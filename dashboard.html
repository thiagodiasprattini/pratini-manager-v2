<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Portal Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

/* =========================
   CORES PADRÃO PRATINI SPORTS
========================= */

:root{

    --verde:#7CFC00;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --preto:#050505;

    --texto:#f5f5f5;

    --cinza:#b8b8b8;

    --borda:#3a3e42;

}


/* =========================
   RESET
========================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--grafite);

    color:
        var(--texto);

    display:flex;

    justify-content:center;

    align-items:center;

    overflow-x:hidden;

}


/* =========================
   PÁGINA
========================= */

.pagina{

    width:100%;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        30px 20px;

}


/* =========================
   LOGO
========================= */

.logo-area{

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:28px;

}


.logo-area img{

    width:180px;

    max-width:80vw;

    height:auto;

    object-fit:contain;

}


/* =========================
   CARD PRINCIPAL
========================= */

.container{

    width:100%;

    max-width:430px;

    background:#111;

    border:
        1px solid var(--borda);

    border-top:
        4px solid var(--verde);

    border-radius:18px;

    padding:35px 30px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

}


/* =========================
   TÍTULO
========================= */

h1{

    text-align:center;

    color:#fff;

    font-size:27px;

    font-weight:800;

    margin-bottom:8px;

}


.subtitulo{

    text-align:center;

    color:#aaa;

    font-size:14px;

    line-height:1.5;

    margin-bottom:30px;

}


/* =========================
   ESCOLHA DO TIPO DE ACESSO
========================= */

.escolha-acesso{

    display:flex;

    flex-direction:column;

    gap:12px;

}


.botao-acesso{

    width:100%;

    min-height:56px;

    border:
        1px solid
        var(--verde);

    border-radius:11px;

    background:
        var(--verde);

    color:#050505;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:
        .2s ease;

}


.botao-acesso:hover{

    filter:
        brightness(.94);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(124,252,0,.15);

}


.botao-acesso:active{

    transform:
        translateY(0);

}


/* =========================
   FORMULÁRIO
========================= */

.formulario{

    display:none;

}


.form-group{

    margin-bottom:18px;

}


.form-group label{

    display:block;

    margin-bottom:8px;

    color:#fff;

    font-size:14px;

    font-weight:700;

}


.form-group input{

    width:100%;

    height:54px;

    background:#202326;

    color:#fff;

    border:
        1px solid #444;

    border-radius:10px;

    padding:
        0 15px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:16px;

    outline:none;

    transition:
        .2s ease;

}


.form-group input::placeholder{

    color:#888;

}


.form-group input:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 3px
        rgba(124,252,0,.10);

}


/* =========================
   BOTÃO ENTRAR
========================= */

.botao-entrar{

    width:100%;

    height:55px;

    border:
        1px solid var(--verde);

    border-radius:10px;

    background:
        var(--verde);

    color:#050505;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    margin-top:4px;

    transition:
        .2s ease;

}


.botao-entrar:hover{

    filter:
        brightness(.94);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(124,252,0,.15);

}


.botao-entrar:active{

    transform:
        translateY(0);

}


.botao-entrar:disabled{

    opacity:.65;

    cursor:
        not-allowed;

    transform:none;

}


/* =========================
   VOLTAR
========================= */

.botao-voltar{

    width:100%;

    height:48px;

    margin-top:15px;

    border:
        1px solid #444;

    border-radius:10px;

    background:#202326;

    color:#ddd;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:
        .2s ease;

}


.botao-voltar:hover{

    background:
        var(--grafite-claro);

    border-color:
        var(--verde);

    color:#fff;

}


/* =========================
   MENSAGEM
========================= */

#mensagem{

    min-height:22px;

    margin-top:17px;

    text-align:center;

    font-size:14px;

    font-weight:700;

    line-height:1.5;

}


/* =========================
   RODAPÉ
========================= */

.footer{

    text-align:center;

    margin-top:20px;

    color:#777;

    font-size:12px;

}


/* =========================
   CARREGANDO
========================= */

.carregando{

    display:none;

    text-align:center;

    color:#ccc;

    font-size:15px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .pagina{

        padding:
            25px 15px;

        justify-content:center;

    }


    .logo-area{

        margin-bottom:22px;

    }


    .logo-area img{

        width:155px;

    }


    .container{

        max-width:430px;

        padding:
            30px 22px;

        border-radius:16px;

    }


    h1{

        font-size:24px;

    }


    .subtitulo{

        font-size:13px;

        margin-bottom:25px;

    }


    .botao-acesso{

        min-height:54px;

        font-size:16px;

    }

}


/* =========================
   TELAS MUITO PEQUENAS
========================= */

@media(max-height:650px){

    .pagina{

        justify-content:flex-start;

        padding-top:20px;

    }


    .logo-area{

        margin-bottom:15px;

    }


    .logo-area img{

        width:130px;

    }


    .container{

        padding:
            25px 20px;

    }

}

</style>

</head>


<body>


<div class="pagina">


    <!-- =========================
         LOGO FORA DO QUADRO
    ========================= -->

    <div class="logo-area">

        <img
            src="Colorida.png"
            alt="Pratini Sports"
        >

    </div>


    <!-- =========================
         CARD
    ========================= -->

    <div class="container">


        <!-- =========================
             ESCOLHA INICIAL
        ========================= -->

        <div
            id="escolhaAcesso"
        >

            <h1>
                Portal Pratini Sports
            </h1>


            <p class="subtitulo">

                Selecione o tipo de acesso
                para continuar.

            </p>


            <div class="escolha-acesso">


                <button
                    type="button"
                    class="botao-acesso"
                    onclick="abrirLogin('administrador')"
                >

                    ADMINISTRADOR

                </button>


                <button
                    type="button"
                    class="botao-acesso"
                    onclick="abrirLogin('atendente')"
                >

                    ATENDENTE

                </button>


            </div>


            <div class="footer">

                © 2026 Pratini Sports

            </div>

        </div>


        <!-- =========================
             FORMULÁRIO DE LOGIN
        ========================= -->

        <div
            id="formularioLogin"
            class="formulario"
        >


            <h1
                id="tituloLogin"
            >
                Portal Pratini Sports
            </h1>


            <p
                class="subtitulo"
                id="subtituloLogin"
            >
                Acesso ao sistema
            </p>


            <!-- CAMPO DE LOGIN -->

            <div class="form-group">


                <label
                    id="labelUsuario"
                    for="usuario"
                >
                    Usuário
                </label>


                <input
                    id="usuario"
                    type="text"
                    autocomplete="username"
                    placeholder="Digite seu usuário"
                >


            </div>


            <!-- SENHA -->

            <div class="form-group">


                <label
                    for="senha"
                >
                    Senha
                </label>


                <input
                    id="senha"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    onkeydown="
                        if(event.key==='Enter'){
                            entrar();
                        }
                    "
                >


            </div>


            <!-- ENTRAR -->

            <button
                id="botaoEntrar"
                type="button"
                class="botao-entrar"
                onclick="entrar()"
            >

                ENTRAR

            </button>


            <!-- VOLTAR -->

            <button
                type="button"
                class="botao-voltar"
                onclick="voltarInicio()"
            >

                Voltar

            </button>


            <!-- MENSAGEM -->

            <p
                id="mensagem"
            ></p>


            <div class="footer">

                © 2026 Pratini Sports

            </div>


        </div>


    </div>


</div>


<script>

/* =========================
   VARIÁVEL DO TIPO DE LOGIN
========================= */

let tipoLogin = null;


/* =========================
   ABRIR LOGIN
========================= */

function abrirLogin(tipo){

    tipoLogin = tipo;


    const escolha =
        document.getElementById(
            "escolhaAcesso"
        );


    const formulario =
        document.getElementById(
            "formularioLogin"
        );


    const titulo =
        document.getElementById(
            "tituloLogin"
        );


    const subtitulo =
        document.getElementById(
            "subtituloLogin"
        );


    const labelUsuario =
        document.getElementById(
            "labelUsuario"
        );


    const usuario =
        document.getElementById(
            "usuario"
        );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    escolha.style.display =
        "none";


    formulario.style.display =
        "block";


    mensagem.innerHTML =
        "";


    usuario.value =
        "";


    document.getElementById(
        "senha"
    ).value =
        "";


    if(tipo === "administrador"){

        titulo.innerText =
            "Acesso do Administrador";


        subtitulo.innerText =
            "Entre com seu e-mail e senha.";


        labelUsuario.innerText =
            "E-mail";


        usuario.type =
            "email";


        usuario.placeholder =
            "Digite seu e-mail";


        usuario.autocomplete =
            "username";

    }


    else{

        titulo.innerText =
            "Acesso da Atendente";


        subtitulo.innerText =
            "Entre com seu usuário e senha.";


        labelUsuario.innerText =
            "Usuário";


        usuario.type =
            "text";


        usuario.placeholder =
            "Digite seu usuário";


        usuario.autocomplete =
            "username";

    }


    setTimeout(function(){

        usuario.focus();

    },100);

}


/* =========================
   VOLTAR PARA INÍCIO
========================= */

function voltarInicio(){

    tipoLogin =
        null;


    document.getElementById(
        "formularioLogin"
    ).style.display =
        "none";


    document.getElementById(
        "escolhaAcesso"
    ).style.display =
        "block";


    document.getElementById(
        "usuario"
    ).value =
        "";


    document.getElementById(
        "senha"
    ).value =
        "";


    document.getElementById(
        "mensagem"
    ).innerHTML =
        "";

}


/* =========================
   LOGIN
========================= */

async function entrar(){


    const campoUsuario =
        document.getElementById(
            "usuario"
        );


    const campoSenha =
        document.getElementById(
            "senha"
        );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const botao =
        document.getElementById(
            "botaoEntrar"
        );


    const usuario =
        campoUsuario.value.trim();


    const senha =
        campoSenha.value.trim();


    /* =========================
       VERIFICA TIPO
    ========================= */

    if(!tipoLogin){

        return;

    }


    /* =========================
       VALIDA CAMPOS
    ========================= */

    if(!usuario || !senha){

        mensagem.style.color =
            "#ff7777";


        mensagem.innerText =
            tipoLogin === "administrador"

            ?

            "Digite seu e-mail e senha."

            :

            "Digite seu usuário e senha.";


        return;

    }


    /* =========================
       VERIFICA SUPABASE
    ========================= */

    if(
        typeof db ===
        "undefined"
    ){

        mensagem.style.color =
            "#ff7777";


        mensagem.innerText =
            "Erro: Supabase não carregado.";


        return;

    }


    botao.disabled =
        true;


    botao.innerText =
        "ENTRANDO...";


    mensagem.style.color =
        "#ccc";


    mensagem.innerText =
        "Verificando acesso...";


    try{


        /* =========================
           LOGIN ADMINISTRADOR
        ========================= */

        if(
            tipoLogin ===
            "administrador"
        ){


            const {
                data,
                error
            } =
                await db.auth.signInWithPassword({

                    email:
                        usuario,

                    password:
                        senha

                });


            if(error){

                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "E-mail ou senha inválidos.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            if(
                !data ||
                !data.session
            ){

                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Não foi possível iniciar a sessão.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /* =========================
               VERIFICA PERFIL
            ========================= */

            const usuarioAuth =
                data.session.user;


            const {
                data: perfil,
                error: erroPerfil
            } =
                await db
                .from("perfis")
                .select(
                    "id,nome,role"
                )
                .eq(
                    "id",
                    usuarioAuth.id
                )
                .single();


            if(
                erroPerfil ||
                !perfil
            ){

                await db.auth.signOut();


                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Perfil de administrador não encontrado.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            if(
                perfil.role !==
                "admin"
            ){

                await db.auth.signOut();


                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Este acesso não possui permissão de administrador.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /* =========================
               LOGIN ADMINISTRADOR OK
            ========================= */

            mensagem.style.color =
                "var(--verde)";


            mensagem.innerText =
                "Login realizado com sucesso!";


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);


            return;

        }


        /* =========================
           LOGIN ATENDENTE
        ========================= */

        if(
            tipoLogin ===
            "atendente"
        ){


            /*
               PRIMEIRO LOCALIZA
               O USUÁRIO NA TABELA
               usuarios_login
            */

            const {
                data: atendente,
                error: erroAtendente
            } =
                await db
                .from("usuarios_login")
                .select(
                    "id,usuario_id,login,nome,tipo,ativo,email_interno"
                )
                .eq(
                    "login",
                    usuario
                )
                .eq(
                    "ativo",
                    true
                )
                .single();


            if(
                erroAtendente ||
                !atendente
            ){

                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Usuário ou senha inválidos.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /*
               O USUÁRIO ATENDENTE
               POSSUI UM EMAIL INTERNO
               PARA AUTENTICAÇÃO NO
               SUPABASE.
            */

            const emailInterno =
                atendente.email_interno;


            if(
                !emailInterno
            ){

                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Este atendente ainda não possui acesso configurado.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /*
               LOGIN NO SUPABASE
            */

            const {
                data,
                error
            } =
                await db.auth.signInWithPassword({

                    email:
                        emailInterno,

                    password:
                        senha

                });


            if(error){

                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Usuário ou senha inválidos.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            if(
                !data ||
                !data.session
            ){

                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Não foi possível iniciar a sessão.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /*
               CONFIRMA QUE A CONTA
               LOGADA CORRESPONDE
               AO ATENDENTE.
            */

            if(
                atendente.usuario_id !==
                data.session.user.id
            ){

                await db.auth.signOut();


                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Erro na configuração deste acesso.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /*
               CONFIRMA O TIPO
            */

            if(
                atendente.tipo !==
                "atendente"
            ){

                await db.auth.signOut();


                mensagem.style.color =
                    "#ff7777";


                mensagem.innerText =
                    "Este usuário não está configurado como atendente.";


                botao.disabled =
                    false;


                botao.innerText =
                    "ENTRAR";


                return;

            }


            /* =========================
               LOGIN ATENDENTE OK
            ========================= */

            mensagem.style.color =
                "var(--verde)";


            mensagem.innerText =
                "Login realizado com sucesso!";


            /*
               SALVA IDENTIFICAÇÃO
               LOCAL DO ATENDENTE
               PARA O SISTEMA PODER
               IDENTIFICÁ-LO.
            */

            localStorage.setItem(
                "atendente_login",
                atendente.login
            );


            localStorage.setItem(
                "atendente_nome",
                atendente.nome
            );


            localStorage.setItem(
                "atendente_id",
                atendente.id
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);


            return;

        }


    }catch(erro){

        console.error(
            erro
        );


        mensagem.style.color =
            "#ff7777";


        mensagem.innerText =
            "Ocorreu um erro ao realizar o login.";


        botao.disabled =
            false;


        botao.innerText =
            "ENTRAR";

    }

}

</script>


</body>

</html>
