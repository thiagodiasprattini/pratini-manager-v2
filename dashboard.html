<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pratini Sports - Painel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

/* =========================
   CORES PADRÃO PRATINI SPORTS
========================= */

:root{

    --verde:#7CFC00;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --preto:#050505;

    --texto:#f5f5f5;

    --cinza:#b8b8b8;

    --borda:#3a3e42;
}


/* =========================
   RESET
========================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;
}


/* =========================
   BODY
========================= */

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--grafite);

    color:
        var(--texto);

    min-height:100vh;

    display:flex;

    flex-direction:column;
}


/* =========================
   CABEÇALHO
========================= */

header{

    min-height:105px;

    background:#101214;

    border-bottom:
        1px solid #383c40;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:15px 20px;
}


.logo img{

    width:145px;

    max-height:80px;

    object-fit:contain;
}


/* =========================
   EVENTO ATIVO
========================= */

.evento-ativo{

    margin:
        25px auto 20px;

    width:
        calc(100% - 40px);

    max-width:950px;

    background:#111;

    color:#fff;

    padding:20px;

    border:
        1px solid #3a3e42;

    border-left:
        4px solid var(--verde);

    border-radius:14px;

    text-align:center;

    font-weight:700;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.25);
}


.evento-ativo-titulo{

    color:#aaa;

    font-size:13px;

    letter-spacing:1.5px;

    margin-bottom:8px;
}


.evento-ativo-nome{

    color:#fff;

    font-size:21px;

    font-weight:800;
}


/* =========================
   CONTADOR
========================= */

.contador{

    margin:
        0 auto 25px;

    width:
        calc(100% - 40px);

    max-width:950px;

    background:#111;

    border:
        1px solid var(--borda);

    border-top:
        4px solid var(--verde);

    border-radius:16px;

    padding:25px;

    text-align:center;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.20);
}


.contador .numero{

    font-size:48px;

    font-weight:900;

    color:var(--verde);

    line-height:1;

    margin-bottom:8px;
}


.contador .rotulo{

    color:#aaa;

    font-size:14px;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================
   CONTAINER
========================= */

main{

    flex:1;
}


.container{

    width:100%;

    max-width:950px;

    margin:auto;

    padding:
        0 20px 30px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(270px,1fr)
        );

    gap:18px;
}


/* =========================
   CARDS
========================= */

.card{

    background:#111;

    border:
        1px solid var(--borda);

    border-top:
        4px solid var(--verde);

    border-radius:15px;

    padding:25px;

    cursor:pointer;

    transition:
        .2s ease;

    box-shadow:
        0 6px 20px
        rgba(0,0,0,.20);
}


.card:hover{

    background:
        var(--grafite-claro);

    border-color:
        var(--verde);

    transform:
        translateY(-3px);

    box-shadow:
        0 10px 25px
        rgba(124,252,0,.10);
}


.card h2{

    font-size:21px;

    margin-bottom:9px;

    color:#fff;
}


.card p{

    color:#aaa;

    line-height:1.5;

    font-size:15px;
}


/* =========================
   ÍCONE DO CARD
========================= */

.card-topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:10px;
}


.card-icone{

    width:42px;

    height:42px;

    border-radius:10px;

    background:
        rgba(124,252,0,.08);

    border:
        1px solid
        rgba(124,252,0,.25);

    display:flex;

    align-items:center;

    justify-content:center;

    color:
        var(--verde);

    font-size:21px;

    font-weight:bold;
}


/* =========================
   FOOTER
========================= */

footer{

    margin-top:20px;

    background:#101214;

    border-top:
        1px solid #383c40;

    text-align:center;

    padding:17px;

    color:#888;

    font-size:13px;
}


/* =========================
   CARREGANDO
========================= */

.carregando{

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    background:
        var(--grafite);

    color:#ccc;

    font-size:16px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    header{

        min-height:90px;
    }


    .logo img{

        width:115px;

        max-height:65px;
    }


    .evento-ativo{

        margin-top:18px;

        width:
            calc(100% - 24px);
    }


    .contador{

        width:
            calc(100% - 24px);
    }


    .container{

        padding:
            0 12px 25px;

        grid-template-columns:1fr;

        gap:14px;
    }


    .card{

        padding:22px;
    }


    .card h2{

        font-size:20px;
    }


    .contador .numero{

        font-size:42px;
    }

}

</style>

</head>


<body>


<!-- =========================
     TELA DE CARREGAMENTO
========================= -->

<div
    id="telaCarregando"
    class="carregando"
>

    Verificando acesso...

</div>


<!-- =========================
     PAINEL
========================= -->

<div
    id="telaPainel"
    style="display:none;"
>


<header>

    <div class="logo">

        <img
            src="Colorida.png"
            alt="Pratini Sports"
        >

    </div>

</header>


<main>


<!-- EVENTO ATIVO -->

<div id="containerEvento"></div>


<!-- CONTADOR -->

<div id="containerContador"></div>


<!-- =========================
     OPÇÕES
========================= -->

<div
    class="container"
    id="containerCards"
>


    <!-- EVENTOS -->

    <div
        class="card"
        onclick="location.href='eventos.html'"
    >

        <div class="card-topo">

            <div class="card-icone">
                E
            </div>

            <h2>Eventos</h2>

        </div>

        <p>
            Cadastrar e gerenciar
            eventos.
        </p>

    </div>


    <!-- ATLETAS -->

    <div
        class="card"
        onclick="location.href='atletas.html'"
    >

        <div class="card-topo">

            <div class="card-icone">
                A
            </div>

            <h2>Atletas</h2>

        </div>

        <p>
            Consultar e cadastrar
            atletas do evento.
        </p>

    </div>


    <!-- IMPORTAÇÃO -->

    <div
        class="card"
        onclick="location.href='importar.html'"
    >

        <div class="card-topo">

            <div class="card-icone">
                I
            </div>

            <h2>Importar</h2>

        </div>

        <p>
            Importar atletas através
            de planilha Excel ou CSV.
        </p>

    </div>


    <!-- ENTREGA -->

    <div
        class="card"
        onclick="location.href='entrega.html'"
    >

        <div class="card-topo">

            <div class="card-icone">
                ✓
            </div>

            <h2>Entrega de Inscrição</h2>

        </div>

        <p>
            Pesquisar atletas e
            registrar a entrega dos kits.
        </p>

    </div>


</div>


</main>


<footer>

    © 2026 Pratini Sports

</footer>


</div>


<script>


/* =========================
   EVENTO ATIVO
========================= */

const eventoId =
    localStorage.getItem(
        "evento_ativo_id"
    );


let canalRealtime = null;


/* =========================
   VERIFICAR ACESSO
========================= */

async function verificarAcesso(){


    const {
        data: sessao
    } =
        await db.auth.getSession();


    if(
        !sessao ||
        !sessao.session
    ){

        window.location.href =
            "login.html";

        return;
    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } =
        await db
        .from("perfis")
        .select(
            "role,nome"
        )
        .eq(
            "id",
            usuario.id
        )
        .single();


    if(
        error ||
        !perfil
    ){

        window.location.href =
            "login.html";

        return;
    }


    /* =========================
       EVENTO ATIVO
    ========================= */

    const eventoAtivoNome =
        localStorage.getItem(
            "evento_ativo_nome"
        );


    const containerEvento =
        document.getElementById(
            "containerEvento"
        );


    if(eventoAtivoNome){

        containerEvento.innerHTML = `

            <div class="evento-ativo">

                <div class="evento-ativo-titulo">
                    EVENTO ATIVO
                </div>

                <div class="evento-ativo-nome">
                    ${escaparHTML(
                        eventoAtivoNome
                    )}
                </div>

            </div>

        `;

    }else{

        containerEvento.innerHTML = `

            <div class="evento-ativo">

                <div class="evento-ativo-titulo">
                    EVENTO ATIVO
                </div>

                <div class="evento-ativo-nome">
                    Nenhum evento selecionado
                </div>

            </div>

        `;
    }


    /* =========================
       ACESSO DO ATENDENTE
    ========================= */

    if(
        perfil.role === "atendente"
    ){

        document
        .querySelectorAll(".card")
        .forEach(
            card => {

                const titulo =
                    card.querySelector(
                        "h2"
                    );


                if(!titulo){
                    return;
                }


                const nome =
                    titulo.innerText
                    .trim();


                /*
                   ATENDENTE SÓ PODE
                   ACESSAR ENTREGA
                */

                if(
                    nome !==
                    "Entrega de Inscrição"
                ){

                    card.style.display =
                        "none";
                }

            }
        );
    }


    /* =========================
       MOSTRAR PAINEL
    ========================= */

    document.getElementById(
        "telaCarregando"
    ).style.display =
        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =
        "block";


    /* =========================
       CONTADOR
    ========================= */

    carregarContador();


    /* =========================
       REALTIME
    ========================= */

    escutarNovosInscritos();

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(texto){

    return (texto || "")
        .toString()

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   CONTADOR DE ATLETAS
========================= */

async function carregarContador(){


    const containerContador =
        document.getElementById(
            "containerContador"
        );


    if(!eventoId){

        containerContador.innerHTML =
            "";

        return;
    }


    const {
        count,
        error
    } =
        await db
        .from("atletas_v2")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        )
        .eq(
            "evento_id",
            eventoId
        );


    if(error){

        containerContador.innerHTML =
            "";

        console.error(
            error
        );

        return;
    }


    containerContador.innerHTML = `

        <div class="contador">

            <div
                class="numero"
                id="numeroInscritos"
            >
                ${count ?? 0}
            </div>

            <div class="rotulo">
                Inscritos no evento
            </div>

        </div>

    `;
}


/* =========================
   REALTIME
========================= */

function escutarNovosInscritos(){


    if(!eventoId){

        return;
    }


    if(canalRealtime){

        db.removeChannel(
            canalRealtime
        );
    }


    canalRealtime =
        db

        .channel(
            "contador-atletas-" +
            eventoId
        )

        .on(

            "postgres_changes",

            {

                event:"*",

                schema:"public",

                table:"atletas_v2",

                filter:
                    "evento_id=eq." +
                    eventoId

            },

            () => {

                carregarContador();

            }

        )

        .subscribe();

}


/* =========================
   INICIAR
========================= */

verificarAcesso();

</script>


</body>

</html>
