<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://kchpprimvfnwchztwlsa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_TT9qEWZX65Xl3prYCwqMtw_t7kA7lf4";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    background:#1f1f1f;
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
}

.logo{
    width:280px;
    max-width:100%;
    margin-bottom:20px;
}

h1{
    color:#65d600;
    font-size:28px;
    margin-bottom:10px;
}

.subtitulo{
    color:#bdbdbd;
    margin-bottom:25px;
    font-size:14px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#65d600;
    border:none;
    border-radius:8px;
    color:#fff;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    background:#58bb00;
}

.erro{
    color:#ff5b5b;
    margin-top:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="card">

    <img src="Colorida.png" alt="Pratini Sports" class="logo">
    <h1>Portal Pratini Sports</h1>

    <p class="subtitulo">
        Acesso exclusivo para equipe autorizada
    </p>

    <input id="usuario" placeholder="Usuário">

    <input id="senha" type="password" placeholder="Senha">

    <button onclick="entrar()">Entrar</button>

    <p id="mensagem" class="erro"></p>

</div>

<script>
async function entrar(){

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();
    const mensagem = document.getElementById("mensagem");

    mensagem.innerHTML = "";

    if(!usuario || !senha){
        mensagem.innerHTML = "Digite usuário e senha.";
        return;
    }

    const { data, error } = await db
        .from("usuarios_v2")
        .select("*")
        .eq("usuario", usuario)
        .eq("senha", senha)
        .eq("ativo", true)
        .limit(1);

    if(error){
        mensagem.innerHTML = "Erro ao acessar: " + error.message;
        return;
    }

    if(!data || data.length === 0){
        mensagem.innerHTML = "Usuário ou senha inválidos.";
        return;
    }

    const user = data[0];

    localStorage.setItem("usuario_nome", user.nome);
    localStorage.setItem("usuario_login", user.usuario);
    localStorage.setItem("usuario_perfil", user.perfil);

    location.href = "dashboard.html";
}
</script>

</body>
</html>
