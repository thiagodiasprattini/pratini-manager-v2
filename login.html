<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pratini Sports - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

/* =========================
   CORES PADRÃO PRATINI SPORTS
========================= */

:root{

    --verde:#7CFC00;

    --verde-hover:#8CFF20;

    --preto:#050505;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --cinza:#b8b8b8;

    --cinza-claro:#f5f5f5;

}


/* =========================
   RESET
========================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:

        linear-gradient(
            135deg,
            #050505 0%,
            #202326 50%,
            #2b2f33 100%
        );

    color:
        var(--cinza-claro);

}


/* =========================
   CONTAINER
========================= */

.container{

    width:90%;

    max-width:430px;

    background:
        var(--grafite);

    padding:40px;

    border-radius:20px;

    border:
        1px solid #3a3e42;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    text-align:center;

}


/* =========================
   LOGO
========================= */

.logo{

    margin-bottom:18px;

}


.logo img{

    width:210px;

    height:auto;

}


/* =========================
   TITULO
========================= */

h1{

    color:#fff;

    font-size:28px;

    font-weight:700;

    margin-bottom:8px;

}


.subtitulo{

    color:
        var(--cinza);

    font-size:14px;

    margin-bottom:30px;

}


/* =========================
   TIPO DE ACESSO
========================= */

.tipo-acesso{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    margin-bottom:22px;

}


.tipo-botao{

    padding:13px 8px;

    border-radius:10px;

    border:
        1px solid #414549;

    background:
        #111;

    color:
        var(--cinza);

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:
        .2s ease;

}


.tipo-botao:hover{

    border-color:
        var(--verde);

    color:
        #fff;

}


.tipo-botao.ativo{

    background:
        rgba(124,252,0,.08);

    border-color:
        var(--verde);

    color:
        var(--verde);

    box-shadow:
        0 0 0 1px
        rgba(124,252,0,.05);

}


/* =========================
   FORM
========================= */

.form-group{

    text-align:left;

    margin-bottom:18px;

}


label{

    display:block;

    margin-bottom:8px;

    color:#fff;

    font-size:14px;

    font-weight:700;

}


/* =========================
   CAMPOS
========================= */

input[type="text"],
input[type="email"],
input[type="password"]{

    width:100%;

    height:54px;

    background:#fff;

    color:#222;

    border:
        1px solid #ddd;

    border-radius:10px;

    padding:
        0 15px;

    font-size:16px;

    transition:
        .25s ease;

}


input::placeholder{

    color:#888;

}


input:focus{

    outline:none;

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 3px
        rgba(124,252,0,.16);

}


/* =========================
   OPÇÕES DE LOGIN
========================= */

.opcoes-login{

    text-align:left;

    margin-bottom:15px;

}


.checkbox-item{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;

    color:#fff;

    font-size:14px;

    font-weight:500;

    cursor:pointer;

}


.checkbox-item input{

    width:18px;

    height:18px;

    margin:0;

    accent-color:
        var(--verde);

}


/* =========================
   BOTÃO ENTRAR
========================= */

button{

    width:100%;

    height:55px;

    border:none;

    border-radius:10px;

    margin-top:10px;

    background:
        var(--verde);

    color:
        var(--preto);

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    transition:
        .2s ease;

}


button:hover{

    background:
        var(--verde-hover);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(124,252,0,.25);

}


button:active{

    transform:
        translateY(0);

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;

}


/* =========================
   MENSAGEM
========================= */

#mensagem{

    margin-top:18px;

    min-height:20px;

    font-weight:700;

    color:#fff;

    line-height:1.4;

}


/* =========================
   RODAPÉ
========================= */

.footer{

    margin-top:25px;

    color:
        var(--cinza);

    font-size:12px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .container{

        padding:
            30px 22px;

    }


    .logo img{

        width:190px;

    }


    h1{

        font-size:25px;

    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">

        <img
            src="Colorida.png"
            alt="Pratini Sports"
        >

    </div>


    <!-- =========================
         TITULO
    ========================== -->

    <h1>
        Acesso ao Painel
    </h1>


    <p class="subtitulo">
        Acesso exclusivo para equipe autorizada
    </p>


    <!-- =========================
         TIPO DE ACESSO
    ========================== -->

    <div class="tipo-acesso">


        <div
            id="botaoAdmin"
            class="tipo-botao ativo"
            onclick="selecionarTipo('admin')"
        >

            ADMINISTRADOR

        </div>


        <div
            id="botaoAtendente"
            class="tipo-botao"
            onclick="selecionarTipo('atendente')"
        >

            ATENDENTE

        </div>


    </div>


    <!-- =========================
         USUÁRIO
    ========================== -->

    <div class="form-group">


        <label id="labelUsuario">

            E-mail

        </label>


        <input
            id="usuario"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="username"
            onkeydown="
                if(event.key==='Enter'){
                    document.getElementById('senha').focus();
                }
            "
        >


    </div>


    <!-- =========================
         SENHA
    ========================== -->

    <div class="form-group">


        <label for="senha">

            Senha

        </label>


        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            onkeydown="
                if(event.key==='Enter'){
                    entrar();
                }
            "
        >


    </div>


    <!-- =========================
         OPÇÕES ADMINISTRADOR
    ========================== -->

    <div
        class="opcoes-login"
        id="opcoesAdmin"
    >


        <label class="checkbox-item">


            <input
                type="checkbox"
                id="lembrarUsuario"
            >


            Lembrar e-mail


        </label>


        <label class="checkbox-item">


            <input
                type="checkbox"
                id="manterConectado"
            >


            Manter-me conectado


        </label>


    </div>


    <!-- =========================
         BOTÃO
    ========================== -->

    <button
        id="botaoEntrar"
        onclick="entrar()"
    >

        ENTRAR

    </button>


    <!-- =========================
         MENSAGEM
    ========================== -->

    <p id="mensagem"></p>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <div class="footer">

        © 2026 Pratini Sports

    </div>


</div>


<script>


/* =========================
   CONFIGURAÇÃO
========================= */


/*
    DOMÍNIO INTERNO DAS ATENDENTES

    A atendente não precisa conhecer
    esse e-mail.

    Exemplo:

    JULIANA

    será transformado internamente em:

    juliana@atendentes.pratinisports.local
*/

const DOMINIO_ATENDENTES =
    "@atendentes.pratinisports.local";


let tipoAcesso =
    "admin";


/* =========================
   SELECIONAR TIPO DE ACESSO
========================= */

function selecionarTipo(tipo){


    tipoAcesso =
        tipo;


    const botaoAdmin =
        document.getElementById(
            "botaoAdmin"
        );


    const botaoAtendente =
        document.getElementById(
            "botaoAtendente"
        );


    const label =
        document.getElementById(
            "labelUsuario"
        );


    const usuario =
        document.getElementById(
            "usuario"
        );


    const opcoesAdmin =
        document.getElementById(
            "opcoesAdmin"
        );


    /* =========================
       ADMINISTRADOR
    ========================== */

    if(tipo === "admin"){


        botaoAdmin.classList.add(
            "ativo"
        );


        botaoAtendente.classList.remove(
            "ativo"
        );


        label.innerText =
            "E-mail";


        usuario.type =
            "email";


        usuario.placeholder =
            "Digite seu e-mail";


        usuario.autocomplete =
            "username";


        opcoesAdmin.style.display =
            "block";


        const emailSalvo =
            localStorage.getItem(
                "email_salvo"
            );


        if(emailSalvo){


            usuario.value =
                emailSalvo;


            document.getElementById(
                "lembrarUsuario"
            ).checked =
                true;


        }


    }


    /* =========================
       ATENDENTE
    ========================== */

    else{


        botaoAtendente.classList.add(
            "ativo"
        );


        botaoAdmin.classList.remove(
            "ativo"
        );


        label.innerText =
            "Nome de usuário";


        usuario.type =
            "text";


        usuario.placeholder =
            "Digite seu nome de usuário";


        usuario.autocomplete =
            "username";


        opcoesAdmin.style.display =
            "none";


        usuario.value =
            "";


    }


    document.getElementById(
        "mensagem"
    ).innerHTML =
        "";


}


/* =========================
   CARREGAR DADOS SALVOS
========================= */

window.onload =
function(){


    const emailSalvo =
        localStorage.getItem(
            "email_salvo"
        );


    if(emailSalvo){


        document.getElementById(
            "usuario"
        ).value =
            emailSalvo;


        document.getElementById(
            "lembrarUsuario"
        ).checked =
            true;


    }


    const manter =
        localStorage.getItem(
            "manter_conectado"
        );


    if(manter === "sim"){


        document.getElementById(
            "manterConectado"
        ).checked =
            true;


    }


};


/* =========================
   GERAR LOGIN INTERNO
   DA ATENDENTE
========================= */

function gerarEmailAtendente(nome){


    return nome

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .trim()

        .replace(
            /\s+/g,
            "."
        )

        .replace(
            /[^a-z0-9.]/g,
            ""
        )

        +
        DOMINIO_ATENDENTES;


}


/* =========================
   LOGIN
========================= */

async function entrar(){


    const campoMensagem =
        document.getElementById(
            "mensagem"
        );


    const botao =
        document.getElementById(
            "botaoEntrar"
        );


    let usuario =
        document.getElementById(
            "usuario"
        )
        .value
        .trim();


    const senha =
        document.getElementById(
            "senha"
        )
        .value
        .trim();


    campoMensagem.style.color =
        "#fff";


    campoMensagem.innerHTML =
        "Verificando acesso...";


    /* =========================
       VALIDAÇÃO
    ========================== */

    if(!usuario || !senha){


        campoMensagem.style.color =
            "#ff6b6b";


        campoMensagem.innerHTML =

            tipoAcesso === "admin"

            ?

            "Digite seu e-mail e senha."

            :

            "Digite seu nome de usuário e senha.";


        return;

    }


    /* =========================
       VERIFICAR SUPABASE
    ========================== */

    if(typeof db === "undefined"){


        campoMensagem.style.color =
            "#ff6b6b";


        campoMensagem.innerHTML =
            "Erro: Supabase não carregado.";


        return;

    }


    botao.disabled =
        true;


    try{


        /* =========================
           ATENDENTE
        ========================== */

        if(
            tipoAcesso ===
            "atendente"
        ){


            usuario =
                gerarEmailAtendente(
                    usuario
                );


        }


        /* =========================
           AUTENTICAÇÃO
        ========================== */

        const {
            data,
            error
        } =
            await db.auth.signInWithPassword({

                email:
                    usuario,

                password:
                    senha

            });


        /* =========================
           ERRO
        ========================== */

        if(error){


            console.error(
                "Erro de login:",
                error
            );


            campoMensagem.style.color =
                "#ff6b6b";


            campoMensagem.innerHTML =

                tipoAcesso === "admin"

                ?

                "E-mail ou senha inválidos."

                :

                "Nome de usuário ou senha inválidos.";


            botao.disabled =
                false;


            return;

        }


        /* =========================
           SESSÃO
        ========================== */

        if(
            data &&
            data.session
        ){


            const usuarioId =
                data.session.user.id;


            /* =========================
               BUSCAR PERFIL
            ========================== */

            const {
                data: perfil,
                error:
                    erroPerfil
            } =
                await db

                .from("perfis")

                .select(
                    "id,nome,role"
                )

                .eq(
                    "id",
                    usuarioId
                )

                .single();


            /* =========================
               PERFIL NÃO ENCONTRADO
            ========================== */

            if(
                erroPerfil ||
                !perfil
            ){


                await db.auth.signOut();


                campoMensagem.style.color =
                    "#ff6b6b";


                campoMensagem.innerHTML =
                    "Perfil de usuário não encontrado.";


                botao.disabled =
                    false;


                return;

            }


            /* =========================
               VALIDAR ADMINISTRADOR
            ========================== */

            if(

                tipoAcesso ===
                "admin"

                &&

                perfil.role !==
                "admin"

            ){


                await db.auth.signOut();


                campoMensagem.style.color =
                    "#ff6b6b";


                campoMensagem.innerHTML =
                    "Esta conta não possui acesso de administrador.";


                botao.disabled =
                    false;


                return;

            }


            /* =========================
               VALIDAR ATENDENTE
            ========================== */

            if(

                tipoAcesso ===
                "atendente"

                &&

                perfil.role !==
                "atendente"

            ){


                await db.auth.signOut();


                campoMensagem.style.color =
                    "#ff6b6b";


                campoMensagem.innerHTML =
                    "Esta conta não está cadastrada como atendente.";


                botao.disabled =
                    false;


                return;

            }


            /* =========================
               PREFERÊNCIAS DO ADMIN
            ========================== */

            if(
                tipoAcesso ===
                "admin"
            ){


                const lembrar =
                    document.getElementById(
                        "lembrarUsuario"
                    ).checked;


                const manter =
                    document.getElementById(
                        "manterConectado"
                    ).checked;


                if(lembrar){


                    localStorage.setItem(

                        "email_salvo",

                        usuario

                    );


                }

                else{


                    localStorage.removeItem(

                        "email_salvo"

                    );


                }


                if(manter){


                    localStorage.setItem(

                        "manter_conectado",

                        "sim"

                    );


                }

                else{


                    localStorage.removeItem(

                        "manter_conectado"

                    );


                }


            }


            /* =========================
               SALVAR DADOS DO USUÁRIO
            ========================== */

            localStorage.setItem(

                "usuario_id",

                perfil.id

            );


            localStorage.setItem(

                "usuario_nome",

                perfil.nome ||
                data.session.user.email

            );


            localStorage.setItem(

                "usuario_role",

                perfil.role

            );


            /* =========================
               LOGIN CONCLUÍDO
            ========================== */

            campoMensagem.style.color =
                var(--verde);


            campoMensagem.innerHTML =
                "Login realizado com sucesso!";


            setTimeout(

                function(){

                    window.location.href =
                        "dashboard.html";

                },

                700

            );


        }


    }

    catch(err){


        console.error(err);


        campoMensagem.style.color =
            "#ff6b6b";


        campoMensagem.innerHTML =
            "Erro ao realizar login.";


        botao.disabled =
            false;


    }

}

</script>


</body>

</html>
