<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    background:#f4f5f7;
}

/* CARD */

.container{
    width:90%;
    max-width:430px;

    background:#ffffff;

    border-radius:20px;

    padding:40px;

    box-shadow:
    0 10px 35px rgba(0,0,0,0.08);

    text-align:center;
}

/* LOGO */

.logo{
    margin-bottom:15px;
}

.logo img{
    width:240px;
    max-width:100%;
    height:auto;
}

/* TITULO */

h1{
    font-size:28px;
    color:#111111;
    margin-bottom:8px;
    font-weight:700;
}

.subtitulo{
    color:#666666;
    font-size:14px;
    margin-bottom:30px;
}

/* CAMPOS */

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;

    color:#333333;

    font-size:14px;
    font-weight:600;
}

input{
    width:100%;
    height:54px;

    background:#ffffff;

    border:1px solid #dcdcdc;

    border-radius:10px;

    padding:0 15px;

    font-size:16px;

    transition:0.3s;
}

input:focus{
    outline:none;

    border-color:#59D600;

    box-shadow:
    0 0 0 4px rgba(89,214,0,0.15);
}

input::placeholder{
    color:#999999;
}

/* BOTAO */

button{
    width:100%;
    height:55px;

    border:none;

    border-radius:10px;

    background:#59D600;

    color:#000000;

    font-size:17px;
    font-weight:700;

    cursor:pointer;

    transition:0.3s;
}

button:hover{
    background:#67f000;
}

#mensagem{
    margin-top:15px;
    min-height:20px;
    font-weight:600;
}

.footer{
    margin-top:25px;
    color:#999999;
    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="Colorida.png" alt="Pratini Sports">
    </div>

    <h1>Portal Pratini Sports</h1>

    <p class="subtitulo">
        Acesso exclusivo para equipe autorizada
    </p>

    <div class="form-group">
        <label for="email">E-mail</label>
        <input
            id="email"
            type="email"
            placeholder="Digite seu e-mail">
    </div>

    <div class="form-group">
        <label for="senha">Senha</label>
        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha">
    </div>

    <button onclick="entrar()">
        Entrar
    </button>

    <p id="mensagem"></p>

    <div class="footer">
        © 2025 Pratini Sports
    </div>

</div>

<script>

async function entrar(){

    const campoMensagem =
        document.getElementById("mensagem");

    const email =
        document.getElementById("email")
        .value
        .trim();

    const senha =
        document.getElementById("senha")
        .value
        .trim();

    campoMensagem.style.color = "#333";
    campoMensagem.innerHTML = "Verificando acesso...";

    if(!email || !senha){

        campoMensagem.style.color = "#d93025";
        campoMensagem.innerHTML =
        "Digite e-mail e senha.";

        return;
    }

    if(typeof db === "undefined"){

        campoMensagem.style.color = "#d93025";
        campoMensagem.innerHTML =
        "Erro: Supabase não carregado.";

        return;
    }

    try{

        const { data, error } =
        await db.auth.signInWithPassword({

            email: email,
            password: senha

        });

        if(error){

            campoMensagem.style.color = "#d93025";
            campoMensagem.innerHTML =
            "E-mail ou senha inválidos.";

            return;
        }

        if(data && data.session){

            campoMensagem.style.color =
            "#59D600";

            campoMensagem.innerHTML =
            "Login realizado com sucesso!";

            setTimeout(function(){

                window.location.href =
                "dashboard.html";

            },800);
        }

    }catch(err){

        console.error(err);

        campoMensagem.style.color =
        "#d93025";

        campoMensagem.innerHTML =
        "Erro: " + err.message;
    }
}

</script>

</body>
</html>
