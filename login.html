<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

/* =====================================================
   PADRÃO PRATINI SPORTS
===================================================== */

:root{

    --bg:#1F1F1F;

    --bg-dark:#181818;

    --card:#2E2E2E;

    --card-hover:#383838;

    --verde:#73C46B;

    --verde-hover:#8AD982;

    --texto:#FFFFFF;

    --texto-secundario:#CFCFCF;

    --borda:#4A4A4A;
}


/* =====================================================
   RESET
===================================================== */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =====================================================
   BODY
===================================================== */

html,
body{

    width:100%;

    min-height:100%;

}


body{

    min-height:100vh;

    font-family:
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #292929 0%,
            #202020 45%,
            #181818 100%
        );

    color:
        var(--texto);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:
        25px 20px;

}


/* =====================================================
   ÁREA DA LOGO
===================================================== */

.logo-area{

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:25px;

}


.logo-area img{

    width:220px;

    max-width:75vw;

    height:auto;

    display:block;

}


/* =====================================================
   CONTAINER
===================================================== */

.login-container{

    width:100%;

    max-width:430px;

}


/* =====================================================
   CARD
===================================================== */

.login-card{

    width:100%;

    background:
        rgba(46,46,46,.97);

    border:
        1px solid var(--borda);

    border-radius:18px;

    padding:32px;

    box-shadow:

        0 18px 45px
        rgba(0,0,0,.38);

}


/* =====================================================
   TÍTULO
===================================================== */

.titulo{

    text-align:center;

    font-size:27px;

    font-weight:700;

    color:
        var(--texto);

    margin-bottom:8px;

}


.subtitulo{

    text-align:center;

    color:
        var(--texto-secundario);

    font-size:14px;

    line-height:1.5;

    margin-bottom:28px;

}


/* =====================================================
   SELEÇÃO DE ACESSO
===================================================== */

.selecao-acesso{

    display:flex;

    flex-direction:column;

    gap:13px;

}


.botao-tipo{

    width:100%;

    min-height:58px;

    border:

        1px solid
        var(--verde);

    border-radius:11px;

    background:
        var(--verde);

    color:#111;

    font-family:
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    font-size:16px;

    font-weight:700;

    letter-spacing:.3px;

    cursor:pointer;

    transition:
        all .2s ease;

}


.botao-tipo:hover{

    background:
        var(--verde-hover);

    border-color:
        var(--verde-hover);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(115,196,107,.20);

}


.botao-tipo:active{

    transform:
        translateY(0);

}


/* =====================================================
   ÁREA DO FORMULÁRIO
===================================================== */

.formulario{

    display:none;

}


.formulario.ativo{

    display:block;

}


/* =====================================================
   BOTÃO VOLTAR
===================================================== */

.botao-voltar{

    width:100%;

    border:0;

    background:transparent;

    color:
        var(--texto-secundario);

    text-align:left;

    padding:0;

    margin-bottom:22px;

    font-family:
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    font-size:14px;

    cursor:pointer;

    transition:
        color .2s ease;

}


.botao-voltar:hover{

    color:
        var(--verde);

}


/* =====================================================
   TIPO DE ACESSO
===================================================== */

.tipo-selecionado{

    text-align:center;

    color:
        var(--verde);

    font-size:13px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:22px;

}


/* =====================================================
   CAMPOS
===================================================== */

.form-group{

    margin-bottom:18px;

}


.form-group label{

    display:block;

    margin-bottom:8px;

    color:
        var(--texto);

    font-size:14px;

    font-weight:600;

}


.form-group input{

    width:100%;

    height:52px;

    padding:
        0 15px;

    background:#FFFFFF;

    color:#222222;

    border:
        1px solid #D7D7D7;

    border-radius:10px;

    font-family:
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    font-size:16px;

    outline:none;

    transition:
        all .2s ease;

}


.form-group input::placeholder{

    color:#888;

}


.form-group input:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 3px
        rgba(115,196,107,.18);

}


/* =====================================================
   OPÇÕES
===================================================== */

.opcoes-login{

    margin-top:4px;

    margin-bottom:8px;

}


.checkbox-item{

    display:flex;

    align-items:center;

    gap:9px;

    color:
        var(--texto-secundario);

    font-size:13px;

    margin-bottom:10px;

    cursor:pointer;

}


.checkbox-item input{

    width:17px;

    height:17px;

    margin:0;

    accent-color:
        var(--verde);

}


/* =====================================================
   BOTÃO ENTRAR
===================================================== */

.botao-entrar{

    width:100%;

    height:54px;

    margin-top:8px;

    border:0;

    border-radius:10px;

    background:
        var(--verde);

    color:#111;

    font-family:
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    transition:
        all .2s ease;

}


.botao-entrar:hover{

    background:
        var(--verde-hover);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(115,196,107,.20);

}


.botao-entrar:active{

    transform:
        translateY(0);

}


.botao-entrar:disabled{

    opacity:.65;

    cursor:
        not-allowed;

    transform:none;

}


/* =====================================================
   MENSAGEM
===================================================== */

#mensagem{

    min-height:22px;

    margin-top:16px;

    text-align:center;

    font-size:14px;

    font-weight:600;

    line-height:1.4;

}


/* =====================================================
   RODAPÉ
===================================================== */

.footer{

    text-align:center;

    margin-top:22px;

    color:#9F9F9F;

    font-size:12px;

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:769px){

    body{

        padding-top:30px;

    }

    .logo-area{

        margin-bottom:28px;

    }

    .logo-area img{

        width:235px;

    }

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    body{

        justify-content:center;

        padding:
            20px 15px;

    }


    .logo-area{

        margin-bottom:20px;

    }


    .logo-area img{

        width:190px;

    }


    .login-card{

        padding:
            27px 22px;

        border-radius:16px;

    }


    .titulo{

        font-size:24px;

    }


    .subtitulo{

        font-size:13px;

        margin-bottom:24px;

    }


    .botao-tipo{

        min-height:55px;

    }

}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media(max-height:650px){

    body{

        justify-content:flex-start;

        padding-top:15px;

    }


    .logo-area{

        margin-bottom:12px;

    }


    .logo-area img{

        width:160px;

    }


    .login-card{

        padding:22px;

    }


    .titulo{

        font-size:22px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGO
===================================================== -->

<div class="logo-area">

    <img
        src="Colorida.png"
        alt="Pratini Sports"
    >

</div>


<!-- =====================================================
     CONTAINER
===================================================== -->

<div class="login-container">


<div class="login-card">


<!-- =====================================================
     TELA INICIAL
===================================================== -->

<div
    id="selecaoAcesso"
    class="selecao-acesso"
>

    <h1 class="titulo">
        Portal Pratini Sports
    </h1>

    <p class="subtitulo">
        Selecione o tipo de acesso
    </p>


    <button
        type="button"
        class="botao-tipo"
        onclick="abrirLogin('administrador')"
    >
        ADMINISTRADOR
    </button>


    <button
        type="button"
        class="botao-tipo"
        onclick="abrirLogin('atendente')"
    >
        ATENDENTE
    </button>

</div>


<!-- =====================================================
     LOGIN ADMINISTRADOR
===================================================== -->

<div
    id="loginAdministrador"
    class="formulario"
>


    <button
        type="button"
        class="botao-voltar"
        onclick="voltarInicio()"
    >
        ← Voltar
    </button>


    <div class="tipo-selecionado">
        Acesso do administrador
    </div>


    <div class="form-group">

        <label for="emailAdministrador">
            E-mail
        </label>

        <input
            id="emailAdministrador"
            type="email"
            placeholder="Digite seu e-mail"
            autocomplete="username"
        >

    </div>


    <div class="form-group">

        <label for="senhaAdministrador">
            Senha
        </label>

        <input
            id="senhaAdministrador"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
        >

    </div>


    <div class="opcoes-login">

        <label class="checkbox-item">

            <input
                type="checkbox"
                id="lembrarEmail"
            >

            Lembrar e-mail

        </label>


        <label class="checkbox-item">

            <input
                type="checkbox"
                id="manterConectado"
            >

            Manter-me conectado

        </label>

    </div>


    <button
        type="button"
        class="botao-entrar"
        onclick="entrarAdministrador()"
    >
        ENTRAR
    </button>


</div>


<!-- =====================================================
     LOGIN ATENDENTE
===================================================== -->

<div
    id="loginAtendente"
    class="formulario"
>


    <button
        type="button"
        class="botao-voltar"
        onclick="voltarInicio()"
    >
        ← Voltar
    </button>


    <div class="tipo-selecionado">
        Acesso da atendente
    </div>


    <div class="form-group">

        <label for="loginAtendenteCampo">
            Usuário
        </label>

        <input
            id="loginAtendenteCampo"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
        >

    </div>


    <div class="form-group">

        <label for="senhaAtendente">
            Senha
        </label>

        <input
            id="senhaAtendente"
            type="password"
            placeholder="Digite sua senha"
            autocomplete="current-password"
        >

    </div>


    <button
        type="button"
        class="botao-entrar"
        onclick="entrarAtendente()"
    >
        ENTRAR
    </button>


</div>


<!-- =====================================================
     MENSAGEM
===================================================== -->

<p id="mensagem"></p>


<!-- =====================================================
     RODAPÉ
===================================================== -->

<div class="footer">

    © 2026 Pratini Sports

</div>


</div>

</div>


<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const mensagem =
    document.getElementById("mensagem");


/* =====================================================
   CARREGA DADOS SALVOS
===================================================== */

window.addEventListener("load", function(){

    const emailSalvo =
        localStorage.getItem(
            "email_salvo"
        );


    if(emailSalvo){

        document.getElementById(
            "emailAdministrador"
        ).value =
            emailSalvo;

        document.getElementById(
            "lembrarEmail"
        ).checked = true;

    }


    const manter =
        localStorage.getItem(
            "manter_conectado"
        );


    if(manter === "sim"){

        document.getElementById(
            "manterConectado"
        ).checked = true;

    }

});


/* =====================================================
   ABRIR LOGIN
===================================================== */

function abrirLogin(tipo){

    document.getElementById(
        "selecaoAcesso"
    ).style.display = "none";


    document.getElementById(
        "loginAdministrador"
    ).classList.remove("ativo");


    document.getElementById(
        "loginAtendente"
    ).classList.remove("ativo");


    mensagem.innerHTML = "";


    if(tipo === "administrador"){

        document.getElementById(
            "loginAdministrador"
        ).classList.add("ativo");


        setTimeout(function(){

            document.getElementById(
                "emailAdministrador"
            ).focus();

        },100);

    }


    if(tipo === "atendente"){

        document.getElementById(
            "loginAtendente"
        ).classList.add("ativo");


        setTimeout(function(){

            document.getElementById(
                "loginAtendenteCampo"
            ).focus();

        },100);

    }

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarInicio(){

    document.getElementById(
        "loginAdministrador"
    ).classList.remove("ativo");


    document.getElementById(
        "loginAtendente"
    ).classList.remove("ativo");


    document.getElementById(
        "selecaoAcesso"
    ).style.display = "flex";


    mensagem.innerHTML = "";

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
){

    mensagem.innerHTML =
        texto;


    if(tipo === "erro"){

        mensagem.style.color =
            "#ff6b6b";

    }

    else if(tipo === "sucesso"){

        mensagem.style.color =
            "var(--verde)";

    }

    else{

        mensagem.style.color =
            "#ffffff";

    }

}


/* =====================================================
   LOGIN ADMINISTRADOR
===================================================== */

async function entrarAdministrador(){

    const email =
        document.getElementById(
            "emailAdministrador"
        )
        .value
        .trim();


    const senha =
        document.getElementById(
            "senhaAdministrador"
        )
        .value
        .trim();


    if(!email || !senha){

        mostrarMensagem(
            "Digite o e-mail e a senha.",
            "erro"
        );

        return;

    }


    if(typeof db === "undefined"){

        mostrarMensagem(
            "Erro: Supabase não carregado.",
            "erro"
        );

        return;

    }


    mostrarMensagem(
        "Verificando acesso...",
        "normal"
    );


    try{

        const {
            data,
            error
        } =
            await db.auth.signInWithPassword({

                email:
                    email,

                password:
                    senha

            });


        if(error){

            console.error(error);

            mostrarMensagem(
                "E-mail ou senha inválidos.",
                "erro"
            );

            return;

        }


        if(
            data &&
            data.session
        ){

            const lembrar =
                document.getElementById(
                    "lembrarEmail"
                ).checked;


            const manter =
                document.getElementById(
                    "manterConectado"
                ).checked;


            if(lembrar){

                localStorage.setItem(
                    "email_salvo",
                    email
                );

            }else{

                localStorage.removeItem(
                    "email_salvo"
                );

            }


            if(manter){

                localStorage.setItem(
                    "manter_conectado",
                    "sim"
                );

            }else{

                localStorage.removeItem(
                    "manter_conectado"
                );

            }


            mostrarMensagem(
                "Login realizado com sucesso!",
                "sucesso"
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);

        }

    }

    catch(error){

        console.error(error);

        mostrarMensagem(
            "Erro ao realizar login.",
            "erro"
        );

    }

}


/* =====================================================
   LOGIN ATENDENTE
===================================================== */

async function entrarAtendente(){

    const login =
        document.getElementById(
            "loginAtendenteCampo"
        )
        .value
        .trim();


    const senha =
        document.getElementById(
            "senhaAtendente"
        )
        .value
        .trim();


    if(!login || !senha){

        mostrarMensagem(
            "Digite o usuário e a senha.",
            "erro"
        );

        return;

    }


    if(typeof db === "undefined"){

        mostrarMensagem(
            "Erro: Supabase não carregado.",
            "erro"
        );

        return;

    }


    mostrarMensagem(
        "Verificando acesso...",
        "normal"
    );


    try{

        /*
           BUSCA O USUÁRIO DE ATENDIMENTO
           PELO LOGIN INFORMADO
        */

        const {
            data: usuarioLogin,
            error: erroLogin
        } =
            await db
            .from("usuarios_login")
            .select(
                "id,usuario_id,login,nome,tipo,ativo,email_interno"
            )
            .eq(
                "login",
                login
            )
            .eq(
                "ativo",
                true
            )
            .single();


        if(
            erroLogin ||
            !usuarioLogin
        ){

            mostrarMensagem(
                "Usuário ou senha inválidos.",
                "erro"
            );

            return;

        }


        /*
           O SUPABASE AUTH AINDA FAZ A
           AUTENTICAÇÃO DA SENHA.

           O CAMPO email_interno É O E-MAIL
           TÉCNICO DO USUÁRIO.
        */

        const emailInterno =
            usuarioLogin.email_interno;


        if(!emailInterno){

            mostrarMensagem(
                "Este usuário ainda não está configurado corretamente.",
                "erro"
            );

            return;

        }


        const {
            data,
            error
        } =
            await db.auth.signInWithPassword({

                email:
                    emailInterno,

                password:
                    senha

            });


        if(error){

            console.error(error);

            mostrarMensagem(
                "Usuário ou senha inválidos.",
                "erro"
            );

            return;

        }


        if(
            data &&
            data.session
        ){

            /*
               GUARDA INFORMAÇÕES DO ATENDENTE
               PARA O SISTEMA SABER QUEM FEZ
               A ENTREGA.
            */

            localStorage.setItem(
                "atendente_login",
                usuarioLogin.login
            );


            localStorage.setItem(
                "atendente_nome",
                usuarioLogin.nome
            );


            localStorage.setItem(
                "atendente_id",
                usuarioLogin.id
            );


            mostrarMensagem(
                "Login realizado com sucesso!",
                "sucesso"
            );


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);

        }

    }

    catch(error){

        console.error(error);

        mostrarMensagem(
            "Erro ao realizar login.",
            "erro"
        );

    }

}


/* =====================================================
   ENTER NO TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Enter"){
            return;
        }


        const admin =
            document.getElementById(
                "loginAdministrador"
            )
            .classList
            .contains("ativo");


        const atendente =
            document.getElementById(
                "loginAtendente"
            )
            .classList
            .contains("ativo");


        if(admin){

            entrarAdministrador();

        }

        else if(atendente){

            entrarAtendente();

        }

    }
);

</script>


</body>

</html>
