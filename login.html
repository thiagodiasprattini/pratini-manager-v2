<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portal Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    background:
    radial-gradient(
        circle at top,
        rgba(89,214,0,0.15),
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #000000,
        #0f0f0f,
        #181818
    );

    color:#ffffff;
}

.container{
    width:90%;
    max-width:420px;

    background:rgba(20,20,20,0.96);

    border:1px solid rgba(89,214,0,0.25);

    border-radius:24px;

    padding:40px 35px;

    box-shadow:
    0 0 30px rgba(89,214,0,0.15),
    0 15px 40px rgba(0,0,0,0.45);

    backdrop-filter:blur(10px);
}

.logo{
    display:flex;
    justify-content:center;
    margin-bottom:25px;
}

.logo img{
    width:320px;
    max-width:100%;
    height:auto;

    filter:
    drop-shadow(0 0 10px rgba(89,214,0,0.20));
}

.subtitulo{
    text-align:center;
    color:#cfcfcf;
    font-size:14px;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;

    color:#dcdcdc;

    font-size:14px;

    font-weight:500;
}

input{
    width:100%;
    height:55px;

    background:#1d1d1d;

    border:1px solid #333;

    border-radius:12px;

    padding:0 16px;

    color:#fff;

    font-size:16px;

    transition:all .3s ease;
}

input::placeholder{
    color:#888;
}

input:focus{
    outline:none;

    border-color:#59D600;

    box-shadow:
    0 0 0 4px rgba(89,214,0,0.15);
}

button{
    width:100%;
    height:55px;

    margin-top:10px;

    border:none;

    border-radius:12px;

    background:#59D600;

    color:#000;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:.3s;
}

button:hover{
    background:#6eff00;

    transform:translateY(-2px);

    box-shadow:
    0 10px 25px rgba(89,214,0,0.35);
}

button:active{
    transform:translateY(0);
}

#mensagem{
    text-align:center;
    margin-top:18px;
    font-weight:600;
    min-height:20px;
}

.footer{
    text-align:center;
    margin-top:25px;

    color:#777;

    font-size:12px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <img src="Colorida.png" alt="Pratini Sports">
    </div>
<h1>Portal Pratini Sports</h1>
    <p class="subtitulo">
        Acesso exclusivo para equipe autorizada
    </p>

    <div class="form-group">
        <label for="email">E-mail</label>
        <input
            id="email"
            type="email"
            placeholder="Digite seu e-mail">
    </div>

    <div class="form-group">
        <label for="senha">Senha</label>
        <input
            id="senha"
            type="password"
            placeholder="Digite sua senha">
    </div>

    <button onclick="entrar()">
        Entrar
    </button>

    <p id="mensagem"></p>

    <div class="footer">
        © 2025 Pratini Sports
    </div>

</div>

<script>

async function entrar(){

    const campoMensagem =
        document.getElementById("mensagem");

    const email =
        document.getElementById("email")
        .value
        .trim();

    const senha =
        document.getElementById("senha")
        .value
        .trim();

    campoMensagem.style.color = "#ffffff";
    campoMensagem.innerHTML = "Verificando acesso...";

    if(!email || !senha){

        campoMensagem.style.color = "#ff6666";
        campoMensagem.innerHTML =
        "Digite e-mail e senha.";

        return;
    }

    if(typeof db === "undefined"){

        campoMensagem.style.color = "#ff6666";
        campoMensagem.innerHTML =
        "Erro: Supabase não carregado.";

        return;
    }

    try{

        const { data, error } =
        await db.auth.signInWithPassword({

            email: email,
            password: senha

        });

        if(error){

            campoMensagem.style.color = "#ff6666";
            campoMensagem.innerHTML =
            "E-mail ou senha inválidos.";

            return;
        }

        if(data && data.session){

            campoMensagem.style.color =
            "#59D600";

            campoMensagem.innerHTML =
            "Login realizado com sucesso!";

            setTimeout(function(){

                window.location.href =
                "dashboard.html";

            }, 800);
        }

    }
    catch(err){

        console.error(err);

        campoMensagem.style.color = "#ff6666";

        campoMensagem.innerHTML =
        "Erro: " + err.message;
    }
}

</script>

</body>
</html>
