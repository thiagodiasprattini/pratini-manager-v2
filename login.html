<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Portal Pratini Sports</title>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- FONTE -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =========================
   PADRÃO GERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter', sans-serif;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            135deg,
            #1A1A1A 0%,
            #202020 50%,
            #292929 100%
        );

    color:#FFFFFF;

    padding:30px 20px;

}


/* =========================
   ÁREA PRINCIPAL
========================= */

.pagina{

    width:100%;

    max-width:430px;

    display:flex;

    flex-direction:column;

    align-items:center;

}


/* =========================
   LOGO
========================= */

.logo{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:28px;

}


.logo img{

    width:230px;

    max-width:80%;

    height:auto;

    display:block;

}


/* =========================
   QUADRO DE LOGIN
========================= */

.container{

    width:100%;

    background:#2E2E2E;

    border:
        1px solid #4A4A4A;

    border-radius:18px;

    padding:34px 35px 30px;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.40);

}


/* =========================
   TÍTULO
========================= */

h1{

    color:#FFFFFF;

    font-size:25px;

    font-weight:700;

    text-align:center;

    margin-bottom:8px;

}


.subtitulo{

    color:#CFCFCF;

    font-size:13px;

    text-align:center;

    line-height:1.5;

    margin-bottom:28px;

}


/* =========================
   ESCOLHA DO ACESSO
========================= */

.titulo-acesso{

    color:#FFFFFF;

    font-size:14px;

    font-weight:600;

    text-align:center;

    margin-bottom:14px;

}


/* =========================
   BOTÕES ADMIN / ATENDENTE
========================= */

.tipo-login{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-bottom:24px;

}


.tipo-login button{

    width:100%;

    height:52px;

    border:none;

    border-radius:10px;

    background:#73C46B;

    color:#111111;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    transition:
        .2s ease;

}


.tipo-login button:hover{

    background:#8AD982;

    transform:
        translateY(-1px);

    box-shadow:
        0 7px 18px
        rgba(115,196,107,.18);

}


.tipo-login button.ativo{

    background:#73C46B;

    box-shadow:
        0 0 0 2px
        rgba(115,196,107,.25);

}


/* =========================
   FORMULÁRIO
========================= */

#formularioLogin{

    display:none;

}


.form-group{

    text-align:left;

    margin-bottom:17px;

}


label{

    display:block;

    margin-bottom:7px;

    color:#FFFFFF;

    font-size:13px;

    font-weight:600;

}


/* =========================
   INPUTS
========================= */

input{

    width:100%;

    height:52px;

    background:#FFFFFF;

    color:#222222;

    border:
        1px solid #D8D8D8;

    border-radius:9px;

    padding:
        0 14px;

    font-size:15px;

    outline:none;

    transition:
        .2s ease;

}


input::placeholder{

    color:#888888;

}


input:focus{

    border-color:
        #73C46B;

    box-shadow:
        0 0 0 3px
        rgba(115,196,107,.18);

}


/* =========================
   OPÇÕES
========================= */

.opcoes-login{

    text-align:left;

    margin-bottom:18px;

}


.checkbox-item{

    display:flex;

    align-items:center;

    gap:9px;

    margin-bottom:9px;

    color:#D5D5D5;

    font-size:12px;

    font-weight:400;

    cursor:pointer;

}


.checkbox-item input{

    width:17px;

    height:17px;

    margin:0;

    accent-color:#73C46B;

}


/* =========================
   BOTÃO ENTRAR
========================= */

.botao-entrar{

    width:100%;

    height:53px;

    border:none;

    border-radius:10px;

    background:#73C46B;

    color:#111111;

    font-size:16px;

    font-weight:800;

    cursor:pointer;

    transition:
        .2s ease;

}


.botao-entrar:hover{

    background:#8AD982;

    transform:
        translateY(-1px);

    box-shadow:
        0 8px 20px
        rgba(115,196,107,.20);

}


.botao-entrar:active{

    transform:
        translateY(0);

}


/* =========================
   MENSAGEM
========================= */

#mensagem{

    min-height:20px;

    margin-top:16px;

    text-align:center;

    font-size:13px;

    font-weight:600;

    line-height:1.4;

}


/* =========================
   VOLTAR
========================= */

.botao-voltar{

    width:100%;

    height:45px;

    margin-top:12px;

    border:
        1px solid #4A4A4A;

    border-radius:9px;

    background:#252525;

    color:#CFCFCF;

    font-size:13px;

    font-weight:600;

    cursor:pointer;

    display:none;

}


.botao-voltar:hover{

    background:#383838;

    color:#FFFFFF;

}


/* =========================
   RODAPÉ
========================= */

.footer{

    text-align:center;

    margin-top:22px;

    color:#9F9F9F;

    font-size:11px;

}


/* =========================
   CARREGANDO
========================= */

.carregando{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#1F1F1F;

    color:#CFCFCF;

    font-size:15px;

    z-index:9999;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{

        padding:
            20px 15px;

        align-items:center;

    }


    .pagina{

        max-width:390px;

    }


    .logo{

        margin-bottom:22px;

    }


    .logo img{

        width:200px;

    }


    .container{

        padding:
            30px 24px 25px;

    }


    h1{

        font-size:23px;

    }


    .tipo-login{

        grid-template-columns:1fr;

        gap:10px;

    }


    .tipo-login button{

        height:50px;

    }

}


/* =========================
   CELULARES PEQUENOS
========================= */

@media(max-width:380px){

    body{

        padding:
            15px 12px;

    }


    .logo img{

        width:180px;

    }


    .container{

        padding:
            25px 20px;

    }

}

</style>

</head>


<body>


<!-- =========================
     CARREGANDO
========================= -->

<div
    id="telaCarregando"
    class="carregando"
>

    Carregando...

</div>


<!-- =========================
     PÁGINA
========================= -->

<div
    class="pagina"
    id="pagina"
    style="display:none;"
>


    <!-- LOGO FORA DO QUADRO -->

    <div class="logo">

        <img
            src="Colorida.png"
            alt="Pratini Sports"
        >

    </div>


    <!-- QUADRO -->

    <div class="container">


        <h1>
            Portal Pratini Sports
        </h1>


        <p class="subtitulo">

            Selecione o tipo de acesso

        </p>


        <!-- =========================
             ESCOLHA
        ========================= -->

        <div class="titulo-acesso">

            Como deseja acessar?

        </div>


        <div class="tipo-login">


            <button
                id="btnAdministrador"
                onclick="selecionarTipo('administrador')"
            >

                Administrador

            </button>


            <button
                id="btnAtendente"
                onclick="selecionarTipo('atendente')"
            >

                Atendente

            </button>


        </div>


        <!-- =========================
             FORMULÁRIO
        ========================= -->

        <div
            id="formularioLogin"
        >


            <div
                class="form-group"
                id="campoEmail"
            >

                <label for="email">

                    E-mail

                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div
                class="form-group"
                id="campoLogin"
                style="display:none;"
            >

                <label for="login">

                    Nome de acesso

                </label>

                <input
                    id="login"
                    type="text"
                    autocomplete="username"
                    placeholder="Digite seu nome de acesso"
                >

            </div>


            <div class="form-group">

                <label for="senha">

                    Senha

                </label>

                <input
                    id="senha"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                    onkeydown="
                        if(event.key==='Enter'){
                            entrar();
                        }
                    "
                >

            </div>


            <!-- OPÇÕES ADMINISTRADOR -->

            <div
                class="opcoes-login"
                id="opcoesAdministrador"
                style="display:none;"
            >

                <label class="checkbox-item">

                    <input
                        type="checkbox"
                        id="lembrarEmail"
                    >

                    Lembrar e-mail

                </label>


                <label class="checkbox-item">

                    <input
                        type="checkbox"
                        id="manterConectado"
                    >

                    Manter-me conectado

                </label>

            </div>


            <!-- OPÇÕES ATENDENTE -->

            <div
                class="opcoes-login"
                id="opcoesAtendente"
                style="display:none;"
            >

                <label class="checkbox-item">

                    <input
                        type="checkbox"
                        id="lembrarLogin"
                    >

                    Lembrar nome de acesso

                </label>


                <label class="checkbox-item">

                    <input
                        type="checkbox"
                        id="manterConectadoAtendente"
                    >

                    Manter-me conectado

                </label>

            </div>


            <button
                class="botao-entrar"
                onclick="entrar()"
            >

                ENTRAR

            </button>


            <button
                id="botaoVoltar"
                class="botao-voltar"
                onclick="voltarEscolha()"
            >

                Voltar

            </button>


            <p id="mensagem"></p>


        </div>


        <!-- RODAPÉ -->

        <div class="footer">

            © 2026 Pratini Sports

        </div>


    </div>

</div>


<script>

/* =========================
   VARIÁVEL DO TIPO DE ACESSO
========================= */

let tipoAcesso = null;


/* =========================
   INICIAR
========================= */

window.onload = function(){

    document.getElementById(
        "telaCarregando"
    ).style.display = "none";


    document.getElementById(
        "pagina"
    ).style.display = "flex";


    carregarDadosSalvos();

};


/* =========================
   DADOS SALVOS
========================= */

function carregarDadosSalvos(){

    const emailSalvo =
        localStorage.getItem(
            "email_salvo"
        );


    if(emailSalvo){

        document.getElementById(
            "email"
        ).value = emailSalvo;

        document.getElementById(
            "lembrarEmail"
        ).checked = true;

    }


    const loginSalvo =
        localStorage.getItem(
            "login_atendente_salvo"
        );


    if(loginSalvo){

        document.getElementById(
            "login"
        ).value = loginSalvo;

        document.getElementById(
            "lembrarLogin"
        ).checked = true;

    }


    const manter =
        localStorage.getItem(
            "manter_conectado"
        );


    if(manter === "sim"){

        document.getElementById(
            "manterConectado"
        ).checked = true;

    }


    const manterAtendente =
        localStorage.getItem(
            "manter_conectado_atendente"
        );


    if(
        manterAtendente === "sim"
    ){

        document.getElementById(
            "manterConectadoAtendente"
        ).checked = true;

    }

}


/* =========================
   ESCOLHER TIPO
========================= */

function selecionarTipo(tipo){

    tipoAcesso = tipo;


    const formulario =
        document.getElementById(
            "formularioLogin"
        );


    const campoEmail =
        document.getElementById(
            "campoEmail"
        );


    const campoLogin =
        document.getElementById(
            "campoLogin"
        );


    const opcoesAdministrador =
        document.getElementById(
            "opcoesAdministrador"
        );


    const opcoesAtendente =
        document.getElementById(
            "opcoesAtendente"
        );


    const btnAdministrador =
        document.getElementById(
            "btnAdministrador"
        );


    const btnAtendente =
        document.getElementById(
            "btnAtendente"
        );


    const botaoVoltar =
        document.getElementById(
            "botaoVoltar"
        );


    formulario.style.display =
        "block";


    botaoVoltar.style.display =
        "block";


    if(tipo === "administrador"){

        campoEmail.style.display =
            "block";

        campoLogin.style.display =
            "none";


        opcoesAdministrador.style.display =
            "block";

        opcoesAtendente.style.display =
            "none";


        btnAdministrador.classList.add(
            "ativo"
        );

        btnAtendente.classList.remove(
            "ativo"
        );


        document.getElementById(
            "email"
        ).focus();

    }


    if(tipo === "atendente"){

        campoEmail.style.display =
            "none";

        campoLogin.style.display =
            "block";


        opcoesAdministrador.style.display =
            "none";

        opcoesAtendente.style.display =
            "block";


        btnAdministrador.classList.remove(
            "ativo"
        );

        btnAtendente.classList.add(
            "ativo"
        );


        document.getElementById(
            "login"
        ).focus();

    }


    limparMensagem();

}


/* =========================
   VOLTAR
========================= */

function voltarEscolha(){

    tipoAcesso = null;


    document.getElementById(
        "formularioLogin"
    ).style.display =
        "none";


    document.getElementById(
        "botaoVoltar"
    ).style.display =
        "none";


    document.getElementById(
        "btnAdministrador"
    ).classList.remove(
        "ativo"
    );


    document.getElementById(
        "btnAtendente"
    ).classList.remove(
        "ativo"
    );


    document.getElementById(
        "senha"
    ).value = "";


    limparMensagem();

}


/* =========================
   LIMPAR MENSAGEM
========================= */

function limparMensagem(){

    const mensagem =
        document.getElementById(
            "mensagem"
        );

    mensagem.innerHTML = "";

}


/* =========================
   LOGIN
========================= */

async function entrar(){

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    if(!tipoAcesso){

        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Selecione Administrador ou Atendente.";

        return;

    }


    const senha =
        document.getElementById(
            "senha"
        ).value.trim();


    if(!senha){

        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Digite sua senha.";

        return;

    }


    if(typeof db === "undefined"){

        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Erro: Supabase não carregado.";

        return;

    }


    mensagem.style.color =
        "#CFCFCF";

    mensagem.innerHTML =
        "Verificando acesso...";


    try{


        /* =========================
           ADMINISTRADOR
        ========================= */

        if(
            tipoAcesso ===
            "administrador"
        ){

            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            if(!email){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Digite o e-mail do administrador.";

                return;

            }


            const {
                data,
                error
            } =
                await db.auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        senha

                });


            if(error){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "E-mail ou senha inválidos.";

                return;

            }


            if(
                data &&
                data.session
            ){

                const lembrar =
                    document.getElementById(
                        "lembrarEmail"
                    ).checked;


                const manter =
                    document.getElementById(
                        "manterConectado"
                    ).checked;


                if(lembrar){

                    localStorage.setItem(
                        "email_salvo",
                        email
                    );

                }else{

                    localStorage.removeItem(
                        "email_salvo"
                    );

                }


                if(manter){

                    localStorage.setItem(
                        "manter_conectado",
                        "sim"
                    );

                }else{

                    localStorage.removeItem(
                        "manter_conectado"
                    );

                }


                mensagem.style.color =
                    "#73C46B";

                mensagem.innerHTML =
                    "Login realizado com sucesso!";


                setTimeout(
                    function(){

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );

            }

            return;

        }


        /* =========================
           ATENDENTE
        ========================= */

        if(
            tipoAcesso ===
            "atendente"
        ){

            const login =
                document.getElementById(
                    "login"
                ).value.trim();


            if(!login){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Digite seu nome de acesso.";

                return;

            }


            /*
               BUSCA O USUÁRIO DE LOGIN
               PELO NOME DE ACESSO
            */

            const {
                data: usuarioLogin,
                error: erroLogin
            } =
                await db
                .from("usuarios_login")
                .select(
                    "id,usuario_id,login,nome,tipo,ativo,email_interno"
                )
                .eq(
                    "login",
                    login
                )
                .eq(
                    "ativo",
                    true
                )
                .maybeSingle();


            if(
                erroLogin ||
                !usuarioLogin
            ){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Nome de acesso ou senha inválidos.";

                return;

            }


            /*
               O SUPABASE AUTH PRECISA
               DO EMAIL INTERNO DA ATENDENTE.

               A ATENDENTE NÃO PRECISA
               SABER OU DIGITAR ESSE EMAIL.
            */

            const emailInterno =
                usuarioLogin.email_interno;


            if(!emailInterno){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Este usuário ainda não está configurado corretamente.";

                return;

            }


            const {
                data,
                error
            } =
                await db.auth
                .signInWithPassword({

                    email:
                        emailInterno,

                    password:
                        senha

                });


            if(error){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Nome de acesso ou senha inválidos.";

                return;

            }


            if(
                data &&
                data.session
            ){

                const lembrar =
                    document.getElementById(
                        "lembrarLogin"
                    ).checked;


                const manter =
                    document.getElementById(
                        "manterConectadoAtendente"
                    ).checked;


                if(lembrar){

                    localStorage.setItem(
                        "login_atendente_salvo",
                        login
                    );

                }else{

                    localStorage.removeItem(
                        "login_atendente_salvo"
                    );

                }


                if(manter){

                    localStorage.setItem(
                        "manter_conectado_atendente",
                        "sim"
                    );

                }else{

                    localStorage.removeItem(
                        "manter_conectado_atendente"
                    );

                }


                /*
                   GUARDA O LOGIN DA ATENDENTE
                   PARA IDENTIFICAÇÃO NO SISTEMA
                */

                localStorage.setItem(
                    "usuario_login",
                    login
                );


                localStorage.setItem(
                    "usuario_nome",
                    usuarioLogin.nome
                );


                localStorage.setItem(
                    "usuario_tipo",
                    "atendente"
                );


                mensagem.style.color =
                    "#73C46B";

                mensagem.innerHTML =
                    "Login realizado com sucesso!";


                setTimeout(
                    function(){

                        window.location.href =
                            "dashboard.html";

                    },
                    700
                );

            }

        }


    }catch(err){

        console.error(err);


        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Erro ao realizar login.";

    }

}

</script>

</body>

</html>
