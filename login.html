<h1>Portal Pratini Sports</h1>

<p>Acesso exclusivo para equipe autorizada</p>

<input id="usuario" placeholder="Usuário">

<input id="senha" type="password" placeholder="Senha">

<button onclick="entrar()">Entrar</button>

<p id="mensagem"></p>

</div>


<script>
async function entrar() {

    const campoMensagem = document.getElementById("mensagem");

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();

    campoMensagem.innerHTML = "";

    try {

        const { data, error } = await db
            .from("usuarios_v2")
            .select("*")
            .eq("usuario", usuario)
            .eq("senha", senha)
            .eq("ativo", true);

        if (error) {
            campoMensagem.innerHTML = error.message;
            return;
        }

        if (data && data.length > 0) {
            campoMensagem.innerHTML = "LOGIN OK";

            // depois ativamos o redirecionamento
            // window.location.href = "dashboard.html";

        } else {
            campoMensagem.innerHTML = "Usuário ou senha inválidos";
        }

    } catch (err) {

        campoMensagem.innerHTML = err.message;

    }
}
</script>
