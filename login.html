<script>
async function entrar() {

    const campoMensagem = document.getElementById("mensagem");

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value.trim();

    campoMensagem.innerHTML = "";

    try {

        const { data, error } = await db
            .from("usuarios_v2")
            .select("*")
            .eq("usuario", usuario)
            .eq("senha", senha)
            .eq("ativo", true);

        console.log("DATA:", data);
        console.log("ERROR:", error);

        alert("DATA: " + JSON.stringify(data));
        alert("ERROR: " + JSON.stringify(error));

        if (error) {
            campoMensagem.innerHTML = error.message;
            return;
        }

        if (data && data.length > 0) {
            campoMensagem.innerHTML = "LOGIN OK";
            // window.location.href = "atletas.html";
        } else {
            campoMensagem.innerHTML = "Usuário ou senha inválidos";
        }

    } catch (err) {

        console.error(err);
        campoMensagem.innerHTML = err.message;

    }
}
</script>
