<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pratini Sports - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

/* =========================================================
   CORES PADRÃO PRATINI SPORTS
========================================================= */

:root{

    --verde:#7CFC00;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --preto:#050505;

    --texto:#f5f5f5;

    --cinza:#b8b8b8;

    --borda:#3a3e42;

}


/* =========================================================
   RESET
========================================================= */

*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


/* =========================================================
   BODY
========================================================= */

html,
body{

    width:100%;

    min-height:100%;

}


body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--grafite);

    color:
        var(--texto);

    display:flex;

    flex-direction:column;

    align-items:center;

    overflow-x:hidden;

}


/* =========================================================
   ÁREA DA LOGO
========================================================= */

.logo-area{

    width:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    padding-top:55px;

    padding-bottom:25px;

}


.logo-area img{

    width:180px;

    max-width:70vw;

    height:auto;

    object-fit:contain;

}


/* =========================================================
   CAIXA PRINCIPAL
========================================================= */

.login-container{

    width:
        calc(100% - 40px);

    max-width:430px;

    background:#111;

    border:
        1px solid var(--borda);

    border-top:
        4px solid var(--verde);

    border-radius:16px;

    padding:32px;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);

    text-align:center;

    margin:
        auto 0;

}


/* =========================================================
   TÍTULO
========================================================= */

.titulo{

    color:#fff;

    font-size:27px;

    font-weight:800;

    line-height:1.2;

    margin-bottom:8px;

}


.subtitulo{

    color:#aaa;

    font-size:14px;

    line-height:1.5;

    margin-bottom:28px;

}


/* =========================================================
   TELA DE ESCOLHA
========================================================= */

.escolha-login{

    display:flex;

    flex-direction:column;

    gap:14px;

}


.botao-tipo{

    width:100%;

    min-height:58px;

    border:
        1px solid var(--verde);

    border-radius:11px;

    background:
        var(--verde);

    color:
        var(--preto);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:17px;

    font-weight:800;

    letter-spacing:.3px;

    cursor:pointer;

    transition:
        .2s ease;

}


.botao-tipo:hover{

    filter:brightness(.92);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(124,252,0,.15);

}


.botao-tipo:active{

    transform:
        translateY(0);

}


/* =========================================================
   FORMULÁRIO
========================================================= */

.formulario{

    display:none;

    text-align:left;

}


.formulario.ativo{

    display:block;

}


/* =========================================================
   VOLTAR
========================================================= */

.voltar{

    display:inline-flex;

    align-items:center;

    gap:6px;

    background:transparent;

    border:0;

    padding:0;

    margin-bottom:24px;

    color:#aaa;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:14px;

    cursor:pointer;

    transition:.2s ease;

}


.voltar:hover{

    color:
        var(--verde);

}


/* =========================================================
   TÍTULO DO FORMULÁRIO
========================================================= */

.titulo-formulario{

    text-align:center;

    color:#fff;

    font-size:22px;

    font-weight:800;

    margin-bottom:24px;

}


/* =========================================================
   CAMPOS
========================================================= */

.form-group{

    margin-bottom:18px;

}


.form-group label{

    display:block;

    margin-bottom:8px;

    color:#fff;

    font-size:14px;

    font-weight:700;

}


.form-group input{

    width:100%;

    height:52px;

    background:#fff;

    color:#222;

    border:
        1px solid #ddd;

    border-radius:10px;

    padding:
        0 15px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:16px;

    outline:none;

    transition:.2s ease;

}


.form-group input::placeholder{

    color:#888;

}


.form-group input:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 3px
        rgba(124,252,0,.12);

}


/* =========================================================
   OPÇÕES
========================================================= */

.opcoes-login{

    margin-top:2px;

    margin-bottom:18px;

}


.checkbox-item{

    display:flex;

    align-items:center;

    gap:9px;

    color:#ccc;

    font-size:13px;

    font-weight:500;

    cursor:pointer;

    margin-bottom:10px;

}


.checkbox-item input{

    width:17px;

    height:17px;

    margin:0;

    accent-color:
        var(--verde);

}


/* =========================================================
   BOTÃO ENTRAR
========================================================= */

.botao-entrar{

    width:100%;

    height:54px;

    border:
        1px solid var(--verde);

    border-radius:10px;

    background:
        var(--verde);

    color:
        var(--preto);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:.2s ease;

}


.botao-entrar:hover{

    filter:brightness(.92);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(124,252,0,.15);

}


.botao-entrar:active{

    transform:
        translateY(0);

}


.botao-entrar:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* =========================================================
   MENSAGEM
========================================================= */

#mensagem{

    min-height:22px;

    margin-top:17px;

    text-align:center;

    font-size:14px;

    font-weight:600;

    line-height:1.4;

}


.mensagem-erro{

    color:#ff6b6b;

}


.mensagem-sucesso{

    color:
        var(--verde);

}


.mensagem-normal{

    color:#ccc;

}


/* =========================================================
   RODAPÉ
========================================================= */

.footer{

    width:100%;

    text-align:center;

    color:#777;

    font-size:12px;

    padding:
        25px 20px 20px;

}


/* =========================================================
   CARREGANDO
========================================================= */

.carregando{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        var(--grafite);

    color:#ccc;

    font-size:16px;

    z-index:9999;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .logo-area{

        padding-top:30px;

        padding-bottom:20px;

    }


    .logo-area img{

        width:150px;

    }


    .login-container{

        width:
            calc(100% - 24px);

        padding:27px 22px;

        margin:
            0 auto;

    }


    .titulo{

        font-size:24px;

    }


    .subtitulo{

        font-size:13px;

        margin-bottom:24px;

    }


    .botao-tipo{

        min-height:56px;

        font-size:16px;

    }


    .footer{

        padding-top:22px;

    }

}


/* =========================================================
   TELAS MUITO PEQUENAS
========================================================= */

@media(max-height:700px){

    .logo-area{

        padding-top:20px;

        padding-bottom:15px;

    }


    .logo-area img{

        width:130px;

    }


    .login-container{

        padding-top:23px;

        padding-bottom:23px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     LOGO
======================================================= -->

<div class="logo-area">

    <img
        src="Colorida.png"
        alt="Pratini Sports"
    >

</div>


<!-- =======================================================
     CAIXA DE LOGIN
======================================================= -->

<div class="login-container">


    <!-- ===================================================
         ESCOLHA DO TIPO DE ACESSO
    ==================================================== -->

    <div
        id="escolhaLogin"
        class="escolha-login"
    >

        <div class="titulo">
            Portal Pratini Sports
        </div>

        <div class="subtitulo">
            Selecione o tipo de acesso
        </div>


        <button
            type="button"
            class="botao-tipo"
            onclick="abrirLogin('administrador')"
        >
            ADMINISTRADOR
        </button>


        <button
            type="button"
            class="botao-tipo"
            onclick="abrirLogin('atendente')"
        >
            ATENDENTE
        </button>

    </div>


    <!-- ===================================================
         LOGIN ADMINISTRADOR
    ==================================================== -->

    <div
        id="formAdministrador"
        class="formulario"
    >

        <button
            type="button"
            class="voltar"
            onclick="voltarInicio()"
        >
            ← Voltar para a página inicial
        </button>


        <div class="titulo-formulario">
            Acesso do Administrador
        </div>


        <div class="form-group">

            <label for="emailAdministrador">
                E-mail
            </label>

            <input
                id="emailAdministrador"
                type="email"
                placeholder="Digite seu e-mail"
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label for="senhaAdministrador">
                Senha
            </label>

            <input
                id="senhaAdministrador"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                onkeydown="
                    if(event.key==='Enter'){
                        entrarAdministrador();
                    }
                "
            >

        </div>


        <div class="opcoes-login">

            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="lembrarEmail"
                >

                Lembrar e-mail

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="manterConectadoAdmin"
                >

                Manter-me conectado

            </label>

        </div>


        <button
            id="botaoAdministrador"
            type="button"
            class="botao-entrar"
            onclick="entrarAdministrador()"
        >
            ENTRAR
        </button>


        <p id="mensagemAdministrador"></p>

    </div>


    <!-- ===================================================
         LOGIN ATENDENTE
    ==================================================== -->

    <div
        id="formAtendente"
        class="formulario"
    >

        <button
            type="button"
            class="voltar"
            onclick="voltarInicio()"
        >
            ← Voltar para a página inicial
        </button>


        <div class="titulo-formulario">
            Acesso da Atendente
        </div>


        <div class="form-group">

            <label for="loginAtendente">
                Usuário
            </label>

            <input
                id="loginAtendente"
                type="text"
                placeholder="Digite seu usuário"
                autocomplete="username"
            >

        </div>


        <div class="form-group">

            <label for="senhaAtendente">
                Senha
            </label>

            <input
                id="senhaAtendente"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                onkeydown="
                    if(event.key==='Enter'){
                        entrarAtendente();
                    }
                "
            >

        </div>


        <label class="checkbox-item">

            <input
                type="checkbox"
                id="manterConectadoAtendente"
            >

            Manter-me conectado

        </label>


        <button
            id="botaoAtendente"
            type="button"
            class="botao-entrar"
            onclick="entrarAtendente()"
        >
            ENTRAR
        </button>


        <p id="mensagemAtendente"></p>

    </div>


</div>


<!-- =======================================================
     RODAPÉ
======================================================= -->

<div class="footer">

    © 2026 Pratini Sports

</div>


<script>


/* =========================================================
   CONTROLE DA TELA
========================================================= */

function abrirLogin(tipo){

    const escolha =
        document.getElementById(
            "escolhaLogin"
        );


    const administrador =
        document.getElementById(
            "formAdministrador"
        );


    const atendente =
        document.getElementById(
            "formAtendente"
        );


    escolha.style.display =
        "none";


    administrador.classList.remove(
        "ativo"
    );


    atendente.classList.remove(
        "ativo"
    );


    if(
        tipo ===
        "administrador"
    ){

        administrador.classList.add(
            "ativo"
        );


        setTimeout(
            function(){

                document
                .getElementById(
                    "emailAdministrador"
                )
                .focus();

            },
            100
        );

    }


    if(
        tipo ===
        "atendente"
    ){

        atendente.classList.add(
            "ativo"
        );


        setTimeout(
            function(){

                document
                .getElementById(
                    "loginAtendente"
                )
                .focus();

            },
            100
        );

    }

}


/* =========================================================
   VOLTAR
========================================================= */

function voltarInicio(){

    document
    .getElementById(
        "formAdministrador"
    )
    .classList.remove(
        "ativo"
    );


    document
    .getElementById(
        "formAtendente"
    )
    .classList.remove(
        "ativo"
    );


    document
    .getElementById(
        "escolhaLogin"
    )
    .style.display =
        "flex";


    limparMensagens();

}


/* =========================================================
   LIMPAR MENSAGENS
========================================================= */

function limparMensagens(){

    document
    .getElementById(
        "mensagemAdministrador"
    )
    .innerHTML =
        "";


    document
    .getElementById(
        "mensagemAtendente"
    )
    .innerHTML =
        "";

}


/* =========================================================
   MENSAGEM
========================================================= */

function mostrarMensagem(
    elemento,
    texto,
    tipo
){

    elemento.className =
        "";


    if(
        tipo === "erro"
    ){

        elemento.classList.add(
            "mensagem-erro"
        );

    }
    else if(
        tipo === "sucesso"
    ){

        elemento.classList.add(
            "mensagem-sucesso"
        );

    }
    else{

        elemento.classList.add(
            "mensagem-normal"
        );

    }


    elemento.innerHTML =
        texto;

}


/* =========================================================
   CARREGAR DADOS SALVOS
========================================================= */

window.addEventListener(
    "load",
    function(){

        const emailSalvo =
            localStorage.getItem(
                "email_salvo"
            );


        if(emailSalvo){

            document
            .getElementById(
                "emailAdministrador"
            )
            .value =
                emailSalvo;


            document
            .getElementById(
                "lembrarEmail"
            )
            .checked =
                true;

        }

    }
);


/* =========================================================
   LOGIN ADMINISTRADOR
========================================================= */

async function entrarAdministrador(){

    const email =
        document
        .getElementById(
            "emailAdministrador"
        )
        .value
        .trim();


    const senha =
        document
        .getElementById(
            "senhaAdministrador"
        )
        .value;


    const mensagem =
        document
        .getElementById(
            "mensagemAdministrador"
        );


    const botao =
        document
        .getElementById(
            "botaoAdministrador"
        );


    if(
        !email ||
        !senha
    ){

        mostrarMensagem(
            mensagem,
            "Digite o e-mail e a senha.",
            "erro"
        );

        return;

    }


    if(
        typeof db ===
        "undefined"
    ){

        mostrarMensagem(
            mensagem,
            "Erro: conexão com o Supabase não foi carregada.",
            "erro"
        );

        return;

    }


    botao.disabled =
        true;


    mostrarMensagem(
        mensagem,
        "Verificando acesso...",
        "normal"
    );


    try{

        const {
            data,
            error
        } =
            await db.auth.signInWithPassword({

                email:
                    email,

                password:
                    senha

            });


        if(error){

            console.error(
                error
            );


            mostrarMensagem(
                mensagem,
                "E-mail ou senha inválidos.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        if(
            !data ||
            !data.session
        ){

            mostrarMensagem(
                mensagem,
                "Não foi possível iniciar a sessão.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           CONFERE O PERFIL
           DO USUÁRIO
        */

        const usuario =
            data.session.user;


        const {
            data: perfil,
            error: erroPerfil
        } =
            await db
            .from("perfis")
            .select(
                "role,nome"
            )
            .eq(
                "id",
                usuario.id
            )
            .single();


        if(
            erroPerfil ||
            !perfil
        ){

            await db.auth.signOut();


            mostrarMensagem(
                mensagem,
                "Perfil de usuário não encontrado.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           ADMINISTRADOR
        */

        if(
            perfil.role !==
            "admin" &&
            perfil.role !==
            "administrador"
        ){

            await db.auth.signOut();


            mostrarMensagem(
                mensagem,
                "Este acesso não possui permissão de administrador.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           LEMBRAR E-MAIL
        */

        const lembrar =
            document
            .getElementById(
                "lembrarEmail"
            )
            .checked;


        if(lembrar){

            localStorage.setItem(
                "email_salvo",
                email
            );

        }
        else{

            localStorage.removeItem(
                "email_salvo"
            );

        }


        /*
           MANTER CONECTADO
        */

        const manter =
            document
            .getElementById(
                "manterConectadoAdmin"
            )
            .checked;


        if(manter){

            localStorage.setItem(
                "manter_conectado",
                "sim"
            );

        }
        else{

            localStorage.removeItem(
                "manter_conectado"
            );

        }


        mostrarMensagem(
            mensagem,
            "Login realizado com sucesso!",
            "sucesso"
        );


        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            600
        );


    }
    catch(error){

        console.error(
            error
        );


        mostrarMensagem(
            mensagem,
            "Ocorreu um erro ao realizar o login.",
            "erro"
        );


        botao.disabled =
            false;

    }

}


/* =========================================================
   LOGIN ATENDENTE
========================================================= */

async function entrarAtendente(){

    const login =
        document
        .getElementById(
            "loginAtendente"
        )
        .value
        .trim();


    const senha =
        document
        .getElementById(
            "senhaAtendente"
        )
        .value;


    const mensagem =
        document
        .getElementById(
            "mensagemAtendente"
        );


    const botao =
        document
        .getElementById(
            "botaoAtendente"
        );


    if(
        !login ||
        !senha
    ){

        mostrarMensagem(
            mensagem,
            "Digite o usuário e a senha.",
            "erro"
        );

        return;

    }


    if(
        typeof db ===
        "undefined"
    ){

        mostrarMensagem(
            mensagem,
            "Erro: conexão com o Supabase não foi carregada.",
            "erro"
        );

        return;

    }


    botao.disabled =
        true;


    mostrarMensagem(
        mensagem,
        "Verificando acesso...",
        "normal"
    );


    try{

        /*
           PROCURA O LOGIN
           DA ATENDENTE
        */

        const {
            data: usuarioLogin,
            error: erroLogin
        } =
            await db
            .from("usuarios_login")
            .select(
                "id,usuario_id,login,nome,tipo,ativo,email_interno"
            )
            .eq(
                "login",
                login
            )
            .maybeSingle();


        if(
            erroLogin
        ){

            console.error(
                erroLogin
            );


            mostrarMensagem(
                mensagem,
                "Erro ao verificar o usuário.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        if(
            !usuarioLogin
        ){

            mostrarMensagem(
                mensagem,
                "Usuário ou senha inválidos.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           VERIFICA SE ESTÁ ATIVO
        */

        if(
            usuarioLogin.ativo !==
            true
        ){

            mostrarMensagem(
                mensagem,
                "Este usuário está desativado.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           VERIFICA O TIPO
        */

        if(
            usuarioLogin.tipo !==
            "atendente"
        ){

            mostrarMensagem(
                mensagem,
                "Este usuário não possui acesso de atendente.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           O SUPABASE AUTH
           CONTINUA SENDO O RESPONSÁVEL
           PELA AUTENTICAÇÃO.

           O campo email_interno contém
           o e-mail técnico vinculado
           àquele usuário.
        */

        const emailInterno =
            usuarioLogin.email_interno;


        if(
            !emailInterno
        ){

            mostrarMensagem(
                mensagem,
                "Este atendente ainda não possui um acesso configurado.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        const {
            data,
            error
        } =
            await db.auth.signInWithPassword({

                email:
                    emailInterno,

                password:
                    senha

            });


        if(error){

            console.error(
                error
            );


            mostrarMensagem(
                mensagem,
                "Usuário ou senha inválidos.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        if(
            !data ||
            !data.session
        ){

            mostrarMensagem(
                mensagem,
                "Não foi possível iniciar a sessão.",
                "erro"
            );


            botao.disabled =
                false;


            return;

        }


        /*
           GUARDA O NOME DA ATENDENTE
           PARA SER UTILIZADO PELO SISTEMA
        */

        localStorage.setItem(
            "atendente_nome",
            usuarioLogin.nome
        );


        localStorage.setItem(
            "atendente_login",
            usuarioLogin.login
        );


        localStorage.setItem(
            "atendente_id",
            usuarioLogin.id
        );


        /*
           MANTER CONECTADO
        */

        const manter =
            document
            .getElementById(
                "manterConectadoAtendente"
            )
            .checked;


        if(manter){

            localStorage.setItem(
                "manter_conectado",
                "sim"
            );

        }
        else{

            localStorage.removeItem(
                "manter_conectado"
            );

        }


        mostrarMensagem(
            mensagem,
            "Login realizado com sucesso!",
            "sucesso"
        );


        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            600
        );


    }
    catch(error){

        console.error(
            error
        );


        mostrarMensagem(
            mensagem,
            "Ocorreu um erro ao realizar o login.",
            "erro"
        );


        botao.disabled =
            false;

    }

}


/* =========================================================
   ENTER PELO TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key !==
            "Enter"
        ){

            return;

        }


        const admin =
            document
            .getElementById(
                "formAdministrador"
            );


        const atendente =
            document
            .getElementById(
                "formAtendente"
            );


        if(
            admin.classList.contains(
                "ativo"
            )
        ){

            entrarAdministrador();

        }


        if(
            atendente.classList.contains(
                "ativo"
            )
        ){

            entrarAtendente();

        }

    }
);

</script>
