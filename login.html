<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Pratini Sports - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

:root{

    --bg:#1F1F1F;

    --card:#2E2E2E;

    --card-hover:#383838;

    --primary:#73C46B;

    --primary-hover:#8AD982;

    --text:#FFFFFF;

    --text-secondary:#CFCFCF;

    --border:#4A4A4A;

    --danger:#ff6b6b;
}


*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    font-family:
        'Segoe UI',
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #1A1A1A,
            #222222,
            #2A2A2A
        );

    color:var(--text);
}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:430px;

    background:
        var(--card);

    border:
        1px solid var(--border);

    border-top:
        4px solid var(--primary);

    border-radius:20px;

    padding:38px 32px;

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.40);

    text-align:center;
}


/* =========================
   LOGO
========================= */

.logo{

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:20px;
}


.logo img{

    width:210px;

    max-width:80%;

    height:auto;
}


/* =========================
   TÍTULO
========================= */

h1{

    color:
        var(--text);

    font-size:28px;

    font-weight:700;

    margin-bottom:8px;
}


.subtitulo{

    color:
        var(--text-secondary);

    font-size:14px;

    line-height:1.5;

    margin-bottom:30px;
}


/* =========================
   ESCOLHA DE ACESSO
========================= */

#telaEscolha{

    display:block;
}


.titulo-escolha{

    color:#fff;

    font-size:18px;

    font-weight:700;

    margin-bottom:18px;
}


.botao-tipo{

    width:100%;

    min-height:60px;

    border:
        1px solid var(--border);

    border-radius:12px;

    margin-bottom:12px;

    background:
        #252525;

    color:#fff;

    font-size:17px;

    font-weight:700;

    cursor:pointer;

    transition:
        all .2s ease;
}


.botao-tipo:hover{

    background:
        var(--card-hover);

    border-color:
        var(--primary);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(115,196,107,.10);
}


.botao-tipo .icone{

    margin-right:8px;
}


/* =========================
   FORMULÁRIO
========================= */

.tela-login{

    display:none;
}


.titulo-login{

    color:
        var(--primary);

    font-size:20px;

    font-weight:800;

    margin-bottom:25px;

    text-transform:uppercase;
}


.form-group{

    text-align:left;

    margin-bottom:18px;
}


.form-group label{

    display:block;

    margin-bottom:8px;

    color:#fff;

    font-size:14px;

    font-weight:600;
}


.form-group input{

    width:100%;

    height:54px;

    background:#fff;

    color:#222;

    border:
        1px solid #ddd;

    border-radius:10px;

    padding:
        0 15px;

    font-size:16px;

    transition:
        all .2s ease;
}


.form-group input::placeholder{

    color:#888;
}


.form-group input:focus{

    outline:none;

    border-color:
        var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(115,196,107,.18);
}


/* =========================
   OPÇÕES
========================= */

.opcoes-login{

    text-align:left;

    margin-bottom:8px;
}


.checkbox-item{

    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;

    color:#fff;

    font-size:14px;

    cursor:pointer;
}


.checkbox-item input{

    width:18px;

    height:18px;

    margin:0;

    accent-color:
        var(--primary);
}


/* =========================
   BOTÃO ENTRAR
========================= */

.botao-entrar{

    width:100%;

    height:55px;

    border:0;

    border-radius:10px;

    margin-top:10px;

    background:
        var(--primary);

    color:#111;

    font-size:17px;

    font-weight:800;

    cursor:pointer;

    transition:
        all .2s ease;
}


.botao-entrar:hover{

    background:
        var(--primary-hover);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 20px
        rgba(115,196,107,.25);
}


.botao-entrar:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

    box-shadow:none;
}


/* =========================
   BOTÃO VOLTAR
========================= */

.botao-voltar{

    width:100%;

    height:48px;

    border:
        1px solid var(--border);

    border-radius:10px;

    margin-top:12px;

    background:#222;

    color:#fff;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.2s;
}


.botao-voltar:hover{

    background:
        #383838;

    border-color:
        #666;
}


/* =========================
   MENSAGEM
========================= */

#mensagem{

    min-height:22px;

    margin-top:16px;

    color:#fff;

    font-size:14px;

    font-weight:600;

    line-height:1.4;
}


.mensagem-erro{

    color:
        var(--danger) !important;
}


.mensagem-sucesso{

    color:
        var(--primary) !important;
}


/* =========================
   RODAPÉ
========================= */

.footer{

    margin-top:25px;

    padding-top:18px;

    border-top:
        1px solid
        rgba(255,255,255,.08);

    color:
        #aaa;

    font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{

        padding:14px;

        align-items:center;
    }


    .container{

        padding:
            30px 22px;

        border-radius:17px;
    }


    .logo img{

        width:185px;
    }


    h1{

        font-size:25px;
    }


    .subtitulo{

        font-size:13px;

        margin-bottom:25px;
    }


    .botao-tipo{

        min-height:58px;

        font-size:16px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">

        <img
            src="Colorida.png"
            alt="Pratini Sports"
        >

    </div>


    <h1>
        Portal Pratini Sports
    </h1>


    <p class="subtitulo">

        Selecione o tipo de acesso

    </p>


    <!-- =========================
         ESCOLHA DO USUÁRIO
    ========================== -->

    <div id="telaEscolha">

        <div class="titulo-escolha">

            Como você deseja entrar?

        </div>


        <button
            class="botao-tipo"
            onclick="abrirLogin('admin')"
        >

            <span class="icone">🔐</span>

            ADMINISTRADOR

        </button>


        <button
            class="botao-tipo"
            onclick="abrirLogin('atendente')"
        >

            <span class="icone">👤</span>

            ATENDENTE

        </button>

    </div>


    <!-- =========================
         LOGIN ADMINISTRADOR
    ========================== -->

    <div
        id="loginAdmin"
        class="tela-login"
    >

        <div class="titulo-login">

            Acesso do Administrador

        </div>


        <div class="form-group">

            <label for="emailAdmin">

                E-mail

            </label>

            <input
                id="emailAdmin"
                type="email"
                autocomplete="username"
                placeholder="Digite seu e-mail"
            >

        </div>


        <div class="form-group">

            <label for="senhaAdmin">

                Senha

            </label>

            <input
                id="senhaAdmin"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
            >

        </div>


        <div class="opcoes-login">

            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="lembrarEmail"
                >

                Lembrar e-mail

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="manterConectadoAdmin"
                >

                Manter-me conectado

            </label>

        </div>


        <button
            class="botao-entrar"
            id="botaoAdmin"
            onclick="entrarAdministrador()"
        >

            ENTRAR

        </button>


        <button
            class="botao-voltar"
            onclick="voltarEscolha()"
        >

            ← Voltar

        </button>

    </div>


    <!-- =========================
         LOGIN ATENDENTE
    ========================== -->

    <div
        id="loginAtendente"
        class="tela-login"
    >

        <div class="titulo-login">

            Acesso da Atendente

        </div>


        <div class="form-group">

            <label for="loginAtendenteCampo">

                Usuário

            </label>

            <input
                id="loginAtendenteCampo"
                type="text"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                placeholder="Digite seu usuário"
            >

        </div>


        <div class="form-group">

            <label for="senhaAtendente">

                Senha

            </label>

            <input
                id="senhaAtendente"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
            >

        </div>


        <div class="opcoes-login">

            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="manterConectadoAtendente"
                >

                Manter-me conectado

            </label>

        </div>


        <button
            class="botao-entrar"
            id="botaoAtendente"
            onclick="entrarAtendente()"
        >

            ENTRAR

        </button>


        <button
            class="botao-voltar"
            onclick="voltarEscolha()"
        >

            ← Voltar

        </button>

    </div>


    <!-- =========================
         MENSAGEM
    ========================== -->

    <p id="mensagem"></p>


    <div class="footer">

        © 2026 Pratini Sports

    </div>


</div>


<script>


/* =========================
   ELEMENTOS
========================= */

const telaEscolha =
    document.getElementById(
        "telaEscolha"
    );


const loginAdmin =
    document.getElementById(
        "loginAdmin"
    );


const loginAtendente =
    document.getElementById(
        "loginAtendente"
    );


const mensagem =
    document.getElementById(
        "mensagem"
    );


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(
    texto,
    tipo = ""
){

    mensagem.className = "";

    mensagem.innerText =
        texto;


    if(tipo === "erro"){

        mensagem.classList.add(
            "mensagem-erro"
        );

    }


    if(tipo === "sucesso"){

        mensagem.classList.add(
            "mensagem-sucesso"
        );
    }

}


/* =========================
   ABRIR LOGIN
========================= */

function abrirLogin(tipo){

    telaEscolha.style.display =
        "none";


    loginAdmin.style.display =
        "none";


    loginAtendente.style.display =
        "none";


    mostrarMensagem("");


    if(tipo === "admin"){

        loginAdmin.style.display =
            "block";


        setTimeout(() => {

            document
            .getElementById(
                "emailAdmin"
            )
            .focus();

        },100);

    }


    if(tipo === "atendente"){

        loginAtendente.style.display =
            "block";


        setTimeout(() => {

            document
            .getElementById(
                "loginAtendenteCampo"
            )
            .focus();

        },100);

    }

}


/* =========================
   VOLTAR
========================= */

function voltarEscolha(){

    loginAdmin.style.display =
        "none";


    loginAtendente.style.display =
        "none";


    telaEscolha.style.display =
        "block";


    mostrarMensagem("");

}


/* =========================
   ENTER NOS CAMPOS
========================= */

document
.getElementById("emailAdmin")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            entrarAdministrador();

        }

    }
);


document
.getElementById("senhaAdmin")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            entrarAdministrador();

        }

    }
);


document
.getElementById("loginAtendenteCampo")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            entrarAtendente();

        }

    }
);


document
.getElementById("senhaAtendente")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            entrarAtendente();

        }

    }
);


/* =========================
   ADMINISTRADOR
========================= */

async function entrarAdministrador(){

    const botao =
        document.getElementById(
            "botaoAdmin"
        );


    const email =
        document
        .getElementById(
            "emailAdmin"
        )
        .value
        .trim();


    const senha =
        document
        .getElementById(
            "senhaAdmin"
        )
        .value;


    if(!email || !senha){

        mostrarMensagem(
            "Digite o e-mail e a senha.",
            "erro"
        );

        return;
    }


    botao.disabled =
        true;


    mostrarMensagem(
        "Verificando acesso..."
    );


    try{

        const {
            data,
            error
        } =
        await db.auth.signInWithPassword({

            email:
                email,

            password:
                senha

        });


        if(error){

            console.error(error);

            mostrarMensagem(
                "E-mail ou senha inválidos.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        if(!data || !data.session){

            mostrarMensagem(
                "Não foi possível iniciar a sessão.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        /*
           CONFIRMA SE É ADMINISTRADOR
        */

        const usuario =
            data.session.user;


        const {
            data:perfil,
            error:erroPerfil
        } =
        await db
        .from("perfis")
        .select("nome,role")
        .eq(
            "id",
            usuario.id
        )
        .single();


        if(
            erroPerfil ||
            !perfil
        ){

            await db.auth.signOut();

            mostrarMensagem(
                "Perfil do usuário não encontrado.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        if(
            perfil.role !==
            "admin"
        ){

            await db.auth.signOut();

            mostrarMensagem(
                "Este acesso não possui permissão de administrador.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        salvarPreferenciasAdmin(
            email
        );


        mostrarMensagem(
            "Login realizado com sucesso!",
            "sucesso"
        );


        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            600
        );


    }catch(error){

        console.error(error);

        mostrarMensagem(
            "Erro ao realizar login.",
            "erro"
        );

        botao.disabled =
            false;
    }

}


/* =========================
   ATENDENTE
========================= */

async function entrarAtendente(){

    const botao =
        document.getElementById(
            "botaoAtendente"
        );


    const login =
        document
        .getElementById(
            "loginAtendenteCampo"
        )
        .value
        .trim()
        .toLowerCase();


    const senha =
        document
        .getElementById(
            "senhaAtendente"
        )
        .value;


    if(!login || !senha){

        mostrarMensagem(
            "Digite o usuário e a senha.",
            "erro"
        );

        return;
    }


    botao.disabled =
        true;


    mostrarMensagem(
        "Verificando acesso..."
    );


    try{

        /*
           LOCALIZA O LOGIN DA ATENDENTE
        */

        const {
            data,
            error
        } =
        await db.rpc(
            "buscar_login_atendente",
            {
                p_login:
                    login
            }
        );


        if(error){

            console.error(error);

            mostrarMensagem(
                "Não foi possível localizar o usuário.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        if(
            !data ||
            data.length === 0
        ){

            mostrarMensagem(
                "Usuário ou senha inválidos.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        const atendente =
            data[0];


        if(
            !atendente.ativo
        ){

            mostrarMensagem(
                "Este usuário está desativado.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        if(
            atendente.tipo !==
            "atendente"
        ){

            mostrarMensagem(
                "Este acesso não é de atendente.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        /*
           LOGIN REAL NO SUPABASE AUTH
        */

        const {
            data:loginAuth,
            error:erroAuth
        } =
        await db.auth.signInWithPassword({

            email:
                atendente.email_interno,

            password:
                senha

        });


        if(erroAuth){

            console.error(
                erroAuth
            );

            mostrarMensagem(
                "Usuário ou senha inválidos.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        if(
            !loginAuth ||
            !loginAuth.session
        ){

            mostrarMensagem(
                "Não foi possível iniciar a sessão.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        /*
           CONFIRMA PERFIL
        */

        const {
            data:perfil,
            error:erroPerfil
        } =
        await db
        .from("perfis")
        .select("nome,role")
        .eq(
            "id",
            loginAuth.session.user.id
        )
        .single();


        if(
            erroPerfil ||
            !perfil
        ){

            await db.auth.signOut();

            mostrarMensagem(
                "Perfil da atendente não encontrado.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        if(
            perfil.role !==
            "atendente"
        ){

            await db.auth.signOut();

            mostrarMensagem(
                "Este usuário não possui acesso de atendente.",
                "erro"
            );

            botao.disabled =
                false;

            return;
        }


        mostrarMensagem(
            "Login realizado com sucesso!",
            "sucesso"
        );


        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            600
        );


    }catch(error){

        console.error(error);

        mostrarMensagem(
            "Erro ao realizar login.",
            "erro"
        );

        botao.disabled =
            false;
    }

}


/* =========================
   PREFERÊNCIAS ADMIN
========================= */

function salvarPreferenciasAdmin(
    email
){

    const lembrar =
        document
        .getElementById(
            "lembrarEmail"
        )
        .checked;


    const manter =
        document
        .getElementById(
            "manterConectadoAdmin"
        )
        .checked;


    if(lembrar){

        localStorage.setItem(
            "email_salvo",
            email
        );

    }else{

        localStorage.removeItem(
            "email_salvo"
        );

    }


    if(manter){

        localStorage.setItem(
            "manter_conectado",
            "sim"
        );

    }else{

        localStorage.removeItem(
            "manter_conectado"
        );

    }

}


/* =========================
   CARREGAR PREFERÊNCIAS
========================= */

window.addEventListener(
    "load",
    function(){

        const emailSalvo =
            localStorage.getItem(
                "email_salvo"
            );


        if(emailSalvo){

            document
            .getElementById(
                "emailAdmin"
            )
            .value =
                emailSalvo;


            document
            .getElementById(
                "lembrarEmail"
            )
            .checked =
                true;

        }


        const manter =
            localStorage.getItem(
                "manter_conectado"
            );


        if(manter === "sim"){

            document
            .getElementById(
                "manterConectadoAdmin"
            )
            .checked =
                true;

        }

    }
);

</script>

</body>

</html>
