<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<style>

/* =========================
   PADRÃO PRATINI SPORTS
========================= */

:root{

    --verde:#7CFC00;

    --verde-hover:#8DFF29;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --preto:#050505;

    --texto:#f5f5f5;

    --cinza:#b8b8b8;

    --borda:#3a3e42;
}


*{

    margin:0;

    padding:0;

    box-sizing:border-box;

}


html,
body{

    width:100%;

    min-height:100%;

}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #1a1c1e 0%,
            #202326 50%,
            #111315 100%
        );

    color:var(--texto);

    padding:20px;
}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:430px;

    background:
        #111315;

    border:
        1px solid #383c40;

    border-radius:20px;

    padding:35px;

    box-shadow:

        0 15px 40px
        rgba(0,0,0,.45),

        0 0 0 1px
        rgba(124,252,0,.05);

    text-align:center;
}


/* =========================
   LOGO
========================= */

.logo{

    margin-bottom:18px;

}


.logo img{

    width:210px;

    max-width:80%;

    height:auto;

    object-fit:contain;
}


/* =========================
   TITULO
========================= */

h1{

    color:#fff;

    font-size:27px;

    font-weight:800;

    margin-bottom:8px;
}


.subtitulo{

    color:#bdbdbd;

    font-size:14px;

    line-height:1.5;

    margin-bottom:28px;
}


/* =========================
   SELEÇÃO DE ACESSO
========================= */

.selecao-acesso{

    display:block;
}


.titulo-selecao{

    color:#fff;

    font-size:18px;

    font-weight:bold;

    margin-bottom:18px;
}


.botoes-acesso{

    display:grid;

    grid-template-columns:1fr;

    gap:12px;
}


.botao-acesso{

    width:100%;

    min-height:58px;

    border:0;

    border-radius:11px;

    background:
        var(--verde);

    color:#050505;

    font-size:17px;

    font-weight:900;

    letter-spacing:.3px;

    cursor:pointer;

    transition:
        .18s ease;

    box-shadow:
        0 5px 16px
        rgba(124,252,0,.12);
}


.botao-acesso:hover{

    background:
        var(--verde-hover);

    transform:
        translateY(-2px);

    box-shadow:
        0 8px 22px
        rgba(124,252,0,.20);
}


.botao-acesso:active{

    transform:
        translateY(0);
}


/* =========================
   FORMULÁRIO
========================= */

.formulario{

    display:none;

    text-align:left;
}


.tipo-selecionado{

    background:#17191b;

    border:
        1px solid #363a3e;

    border-left:
        4px solid var(--verde);

    border-radius:10px;

    padding:13px 15px;

    margin-bottom:22px;

    color:#fff;

    font-size:14px;

    font-weight:bold;

    text-align:center;
}


.tipo-selecionado span{

    color:var(--verde);
}


/* =========================
   CAMPOS
========================= */

.form-group{

    margin-bottom:17px;
}


.form-group label{

    display:block;

    color:#fff;

    font-size:14px;

    font-weight:bold;

    margin-bottom:7px;
}


input{

    width:100%;

    height:53px;

    padding:
        0 15px;

    border:
        1px solid #44484c;

    border-radius:10px;

    background:#202326;

    color:#fff;

    font-size:16px;

    outline:none;

    transition:.18s ease;
}


input::placeholder{

    color:#888;
}


input:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 2px
        rgba(124,252,0,.10);
}


/* =========================
   OPÇÕES
========================= */

.opcoes-login{

    margin-bottom:10px;
}


.checkbox-item{

    display:flex;

    align-items:center;

    gap:9px;

    color:#ccc;

    font-size:14px;

    cursor:pointer;

    margin-bottom:10px;
}


.checkbox-item input{

    width:17px;

    height:17px;

    margin:0;

    accent-color:
        var(--verde);
}


/* =========================
   BOTÃO ENTRAR
========================= */

.botao-entrar{

    width:100%;

    height:55px;

    margin-top:8px;

    border:0;

    border-radius:10px;

    background:
        var(--verde);

    color:#050505;

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    transition:.18s ease;

    box-shadow:
        0 6px 18px
        rgba(124,252,0,.15);
}


.botao-entrar:hover{

    background:
        var(--verde-hover);

    transform:
        translateY(-2px);

    box-shadow:
        0 9px 24px
        rgba(124,252,0,.22);
}


.botao-entrar:active{

    transform:
        translateY(0);
}


/* =========================
   BOTÃO VOLTAR
========================= */

.botao-voltar{

    width:100%;

    height:48px;

    margin-top:11px;

    border:
        1px solid #444;

    border-radius:10px;

    background:#25282b;

    color:#fff;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.18s ease;
}


.botao-voltar:hover{

    background:#303438;

    border-color:#555;
}


/* =========================
   MENSAGEM
========================= */

#mensagem{

    min-height:22px;

    margin-top:17px;

    text-align:center;

    font-size:14px;

    font-weight:bold;

    line-height:1.4;
}


/* =========================
   RODAPÉ
========================= */

.footer{

    margin-top:28px;

    color:#777;

    font-size:12px;

    text-align:center;
}


/* =========================
   CARREGANDO
========================= */

.carregando{

    display:none;

    color:#ccc;

    text-align:center;

    font-size:15px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    body{

        padding:15px;

        align-items:center;
    }


    .container{

        padding:28px 22px;

        border-radius:17px;
    }


    .logo img{

        width:190px;
    }


    h1{

        font-size:24px;
    }


    .subtitulo{

        font-size:13px;

        margin-bottom:24px;
    }


    .botao-acesso{

        min-height:55px;

        font-size:16px;
    }

}


</style>

</head>


<body>


<div class="container">


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo">

        <img
            src="Colorida.png"
            alt="Pratini Sports"
        >

    </div>


    <!-- =========================
         TITULO
    ========================== -->

    <h1>
        Pratini Sports
    </h1>


    <p class="subtitulo">
        Acesso ao sistema de gestão
    </p>


    <!-- =========================
         SELEÇÃO DE PERFIL
    ========================== -->

    <div
        id="selecaoAcesso"
        class="selecao-acesso"
    >

        <div class="titulo-selecao">
            Selecione o tipo de acesso
        </div>


        <div class="botoes-acesso">


            <button
                type="button"
                class="botao-acesso"
                onclick="abrirLogin('administrador')"
            >
                ADMINISTRADOR
            </button>


            <button
                type="button"
                class="botao-acesso"
                onclick="abrirLogin('atendente')"
            >
                ATENDENTE
            </button>


        </div>

    </div>


    <!-- =========================
         LOGIN
    ========================== -->

    <div
        id="formularioLogin"
        class="formulario"
    >


        <div class="tipo-selecionado">

            Acesso:

            <span id="tipoSelecionado">
                -
            </span>

        </div>


        <!-- LOGIN ADMINISTRADOR -->

        <div
            id="campoEmail"
            class="form-group"
        >

            <label for="email">
                E-mail
            </label>

            <input
                id="email"
                type="email"
                autocomplete="username"
                placeholder="Digite seu e-mail"
            >

        </div>


        <!-- LOGIN ATENDENTE -->

        <div
            id="campoLogin"
            class="form-group"
            style="display:none;"
        >

            <label for="login">
                Nome de acesso
            </label>

            <input
                id="login"
                type="text"
                autocomplete="username"
                placeholder="Digite seu nome de acesso"
            >

        </div>


        <!-- SENHA -->

        <div class="form-group">

            <label for="senha">
                Senha
            </label>

            <input
                id="senha"
                type="password"
                autocomplete="current-password"
                placeholder="Digite sua senha"
                onkeydown="
                    if(event.key === 'Enter'){
                        entrar();
                    }
                "
            >

        </div>


        <!-- OPÇÕES -->

        <div
            id="opcoesAdministrador"
            class="opcoes-login"
        >

            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="lembrarEmail"
                >

                Lembrar e-mail

            </label>


            <label class="checkbox-item">

                <input
                    type="checkbox"
                    id="manterConectado"
                >

                Manter-me conectado

            </label>

        </div>


        <!-- BOTÃO -->

        <button
            type="button"
            class="botao-entrar"
            onclick="entrar()"
        >
            ENTRAR
        </button>


        <!-- VOLTAR -->

        <button
            type="button"
            class="botao-voltar"
            onclick="voltarSelecao()"
        >
            VOLTAR
        </button>


        <!-- MENSAGEM -->

        <p id="mensagem"></p>


    </div>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <div class="footer">

        © 2026 Pratini Sports

    </div>


</div>


<script>


/* =========================
   VARIÁVEIS
========================= */

let tipoAcesso = null;


/* =========================
   ABRIR LOGIN
========================= */

function abrirLogin(tipo){

    tipoAcesso = tipo;


    const selecao =
        document.getElementById(
            "selecaoAcesso"
        );


    const formulario =
        document.getElementById(
            "formularioLogin"
        );


    const campoEmail =
        document.getElementById(
            "campoEmail"
        );


    const campoLogin =
        document.getElementById(
            "campoLogin"
        );


    const opcoesAdministrador =
        document.getElementById(
            "opcoesAdministrador"
        );


    const tipoSelecionado =
        document.getElementById(
            "tipoSelecionado"
        );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.innerHTML = "";


    selecao.style.display =
        "none";


    formulario.style.display =
        "block";


    if(tipo === "administrador"){

        tipoSelecionado.innerText =
            "ADMINISTRADOR";


        campoEmail.style.display =
            "block";


        campoLogin.style.display =
            "none";


        opcoesAdministrador.style.display =
            "block";


        setTimeout(function(){

            document
            .getElementById("email")
            .focus();

        },100);

    }


    else if(tipo === "atendente"){

        tipoSelecionado.innerText =
            "ATENDENTE";


        campoEmail.style.display =
            "none";


        campoLogin.style.display =
            "block";


        opcoesAdministrador.style.display =
            "none";


        setTimeout(function(){

            document
            .getElementById("login")
            .focus();

        },100);

    }

}


/* =========================
   VOLTAR
========================= */

function voltarSelecao(){

    tipoAcesso = null;


    document
    .getElementById(
        "formularioLogin"
    )
    .style.display =
        "none";


    document
    .getElementById(
        "selecaoAcesso"
    )
    .style.display =
        "block";


    document
    .getElementById(
        "email"
    )
    .value = "";


    document
    .getElementById(
        "login"
    )
    .value = "";


    document
    .getElementById(
        "senha"
    )
    .value = "";


    document
    .getElementById(
        "mensagem"
    )
    .innerHTML = "";

}


/* =========================
   CARREGAR DADOS SALVOS
========================= */

window.addEventListener(
    "load",
    function(){

        const emailSalvo =
            localStorage.getItem(
                "email_salvo"
            );


        if(emailSalvo){

            document
            .getElementById(
                "email"
            )
            .value =
                emailSalvo;


            document
            .getElementById(
                "lembrarEmail"
            )
            .checked =
                true;

        }


        const manter =
            localStorage.getItem(
                "manter_conectado"
            );


        if(manter === "sim"){

            document
            .getElementById(
                "manterConectado"
            )
            .checked =
                true;

        }

    }
);


/* =========================
   LOGIN
========================= */

async function entrar(){

    const mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.style.color =
        "#ffffff";


    mensagem.innerHTML =
        "Verificando acesso...";


    /* =========================
       VERIFICA TIPO
    ========================== */

    if(!tipoAcesso){

        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Selecione o tipo de acesso.";

        return;
    }


    /* =========================
       VERIFICA SUPABASE
    ========================== */

    if(typeof db === "undefined"){

        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Erro: Supabase não carregado.";

        return;
    }


    /* =========================
       SENHA
    ========================== */

    const senha =
        document
        .getElementById(
            "senha"
        )
        .value
        .trim();


    if(!senha){

        mensagem.style.color =
            "#ff6b6b";

        mensagem.innerHTML =
            "Digite sua senha.";

        return;
    }


    try{


        /* =====================================================
           ADMINISTRADOR
        ===================================================== */

        if(tipoAcesso === "administrador"){

            const email =
                document
                .getElementById(
                    "email"
                )
                .value
                .trim()
                .toLowerCase();


            if(!email){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Digite o e-mail do administrador.";

                return;
            }


            const {
                data,
                error
            } =
                await db.auth.signInWithPassword({

                    email:
                        email,

                    password:
                        senha

                });


            if(error){

                console.error(
                    "Erro administrador:",
                    error
                );


                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "E-mail ou senha inválidos.";

                return;
            }


            if(
                !data ||
                !data.session
            ){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Não foi possível iniciar a sessão.";

                return;
            }


            /* =========================
               VERIFICA PERFIL
            ========================== */

            const usuario =
                data.session.user;


            const {
                data: perfil,
                error: erroPerfil
            } =
                await db
                .from("perfis")
                .select("role,nome")
                .eq(
                    "id",
                    usuario.id
                )
                .single();


            if(
                erroPerfil ||
                !perfil
            ){

                await db.auth.signOut();


                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Perfil de administrador não encontrado.";

                return;
            }


            if(
                perfil.role !==
                "admin"
            ){

                await db.auth.signOut();


                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Este usuário não possui acesso de administrador.";

                return;
            }


            /* =========================
               LEMBRAR E-MAIL
            ========================== */

            const lembrar =
                document
                .getElementById(
                    "lembrarEmail"
                )
                .checked;


            const manter =
                document
                .getElementById(
                    "manterConectado"
                )
                .checked;


            if(lembrar){

                localStorage.setItem(
                    "email_salvo",
                    email
                );

            }

            else{

                localStorage.removeItem(
                    "email_salvo"
                );

            }


            if(manter){

                localStorage.setItem(
                    "manter_conectado",
                    "sim"
                );

            }

            else{

                localStorage.removeItem(
                    "manter_conectado"
                );

            }


            mensagem.style.color =
                "#7CFC00";


            mensagem.innerHTML =
                "Login realizado com sucesso!";


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);


            return;
        }


        /* =====================================================
           ATENDENTE
        ===================================================== */

        if(tipoAcesso === "atendente"){

            const login =
                document
                .getElementById(
                    "login"
                )
                .value
                .trim()
                .toLowerCase();


            if(!login){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Digite seu nome de acesso.";

                return;
            }


            /*
               PRIMEIRO LOCALIZA
               O ATENDENTE
            */

            const {
                data: atendente,
                error: erroAtendente
            } =
                await db
                .from("usuarios_login")
                .select(`
                    id,
                    usuario_id,
                    login,
                    nome,
                    tipo,
                    ativo,
                    email_interno
                `)
                .eq(
                    "login",
                    login
                )
                .eq(
                    "ativo",
                    true
                )
                .single();


            if(
                erroAtendente ||
                !atendente
            ){

                console.error(
                    "Erro atendente:",
                    erroAtendente
                );


                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Nome de acesso ou senha inválidos.";

                return;
            }


            /*
               O LOGIN DA ATENDENTE
               UTILIZA O EMAIL INTERNO
               CADASTRADO NA TABELA.
            */

            if(
                !atendente.email_interno
            ){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Este atendente ainda não possui um acesso configurado.";

                return;
            }


            const {
                data,
                error
            } =
                await db.auth.signInWithPassword({

                    email:
                        atendente.email_interno,

                    password:
                        senha

                });


            if(error){

                console.error(
                    "Erro autenticação atendente:",
                    error
                );


                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Nome de acesso ou senha inválidos.";

                return;
            }


            if(
                !data ||
                !data.session
            ){

                mensagem.style.color =
                    "#ff6b6b";

                mensagem.innerHTML =
                    "Não foi possível iniciar a sessão.";

                return;
            }


            /*
               GUARDA O ATENDENTE ATIVO
               PARA A CENTRAL DE ENTREGA
            */

            localStorage.setItem(

                "atendente_id",

                atendente.id

            );


            localStorage.setItem(

                "atendente_nome",

                atendente.nome

            );


            localStorage.setItem(

                "atendente_login",

                atendente.login

            );


            /*
               TAMBÉM GUARDA O ID
               DO USUÁRIO AUTH
            */

            localStorage.setItem(

                "atendente_usuario_id",

                atendente.usuario_id

            );


            mensagem.style.color =
                "#7CFC00";


            mensagem.innerHTML =
                "Login realizado com sucesso!";


            setTimeout(function(){

                window.location.href =
                    "dashboard.html";

            },700);


            return;
        }


    }

    catch(err){

        console.error(
            "Erro no login:",
            err
        );


        mensagem.style.color =
            "#ff6b6b";


        mensagem.innerHTML =
            "Ocorreu um erro ao realizar o login.";

    }

}


</script>


</body>

</html>
