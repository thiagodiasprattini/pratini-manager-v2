<script>

let dadosPlanilha = [];
let colunas = [];
let nomeArquivo = "";
let usuarioLogado = null;

const eventoId =
    localStorage.getItem("evento_ativo_id");

const eventoNome =
    localStorage.getItem("evento_ativo_nome");


/* =====================================================
   ACESSO
===================================================== */

async function verificarAcesso(){

    const { data: sessao } =
        await db.auth.getSession();

    if(!sessao || !sessao.session){

        window.location.href = "login.html";

        return;
    }

    const usuario =
        sessao.session.user;


    const { data: perfil, error } =
        await db
        .from("perfis")
        .select("role, nome")
        .eq("id", usuario.id)
        .single();


    if(
        error ||
        !perfil ||
        perfil.role !== "admin"
    ){

        alert(
            "Acesso restrito ao administrador."
        );

        window.location.href =
            "dashboard.html";

        return;
    }


    usuarioLogado = {

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email

    };


    document.getElementById(
        "eventoAtivo"
    ).innerText =
        eventoNome ||
        "Nenhum evento selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display = "none";


    document.getElementById(
        "telaPainel"
    ).style.display = "block";

}


/* =====================================================
   NORMALIZAÇÃO
===================================================== */

function normalizarTexto(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}


/* =====================================================
   IDENTIFICAÇÃO SEGURA DAS COLUNAS
===================================================== */

function encontrarColunaExata(lista){

    for(const coluna of colunas){

        const normalizada =
            normalizarTexto(coluna);

        if(
            lista.includes(normalizada)
        ){

            return coluna;

        }

    }

    return "";

}


function sugerirColuna(palavras){

    for(const coluna of colunas){

        const normalizada =
            normalizarTexto(coluna);

        for(const palavra of palavras){

            const termo =
                normalizarTexto(palavra);

            if(
                normalizada === termo
            ){

                return coluna;

            }

        }

    }


    for(const coluna of colunas){

        const normalizada =
            normalizarTexto(coluna);

        for(const palavra of palavras){

            const termo =
                normalizarTexto(palavra);

            if(
                normalizada.includes(termo)
            ){

                return coluna;

            }

        }

    }

    return "";

}


/* =====================================================
   EQUIPE - REGRA ESPECIAL
===================================================== */

function encontrarEquipe(){

    /*
        Primeiro procuramos nomes exatos.
    */

    const nomesExatos = [

        "equipe",
        "equipe ou assessoria",
        "nome da equipe",
        "assessoria",
        "grupo",
        "time"

    ];


    for(const coluna of colunas){

        const c =
            normalizarTexto(coluna);

        if(
            nomesExatos.includes(c)
        ){

            return coluna;

        }

    }


    /*
        Depois procuramos colunas que contenham
        equipe ou assessoria.

        MAS NUNCA aceitamos:

        pelotão
        pace
        modalidade
        distância
        prova
    */

    const proibidos = [

        "pelotao",
        "pace",
        "modalidade",
        "distancia",
        "prova",
        "numero",
        "peito",
        "camiseta",
        "nascimento",
        "cpf"

    ];


    for(const coluna of colunas){

        const c =
            normalizarTexto(coluna);


        if(
            proibidos.some(
                termo => c.includes(termo)
            )
        ){

            continue;

        }


        if(
            c.includes("equipe") ||
            c.includes("assessoria") ||
            c.includes("time")
        ){

            return coluna;

        }

    }


    return "";

}


/* =====================================================
   PREENCHER SELECTS
===================================================== */

function preencherSelects(){

    const campos = [

        [
            "colNome",
            [
                "nome completo",
                "nome",
                "atleta"
            ]
        ],

        [
            "colCpf",
            [
                "cpf",
                "documento"
            ]
        ],

        [
            "colNumero",
            [
                "numero de peito",
                "numero",
                "peito",
                "bib"
            ]
        ],

        [
            "colModalidade",
            [
                "modalidade",
                "distancia",
                "prova"
            ]
        ],

        [
            "colCamiseta",
            [
                "camiseta",
                "tamanho",
                "camisa"
            ]
        ],

        [
            "colProduto",
            [
                "produto extra",
                "produto",
                "extra",
                "brinde"
            ]
        ],

        [
            "colNascimento",
            [
                "nascimento",
                "data de nascimento",
                "data nascimento"
            ]
        ]

    ];


    campos.forEach(
        ([id, sugestoes]) => {

            const select =
                document.getElementById(id);

            select.innerHTML =
                "<option value=''>Não importar</option>";


            colunas.forEach(
                col => {

                    const option =
                        document.createElement("option");

                    option.value = col;
                    option.textContent = col;

                    select.appendChild(option);

                }
            );


            const sugestao =
                sugerirColuna(sugestoes);


            if(sugestao){

                select.value =
                    sugestao;

            }

        }
    );


    /*
        EQUIPE TEM REGRA PRÓPRIA
    */

    const selectEquipe =
        document.getElementById(
            "colEquipe"
        );


    selectEquipe.innerHTML =
        "<option value=''>Não importar</option>";


    colunas.forEach(
        col => {

            const option =
                document.createElement("option");

            option.value = col;

            option.textContent = col;

            selectEquipe.appendChild(
                option
            );

        }
    );


    const equipe =
        encontrarEquipe();


    if(equipe){

        selectEquipe.value =
            equipe;

    }

}


/* =====================================================
   LEITURA DO ARQUIVO
===================================================== */

function lerArquivo(){

    if(!eventoId){

        alert(
            "Selecione um evento ativo antes de importar."
        );

        return;
    }


    const arquivo =
        document.getElementById(
            "arquivo"
        ).files[0];


    if(!arquivo){

        alert(
            "Selecione uma planilha."
        );

        return;
    }


    nomeArquivo =
        arquivo.name;


    const ehCsv =
        nomeArquivo
        .toLowerCase()
        .endsWith(".csv");


    if(ehCsv){

        lerComoCsv(
            arquivo
        );

    }else{

        lerComoExcel(
            arquivo
        );

    }

}


/* =====================================================
   FINALIZAR LEITURA
===================================================== */

function finalizarLeitura(dados){

    if(
        !dados ||
        dados.length === 0
    ){

        alert(
            "A planilha está vazia."
        );

        return;
    }


    dadosPlanilha =
        dados;


    colunas =
        Object.keys(
            dadosPlanilha[0]
        );


    preencherSelects();


    document.getElementById(
        "mapeamento"
    ).style.display =
        "block";


    alert(
        "Planilha lida com sucesso! " +
        dadosPlanilha.length +
        " linhas encontradas."
    );

}


/* =====================================================
   CSV
===================================================== */

function lerComoCsv(arquivo){

    Papa.parse(
        arquivo,
        {

            header:true,

            delimiter:";",

            skipEmptyLines:true,

            encoding:"UTF-8",

            complete:function(resultado){

                finalizarLeitura(
                    resultado.data
                );

            },

            error:function(erro){

                alert(
                    "Erro ao ler CSV: " +
                    erro.message
                );

            }

        }
    );

}


/* =====================================================
   EXCEL
===================================================== */

function lerComoExcel(arquivo){

    const leitor =
        new FileReader();


    leitor.onload =
        function(e){

            try{

                const data =
                    new Uint8Array(
                        e.target.result
                    );


                const workbook =
                    XLSX.read(
                        data,
                        {
                            type:"array"
                        }
                    );


                const primeiraAba =
                    workbook.SheetNames[0];


                const planilha =
                    workbook.Sheets[
                        primeiraAba
                    ];


                const dados =
                    XLSX.utils.sheet_to_json(
                        planilha,
                        {
                            defval:""
                        }
                    );


                finalizarLeitura(
                    dados
                );


            }catch(erro){

                alert(
                    "Erro ao ler planilha: " +
                    erro.message
                );

            }

        };


    leitor.readAsArrayBuffer(
        arquivo
    );

}


/* =====================================================
   VALOR
===================================================== */

function valor(linha,campo){

    const coluna =
        document.getElementById(
            campo
        ).value;


    if(!coluna){

        return "";

    }


    return (
        linha[coluna] || ""
    )
    .toString()
    .trim();

}


/* =====================================================
   DATA DE NASCIMENTO
===================================================== */

function converterDataNascimento(valorData){

    if(!valorData){

        return null;

    }


    /*
        Se o Excel entregar como número
        serial de data.
    */

    if(
        typeof valorData === "number"
    ){

        const data =
            XLSX.SSF.parse_date_code(
                valorData
            );


        if(data){

            const ano =
                data.y;

            const mes =
                String(data.m)
                .padStart(2,"0");

            const dia =
                String(data.d)
                .padStart(2,"0");


            return (
                ano +
                "-" +
                mes +
                "-" +
                dia
            );

        }

    }


    let texto =
        valorData
        .toString()
        .trim();


    /*
        DD/MM/YYYY
    */

    let partes =
        texto.split("/");


    if(partes.length === 3){

        let dia =
            partes[0].padStart(2,"0");

        let mes =
            partes[1].padStart(2,"0");

        let ano =
            partes[2];


        if(ano.length === 2){

            ano =
                "19" + ano;

        }


        return (
            ano +
            "-" +
            mes +
            "-" +
            dia
        );

    }


    /*
        YYYY-MM-DD
    */

    if(
        /^\d{4}-\d{2}-\d{2}$/.test(texto)
    ){

        return texto;

    }


    return null;

}


/* =====================================================
   PRÉ-VISUALIZAÇÃO
===================================================== */

function preVisualizar(){

        document.getElementById(

    if(!campoNome){

        <b>${validos}</b>

        ${equipeSelecionada || "Não importar"}
        </b>

    `;

}


/* =====================================================
   BUSCAR ATLETA EXISTENTE
===================================================== */

async function buscarAtletaExistente(
    cpf,
    numero
){

    if(cpf){

        const {
            data
        } =
            await db
            .from("atletas_v2")
            .select("*")
            .eq(
                "evento_id",
                eventoId
            )
            .eq(
                "cpf",
                cpf
            )
            .limit(1);


        if(
            data &&
            data.length > 0
        ){

            return data[0];

        }

    }


    if(numero){

        const {
            data
        } =
            await db
            .from("atletas_v2")
            .select("*")
            .eq(
                "evento_id",
                eventoId
            )
            .eq(
                "numero_peito",
                numero
            )
            .limit(1);


        if(
            data &&
            data.length > 0
        ){

            return data[0];

        }

    }


    return null;

}


/* =====================================================
   IMPORTAÇÃO
===================================================== */

async function importarAtletas(){

    const botao =
        document.getElementById(
            "btnImportar"
        );


    const progresso =
        document.getElementById(
            "progresso"
        );


    botao.disabled =
        true;


    botao.innerText =
        "Importando...";


    progresso.style.display =
        "block";


    progresso.innerText =
        "Iniciando importação...";


    let novos = 0;
    let atualizados = 0;
    let ignorados = 0;
    let erros = 0;

    let ultimoErro = "";


    try{

        const total =
            dadosPlanilha.length;


        let processados = 0;


        for(
            const linha of dadosPlanilha
        ){

            processados++;


            if(
                processados % 5 === 0 ||
                processados === total
            ){

                progresso.innerText =
                    `Importando ${processados} de ${total}... 
                    (novos: ${novos}, 
                    atualizados: ${atualizados}, 
                    erros: ${erros})`;

            }


            const nome =
                valor(
                    linha,
                    "colNome"
                );


            const cpf =
                valor(
                    linha,
                    "colCpf"
                );


            const numero_peito =
                valor(
                    linha,
                    "colNumero"
                );


            const modalidade =
                valor(
                    linha,
                    "colModalidade"
                );


            const camiseta =
                valor(
                    linha,
                    "colCamiseta"
                );


            /*
                AQUI ESTÁ A CORREÇÃO PRINCIPAL.

                A equipe vem SOMENTE da coluna
                selecionada em colEquipe.

                Nunca usamos modalidade,
                pelotão ou pace como equipe.
            */

            const equipe =
                valor(
                    linha,
                    "colEquipe"
                );


            const produto_extra =
                valor(
                    linha,
                    "colProduto"
                );


            const nascimentoBruto =
                valor(
                    linha,
                    "colNascimento"
                );


            const data_nascimento =
                converterDataNascimento(
                    nascimentoBruto
                );


            if(!nome){

                ignorados++;

                continue;

            }


            try{

                const existente =
                    await buscarAtletaExistente(
                        cpf,
                        numero_peito
                    );


                /*
                    OBJETO DE ATUALIZAÇÃO
                */

                if(existente){

                    const atualizacao = {

                        nome,

                        cpf,

                        numero_peito,

                        modalidade,

                        camiseta,

                        equipe,

                        produto_extra,

                        data_nascimento

                    };


                    const {
                        error
                    } =
                        await db
                        .from("atletas_v2")
                        .update(
                            atualizacao
                        )
                        .eq(
                            "id",
                            existente.id
                        );


                    if(error){

                        erros++;

                        ultimoErro =
                            error.message;

                    }else{

                        atualizados++;

                    }


                }else{


                    /*
                        NOVO ATLETA
                    */

                    const {
                        error
                    } =
                        await db
                        .from("atletas_v2")
                        .insert([{

                            evento_id:
                                eventoId,

                            nome,

                            cpf,

                            numero_peito,

                            modalidade,

                            camiseta,

                            equipe,

                            produto_extra,

                            data_nascimento,

                            origem_importacao:
                                nomeArquivo,

                            importacao_id:
                                null,

                            status_kit:
                                "pendente"

                        }]);


                    if(error){

                        erros++;

                        ultimoErro =
                            error.message;

                    }else{

                        novos++;

                    }

                }


            }catch(e){

                erros++;

                ultimoErro =
                    e.message;

            }

        }


        /*
            REGISTRO DA IMPORTAÇÃO
        */

        try{

            await db
            .from("importacoes_v2")
            .insert([{

                evento_id:
                    eventoId,

                nome_arquivo:
                    nomeArquivo,

                usuario:
                    usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",

                total_linhas:
                    dadosPlanilha.length,

                novos,

                atualizados,

                ignorados,

                erros

            }]);

        }catch(e){

            console.error(
                "Erro ao gravar log:",
                e
            );

        }


        /*
            AUDITORIA
        */

        try{

            await db
            .from("auditoria_v2")
            .insert([{

                evento_id:
                    eventoId,

                usuario:
                    usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",

                acao:
                    "Importação de planilha",

                detalhe:
                    `${nomeArquivo} | 
                    Novos: ${novos} | 
                    Atualizados: ${atualizados} | 
                    Ignorados: ${ignorados} | 
                    Erros: ${erros}`

            }]);

        }catch(e){

            console.error(
                "Erro ao gravar auditoria:",
                e
            );

        }


        progresso.style.display =
            "none";


        document.getElementById(
            "resultado"
        ).style.display =
            "block";


        document.getElementById(
            "resultadoTexto"
        ).innerHTML = `

            <span class="ok">
                Importação concluída!
            </span>

            <br><br>

            Novos atletas:
            <b>${novos}</b>

            <br>

            Atualizados:
            <b>${atualizados}</b>

            <br>

            Ignorados:
            <b>${ignorados}</b>

            <br>

            Erros:
            <b>${erros}</b>

            ${
                erros > 0
                ?
                `
                <br><br>

                <span class="erro">
                    Último erro:
                    ${ultimoErro}
                </span>
                `
                :
                ""
            }

        `;


    }catch(erroGeral){

        progresso.style.display =
            "none";


        document.getElementById(
            "resultado"
        ).style.display =
            "block";


        document.getElementById(
            "resultadoTexto"
        ).innerHTML = `

            <span class="erro">
                A importação parou por um erro inesperado.
            </span>

            <br><br>

            ${erroGeral.message}

            <br><br>

            Progresso até parar:

            <br>

            Novos:
            <b>${novos}</b>

            |

            Atualizados:
            <b>${atualizados}</b>

            |

            Ignorados:
            <b>${ignorados}</b>

            |

            Erros:
            <b>${erros}</b>

        `;


        console.error(
            erroGeral
        );


    }finally{

        botao.disabled =
            false;


        botao.innerText =
            "Importar Atletas";

    }

}


verificarAcesso();

</script>

</body>
</html>
