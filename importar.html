/* =====================================================

===================================================== */

let usuarioLogado = null;

===================================================== */

    const {
        data: sessao
    } =
        await db.auth.getSession();

        !sessao ||
        !sessao.session
    ){

        window.location.href =
            "login.html";

        return;
    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } =
        await db
        .from("perfis")
        .select("role,nome")
        .eq(
            "id",
            usuario.id
        )
        .single();


    if(
        error ||
        !perfil ||
        perfil.role !== "admin"
    ){

        alert(
            "Acesso restrito ao administrador."
        );


        window.location.href =
            "dashboard.html";


        return;
    }


    usuarioLogado = {

        id:
            usuario.id,

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email

    };

        "eventoAtivo"
    ).innerText =

        eventoNome ||
        "Nenhum evento selecionado.";

        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =

}



/* =====================================================
   NORMALIZAR TEXTO
===================================================== */


function normalizarTexto(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .trim()
        .replace(
            /\s+/g,
            " "
        );
}



/* =====================================================
   SUGERIR COLUNA
===================================================== */

function sugerirColuna(palavras){

    const colunasNormalizadas =
        colunas.map(
            coluna => ({

                original:
                    coluna,

                normalizada:
                    normalizarTexto(
                        coluna
                    )

            })
        );


    /*
       PRIMEIRO:
       procura correspondência EXATA.
    */


    for(
        const palavra of palavras
    ){

        const palavraNormalizada =
            normalizarTexto(
                palavra
            );


        const exata =
            colunasNormalizadas.find(
                item =>
                    item.normalizada ===
                    palavraNormalizada
            );


        if(exata){

            return exata.original;

        }

    }


    /*
       SEGUNDO:
       procura correspondência parcial.
    */


    for(
        const palavra of palavras
    ){

        const palavraNormalizada =
            normalizarTexto(
                palavra
            );


        const parcial =
            colunasNormalizadas.find(
                item =>
                    item.normalizada.includes(
                        palavraNormalizada
                    )
            );


        if(parcial){

            return parcial.original;

        }

    }


    return "";

}

        [

        */

        [

        ],


        [

    campos.forEach(

/* =====================================================
   LER ARQUIVO
===================================================== */


function lerArquivo(){

    if(!eventoId){

        alert(
            "Selecione um evento antes de importar."
        );

        return;
    }


    const arquivo =
        document
        .getElementById(
            "arquivo"
        )
        .files[0];


    if(!arquivo){

        alert(
            "Selecione uma planilha."
        );

        return;
    }


    nomeArquivo =
        arquivo.name;


    if(
        nomeArquivo
        .toLowerCase()
        .endsWith(".csv")
    ){

        lerComoCsv(
            arquivo
        );

    }else{

        lerComoExcel(
            arquivo
        );

    }

}



/* =====================================================
   FINALIZAR LEITURA
===================================================== */


function finalizarLeitura(dados){

    if(
        !dados ||
        dados.length === 0
    ){

        alert(
            "A planilha está vazia."
        );

        return;
    }


    dadosPlanilha =
        dados;


    colunas =
        Object.keys(
            dadosPlanilha[0]
        );


    preencherSelects();


    document.getElementById(
        "mapeamento"
    ).style.display =
        "block";


    document.getElementById(
        "preview"
    ).style.display =
        "none";


    alert(
        "Planilha lida com sucesso! " +
        dadosPlanilha.length +
        " linhas encontradas."
    );

}



/* =====================================================
   CSV

   IMPORTANTE (correção):
   O arquivo é lido como TEXTO primeiro (via FileReader),
   e só depois esse texto pronto é entregue ao Papa Parse.

   Entregar o arquivo "bruto" (File) direto pro Papa Parse
   usa um caminho de leitura por streaming interno da
   biblioteca que, em alguns navegadores, corta o arquivo
   no meio sem gerar nenhum erro visível — foi a causa de
   planilhas grandes (700+ linhas) sendo lidas pela metade.
===================================================== */


function lerComoCsv(arquivo){

    const leitor =
        new FileReader();


    leitor.onload =
        function(e){

            const textoCompleto =
                e.target.result;


            Papa.parse(
                textoCompleto,
                {

                    header:true,

                    delimiter:";",

                    skipEmptyLines:true,


                    complete:
                        function(resultado){

                            finalizarLeitura(
                                resultado.data
                            );

                        },


                    error:
                        function(erro){

                            alert(
                                "Erro ao ler CSV: " +
                                erro.message
                            );

                        }

                }
            );

        };


    leitor.onerror =
        function(){

            alert(
                "Erro ao abrir o arquivo CSV."
            );

        };


    leitor.readAsText(
        arquivo,
        "UTF-8"
    );

}



/* =====================================================
   EXCEL
===================================================== */


function lerComoExcel(arquivo){

    const leitor =
        new FileReader();


    leitor.onload =
        function(e){

            try{

                const data =
                    new Uint8Array(
                        e.target.result
                    );


                const workbook =
                    XLSX.read(
                        data,
                        {
                            type:"array",
                            cellDates:true
                        }
                    );


                const primeiraAba =
                    workbook.SheetNames[0];


                const planilha =
                    workbook.Sheets[
                        primeiraAba
                    ];


                const dados =
                    XLSX.utils.sheet_to_json(
                        planilha,
                        {
                            defval:""
                        }
                    );


                finalizarLeitura(
                    dados
                );


            }catch(erro){

                alert(
                    "Erro ao ler planilha: " +
                    erro.message
                );

            }

        };


    leitor.readAsArrayBuffer(
        arquivo
    );

}



/* =====================================================
   VALOR
===================================================== */


function valor(
    linha,
    campo
){

    const coluna =
        document
        .getElementById(
            campo
        )
        .value;


    if(!coluna){

        return "";
    }


    const valorOriginal =
        linha[coluna];


    if(
        valorOriginal === null ||
        valorOriginal === undefined
    ){

        return "";
    }


    if(
        valorOriginal instanceof Date
    ){

        return valorOriginal
            .toISOString()
            .split("T")[0];

    }


    return valorOriginal
        .toString()
        .trim();

}



/* =====================================================
   CONVERTER DATA
===================================================== */


function converterData(valorData){

    if(!valorData){

        return null;
    }


    let valor =
        valorData
        .toString()
        .trim();


    /*
       DD/MM/YYYY
    */


    const br =
        valor.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if(br){

        return (

            br[3] +

            "-" +

            br[2].padStart(
                2,
                "0"
            ) +

            "-" +

            br[1].padStart(
                2,
                "0"
            )

        );

    }


    /*
       YYYY-MM-DD
    */


    const iso =
        valor.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );


    if(iso){

        return (

            iso[1] +

            "-" +

            iso[2].padStart(
                2,
                "0"
            ) +

            "-" +

            iso[3].padStart(
                2,
                "0"
            )

        );

    }


    return null;

}

/* =====================================================
   BUSCAR ATLETA EXISTENTE
===================================================== */


async function buscarAtletaExistente(
    cpf,
    numero
){

    if(cpf){

        const {
            data
        } =
            await db
            .from("atletas_v2")
            .select("*")
            .eq(
                "evento_id",
                eventoId
            )
            .eq(
                "cpf",
                cpf
            )
            .limit(1);


        if(
            data &&
            data.length > 0
        ){

            return data[0];

        }

    }


    if(numero){

        const {
            data
        } =
            await db
            .from("atletas_v2")
            .select("*")
            .eq(
                "evento_id",
                eventoId
            )
            .eq(
                "numero_peito",
                numero
            )
            .limit(1);


        if(
            data &&
            data.length > 0
        ){

            return data[0];

        }

    }


    return null;

}



/* =====================================================
   IMPORTAR ATLETAS
===================================================== */


async function importarAtletas(){

    const botao =
        document.getElementById(
            "btnImportar"
        );


    const progresso =
        document.getElementById(
            "progresso"
        );


    botao.disabled =
        true;


    botao.innerText =
        "Importando...";


    progresso.style.display =
        "block";


    let novos = 0;

    let atualizados = 0;

    let ignorados = 0;

    let erros = 0;

    let ultimoErro = "";


    try{

        const total =
            dadosPlanilha.length;


        let processados = 0;


        for(
            const linha of dadosPlanilha
        ){

            processados++;


            progresso.innerText =
                `Importando ${processados} de ${total}...`;


            /*
               CAMPOS
            */


            const nome =
                valor(
                    linha,
                    "colNome"
                );


            const cpf =
                valor(
                    linha,
                    "colCpf"
                );


            const data_nascimento =
                converterData(
                    valor(
                        linha,
                        "colNascimento"
                    )
                );


            const numero_peito =
                valor(
                    linha,
                    "colNumero"
                );


            const modalidade =
                valor(
                    linha,
                    "colModalidade"
                );


            const camiseta =
                valor(
                    linha,
                    "colCamiseta"
                );


            /*
               EQUIPE

               IMPORTANTE:
               vem da coluna selecionada
               em "Equipe ou Assessoria".
            */


            const equipe =
                valor(
                    linha,
                    "colEquipe"
                );


            /*
               PELOTÃO

               Vem exclusivamente da
               coluna selecionada em Pelotão.
            */


            const pelotao =
                valor(
                    linha,
                    "colPelotao"
                );


            /*
               PRODUTO EXTRA
            */


            const produto_extra =
                valor(
                    linha,
                    "colProduto"
                );


            if(!nome){

                ignorados++;

                continue;
            }


            try{


                const existente =
                    await buscarAtletaExistente(
                        cpf,
                        numero_peito
                    );


                /*
                   OBJETO PADRÃO
                */


                const dadosAtleta = {

                    evento_id:
                        eventoId,


                    nome:
                        nome,


                    cpf:
                        cpf || null,


                    data_nascimento:
                        data_nascimento,


                    numero_peito:
                        numero_peito || null,


                    modalidade:
                        modalidade || null,


                    camiseta:
                        camiseta || null,


                    /*
                       AQUI:
                       Equipe ou Assessoria
                       → equipe
                    */


                    equipe:
                        equipe || null,


                    /*
                       AQUI:
                       Pelotão
                       → pelotao
                    */


                    pelotao:
                        pelotao || null,


                    produto_extra:
                        produto_extra || null

                };


                if(existente){

                    const {
                        error
                    } =
                        await db
                        .from("atletas_v2")
                        .update(
                            dadosAtleta
                        )
                        .eq(
                            "id",
                            existente.id
                        );


                    if(error){

                        erros++;


                        ultimoErro =
                            error.message;

                    }else{

                        atualizados++;

                    }


                }else{


                    const {
                        error
                    } =
                        await db
                        .from("atletas_v2")
                        .insert([

                            {

                                ...dadosAtleta,


                                origem_importacao:
                                    nomeArquivo,


                                importacao_id:
                                    null,


                                status_kit:
                                    "pendente"

                            }

                        ]);


                    if(error){

                        erros++;


                        ultimoErro =
                            error.message;

                    }else{

                        novos++;

                    }

                }


            }catch(e){

                erros++;


                ultimoErro =
                    e.message;

            }

        }


        /*
           REGISTRA IMPORTAÇÃO
        */


        await db
        .from("importacoes_v2")
        .insert([

            {

                evento_id:
                    eventoId,


                nome_arquivo:
                    nomeArquivo,


                usuario:
                    usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",


                total_linhas:
                    dadosPlanilha.length,


                novos:


                    novos,


                atualizados:


                    atualizados,


                ignorados:


                    ignorados,


                erros:


                    erros

            }

        ]);


        /*
           AUDITORIA
        */


        await db
        .from("auditoria_v2")
        .insert([

            {

                evento_id:
                    eventoId,


                usuario:
                    usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",


                acao:
                    "Importação de planilha",


                detalhe:

                    `${nomeArquivo} | Novos: ${novos} | Atualizados: ${atualizados} | Ignorados: ${ignorados} | Erros: ${erros}`

            }

        ]);


        progresso.style.display =
            "none";


        document.getElementById(
            "resultado"
        ).style.display =
            "block";


        document.getElementById(
            "resultadoTexto"
        ).innerHTML = `

            <span class="ok">

                Importação concluída!

            </span>


            <br><br>


            Novos atletas:

            <b>
                ${novos}
            </b>


            <br>


            Atualizados:

            <b>
                ${atualizados}
            </b>


            <br>


            Ignorados:

            <b>
                ${ignorados}
            </b>


            <br>


            Erros:

            <b>
                ${erros}
            </b>


            ${
                erros > 0

                ?

                `

                <br><br>

                <span class="erro">

                    Último erro:

                    ${ultimoErro}

                </span>

                `

                :

                ""

            }

        `;


    }catch(erroGeral){


        progresso.style.display =
            "none";


        document.getElementById(
            "resultado"
        ).style.display =
            "block";


        document.getElementById(
            "resultadoTexto"
        ).innerHTML = `

            <span class="erro">

                A importação encontrou um erro.

            </span>


            <br><br>


            ${erroGeral.message}

        `;


        console.error(
            erroGeral
        );

    }finally{


        botao.disabled =
            false;


        botao.innerText =
            "IMPORTAR ATLETAS";

    }

}



/* =====================================================
   INICIAR
===================================================== */


verificarAcesso();


</script>


</body>

</html>
