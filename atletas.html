<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://kchpprimvfnwchztwlsa.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_TT9qEWZX65Xl3prYCwqMtw_t7kA7lf4";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================
   EVENTO
========================= */

const eventoId =
    localStorage.getItem(
        "evento_ativo_id"
    );


const eventoNome =
    localStorage.getItem(
        "evento_ativo_nome"
    );


let atletas = [];


/* =========================
   ACESSO
========================= */

async function verificarAcesso(){

    const {
        data: sessao
    } =
        await db.auth.getSession();


    if(
        !sessao ||
        !sessao.session
    ){

        window.location.href =
            "login.html";

        return;
    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } =
        await db
        .from("perfis")
        .select("role,nome")
        .eq(
            "id",
            usuario.id
        )
        .single();


    if(
        error ||
        !perfil ||
        perfil.role !== "admin"
    ){

        alert(
            "Acesso restrito ao administrador."
        );

        window.location.href =
            "dashboard.html";

        return;
    }


    document.getElementById(
        "eventoAtivo"
    ).innerText =
        eventoNome ||
        "Nenhum evento ativo selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display =
        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =
        "block";


    carregarAtletas();

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(texto){

    return (
        texto ??
        ""
    )
    .toString()
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   DATA
========================= */

function converterDataParaBanco(valor){

    if(!valor){

        return null;

    }


    const partes =
        valor
        .trim()
        .split("/");


    if(
        partes.length !== 3
    ){

        return null;

    }


    const dia =
        partes[0].padStart(2,"0");


    const mes =
        partes[1].padStart(2,"0");


    const ano =
        partes[2];


    if(
        ano.length !== 4
    ){

        return null;

    }


    const data =
        new Date(
            Number(ano),
            Number(mes) - 1,
            Number(dia)
        );


    if(
        data.getFullYear() !== Number(ano) ||
        data.getMonth() !== Number(mes) - 1 ||
        data.getDate() !== Number(dia)
    ){

        return null;

    }


    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );

}


/* =========================
   DATA PARA TELA
========================= */

function formatarData(data){

    if(!data){

        return "Não informada";

    }


    const texto =
        data
        .toString()
        .split("T")[0];


    const partes =
        texto.split("-");


    if(
        partes.length === 3
    ){

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return data;

}


/* =========================
   MÁSCARA DATA
========================= */

function mascaraData(input){

    let valor =
        input.value
        .replace(/\D/g,"");


    if(valor.length > 8){

        valor =
            valor.substring(
                0,
                8
            );

    }


    if(valor.length >= 5){

        input.value =
            valor.substring(0,2) +
            "/" +
            valor.substring(2,4) +
            "/" +
            valor.substring(4);

    }else if(valor.length >= 3){

        input.value =
            valor.substring(0,2) +
            "/" +
            valor.substring(2);

    }else{

        input.value =
            valor;

    }

}


/* =========================
   CARREGAR ATLETAS
========================= */

async function carregarAtletas(){

    const lista =
        document.getElementById(
            "listaAtletas"
        );


    if(!eventoId){

        lista.innerHTML = `
            <div class="mensagem erro">
                Selecione um evento ativo antes
                de cadastrar atletas.
            </div>
        `;

        return;

    }


    lista.innerHTML = `
        <div class="mensagem">
            Carregando atletas...
        </div>
    `;


    const {
        data,
        error
    } =
        await db
        .from("atletas_v2")
        .select("*")
        .eq(
            "evento_id",
            eventoId
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        lista.innerHTML = `
            <div class="mensagem erro">
                Erro ao carregar atletas:
                ${escaparHTML(error.message)}
            </div>
        `;

        return;

    }


    atletas =
        data || [];


    renderizarAtletas(
        atletas
    );

}


/* =========================

========================= */

        listaAtletas.length === 0

        return;

    }


    lista.innerHTML = "";


    listaAtletas.forEach(
        atleta => {

            const div =

            div.dataset.nome =

            div.dataset.cpf =

                .toLowerCase();


            div.dataset.numero =
                (atleta.numero_peito || "")

                    <div class="atleta-numero">

                        Nº
                        ${escaparHTML(
                            atleta.numero_peito ||
                            "—"
                        )}

                    </div>

                </div>


                <div class="atleta-dados">

                    <div class="atleta-dado">

                        <strong>CPF:</strong>

                        ${escaparHTML(
                            atleta.cpf ||
                            "Não informado"
                        )}

                    </div>


                    <div class="atleta-dado">

                        <strong>
                            Nascimento:
                        </strong>

                            atleta.data_nascimento
                        )}

                    </div>


                    <div class="atleta-dado">

                        <strong>
                            Modalidade:
                        </strong>

                        ${escaparHTML(
                            atleta.modalidade ||
                            "Não informada"
                        )}

                    </div>


                    <div class="atleta-dado">

                        <strong>
                            Sexo:
                        </strong>

                        ${escaparHTML(
                            atleta.sexo ||
                            "Não informado"
                        )}

                    </div>


                    <div class="atleta-dado">

                        <strong>
                            Camiseta:
                        </strong>

                        ${escaparHTML(
                            atleta.camiseta ||
                            "Não informada"
                        )}

                    </div>


                    <div class="atleta-dado">

                        <strong>
                            Equipe ou Assessoria:
                        </strong>

                        ${escaparHTML(
                            atleta.equipe ||
                            "Não informada"
                        )}

                    </div>


                    <div class="atleta-dado">

                        <strong>

                        ${escaparHTML(
                            atleta.pelotao ||
                            "Não informado"
                        )}

                    <div class="atleta-dado">

                </div>


                <div class="status">

                    STATUS:
                    ${escaparHTML(
                        atleta.status_kit ||

                    onclick="abrirEdicao('${atleta.id}')"

            lista.appendChild(

}


/* =========================
   FILTRAR
========================= */

function filtrarAtletas(){

    const texto =
        document
        .getElementById(
            "busca"
        )
        .value
        .toLowerCase()
        .trim();


    if(!texto){

        renderizarAtletas(
            atletas
        );

        return;

    }


    const filtrados =
        atletas.filter(
            atleta => {

                const nome =
                    (
                        atleta.nome ||
                        ""
                    )
                    .toLowerCase();


                const cpf =
                    (
                        atleta.cpf ||
                        ""
                    )
                    .toLowerCase();


                const numero =
                    (
                        atleta.numero_peito ||
                        ""
                    )
                    .toLowerCase();


                return (

                    nome.includes(texto) ||

                    cpf.includes(texto) ||

                    numero.includes(texto)

                );

            }
        );


    renderizarAtletas(
        filtrados
    );

}

            dataNascimentoTexto
        );

        .value

        )

        .trim();


    if(!nome){

    }


    if(

    const dadosAtleta = {

/* =========================
   ABRIR EDIÇÃO
========================= */

function abrirEdicao(id){

    const atleta =
        atletas.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!atleta){

        alert(
            "Atleta não encontrado."
        );

        return;

    }


    document.getElementById(
        "editarId"
    ).value =
        atleta.id;


    document.getElementById(
        "editarNome"
    ).value =
        atleta.nome || "";


    document.getElementById(
        "editarCpf"
    ).value =
        atleta.cpf || "";


    document.getElementById(
        "editarDataNascimento"
    ).value =
        atleta.data_nascimento
        ?
        formatarData(
            atleta.data_nascimento
        )
        :
        "";


    document.getElementById(
        "editarNumero"
    ).value =
        atleta.numero_peito || "";


    document.getElementById(
        "editarSexo"
    ).value =
        atleta.sexo || "";


    document.getElementById(
        "editarModalidade"
    ).value =
        atleta.modalidade || "";


    document.getElementById(
        "editarCamiseta"
    ).value =
        atleta.camiseta || "";


    document.getElementById(
        "editarEquipe"
    ).value =
        atleta.equipe || "";


    document.getElementById(
        "editarPelotao"
    ).value =
        atleta.pelotao || "";


    document.getElementById(
        "editarProduto"
    ).value =
        atleta.produto_extra || "";


    document.getElementById(
        "editarObservacao"
    ).value =
        atleta.observacao || "";


    document
    .getElementById(
        "modalEdicao"
    )
    .classList
    .add("ativo");


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   FECHAR EDIÇÃO
========================= */

function fecharEdicao(){

    document
    .getElementById(
        "modalEdicao"
    )
    .classList
    .remove("ativo");

}


/* =========================
   SALVAR EDIÇÃO
========================= */

async function salvarEdicao(){

    const id =
        document
        .getElementById(
            "editarId"
        )
        .value;


    if(!id){

        alert(
            "Atleta inválido."
        );

        return;

    }


    const nome =
        document
        .getElementById(
            "editarNome"
        )
        .value
        .trim();


    const cpf =
        document
        .getElementById(
            "editarCpf"
        )
        .value
        .trim();


    const dataTexto =
        document
        .getElementById(
            "editarDataNascimento"
        )
        .value
        .trim();


    const data_nascimento =
        converterDataParaBanco(
            dataTexto
        );


    const numero_peito =
        document
        .getElementById(
            "editarNumero"
        )
        .value
        .trim();


    const sexo =
        document
        .getElementById(
            "editarSexo"
        )
        .value;


    const modalidade =
        document
        .getElementById(
            "editarModalidade"
        )
        .value;


    const camiseta =
        document
        .getElementById(
            "editarCamiseta"
        )
        .value
        .trim();


    const equipe =
        document
        .getElementById(
            "editarEquipe"
        )
        .value
        .trim();


    const pelotao =
        document
        .getElementById(
            "editarPelotao"
        )
        .value;


    const produto_extra =
        document
        .getElementById(
            "editarProduto"
        )
        .value
        .trim();


    const observacao =
        document
        .getElementById(
            "editarObservacao"
        )
        .value
        .trim();


    if(!nome){

        alert(
            "O nome do atleta é obrigatório."
        );

        return;

    }


    if(
        dataTexto &&
        !data_nascimento
    ){

        alert(
            "A data de nascimento deve ser válida e estar no formato DD/MM/AAAA."
        );

        return;

    }


    const dadosAtualizados = {

        nome,

        cpf:
            cpf || null,

        data_nascimento,

        numero_peito:
            numero_peito || null,

        sexo:
            sexo || null,

        modalidade:
            modalidade || null,

        camiseta:
            camiseta || null,

        equipe:
            equipe || null,

        pelotao:
            pelotao || null,

        produto_extra:
            produto_extra || null,

        observacao:
            observacao || null

    };


    const {
        error
    } =
        await db
        .from("atletas_v2")
        .update(
            dadosAtualizados
        )
        .eq(
            "id",
            id
        )
        .eq(
            "evento_id",
            eventoId
        );


    if(error){

        alert(
            "Erro ao salvar alterações:\n\n" +
            error.message
        );

        console.error(
            error
        );

        return;

    }


    alert(
        "Alterações salvas com sucesso!"
    );


    fecharEdicao();


    carregarAtletas();

}
