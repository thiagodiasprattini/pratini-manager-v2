<script>

const eventoId =
    localStorage.getItem("evento_ativo_id");

const eventoNome =
    localStorage.getItem("evento_ativo_nome");

let atletas = [];

let atletaEditando = null;


/* =========================
   ACESSO
========================= */

async function verificarAcesso(){

    const { data: sessao } =
        await db.auth.getSession();

    if(
        !sessao ||
        !sessao.session
    ){

        window.location.href =
            "login.html";

        return;
    }


    const usuario =
        sessao.session.user;


    const { data: perfil, error } =
        await db
        .from("perfis")
        .select("role,nome")
        .eq("id",usuario.id)
        .single();


    if(
        error ||
        !perfil ||
        perfil.role !== "admin"
    ){

        alert(
            "Acesso restrito ao administrador."
        );

        window.location.href =
            "dashboard.html";

        return;
    }


    document.getElementById(
        "eventoAtivo"
    ).innerText =
        eventoNome ||
        "Nenhum evento ativo selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display =
        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =
        "block";


    aplicarMaiusculoAutomatico(
        document.getElementById("formNovoAtleta")
    );


    carregarAtletas();
}


/* =========================
   CARREGAR ATLETAS
========================= */

async function carregarAtletas(){

    const lista =
        document.getElementById(
            "listaAtletas"
        );


    if(!eventoId){

        lista.innerHTML = `
            <div class="card">
                <p>
                    Selecione um evento ativo
                    antes de cadastrar atletas.
                </p>
            </div>
        `;

        return;
    }


    lista.innerHTML = `
        <div class="card">
            Carregando atletas...
        </div>
    `;


    const { data, error } =
        await db
        .from("atletas_v2")
        .select("*")
        .eq("evento_id",eventoId)
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        lista.innerHTML = `
            <div class="card">
                <p class="erro">
                    Erro ao carregar atletas:
                    ${escapeHtml(error.message)}
                </p>
            </div>
        `;

        return;
    }


    atletas =
        data || [];


    renderizarAtletas(atletas);
}


/* =========================
   RENDERIZAR
========================= */

function renderizarAtletas(listaDados){

    const lista =
        document.getElementById(
            "listaAtletas"
        );


    if(
        !listaDados ||
        listaDados.length === 0
    ){

        lista.innerHTML = `
            <div class="card">
                <p>
                    Nenhum atleta cadastrado ainda.
                </p>
            </div>
        `;

        return;
    }


    let html = "";

    listaDados.forEach(
        atleta => {

            html +=
                criarCardAtleta(atleta);

        }
    );

    lista.innerHTML = html;

    // Os <select> de edição (Modalidade, Sexo, Pelotão) precisam
    // ser preenchidos por aqui, em vez de um <script> dentro do HTML:
    // <script> inserido via innerHTML nunca é executado pelo navegador,
    // então o valor atual do atleta nunca aparecia selecionado.
    listaDados.forEach(
        atleta => {

            selecionarValorIgnorandoCaixa(
                document.getElementById("edit_modalidade_" + atleta.id),
                atleta.modalidade
            );

            selecionarValorIgnorandoCaixa(
                document.getElementById("edit_sexo_" + atleta.id),
                atleta.sexo
            );

            selecionarValorIgnorandoCaixa(
                document.getElementById("edit_pelotao_" + atleta.id),
                atleta.pelotao
            );

            aplicarMaiusculoAutomatico(
                document.getElementById("edicao-" + atleta.id)
            );

        }
    );
}


/* =========================
   SELECIONAR VALOR NO <select>
   (ignorando maiúsculas/minúsculas,
   já que atletas importados por planilha
   podem vir com grafia diferente das opções fixas)
========================= */

function selecionarValorIgnorandoCaixa(select, valor){

    if(!select || !valor) return;

    const valorNormalizado =
        valor.toString().trim().toLowerCase();

    for(const opcao of select.options){

        if(opcao.value.toLowerCase() === valorNormalizado){

            select.value = opcao.value;
            return;
        }
    }

    // Se não achar nenhuma opção com esse texto (ex: veio de importação
    // com grafia diferente), deixa como "Selecione" mesmo, sem travar nada.
}

/* =========================
   EDITAR
========================= */

function editarAtleta(id){

    if(atletaEditando && atletaEditando !== id){

        cancelarEdicao(atletaEditando);

    }


    const area =
        document.getElementById(
            "edicao-" + id
        );


    if(!area) return;


    area.classList.remove(
        "oculto"
    );


    atletaEditando = id;


    area.scrollIntoView({
        behavior:"smooth",
        block:"center"
    });
}


/* =========================
   CANCELAR
========================= */

function cancelarEdicao(id){

    const area =
        document.getElementById(
            "edicao-" + id
        );


    if(area){

        area.classList.add(
            "oculto"
        );

    }


    if(atletaEditando === id){

        atletaEditando = null;

    }

}

/* =========================
   MAIÚSCULAS AUTOMÁTICAS
   (aplica em todo input de texto e textarea,
   inclusive nos formulários criados dinamicamente
   na edição de cada atleta)
========================= */

function aplicarMaiusculoAutomatico(raiz){

    const escopo =
        raiz || document;

    const campos =
        escopo.querySelectorAll(
            'input[type="text"], textarea'
        );

    campos.forEach(campo => {

        if(campo.dataset.maiusculoAtivo === "1"){
            return;
        }

        campo.dataset.maiusculoAtivo = "1";

        campo.addEventListener("input", function(){

            const posicaoCursor =
                campo.selectionStart;

            campo.value =
                campo.value.toUpperCase();

            if(
                campo.setSelectionRange &&
                posicaoCursor !== null
            ){

                campo.setSelectionRange(
                    posicaoCursor,
                    posicaoCursor
                );
            }
        });
    });
}

function filtrarAtletas(){

    const texto =
        document
        .getElementById("busca")
        .value
        .toLowerCase()
        .trim();


    const cards =
        document.querySelectorAll(
            ".atleta"
        );


    cards.forEach(card => {

        const nome =
            (card.dataset.nome || "").toLowerCase();

        const cpf =
            (card.dataset.cpf || "").toLowerCase();

        const numero =
            (card.dataset.numero || "").toLowerCase();

        const bate =
            !texto ||
            nome.includes(texto) ||
            cpf.includes(texto) ||
            numero.includes(texto);


        card.style.display =
            bate ? "" : "none";

    });
}


/* =========================

========================= */

function baixarPlanilha(){

    if(!eventoId){

        alert(
            "Não existe evento ativo selecionado."
        );

        return;
    }


    if(
        !atletas ||
        atletas.length === 0
    ){

        alert(
            "Não há atletas para exportar."
        );

        return;
    }


    const dadosExportacao =
        atletas.map(atleta => ({

            "NÚMERO DE PEITO":
                atleta.numero_peito || "",

            "NOME COMPLETO":
                atleta.nome || "",

            "CPF":
                atleta.cpf || "",

            "DATA DE NASCIMENTO":
                formatarDataBR(
                    atleta.data_nascimento
                ),

            "MODALIDADE":
                atleta.modalidade || "",

            "SEXO":
                atleta.sexo || "",

            "CAMISETA":
                atleta.camiseta || "",

            "EQUIPE OU ASSESSORIA":
                atleta.equipe || "",

            "PELOTÃO":
                atleta.pelotao || "",

            "PRODUTO EXTRA":
                atleta.produto_extra || "",

            "OBSERVAÇÃO":
                atleta.observacao || "",

            "STATUS":
                atleta.status_kit || ""

        }));


    const planilha =
        XLSX.utils.json_to_sheet(
            dadosExportacao
        );


    // Força "NÚMERO DE PEITO" (coluna A) e "CPF" (coluna C) como texto,
    // porque o Excel converte esses campos para número automaticamente
    // e apaga o zero à esquerda (ex: CPF 012.345.678-90 vira 12.345.678-90)
    ["A", "C"].forEach(letraColuna => {

        for(
            let linha = 2;
            linha <= dadosExportacao.length + 1;
            linha++
        ){

            const endereco =
                letraColuna + linha;

            const celula =
                planilha[endereco];

            if(celula){
                celula.t = "s";
                celula.z = "@";
            }
        }
    });


    planilha["!cols"] = [

        {wch:18},
        {wch:35},
        {wch:18},
        {wch:20},
        {wch:20},
        {wch:15},
        {wch:15},
        {wch:30},
        {wch:35},
        {wch:30},
        {wch:40},
        {wch:18}

    ];


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        planilha,
        "Atletas"
    );


    const nomeSeguro =
        (eventoNome || "evento")
        .replace(
            /[\\/:*?"<>|]/g,
            ""
        )
        .replace(
            /\s+/g,
            "_"
        );


    const dataAtual =
        new Date();


    const dataArquivo =
        dataAtual
        .toLocaleDateString(
            "pt-BR"
        )
        .replace(
            /\//g,
            "-"
        );


    const nomeArquivo =
        `Atletas_${nomeSeguro}_${dataArquivo}.xlsx`;


    XLSX.writeFile(
        workbook,
        nomeArquivo
    );
}


/* =========================
   DATA
========================= */

function mascaraData(input){

    let valor =
        input.value
        .replace(/\D/g,"")
        .slice(0,8);


    if(valor.length >= 5){

        valor =
            valor.slice(0,2) +
            "/" +
            valor.slice(2,4) +
            "/" +
            valor.slice(4);

    }else if(valor.length >= 3){

        valor =
            valor.slice(0,2) +
            "/" +
            valor.slice(2);

    }


    input.value =
        valor;
}


function converterData(valor){

    if(!valor){

        return null;
    }


    valor =
        valor
        .toString()
        .trim();


    const br =
        valor.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );


    if(br){

        const dia =
            br[1].padStart(2,"0");

        const mes =
            br[2].padStart(2,"0");

        const ano =
            br[3];


        const data =
            new Date(
                `${ano}-${mes}-${dia}T00:00:00`
            );


        if(
            data.getFullYear() != ano ||
            data.getMonth()+1 != Number(mes) ||
            data.getDate() != Number(dia)
        ){

            return null;
        }


        return `${ano}-${mes}-${dia}`;
    }


    const iso =
        valor.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );


    if(iso){

        return (
            iso[1] +
            "-" +
            iso[2].padStart(2,"0") +
            "-" +
            iso[3].padStart(2,"0")
        );
    }


    return null;
}


function formatarDataBR(valor,paraEdicao=false){

    if(!valor){

        return "";
    }


    const texto =
        valor
        .toString()
        .trim();


    if(
        /^\d{2}\/\d{2}\/\d{4}$/.test(texto)
    ){

        return texto;
    }


    const iso =
        texto.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if(iso){

        return (
            iso[3] +
            "/" +
            iso[2] +
            "/" +
            iso[1]
        );
    }


    return texto;
}


/* =========================
   SEGURANÇA HTML
========================= */

function escapeHtml(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


function escapeAttr(valor){

    return escapeHtml(valor);
}
