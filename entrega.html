<script>

/* ==========================================================
   VARIÁVEIS
========================================================== */

let usuarioLogado = null;

const eventoId =
    localStorage.getItem("evento_ativo_id");

const eventoNome =
    localStorage.getItem("evento_ativo_nome");


/* ==========================================================
   VERIFICAR ACESSO
========================================================== */

async function verificarAcesso(){

    try{

        const { data: sessaoData, error: sessaoError } =
            await db.auth.getSession();

        if(
            sessaoError ||
            !sessaoData ||
            !sessaoData.session
        ){

            window.location.href = "login.html";
            return;

        }


        const usuario =
            sessaoData.session.user;


        /* ----------------------------------------------
           PERFIL DO USUÁRIO
        ---------------------------------------------- */

        const { data: perfil, error: perfilError } =
            await db
                .from("perfis")
                .select("role, nome")
                .eq("id", usuario.id)
                .single();


        if(perfilError || !perfil){

            window.location.href = "index.html";
            return;

        }


        usuarioLogado = {

            id: usuario.id,

            nome:
                perfil.nome ||
                usuario.email,

            email:
                usuario.email

        };


        /* ----------------------------------------------
           EVENTO
        ---------------------------------------------- */

        document.getElementById(
            "eventoAtivo"
        ).textContent =
            eventoNome ||
            "Nenhum evento ativo selecionado.";


        document.getElementById(
            "telaCarregando"
        ).style.display = "none";


        document.getElementById(
            "telaPainel"
        ).style.display = "block";


        /* ----------------------------------------------
           ENTER NO CAMPO DE PESQUISA
        ---------------------------------------------- */

        document
            .getElementById("busca")
            .addEventListener("keydown", function(e){

                if(e.key === "Enter"){

                    buscarAtletas();

                }

            });


    }catch(error){

        console.error(error);

        window.location.href = "login.html";

    }

}


/* ==========================================================
   NORMALIZAR TEXTO
========================================================== */

function normalizar(txt){

    return (
        txt || ""
    )
    .toString()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();

}


/* ==========================================================
   ESCAPAR HTML
   Evita problemas quando nomes possuem caracteres especiais.
========================================================== */

function escaparHTML(valor){

    if(valor === null || valor === undefined){

        return "";

    }

    return String(valor)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/* ==========================================================
   FORMATAR DATA DE NASCIMENTO
========================================================== */

function formatarNascimento(data){

    if(!data){

        return "Não informado";

    }

    try{

        const partes =
            String(data).split("-");

        if(partes.length === 3){

            return (
                partes[2] +
                "/" +
                partes[1] +
                "/" +
                partes[0]
            );

        }

        return data;

    }catch(e){

        return data;

    }

}


/* ==========================================================
   FORMATAR DATA/HORA
========================================================== */

function formatarDataHora(data){

    if(!data){

        return "Não informada";

    }

    try{

        return new Date(data).toLocaleString(
            "pt-BR",
            {
                timeZone:"America/Sao_Paulo"
            }
        );

    }catch(e){

        return data;

    }

}


/* ==========================================================
   PESQUISAR ATLETAS
========================================================== */

async function buscarAtletas(){

    const termoOriginal =
        document
            .getElementById("busca")
            .value
            .trim();


    const resultado =
        document.getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    ⚠️ Nenhum evento ativo foi selecionado.

                </div>

            </div>

        `;

        return;

    }


    if(!termoOriginal){

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    Digite o nome ou número de peito.

                </div>

            </div>

        `;

        return;

    }


    resultado.innerHTML = `

        <div class="card">

            <div class="spinner"></div>

            <div class="mensagem">
                Pesquisando atleta...
            </div>

        </div>

    `;


    /* ======================================================
       BUSCA NO BANCO

       Aqui NÃO buscamos CPF.
       A Central trabalha somente com:
       - nome
       - número de peito
    ====================================================== */

    const { data, error } =
        await db

            .from("atletas_v2")

            .select(`
                id,
                evento_id,
                nome,
                numero_peito,
                data_nascimento,
                modalidade,
                camiseta,
                pelotao,
                produto_extra,
                status_kit,
                retirado_por,
                data_retirada,
                entregue_por,
                entregue_por_usuario,
                retirado_login
            `)

            .eq("evento_id", eventoId)

            .limit(1000);


    if(error){

        console.error(error);

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    ❌ Erro ao pesquisar:
                    ${escaparHTML(error.message)}

                </div>

            </div>

        `;

        return;

    }


    const busca =
        normalizar(termoOriginal);


    const encontrados =
        (data || []).filter(atleta => {

            const nome =
                normalizar(atleta.nome);

            const numero =
                normalizar(atleta.numero_peito);

            return (
                nome.includes(busca) ||
                numero === busca
            );

        });


    if(encontrados.length === 0){

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    ❌ Nenhum atleta encontrado.

                    <br><br>

                    Confira o nome ou número de peito.

                </div>

            </div>

        `;

        return;

    }


    resultado.innerHTML = "";


    encontrados.forEach(atleta => {

        resultado.innerHTML +=
            criarCardAtleta(atleta);

    });

}


/* ==========================================================
   CRIAR CARD DO ATLETA
========================================================== */

function criarCardAtleta(atleta){

    const entregue =
        atleta.status_kit === "entregue";


    const id =
        escaparHTML(atleta.id);


    const nome =
        escaparHTML(atleta.nome);


    const numero =
        escaparHTML(
            atleta.numero_peito ||
            "Não informado"
        );


    const nascimento =
        escaparHTML(
            formatarNascimento(
                atleta.data_nascimento
            )
        );


    const modalidade =
        escaparHTML(
            atleta.modalidade ||
            "Não informada"
        );


    const camiseta =
        escaparHTML(
            atleta.camiseta ||
            "Não informada"
        );


    const pelotao =
        escaparHTML(
            atleta.pelotao ||
            "Não informado"
        );


    const produto =
        escaparHTML(
            atleta.produto_extra ||
            "Nenhum"
        );


    let html = `

        <div
            class="card atleta-card
            ${entregue ? "entregue" : "pendente"}"
        >

            <span class="status
                ${entregue ? "status-entregue" : "status-pendente"}">

                ${entregue
                    ? "✓ KIT ENTREGUE"
                    : "KIT PENDENTE"
                }

            </span>


            <h2 class="nome-atleta">
                ${nome}
            </h2>


            <div class="dados-atleta">


                <div class="dado">

                    <span class="dado-label">
                        Número de peito
                    </span>

                    <span class="dado-valor">
                        ${numero}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Data de nascimento
                    </span>

                    <span class="dado-valor">
                        ${nascimento}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Modalidade
                    </span>

                    <span class="dado-valor">
                        ${modalidade}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Camiseta
                    </span>

                    <span class="dado-valor">
                        ${camiseta}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Pelotão
                    </span>

                    <span class="dado-valor">
                        ${pelotao}
                    </span>

                </div>


            </div>


            <div class="produto">

                <span class="produto-label">
                    Produtos
                </span>

                <span class="produto-valor">
                    ${produto}
                </span>

            </div>

    `;


    /* ======================================================
       SE JÁ FOI ENTREGUE
    ====================================================== */

    if(entregue){

        html += `

            <div class="entrega-realizada">

                <div class="entrega-realizada-titulo">

                    ✓ KIT JÁ ENTREGUE

                </div>


                <div class="entrega-info">

                    <b>Retirado por:</b>
                    ${escaparHTML(
                        atleta.retirado_por ||
                        "Não informado"
                    )}

                </div>


                <div class="entrega-info">

                    <b>Atendente:</b>
                    ${escaparHTML(
                        atleta.entregue_por ||
                        atleta.retirado_login ||
                        "Não informado"
                    )}

                </div>


                <div class="entrega-info">

                    <b>Data e horário:</b>
                    ${escaparHTML(
                        formatarDataHora(
                            atleta.data_retirada
                        )
                    )}

                </div>

            </div>

        `;

    }

    /* ======================================================
       SE ESTÁ PENDENTE
    ====================================================== */

    else{

        html += `

            <div
                id="retirada-${id}"
                class="retirada-box"
            >

                <div class="retirada-titulo">

                    Quem está retirando?

                </div>


                <div class="opcoes-retirada">


                    <label
                        class="opcao-retirada"
                        id="opcao-proprio-${id}"
                        onclick="selecionarRetirada('${id}', 'PROPRIO_ATLETA')"
                    >

                        <input
                            type="radio"
                            name="retirada-${id}"
                            value="PROPRIO_ATLETA"
                        >

                        <div class="opcao-titulo">
                            👤 Próprio atleta
                        </div>

                        <div class="opcao-descricao">
                            O atleta está presente
                        </div>

                    </label>


                    <label
                        class="opcao-retirada"
                        id="opcao-terceiro-${id}"
                        onclick="selecionarRetirada('${id}', 'TERCEIRO')"
                    >

                        <input
                            type="radio"
                            name="retirada-${id}"
                            value="TERCEIRO"
                        >

                        <div class="opcao-titulo">
                            👥 Terceiro
                        </div>

                        <div class="opcao-descricao">
                            Outra pessoa está retirando
                        </div>

                    </label>


                </div>


                <div
                    id="terceiro-${id}"
                    class="campo-terceiro"
                    style="display:none;"
                >

                    <label>
                        Nome de quem está retirando *
                    </label>

                    <input
                        id="nome-terceiro-${id}"
                        type="text"
                        placeholder="Digite o nome completo"
                    >

                </div>


                <div class="campo-observacao">

                    <label>
                        Observação
                    </label>

                    <textarea
                        id="observacao-${id}"

                    ></textarea>

                </div>


                <button
                    class="btn btn-verde"
                    onclick="entregar('${id}')"

                    ✓ ENTREGAR KIT

                </button>

            </div>

        `;

    }


    html += `

        </div>

    `;


    return html;

}


/* ==========================================================
   SELECIONAR PRÓPRIO / TERCEIRO
========================================================== */

function selecionarRetirada(id, tipo){

    const proprio =
        document.getElementById(
            "opcao-proprio-" + id
        );

    const terceiro =
        document.getElementById(
            "opcao-terceiro-" + id
        );

    const campoTerceiro =
        document.getElementById(
            "terceiro-" + id
        );


    if(tipo === "PROPRIO_ATLETA"){

        proprio.classList.add("ativa");

        terceiro.classList.remove("ativa");

        campoTerceiro.style.display =
            "none";

    }


    if(tipo === "TERCEIRO"){

        terceiro.classList.add("ativa");

        proprio.classList.remove("ativa");

        campoTerceiro.style.display =
            "block";


        setTimeout(() => {

            const campo =
                document.getElementById(
                    "nome-terceiro-" + id
                );

            if(campo){

                campo.focus();

            }

        },100);

    }

}


/* ==========================================================
   PEGAR TIPO DE RETIRADA
========================================================== */

function obterTipoRetirada(id){

    const radio =
        document.querySelector(
            `input[name="retirada-${id}"]:checked`
        );

    return radio
        ? radio.value
        : null;

}


/* ==========================================================
   ENCONTRAR USUÁRIO NA TABELA USUARIOS_V2
========================================================== */

async function encontrarUsuarioV2(){

    if(!usuarioLogado){

        return null;

    }


    /* Tenta pelo e-mail/login */

    const { data, error } =
        await db
            .from("usuarios_v2")
            .select("id,nome,usuario,ativo")
            .or(
                `usuario.eq.${usuarioLogado.email},usuario.eq.${usuarioLogado.nome}`
            )
            .eq("ativo", true)
            .limit(1);


    if(!error && data && data.length){

        return data[0];

    }


    return null;

}


/* ==========================================================
   ENTREGAR
========================================================== */

async function entregar(id){

    const tipo =
        obterTipoRetirada(id);


    if(!tipo){

        await Swal.fire({

            title:"Quem está retirando?",

            text:
                "Selecione se o kit será retirado pelo próprio atleta ou por um terceiro.",

            icon:"warning",

            background:"#1f1f1f",

            color:"#fff",

            confirmButtonColor:"#ffc400"

        });

        return;

    }


    let nomeRetirante =
        null;


    if(tipo === "PROPRIO_ATLETA"){

        nomeRetirante =
            "Retirado pelo próprio atleta";

    }


    if(tipo === "TERCEIRO"){

        const campo =
            document.getElementById(
                "nome-terceiro-" + id
            );


        nomeRetirante =
            campo
                ? campo.value.trim()
                : "";


        if(!nomeRetirante){

            await Swal.fire({

                title:
                    "Informe o nome",

                text:
                    "Digite o nome da pessoa que está retirando o kit.",

                icon:"warning",

                background:"#1f1f1f",

                color:"#fff",

                confirmButtonColor:"#ffc400"

            });

            return;

        }

    }


    const campoObservacao =
        document.getElementById(
            "observacao-" + id
        );


    const observacao =
        campoObservacao
            ? campoObservacao.value.trim()
            : null;


    /* ======================================================
       CONFIRMAÇÃO
    ====================================================== */

    const confirmacao =
        await Swal.fire({

            title:"Confirmar entrega?",

            html:`

                <div style="text-align:left">

                    <p>
                        <b>Retirada:</b>
                        ${
                            tipo === "PROPRIO_ATLETA"
                            ? "Próprio atleta"
                            : "Terceiro"
                        }
                    </p>

                    <p>
                        <b>Retirado por:</b>
                        ${escaparHTML(nomeRetirante)}
                    </p>

                    ${
                        observacao
                        ? `
                        <p>
                            <b>Observação:</b>
                            ${escaparHTML(observacao)}
                        </p>
                        `
                        : ""
                    }

                </div>

            `,

            icon:"question",

            background:"#1f1f1f",

            color:"#fff",

            showCancelButton:true,

            confirmButtonColor:"#0d9b4d",

            cancelButtonColor:"#555",

            confirmButtonText:"SIM, ENTREGAR",

            cancelButtonText:"CANCELAR"

        });


    if(!confirmacao.isConfirmed){

        return;

    }


    /* ======================================================
       DESABILITAR BOTÕES ENQUANTO PROCESSA
    ====================================================== */

    const botoes =
        document.querySelectorAll(
            `button[onclick="entregar('${id}')"]`
        );


    botoes.forEach(botao => {

        botao.disabled = true;

        botao.innerText =
            "REGISTRANDO...";

    });


    try{


        /* ==================================================
           ENCONTRA USUÁRIO V2
        ================================================== */

        const usuarioV2 =
            await encontrarUsuarioV2();


        /*
          Caso exista usuário correspondente:
          usamos o ID.

          Caso não exista:
          a função do banco aceita NULL e ainda registra
          o nome do atendente disponível no histórico.
        */

        const usuarioId =
            usuarioV2
                ? usuarioV2.id
                : null;


        /* ==================================================
           REGISTRA A ENTREGA NO BANCO

           IMPORTANTE:
           estamos usando a função criada no SQL anterior.
           Ela possui proteção contra entrega duplicada.
        ================================================== */

        const { data, error } =
            await db.rpc(
                "registrar_entrega",
                {
                    p_atleta_id: id,

                    p_usuario_id: usuarioId,

                    p_tipo_retirada: tipo,

                    p_retirado_por: nomeRetirante,

                    p_observacao:
                        observacao || null
                }
            );


        if(error){

            console.error(error);

            throw new Error(
                error.message ||
                "Erro ao registrar entrega."
            );

        }


        /* ==================================================
           RESULTADO DA FUNÇÃO
        ================================================== */

        if(!data){

            throw new Error(
                "O sistema não retornou confirmação da entrega."
            );

        }


        if(data.sucesso === false){

            if(
                data.erro ===
                "KIT_JA_ENTREGUE"
            ){

                await Swal.fire({

                    title:
                        "⚠️ KIT JÁ ENTREGUE",

                    html:`

                        <div style="text-align:left">

                            <p>
                                Este kit já foi registrado como entregue.
                            </p>

                            ${
                                data.entregue_em
                                ? `
                                <p>
                                    <b>Data:</b>
                                    ${escaparHTML(
                                        formatarDataHora(
                                            data.entregue_em
                                        )
                                    )}
                                </p>
                                `
                                : ""
                            }

                            ${
                                data.retirado_por
                                ? `
                                <p>
                                    <b>Retirado por:</b>
                                    ${escaparHTML(
                                        data.retirado_por
                                    )}
                                </p>
                                `
                                : ""
                            }

                            ${
                                data.atendente
                                ? `
                                <p>
                                    <b>Atendente:</b>
                                    ${escaparHTML(
                                        data.atendente
                                    )}
                                </p>
                                `
                                : ""
                            }

                        </div>

                    `,

                    icon:"warning",

                    background:"#1f1f1f",

                    color:"#fff",

                    confirmButtonColor:"#ffc400"

                });

                buscarAtletas();

                return;

            }


            if(
                data.erro ===
                "NOME_TERCEIRO_OBRIGATORIO"
            ){

                throw new Error(
                    "O nome do terceiro é obrigatório."
                );

            }


            throw new Error(
                data.erro ||
                "Não foi possível registrar a entrega."
            );

        }


        /* ==================================================
           SUCESSO
        ================================================== */

        await Swal.fire({

            title:
                "✓ Kit entregue!",

            html:`

                <div style="text-align:center">

                    <p>
                        A entrega foi registrada com sucesso.
                    </p>

                    <p>
                        <b>Retirado por:</b><br>
                        ${escaparHTML(nomeRetirante)}
                    </p>

                </div>

            `,

            icon:"success",

            background:"#1f1f1f",

            color:"#fff",

            confirmButtonColor:"#ffc400",

            confirmButtonText:"OK"

        });


        /* ==================================================
           ATUALIZA RESULTADO
        ================================================== */

        document
            .getElementById("busca")
            .value =
                id ? document.getElementById("busca").value : "";


        buscarAtletas();


    }catch(error){

        console.error(error);


        await Swal.fire({

            title:
                "Erro na entrega",

            text:
                error.message ||
                "Não foi possível registrar a entrega.",

            icon:"error",

            background:"#1f1f1f",

            color:"#fff",

            confirmButtonColor:"#ffc400"

        });


        botoes.forEach(botao => {

            botao.disabled = false;

            botao.innerText =
                "✓ ENTREGAR";

        });

    }

}


/* ==========================================================
   INICIAR
========================================================== */

verificarAcesso();

</script>
