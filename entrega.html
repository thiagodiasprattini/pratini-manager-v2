<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;

const eventoId =
    localStorage.getItem("evento_ativo_id");


/* =========================================================
   FUNÇÕES DE SEGURANÇA / TEXTO
========================================================= */

/*
   Corrige problemas com acentos e evita que nomes como
   André sejam interpretados de forma errada.
*/

function normalizar(txt) {

    return String(txt || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim();

}


/*
   Protege o HTML contra caracteres especiais.
*/

function escaparHTML(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/*
   Formata data de nascimento.
*/

function formatarDataNascimento(data) {

    if (!data) {

        return "Não informada";

    }

    /*
       Quando Supabase retorna YYYY-MM-DD,
       fazemos a conversão manual para evitar
       problemas de fuso horário.
    */

    const texto = String(data).substring(0,10);

    const partes = texto.split("-");

    if (partes.length === 3) {

        return `${partes[2]}/${partes[1]}/${partes[0]}`;

    }

    return escaparHTML(data);

}


/*
   Formata data e hora da retirada.
*/

function formatarDataHora(data) {

    if (!data) {

        return "Não informada";

    }

    try {

        return new Date(data).toLocaleString(
            "pt-BR",
            {
                timeZone: "America/Sao_Paulo",
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch (erro) {

        return "Não informada";

    }

}


/* =========================================================
   VERIFICAR ACESSO
========================================================= */

async function verificarAcesso() {

    try {

        const { data, error } =
            await db.auth.getSession();

        if (
            error ||
            !data ||
            !data.session
        ) {

            window.location.href = "login.html";

            return;

        }


        const usuario =
            data.session.user;


        /*
           Busca o perfil do usuário logado.
        */

        const { data: perfil, error: erroPerfil } =
            await db
                .from("perfis")
                .select("role, nome")
                .eq("id", usuario.id)
                .single();


        if (
            erroPerfil ||
            !perfil
        ) {

            window.location.href = "index.html";

            return;

        }


        usuarioLogado = {

            id: usuario.id,

            nome:
                perfil.nome ||
                usuario.email,

            email:
                usuario.email,

            role:
                perfil.role

        };


        /*
           Nome do evento selecionado.
        */

        const eventoNome =
            localStorage.getItem(
                "evento_ativo_nome"
            );


        document.getElementById(
            "eventoAtivo"
        ).textContent =
            eventoNome ||
            "Nenhum evento selecionado";


        document.getElementById(
            "telaCarregando"
        ).style.display = "none";


        document.getElementById(
            "telaPainel"
        ).style.display = "block";


    } catch (erro) {

        console.error(erro);

        window.location.href = "login.html";

    }

}


/* =========================================================
   BUSCAR ATLETAS
========================================================= */

async function buscarAtletas() {

    const termo =
        document
            .getElementById("busca")
            .value
            .trim();


    const resultado =
        document.getElementById("resultado");


    if (!eventoId) {

        resultado.innerHTML = `
            <div class="mensagem">
                Nenhum evento selecionado.
            </div>
        `;

        return;

    }


    if (!termo) {

        resultado.innerHTML = `
            <div class="mensagem">
                Digite o nome ou o número de peito.
            </div>
        `;

        return;

    }


    resultado.innerHTML = `
        <div class="mensagem">
            Pesquisando...
        </div>
    `;


    /*
       Busca os atletas do evento atual.
    */

    const { data, error } =
        await db
            .from("atletas_v2")
            .select(`
                id,
                evento_id,
                nome,
                numero_peito,
                modalidade,
                camiseta,
                equipe,
                produto_extra,
                status_kit,
                retirado_por,
                data_retirada,
                entregue_por,
                entregue_por_usuario,
                retirado_login
            `)
            .eq("evento_id", eventoId)
            .limit(2000);


    if (error) {

        console.error(error);

        resultado.innerHTML = `
            <div class="mensagem">
                Erro ao pesquisar:
                ${escaparHTML(error.message)}
            </div>
        `;

        return;

    }


    const busca =
        normalizar(termo);


    const encontrados =
        (data || []).filter(atleta => {

            const nome =
                normalizar(atleta.nome);

            const numero =
                normalizar(
                    atleta.numero_peito
                );

            return (
                nome.includes(busca) ||
                numero === busca ||
                numero.includes(busca)
            );

        });


    if (encontrados.length === 0) {

        resultado.innerHTML = `
            <div class="mensagem">
                Nenhum atleta encontrado.
            </div>
        `;

        return;

    }


    resultado.innerHTML = "";


    encontrados.forEach(
        (atleta, index) => {

            const entregue =
                String(atleta.status_kit || "")
                    .toLowerCase()
                    .trim() === "entregue";


            const nome =
                escaparHTML(
                    atleta.nome ||
                    "Nome não informado"
                );


            const numero =
                escaparHTML(
                    atleta.numero_peito ||
                    "—"
                );


            const dataNascimento =
                formatarDataNascimento(
                    atleta.data_nascimento
                );


            /*
               Como a tabela atletas_v2 atual não possui
               data_nascimento, tentamos buscar o dado
               pela tabela antiga caso necessário.
            */

            let dataNascimentoHTML = `
                <span
                    class="dado-valor"
                    id="nascimento-${atleta.id}">
                    ${escaparHTML(dataNascimento)}
                </span>
            `;


            const modalidade =
                escaparHTML(
                    atleta.modalidade ||
                    "Não informada"
                );


            const camiseta =
                escaparHTML(
                    atleta.camiseta ||
                    "Não informada"
                );


            const equipe =
                escaparHTML(
                    atleta.equipe ||
                    "Não informada"
                );


            const produto =
                escaparHTML(
                    atleta.produto_extra ||
                    "Nenhum"
                );


            /*
               Informações de retirada.
            */

            let retiradaHTML = "";


            if (entregue) {

                const retiradoPor =
                    escaparHTML(
                        atleta.retirado_por ||
                        "Não informado"
                    );


                const atendente =
                    escaparHTML(
                        atleta.entregue_por ||
                        atleta.retirado_login ||
                        atleta.entregue_por_usuario ||
                        "Não informado"
                    );


                const dataRetirada =
                    formatarDataHora(
                        atleta.data_retirada
                    );


                retiradaHTML = `

                    <div class="entrega-info">

                        <p>
                            <strong>Quem retirou:</strong><br>
                            ${retiradoPor}
                        </p>

                        <p>
                            <strong>Atendente:</strong><br>
                            ${atendente}
                        </p>

                        <p>
                            <strong>Data e horário:</strong><br>
                            ${escaparHTML(dataRetirada)}
                        </p>

                    </div>

                `;

            }


            /*
               Botão somente se ainda não foi entregue.
            */

            let acaoHTML = "";


            if (!entregue) {

                acaoHTML = `

                    <button
                        class="btn-entregar"
                        onclick="abrirEntrega(
                            '${atleta.id}'
                        )">

                        ENTREGAR

                    </button>

                `;

            }


            resultado.innerHTML += `

                <div
                    class="atleta-card"
                    data-index="${index}">


                    <!-- TOPO DO ATLETA -->

                    <div class="atleta-topo">

                        <h2 class="nome-atleta">
                            ${nome}
                        </h2>


                        <div class="numero-label">
                            NÚMERO DE PEITO
                        </div>


                        <div class="numero-peito">
                            ${numero}
                        </div>

                    </div>



                    <!-- DADOS -->

                    <div class="dados-atleta">


                        <div class="dado">

                            <span class="dado-label">
                                Data de nascimento
                            </span>

                            ${dataNascimentoHTML}

                        </div>


                        <div class="dado">

                            <span class="dado-label">
                                Modalidade
                            </span>

                            <span class="dado-valor">
                                ${modalidade}
                            </span>

                        </div>


                        <div class="dado">

                            <span class="dado-label">
                                Camiseta
                            </span>

                            <span class="dado-valor">
                                ${camiseta}
                            </span>

                        </div>


                        <div class="dado">

                            <span class="dado-label">
                                Pelotão / Equipe
                            </span>

                            <span class="dado-valor">
                                ${equipe}
                            </span>

                        </div>


                    </div>



                    <!-- PRODUTO -->

                    <div class="produto-extra">

                        <span class="dado-label">
                            Produtos
                        </span>

                        <span class="dado-valor">
                            ${produto}
                        </span>

                    </div>



                    <!-- STATUS -->

                    <div class="retirada-area">

                        <div class="retirada-titulo">
                            Status da entrega
                        </div>


                        <span
                            class="status ${
                                entregue
                                    ? "status-entregue"
                                    : "status-pendente"
                            }">

                            ${
                                entregue
                                    ? "ENTREGUE"
                                    : "AGUARDANDO ENTREGA"
                            }

                        </span>

                    </div>


                    ${retiradaHTML}


                    ${
                        !entregue
                            ? `
                                <div
                                    style="
                                    padding: 0 20px 20px;
                                    ">

                                    ${acaoHTML}

                                </div>
                            `
                            : ""
                    }


                </div>

            `;

        }
    );


    /*
       Como a tabela atletas_v2 atual não possui
       data_nascimento, fazemos uma segunda busca
       apenas para preencher a data corretamente.
    */

    const ids =
        encontrados
            .map(a => a.id)
            .filter(Boolean);


    if (ids.length > 0) {

        const { data: dadosAntigos } =
            await db
                .from("atletas")
                .select(
                    "id,nome,numero_peito,data_nascimento"
                )
                .eq("evento_id", eventoId);


        if (
            dadosAntigos &&
            dadosAntigos.length
        ) {

            encontrados.forEach(atleta => {

                const nomeAtual =
                    normalizar(atleta.nome);


                const numeroAtual =
                    normalizar(
                        atleta.numero_peito
                    );


                const antigo =
                    dadosAntigos.find(a =>
                        normalizar(a.nome) === nomeAtual ||
                        (
                            numeroAtual &&
                            normalizar(a.numero_peito)
                            === numeroAtual
                        )
                    );


                if (
                    antigo &&
                    antigo.data_nascimento
                ) {

                    const elemento =
                        document.getElementById(
                            `nascimento-${atleta.id}`
                        );


                    if (elemento) {

                        elemento.textContent =
                            formatarDataNascimento(
                                antigo.data_nascimento
                            );

                    }

                }

            });

        }

    }

}


/* =========================================================
   ABRIR JANELA DE ENTREGA
========================================================= */

async function abrirEntrega(id) {


    /*
       Busca novamente o atleta diretamente no banco.

       Isso é importante porque evita entregar um registro
       que acabou de ser entregue por outro atendente.
    */

    const { data: atleta, error } =
        await db
            .from("atletas_v2")
            .select("*")
            .eq("id", id)
            .single();


    if (error || !atleta) {

        Swal.fire({

            title: "Atleta não encontrado",

            text:
                "Atualize a pesquisa e tente novamente.",

            icon: "error",

            background: "#181818",

            color: "#ffffff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;

    }


    /*
       PROTEÇÃO CONTRA DUPLA ENTREGA
    */

    if (
        String(atleta.status_kit || "")
            .toLowerCase()
            .trim()
        === "entregue"
    ) {

        Swal.fire({

            title: "ENTREGA JÁ REALIZADA",

            html: `

                <div
                    style="
                    font-size:17px;
                    line-height:1.6;
                    text-align:left;
                    ">

                    <b>
                        ${escaparHTML(atleta.nome)}
                    </b>

                    <br><br>

                    Este registro já foi marcado
                    como entregue.

                    <br><br>

                    <b>Quem retirou:</b><br>

                    ${escaparHTML(
                        atleta.retirado_por ||
                        "Não informado"
                    )}

                    <br><br>

                    <b>Data e horário:</b><br>

                    ${escaparHTML(
                        formatarDataHora(
                            atleta.data_retirada
                        )
                    )}

                </div>

            `,

            icon: "warning",

            background: "#181818",

            color: "#ffffff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;

    }


    /*
       Tela de confirmação.
    */

    const resultado =
        await Swal.fire({

            title:
                "Confirmar entrega",

            html: `

                <div
                    style="
                    text-align:center;
                    margin-top:10px;
                    ">

                    <div
                        style="
                        font-size:15px;
                        color:#999;
                        margin-bottom:5px;
                        ">

                        ATLETA

                    </div>


                    <div
                        style="
                        font-size:25px;
                        font-weight:900;
                        color:#fff;
                        margin-bottom:10px;
                        ">

                        ${escaparHTML(atleta.nome)}

                    </div>


                    <div
                        style="
                        font-size:13px;
                        color:#999;
                        margin-bottom:3px;
                        ">

                        NÚMERO DE PEITO

                    </div>


                    <div
                        style="
                        font-size:42px;
                        font-weight:900;
                        color:#7CFC00;
                        margin-bottom:18px;
                        ">

                        ${escaparHTML(
                            atleta.numero_peito ||
                            "—"
                        )}

                    </div>


                    <div
                        style="
                        text-align:left;
                        background:#111;
                        border:1px solid #333;
                        border-radius:10px;
                        padding:15px;
                        ">

                        <b style="color:#999;">
                            Data de nascimento:
                        </b>

                        <br>

                        ${escaparHTML(
                            formatarDataNascimento(
                                atleta.data_nascimento
                            )
                        )}

                    </div>

                </div>

            `,

            showCancelButton: true,

            confirmButtonText:
                "CONFIRMAR ENTREGA",

            cancelButtonText:
                "CANCELAR",

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#444",

            background:
                "#181818",

            color:
                "#ffffff"

        });


    if (!resultado.isConfirmed) {

        return;

    }


    /*
       Depois da confirmação, pergunta quem está retirando.
    */

    const tipoRetirada =
        await Swal.fire({

            title:
                "Quem está retirando?",

            input:
                "radio",

            inputOptions: {

                proprio:
                    "O próprio atleta",

                terceiro:
                    "Terceiro"

            },

            inputValidator:
                (value) => {

                    if (!value) {

                        return "Selecione uma opção.";

                    }

                },

            confirmButtonText:
                "CONTINUAR",

            cancelButtonText:
                "CANCELAR",

            showCancelButton:
                true,

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#444",

            background:
                "#181818",

            color:
                "#ffffff"

        });


    if (
        !tipoRetirada.isConfirmed
    ) {

        return;

    }


    let retiradoPor =
        "Retirado pelo próprio atleta";


    let tipo =
        "proprio";


    let observacao =
        null;


    /*
       Se for terceiro, pede o nome.
    */

    if (
        tipoRetirada.value === "terceiro"
    ) {

        tipo =
            "terceiro";


        const terceiro =
            await Swal.fire({

                title:
                    "Quem está retirando?",

                input:
                    "text",

                inputLabel:
                    "Nome de quem está retirando",

                inputPlaceholder:
                    "Digite o nome completo",

                inputAttributes: {

                    autocomplete:
                        "off"

                },

                showCancelButton:
                    true,

                confirmButtonText:
                    "CONFIRMAR",

                cancelButtonText:
                    "CANCELAR",

                confirmButtonColor:
                    "#7CFC00",

                cancelButtonColor:
                    "#444",

                background:
                    "#181818",

                color:
                    "#ffffff",

                inputValidator:
                    (value) => {

                        if (
                            !value ||
                            !value.trim()
                        ) {

                            return
                                "Digite o nome de quem está retirando.";

                        }

                    }

            });


        if (
            !terceiro.isConfirmed
        ) {

            return;

        }


        retiradoPor =
            terceiro.value.trim();


        /*
           Mantemos o nome também como observação,
           para preservar a informação.
        */

        observacao =
            retiradoPor;

    }


    /*
       Confirmação final.
    */

    const finalConfirmacao =
        await Swal.fire({

            title:
                "Confirmar entrega?",

            html: `

                <div
                    style="
                    font-size:17px;
                    line-height:1.6;
                    ">

                    <b>
                        ${escaparHTML(
                            atleta.nome
                        )}
                    </b>

                    <br>

                    Número:
                    <b>
                        ${escaparHTML(
                            atleta.numero_peito ||
                            "—"
                        )}
                    </b>

                    <br><br>

                    Retirado por:

                    <b>
                        ${escaparHTML(
                            retiradoPor
                        )}
                    </b>

                </div>

            `,

            icon:
                "question",

            showCancelButton:
                true,

            confirmButtonText:
                "SIM, ENTREGAR",

            cancelButtonText:
                "VOLTAR",

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#444",

            background:
                "#181818",

            color:
                "#ffffff"

        });


    if (
        !finalConfirmacao.isConfirmed
    ) {

        return;

    }


    await registrarEntrega(
        atleta,
        retiradoPor,
        tipo,
        observacao
    );

}


/* =========================================================
   REGISTRAR ENTREGA
========================================================= */

async function registrarEntrega(
    atleta,
    retiradoPor,
    tipoRetirada,
    observacao
) {


    const agora =
        new Date().toISOString();


    /*
       NOVA PROTEÇÃO:

       Só atualiza se o registro ainda estiver
       pendente.

       Isso impede que dois atendentes entreguem
       simultaneamente o mesmo registro.
    */

    const { data: atualizado, error } =
        await db
            .from("atletas_v2")
            .update({

                status_kit:
                    "entregue",

                retirado_por:
                    retiradoPor,

                retirado_login:
                    usuarioLogado
                        ? usuarioLogado.email
                        : "Desconhecido",

                entregue_por:
                    usuarioLogado
                        ? usuarioLogado.nome
                        : "Desconhecido",

                entregue_por_usuario:
                    usuarioLogado
                        ? usuarioLogado.id
                        : null,

                data_retirada:
                    agora

            })
            .eq("id", atleta.id)
            .neq("status_kit", "entregue")
            .select("id");


    if (error) {

        console.error(error);

        Swal.fire({

            title:
                "Erro na entrega",

            text:
                error.message,

            icon:
                "error",

            background:
                "#181818",

            color:
                "#ffffff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;

    }


    /*
       Se não atualizou nenhuma linha,
       significa que alguém já entregou.
    */

    if (
        !atualizado ||
        atualizado.length === 0
    ) {

        Swal.fire({

            title:
                "ATENÇÃO",

            text:
                "Este atleta já foi marcado como entregue por outro atendente.",

            icon:
                "warning",

            background:
                "#181818",

            color:
                "#ffffff",

            confirmButtonColor:
                "#7CFC00"

        });

        buscarAtletas();

        return;

    }


    /*
       Registra na tabela entregas.
    */

    const { error: erroEntrega } =
        await db
            .from("entregas")
            .insert([{

                atleta_id:
                    atleta.id,

                usuario_id:
                    usuarioLogado
                        ? usuarioLogado.id
                        : null,

                retirado_por:
                    retiradoPor,

                tipo_retirada:
                    tipoRetirada,

                observacao:
                    observacao,

                entregue_em:
                    agora

            }]);


    if (erroEntrega) {

        console.error(
            "Erro ao registrar tabela entregas:",
            erroEntrega
        );

    }


    /*
       Auditoria.
    */

    const detalheAuditoria =

        `Entrega registrada. ` +

        `Atleta: ${atleta.nome}. ` +

        `Número: ${atleta.numero_peito || "não informado"}. ` +

        `Retirado por: ${retiradoPor}. ` +

        `Tipo: ${tipoRetirada}. ` +

        `Atendente: ${
            usuarioLogado
                ? usuarioLogado.nome
                : "Desconhecido"
        }. ` +

        `Login: ${
            usuarioLogado
                ? usuarioLogado.email
                : "Desconhecido"
        }. ` +

        `Data: ${agora}.`;


    const { error: erroAuditoria } =
        await db
            .from("auditoria_v2")
            .insert([{

                evento_id:
                    eventoId,

                usuario:
                    usuarioLogado
                        ? usuarioLogado.nome
                        : "Desconhecido",

                acao:
                    "Entrega de inscrição",

                detalhe:
                    detalheAuditoria

            }]);


    if (erroAuditoria) {

        console.error(
            "Erro na auditoria:",
            erroAuditoria
        );

    }


    /*
       Mensagem de sucesso.
    */

    await Swal.fire({

        title:
            "ENTREGA CONFIRMADA!",

        html: `

            <div
                style="
                font-size:18px;
                line-height:1.6;
                ">

                <b>
                    ${escaparHTML(
                        atleta.nome
                    )}
                </b>

                <br>

                Número:

                <strong
                    style="
                    color:#7CFC00;
                    font-size:28px;
                    ">

                    ${escaparHTML(
                        atleta.numero_peito ||
                        "—"
                    )}

                </strong>

                <br><br>

                Retirado por:

                <b>
                    ${escaparHTML(
                        retiradoPor
                    )}
                </b>

            </div>

        `,

        icon:
            "success",

        background:
            "#181818",

        color:
            "#ffffff",

        confirmButtonColor:
            "#7CFC00",

        confirmButtonText:
            "OK"

    });


    /*
       Atualiza a pesquisa.
    */

    buscarAtletas();

}
