<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Central de Entrega - Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

    --verde:#7CFC00;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --preto:#050505;

    --texto:#f5f5f5;

    --cinza:#b8b8b8;
}


*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--grafite);

    color:
        var(--texto);
}


/* =========================
   CABEÇALHO
========================= */

header{

    position:relative;

    min-height:105px;

    background:#101214;

    border-bottom:
        1px solid #383c40;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        15px 180px;
}


.logo{

    position:absolute;

    left:28px;

    top:50%;

    transform:
        translateY(-50%);

    width:145px;

    max-height:80px;

    object-fit:contain;
}


.titulo-header{

    font-size:26px;

    font-weight:700;

    letter-spacing:.5px;

    text-align:center;

    color:#fff;
}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:950px;

    margin:auto;

    padding:25px 20px 40px;
}


/* =========================
   EVENTO
========================= */

.evento{

    text-align:center;

    margin-bottom:20px;

    color:#fff;

    font-size:23px;

    font-weight:bold;
}


/* =========================
   PESQUISA
========================= */

.pesquisa{

    background:#111;

    border:
        1px solid #3a3e42;

    border-radius:15px;

    padding:20px;

    margin-bottom:22px;
}


.pesquisa input{

    width:100%;

    padding:16px 18px;

    background:#202326;

    color:#fff;

    border:
        1px solid #444;

    border-radius:10px;

    font-size:18px;

    outline:none;
}


.pesquisa input:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 2px
        rgba(124,252,0,.10);
}


.botao-buscar{

    width:100%;

    margin-top:10px;

    padding:15px;

    border:0;

    border-radius:10px;

    background:
        var(--verde);

    color:#050505;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   RESULTADOS
========================= */

#resultado{
    width:100%;
}


.card-busca{

    background:#080808;

    border:
        1px solid #3d4145;

    border-left:
        4px solid var(--verde);

    border-radius:12px;

    padding:18px 20px;

    margin-bottom:12px;

    cursor:pointer;

    transition:
        .18s ease;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.25);
}


.card-busca:hover{

    border-color:
        var(--verde);

    transform:
        translateY(-1px);

    box-shadow:
        0 7px 22px
        rgba(124,252,0,.12);
}


.nome-busca{

    font-size:21px;

    font-weight:bold;

    color:#fff;

    margin-bottom:8px;
}


.nascimento-busca{

    color:#bdbdbd;

    font-size:16px;
}


.nascimento-busca strong{

    color:#fff;
}


/* =========================
   CARD DETALHES
========================= */

.card-detalhes{

    background:
        #050505;

    border:
        1px solid #4a4f54;

    border-radius:18px;

    padding:25px;

    margin-bottom:25px;

    box-shadow:
        0 0 0 1px
        rgba(124,252,0,.10),

        0 12px 35px
        rgba(0,0,0,.40);
}


/* NOME SOMENTE UMA VEZ */

.nome-detalhe{

    text-align:center;

    font-size:30px;

    line-height:1.15;

    font-weight:800;

    color:#fff;

    margin:
        0 0 20px;

    word-break:normal;
}


/* =========================
   NÚMERO DE PEITO
========================= */

.numero-box{

    text-align:center;

    padding:
        20px 15px 24px;

    margin-bottom:22px;

    background:#111;

    border:
        1px solid #383838;

    border-radius:14px;
}


.numero-label{

    font-size:15px;

    font-weight:bold;

    letter-spacing:2px;

    color:#aaa;

    margin-bottom:5px;
}


.numero{

    font-size:68px;

    line-height:1;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 0 12px
        rgba(255,255,255,.18);
}


/* =========================
   DADOS
========================= */

.dados{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-bottom:20px;
}


.dado{

    background:#111;

    border:
        1px solid #303438;

    border-radius:11px;

    padding:14px;
}


.dado-label{

    color:#969696;

    font-size:13px;

    text-transform:uppercase;

    font-weight:bold;

    letter-spacing:.5px;

    margin-bottom:6px;
}


.dado-valor{

    color:#fff;

    font-size:19px;

    font-weight:600;

    word-break:break-word;
}


/* =========================
   PRODUTO
========================= */

.produto{

    background:#111;

    border:
        1px solid #303438;

    border-radius:11px;

    padding:15px;

    margin-bottom:18px;
}


.produto .dado-valor{

    font-size:19px;
}


/* =========================
   RETIRADA
========================= */

.retirada{

    border-top:
        1px solid #343434;

    padding-top:20px;

    margin-top:15px;
}


.retirada-titulo{

    font-size:20px;

    font-weight:bold;

    margin-bottom:12px;
}


.opcoes{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-bottom:15px;
}


.opcao{

    background:#151515;

    border:
        1px solid #3a3a3a;

    border-radius:10px;

    padding:15px;

    cursor:pointer;

    font-size:17px;

    text-align:center;

    transition:.15s;
}


.opcao.ativo{

    border-color:
        var(--verde);

    background:
        rgba(124,252,0,.08);

    color:
        var(--verde);
}


.opcao input{

    display:none;
}


.campo-terceiro{

    display:none;

    margin-bottom:15px;
}


.campo-terceiro label{

    display:block;

    font-size:15px;

    font-weight:bold;

    margin-bottom:6px;

    color:#ccc;
}


.campo-terceiro input{

    width:100%;

    padding:14px;

    background:#202326;

    border:
        1px solid #444;

    border-radius:9px;

    color:#fff;

    font-size:17px;
}


.observacao{

    margin-bottom:15px;
}


.observacao label{

    display:block;

    font-size:15px;

    font-weight:bold;

    margin-bottom:6px;

    color:#ccc;
}


.observacao textarea{

    width:100%;

    min-height:80px;

    resize:vertical;

    background:#202326;

    color:#fff;

    border:
        1px solid #444;

    border-radius:9px;

    padding:14px;

    font-family:Arial;

    font-size:16px;
}


/* =========================
   BOTÃO ENTREGAR
========================= */

.botao-entregar{

    width:100%;

    border:0;

    border-radius:11px;

    padding:17px;

    margin-top:8px;

    background:
        var(--verde);

    color:#050505;

    font-size:20px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 6px 18px
        rgba(124,252,0,.16);
}


.botao-entregar:hover{

    filter:brightness(.92);
}


/* =========================
   ENTREGUE
========================= */

.entregue-box{

    background:#111;

    border:
        1px solid #3b3b3b;

    border-radius:12px;

    padding:18px;

    margin-top:15px;
}


.status-entregue{

    color:
        var(--verde);

    font-size:22px;

    font-weight:bold;

    margin-bottom:12px;
}


.info-entrega{

    font-size:17px;

    line-height:1.7;

    color:#ddd;
}


/* =========================
   VOLTAR
========================= */

.voltar{

    width:100%;

    padding:15px;

    background:#333;

    color:#fff;

    border:0;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;
}


/* =========================
   CARREGANDO
========================= */

.carregando{

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    color:#ccc;

    font-size:17px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    header{

        min-height:90px;

        padding:
            15px 120px 15px 120px;
    }

    .logo{

        left:15px;

        width:105px;

        max-height:65px;
    }

    .titulo-header{

        font-size:21px;
    }

    .dados{

        grid-template-columns:1fr;
    }

    .opcoes{

        grid-template-columns:1fr;
    }

    .nome-detalhe{

        font-size:25px;
    }

    .numero{

        font-size:58px;
    }

    .container{

        padding:
            18px 12px 30px;
    }
}

</style>

</head>


<body>


<div
    id="telaCarregando"
    class="carregando"
>
    Verificando acesso...
</div>


<div
    id="telaPainel"
    style="display:none;"
>


<header>

    <img
        src="Colorida.png"
        class="logo"
        alt="Pratini Sports"
    >

    <div class="titulo-header">
        CENTRAL DE ENTREGA
    </div>

</header>


<div class="container">


<div
    id="eventoAtivo"
    class="evento"
>
    Carregando...
</div>


<div class="pesquisa">

    <input
        id="busca"
        type="text"

        autocomplete="off"
        onkeydown="
            if(event.key==='Enter'){
                buscarAtletas();
            }
        "
    >

    <button
        class="botao-buscar"

        BUSCAR
    </button>

</div>


<div id="resultado"></div>


<button

>
    Voltar ao Painel
</button>


</div>

<script>


const SUPABASE_URL =
    "https://kchpprimvfnwchztwlsa.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_TT9qEWZX65Xl3prYCwqMtw_t7kA7lf4";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


let usuarioLogado = null;


const eventoId =
    localStorage.getItem(
        "evento_ativo_id"
    );


const eventoNome =
    localStorage.getItem(
        "evento_ativo_nome"
    );


let atletaSelecionado = null;


/* =========================
   ACESSO
========================= */

async function verificarAcesso(){

    const {
        data: sessao
    } =
        await db.auth.getSession();


    if(
        !sessao ||
        !sessao.session
    ){

        window.location.href =
            "login.html";

        return;
    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } =
        await db
        .from("perfis")
        .select("role,nome")
        .eq("id",usuario.id)
        .single();


    if(
        error ||
        !perfil
    ){

        window.location.href =
            "login.html";

        return;
    }


    usuarioLogado = {

        id:
            usuario.id,

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email
    };


    document.getElementById(
        "eventoAtivo"
    ).innerText =
        eventoNome ||
        "Nenhum evento selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display =
        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =
        "block";
}


/* =========================
   NORMALIZAR
========================= */

function normalizar(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .trim();
}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(texto){

    return (texto || "")
        .toString()
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   DATA
========================= */

function formatarData(data){

    if(!data){
        return "Não informada";
    }


    // Caso seja YYYY-MM-DD
    const somenteData =
        data.toString().split("T")[0];


    const partes =
        somenteData.split("-");


    if(
        partes.length === 3
    ){

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );
    }


    const d =
        new Date(data);


    if(
        isNaN(d.getTime())
    ){

        return "Não informada";
    }


    return d.toLocaleDateString(
        "pt-BR",
        {
            timeZone:
                "America/Sao_Paulo"
        }
    );
}


/* =========================
   BUSCAR
========================= */

async function buscarAtletas(){

    const termo =
        document
        .getElementById("busca")
        .value
        .trim();


    const resultado =
        document
        .getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `
            <div class="card-busca">
                Nenhum evento foi selecionado.
            </div>
        `;

        return;
    }


    if(!termo){

        resultado.innerHTML = `
            <div class="card-busca">
                Digite o nome ou número de peito.
            </div>
        `;

        return;
    }


    resultado.innerHTML = `
        <div class="card-busca">
            Pesquisando...
        </div>
    `;


    const {
        data,
        error
    } =
        await db
        .from("atletas_v2")
        .select(`
            id,
            nome,
            data_nascimento,
            numero_peito,
            modalidade,
            camiseta,
            equipe,
            pelotao,
            produto_extra,
            status_kit,
            retirado_por,
            cpf_retirada,
            data_retirada,
            entregue_por,
            entregue_por_usuario,
            retirado_login
        `)
        .eq(
            "evento_id",
            eventoId
        )
        .limit(2000);


    if(error){

        resultado.innerHTML = `
            <div class="card-busca">
                Erro ao buscar atletas:
                ${escaparHTML(error.message)}
            </div>
        `;

        return;
    }


    const busca =
        normalizar(termo);


    const encontrados =
        (data || []).filter(
            atleta =>

                normalizar(
                    atleta.nome
                ).includes(busca)

                ||

                normalizar(
                    atleta.numero_peito
                ).includes(busca)
        );


    if(
        encontrados.length === 0
    ){

        resultado.innerHTML = `
            <div class="card-busca">
                Nenhum atleta encontrado.
            </div>
        `;

        return;
    }


    resultado.innerHTML = "";


    encontrados.forEach(
        atleta => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card-busca";


            card.innerHTML = `

                <div class="nome-busca">

                    ${escaparHTML(
                        atleta.nome
                    )}

                </div>

                <div class="nascimento-busca">

                    Nascimento:
                    <strong>
                        ${formatarData(
                            atleta.data_nascimento
                        )}
                    </strong>

                </div>
            `;


            card.onclick =
                function(){

                    abrirDetalhes(
                        atleta
                    );
                };


            resultado.appendChild(
                card
            );
        }
    );
}


/* =========================
   ABRIR DETALHES
========================= */

function abrirDetalhes(atleta){

    atletaSelecionado =
        atleta;


    const resultado =
        document
        .getElementById(
            "resultado"
        );


    resultado.innerHTML = `

<div class="card-detalhes">


    <div class="nome-detalhe">

        ${escaparHTML(
            atleta.nome
        )}

    </div>


    <div class="numero-box">

        <div class="numero-label">
            NÚMERO DE PEITO
        </div>

        <div class="numero">

            ${escaparHTML(
                atleta.numero_peito ||
                "—"
            )}

        </div>

    </div>


    <div class="dados">


        <div class="dado">

            <div class="dado-label">
                Data de nascimento
            </div>

            <div class="dado-valor">

                ${formatarData(
                    atleta.data_nascimento
                )}

            </div>

        </div>


        <div class="dado">

            <div class="dado-label">
                Modalidade
            </div>

            <div class="dado-valor">

                ${escaparHTML(
                    atleta.modalidade ||
                    "Não informada"
                )}

            </div>

        </div>


        <div class="dado">

            <div class="dado-label">
                Camiseta
            </div>

            <div class="dado-valor">

                ${escaparHTML(
                    atleta.camiseta ||
                    "Não informada"
                )}

            </div>

        </div>


        <div class="dado">

            <div class="dado-label">
                Equipe
            </div>

            <div class="dado-valor">

                ${escaparHTML(
                    atleta.equipe ||
                    "Não informada"
                )}

            </div>

        </div>


        <div class="dado">

            <div class="dado-label">
                Pelotão
            </div>

            <div class="dado-valor">

                ${escaparHTML(
                    atleta.pelotao ||
                    "Não informado"
                )}

            </div>

        </div>


    </div>


    <div class="produto">

        <div class="dado-label">
            Produto
        </div>

        <div class="dado-valor">

            ${escaparHTML(
                atleta.produto_extra ||
                "Nenhum produto"
            )}

        </div>

    </div>


    ${
        atleta.status_kit === "entregue"

        ?

        `

        <div class="entregue-box">

            <div class="status-entregue">
                ENTREGA REALIZADA
            </div>

            <div class="info-entrega">

                <b>Retirado por:</b>
                ${escaparHTML(
                    atleta.retirado_por ||
                    "Não informado"
                )}

                <br>

                <b>Atendente:</b>
                ${escaparHTML(
                    atleta.entregue_por ||
                    atleta.retirado_login ||
                    "Não informado"
                )}

                <br>

                <b>Data e horário:</b>
                ${
                    atleta.data_retirada
                    ?
                    new Date(
                        atleta.data_retirada
                    ).toLocaleString(
                        "pt-BR",
                        {
                            timeZone:
                                "America/Sao_Paulo"
                        }
                    )
                    :
                    "Não informado"
                }

            </div>

        </div>

        `

        :

        `

        <div class="retirada">

            <div class="retirada-titulo">
                Quem está retirando?
            </div>


            <div class="opcoes">


                <label
                    class="opcao ativo"
                    id="opcaoProprio"
                    onclick="selecionarTipo('proprio')"
                >

                    <input
                        type="radio"
                        name="tipoRetirada"
                        value="proprio"
                        checked
                    >

                    Próprio atleta

                </label>


                <label
                    class="opcao"
                    id="opcaoTerceiro"
                    onclick="selecionarTipo('terceiro')"
                >

                    <input
                        type="radio"
                        name="tipoRetirada"
                        value="terceiro"
                    >

                    Terceiro

                </label>


            </div>


            <div
                id="campoTerceiro"
                class="campo-terceiro"
            >

                <label>
                    Nome de quem está retirando
                </label>

                <input
                    id="nomeTerceiro"
                    type="text"
                    placeholder="Digite o nome da pessoa"
                >

            </div>


            <div class="observacao">

                <label>
                    Observação
                </label>

                <textarea
                    id="observacao"
                    placeholder="Ex.: mãe do atleta, pai, esposa, amigo..."
                ></textarea>

            </div>


            <button
                class="botao-entregar"
                onclick="entregarAtleta()"
            >
                ENTREGAR
            </button>

        </div>

        `
    }


</div>

`;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =========================
   TIPO RETIRADA
========================= */

function selecionarTipo(tipo){

    const proprio =
        document.getElementById(
            "opcaoProprio"
        );

    const terceiro =
        document.getElementById(
            "opcaoTerceiro"
        );

    const campo =
        document.getElementById(
            "campoTerceiro"
        );


    if(tipo === "proprio"){

        proprio.classList.add(
            "ativo"
        );

        terceiro.classList.remove(
            "ativo"
        );

        campo.style.display =
            "none";

    }else{

        terceiro.classList.add(
            "ativo"
        );

        proprio.classList.remove(
            "ativo"
        );

        campo.style.display =
            "block";
    }
}


/* =========================
   ENTREGAR
========================= */

async function entregarAtleta(){

    if(!atletaSelecionado){

        return;
    }


    const tipoSelecionado =
        document.querySelector(
            'input[name="tipoRetirada"]:checked'
        );


    if(!tipoSelecionado){

        Swal.fire({

            title:"Atenção",

            text:
                "Selecione quem está retirando.",

            icon:"warning",

            background:"#111",

            color:"#fff",

            confirmButtonColor:
                "#7CFC00"
        });

        return;
    }


    const tipo =
        tipoSelecionado.value;


    let retiradoPor =
        "Retirado pelo próprio atleta";


    if(
        tipo === "terceiro"
    ){

        const nomeTerceiro =
            document
            .getElementById(
                "nomeTerceiro"
            )
            .value
            .trim();


        if(!nomeTerceiro){

            Swal.fire({

                title:"Atenção",

                text:
                    "Informe o nome de quem está retirando.",

                icon:"warning",

                background:"#111",

                color:"#fff",

                confirmButtonColor:
                    "#7CFC00"
            });

            return;
        }


        retiradoPor =
            nomeTerceiro;
    }


    const observacao =
        document
        .getElementById(
            "observacao"
        )
        .value
        .trim();


    const confirmar =
        await Swal.fire({

            title:
                "Confirmar entrega",

            html:
                `
                <div style="font-size:17px;line-height:1.6">

                <b>
                ${escaparHTML(
                    atletaSelecionado.nome
                )}
                </b>

                <br>

                Número:
                <b>
                ${escaparHTML(
                    atletaSelecionado.numero_peito ||
                    "—"
                )}
                </b>

                <br><br>

                Retirado por:
                <b>
                ${escaparHTML(
                    retiradoPor
                )}
                </b>

                </div>
                `,

            icon:
                "question",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#444",

            confirmButtonText:
                "CONFIRMAR ENTREGA",

            cancelButtonText:
                "CANCELAR",

            reverseButtons:true
        });


    if(
        !confirmar.isConfirmed
    ){

        return;
    }


    /*
       PRIMEIRA PROTEÇÃO:
       verifica novamente no banco
       antes de entregar.
    */

    const {
        data: verificacao,
        error: erroVerificacao
    } =
        await db
        .from("atletas_v2")
        .select(
            "id,status_kit"
        )
        .eq(
            "id",
            atletaSelecionado.id
        )
        .single();


    if(erroVerificacao){

        Swal.fire({

            title:"Erro",

            text:
                erroVerificacao.message,

            icon:"error",

            background:"#111",

            color:"#fff",

            confirmButtonColor:
                "#7CFC00"
        });

        return;
    }


    if(
        verificacao.status_kit ===
        "entregue"
    ){

        Swal.fire({

            title:
                "ENTREGA JÁ REALIZADA",

            text:
                "Este atleta já possui uma entrega registrada.",

            icon:
                "warning",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"
        });

        buscarAtletas();

        return;
    }


    /*
       REGISTRA A ENTREGA
    */

    const agora =
        new Date().toISOString();


    const {
        error
    } =
        await db
        .from("atletas_v2")
        .update({

            status_kit:
                "entregue",

            retirado_por:
                retiradoPor,

            cpf_retirada:
                null,

            data_retirada:
                agora,

            entregue_por:
                usuarioLogado
                ? usuarioLogado.nome
                : "Desconhecido",

            entregue_por_usuario:
                usuarioLogado
                ? usuarioLogado.email
                : "Desconhecido",

            retirado_login:
                usuarioLogado
                ? usuarioLogado.email
                : "Desconhecido"

        })
        .eq(
            "id",
            atletaSelecionado.id
        )
        .eq(
            "status_kit",
            "pendente"
        );


    if(error){

        Swal.fire({

            title:
                "Erro na entrega",

            text:
                error.message,

            icon:
                "error",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"
        });

        return;
    }


    /*
       GRAVA HISTÓRICO
    */

    const {
        error:
            erroHistorico
    } =
        await db
        .from("entregas")
        .insert([{

            atleta_id:
                atletaSelecionado.id,

            usuario_id:
                usuarioLogado
                ? usuarioLogado.id
                : null,

            retirado_por:
                retiradoPor,

            cpf_retirada:
                null,

            tipo_retirada:
                tipo,

            observacao:
                observacao || null,

            entregue_em:
                agora
        }]);


    if(
        erroHistorico
    ){

        console.error(
            "Erro no histórico:",
            erroHistorico
        );
    }


    /*
       AUDITORIA
    */

    await db
    .from("auditoria_v2")
    .insert([{

        evento_id:
            eventoId,

        usuario:
            usuarioLogado
            ? usuarioLogado.nome
            : "Desconhecido",

        acao:
            "Entrega",

        detalhe:
            `Atleta: ${atletaSelecionado.nome} | Número: ${atletaSelecionado.numero_peito || "N/I"} | Retirado por: ${retiradoPor} | Tipo: ${tipo} | Observação: ${observacao || "Nenhuma"}`
    }]);


    await Swal.fire({

        title:
            "ENTREGA REALIZADA!",

        html:
            `
            <div style="font-size:18px;line-height:1.6">

            <b>
            ${escaparHTML(
                atletaSelecionado.nome
            )}
            </b>

            <br>

            Número:
            <b>
            ${escaparHTML(
                atletaSelecionado.numero_peito ||
                "—"
            )}
            </b>

            <br><br>

            ${escaparHTML(
                retiradoPor
            )}

            </div>
            `,

        icon:
            "success",

        background:
            "#111",

        color:
            "#fff",

        confirmButtonColor:
            "#7CFC00",

        confirmButtonText:
            "OK"
    });


    buscarAtletas();
}


/* =========================
   INICIAR
========================= */

verificarAcesso();

</script>

</body>

</html>
