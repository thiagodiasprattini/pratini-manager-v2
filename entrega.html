<script>

/* ==========================================================
   VARIÁVEIS
========================================================== */

let usuarioLogado = null;

const eventoId =
    localStorage.getItem(
        "evento_ativo_id"
    );

const eventoNome =
    localStorage.getItem(
        "evento_ativo_nome"
    );


/* ==========================================================
   ACESSO
========================================================== */

async function verificarAcesso(){

    try{

        const {
            data,
            error
        } =
            await db.auth.getSession();


        if(
            error ||
            !data ||
            !data.session
        ){

            window.location.href =
                "login.html";

            return;

        }


        const usuario =
            data.session.user;


        const {
            data: perfil,
            error: perfilError
        } =
            await db

                .from("perfis")

                .select(
                    "role,nome"
                )

                .eq(
                    "id",
                    usuario.id
                )

                .single();


        if(
            perfilError ||
            !perfil
        ){

            window.location.href =
                "index.html";

            return;

        }


        usuarioLogado = {

            id:
                usuario.id,

            nome:
                perfil.nome ||
                usuario.email,

            email:
                usuario.email

        };


        document
            .getElementById(
                "eventoAtivo"
            )
            .textContent =
                eventoNome ||
                "Nenhum evento selecionado";


        document
            .getElementById(
                "telaCarregando"
            )
            .style.display =
                "none";


        document
            .getElementById(
                "telaPainel"
            )
            .style.display =
                "block";


        document
            .getElementById(
                "busca"
            )
            .addEventListener(
                "keydown",
                function(e){

                    if(
                        e.key ===
                        "Enter"
                    ){

                        buscarAtletas();

                    }

                }
            );


    }catch(error){

        console.error(error);

        window.location.href =
            "login.html";

    }

}


/* ==========================================================
   NORMALIZAÇÃO
========================================================== */

function normalizar(valor){

    return String(
        valor || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim();

}


/* ==========================================================
   SEGURANÇA HTML
========================================================== */

function escapar(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================================
   NASCIMENTO
========================================================== */

function formatarNascimento(data){

    if(!data){

        return "Não informado";

    }


    const partes =
        String(data)
        .split("-");


    if(
        partes.length === 3
    ){

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }


    return data;

}


/* ==========================================================
   DATA/HORA
========================================================== */

function formatarDataHora(data){

    if(!data){

        return "Não informada";

    }


    try{

        return new Date(data)
            .toLocaleString(
                "pt-BR",
                {
                    timeZone:
                        "America/Sao_Paulo"
                }
            );

    }catch(e){

        return data;

    }

}


/* ==========================================================
   PESQUISA
========================================================== */

async function buscarAtletas(){

    const campo =
        document.getElementById(
            "busca"
        );


    const resultado =
        document.getElementById(
            "resultado"
        );


    const termo =
        campo.value.trim();


    if(!eventoId){

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    Nenhum evento ativo foi selecionado.

                </div>

            </div>

        `;

        return;

    }


    if(!termo){

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    Digite o nome ou número de peito.

                </div>

            </div>

        `;

        return;

    }


    resultado.innerHTML = `

        <div class="card">

            <div class="spinner"></div>

            <div class="mensagem">
                Pesquisando...
            </div>

        </div>

    `;


    /* ======================================================
       BUSCA SOMENTE OS DADOS NECESSÁRIOS
    ====================================================== */

    const {
        data,
        error
    } =
        await db

            .from("atletas_v2")

            .select(`
                id,
                evento_id,
                nome,
                numero_peito,
                data_nascimento,
                modalidade,
                camiseta,
                pelotao,
                produto_extra,
                status_kit,
                retirado_por,
                data_retirada,
                entregue_por,
                entregue_por_usuario,
                retirado_login
            `)

            .eq(
                "evento_id",
                eventoId
            )

            .limit(1000);


    if(error){

        console.error(error);

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    Não foi possível realizar a pesquisa.

                    <br><br>

                    ${escapar(
                        error.message
                    )}

                </div>

            </div>

        `;

        return;

    }


    const busca =
        normalizar(termo);


    const encontrados =
        (data || [])
        .filter(atleta => {

            const nome =
                normalizar(
                    atleta.nome
                );


            const numero =
                normalizar(
                    atleta.numero_peito
                );


            return (

                nome.includes(
                    busca
                )

                ||

                numero ===
                    busca

            );

        });


    if(
        encontrados.length ===
        0
    ){

        resultado.innerHTML = `

            <div class="card">

                <div class="mensagem">

                    Nenhum atleta encontrado.

                    <br><br>

                    Confira o nome ou número de peito.

                </div>

            </div>

        `;

        return;

    }


    resultado.innerHTML = "";


    encontrados.forEach(
        atleta => {

            resultado.innerHTML +=
                criarAtleta(
                    atleta
                );

        }
    );

}


/* ==========================================================
   CARD DO ATLETA
========================================================== */

function criarAtleta(atleta){

    const entregue =
        atleta.status_kit ===
        "entregue";


    const id =
        escapar(
            atleta.id
        );


    const nome =
        escapar(
            atleta.nome
        );


    const numero =
        escapar(
            atleta.numero_peito ||
            "Não informado"
        );


    const nascimento =
        escapar(
            formatarNascimento(
                atleta.data_nascimento
            )
        );


    const modalidade =
        escapar(
            atleta.modalidade ||
            "Não informada"
        );


    const camiseta =
        escapar(
            atleta.camiseta ||
            "Não informada"
        );


    const pelotao =
        escapar(
            atleta.pelotao ||
            "Não informado"
        );


    const produto =
        escapar(
            atleta.produto_extra ||
            "Nenhum"
        );


    let html = `

        <section
            class="atleta
            ${entregue
                ? "entregue"
                : "pendente"
            }"
        >

            <div class="status
                ${entregue
                    ? "status-entregue"
                    : "status-pendente"
                }"
            >

                ${
                    entregue
                    ? "✓ ENTREGA REALIZADA"
                    : "ENTREGA PENDENTE"
                }

            </div>


            <h2 class="nome-atleta">

                ${nome}

            </h2>


            <div class="dados">


                <div class="dado">

                    <span class="dado-label">
                        Número de peito
                    </span>

                    <span class="dado-valor">
                        ${numero}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Data de nascimento
                    </span>

                    <span class="dado-valor">
                        ${nascimento}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Modalidade
                    </span>

                    <span class="dado-valor">
                        ${modalidade}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Camiseta
                    </span>

                    <span class="dado-valor">
                        ${camiseta}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Pelotão
                    </span>

                    <span class="dado-valor">
                        ${pelotao}
                    </span>

                </div>


            </div>


            <div class="produtos">

                <span class="produtos-label">
                    Produtos
                </span>

                <span class="produtos-valor">
                    ${produto}
                </span>

            </div>

    `;


    /* ======================================================
       ENTREGA JÁ REALIZADA
    ====================================================== */

    if(entregue){

        html += `

            <div class="entrega-realizada">

                <div class="entrega-titulo">

                    ✓ ENTREGA JÁ REALIZADA

                </div>


                <div class="entrega-info">

                    <strong>
                        Retirado por:
                    </strong>

                    ${escapar(
                        atleta.retirado_por ||
                        "Não informado"
                    )}

                </div>


                <div class="entrega-info">

                    <strong>
                        Atendente:
                    </strong>

                    ${escapar(
                        atleta.entregue_por ||
                        atleta.retirado_login ||
                        "Não informado"
                    )}

                </div>


                <div class="entrega-info">

                    <strong>
                        Data e horário:
                    </strong>

                    ${escapar(
                        formatarDataHora(
                            atleta.data_retirada
                        )
                    )}

                </div>

            </div>

        `;

    }


    /* ======================================================
       ENTREGA PENDENTE
    ====================================================== */

    else{

        html += `

            <div class="retirada">

                <div class="retirada-titulo">

                    Quem está retirando?

                </div>


                <div class="opcoes">


                    <label
                        id="opcao-proprio-${id}"
                        class="opcao"
                        onclick="
                            selecionarRetirada(
                                '${id}',
                                'PROPRIO_ATLETA'
                            )
                        "
                    >

                        <input
                            type="radio"
                            name="retirada-${id}"
                            value="PROPRIO_ATLETA"
                        >

                        <div class="opcao-titulo">
                            Próprio atleta
                        </div>

                        <div class="opcao-desc">
                            O atleta está presente
                        </div>

                    </label>


                    <label
                        id="opcao-terceiro-${id}"
                        class="opcao"
                        onclick="
                            selecionarRetirada(
                                '${id}',
                                'TERCEIRO'
                            )
                        "
                    >

                        <input
                            type="radio"
                            name="retirada-${id}"
                            value="TERCEIRO"
                        >

                        <div class="opcao-titulo">
                            Terceiro
                        </div>

                        <div class="opcao-desc">
                            Outra pessoa está retirando
                        </div>

                    </label>


                </div>


                <div
                    id="terceiro-${id}"
                    class="campo"
                    style="display:none;"
                >

                    <label>
                        Nome de quem está retirando *
                    </label>

                    <input
                        id="nome-terceiro-${id}"
                        type="text"
                        placeholder="Nome completo"
                    >

                </div>


                <div class="campo">

                    <label>
                        Observação
                    </label>

                    <textarea
                        id="observacao-${id}"
                        placeholder="Digite uma observação, se necessário"
                    ></textarea>

                </div>


                <button
                    id="btn-entregar-${id}"
                    class="btn btn-verde"
                    onclick="
                        entregar('${id}')
                    "
                >

                    CONFIRMAR ENTREGA

                </button>

            </div>

        `;

    }


    html += `

        </section>

    `;


    return html;

}


/* ==========================================================
   SELECIONAR RETIRADA
========================================================== */

function selecionarRetirada(
    id,
    tipo
){

    const proprio =
        document.getElementById(
            "opcao-proprio-" +
            id
        );


    const terceiro =
        document.getElementById(
            "opcao-terceiro-" +
            id
        );


    const campo =
        document.getElementById(
            "terceiro-" +
            id
        );


    if(
        tipo ===
        "PROPRIO_ATLETA"
    ){

        proprio.classList.add(
            "ativa"
        );

        terceiro.classList.remove(
            "ativa"
        );

        campo.style.display =
            "none";

    }


    if(
        tipo ===
        "TERCEIRO"
    ){

        terceiro.classList.add(
            "ativa"
        );

        proprio.classList.remove(
            "ativa"
        );

        campo.style.display =
            "block";


        setTimeout(
            () => {

                const input =
                    document.getElementById(
                        "nome-terceiro-" +
                        id
                    );

                if(input){

                    input.focus();

                }

            },
            100
        );

    }

}


/* ==========================================================
   TIPO DE RETIRADA
========================================================== */

function obterTipo(id){

    const selecionado =
        document.querySelector(
            `input[name="retirada-${id}"]:checked`
        );


    return selecionado
        ? selecionado.value
        : null;

}


/* ==========================================================
   USUÁRIO
========================================================== */

async function encontrarUsuario(){

    if(
        !usuarioLogado
    ){

        return null;

    }


    const {

        data,
        error

    } =

        await db

            .from(
                "usuarios_v2"
            )

            .select(
                "id,nome,usuario,ativo"
            )

            .eq(
                "ativo",
                true
            )

            .or(
                `usuario.eq.${usuarioLogado.email},usuario.eq.${usuarioLogado.nome}`
            )

            .limit(1);


    if(
        !error &&
        data &&
        data.length
    ){

        return data[0];

    }


    return null;

}


/* ==========================================================
   REALIZAR ENTREGA
========================================================== */

async function entregar(id){

    const tipo =
        obterTipo(id);


    if(!tipo){

        await Swal.fire({

            title:
                "Selecione quem está retirando",

            text:
                "Escolha entre próprio atleta ou terceiro.",

            icon:
                "warning",

            background:
                "#1b1e21",

            color:
                "#fff",

            confirmButtonColor:
                "#ffc400"

        });

        return;

    }


    let retiradoPor = null;


    /* ======================================================
       PRÓPRIO ATLETA
    ====================================================== */

    if(
        tipo ===
        "PROPRIO_ATLETA"
    ){

        retiradoPor =
            "Retirado pelo próprio atleta";

    }


    /* ======================================================
       TERCEIRO
    ====================================================== */

    if(
        tipo ===
        "TERCEIRO"
    ){

        const campo =
            document.getElementById(
                "nome-terceiro-" +
                id
            );


        retiradoPor =
            campo
                ? campo.value.trim()
                : "";


        if(!retiradoPor){

            await Swal.fire({

                title:
                    "Informe o nome",

                text:
                    "Digite o nome da pessoa que está retirando.",

                icon:
                    "warning",

                background:
                    "#1b1e21",

                color:
                    "#fff",

                confirmButtonColor:
                    "#ffc400"

            });

            return;

        }

    }


    /* ======================================================
       OBSERVAÇÃO
    ====================================================== */

    const campoObservacao =
        document.getElementById(
            "observacao-" +
            id
        );


    const observacao =
        campoObservacao
            ? campoObservacao.value.trim()
            : null;


    /* ======================================================
       CONFIRMAÇÃO
    ====================================================== */

    const confirmacao =
        await Swal.fire({

            title:
                "Confirmar entrega?",

            html: `

                <div
                    style="
                        text-align:left;
                        line-height:1.7;
                    "
                >

                    <div>
                        <strong>Retirada:</strong>
                        ${
                            tipo ===
                            "PROPRIO_ATLETA"
                            ? "Próprio atleta"
                            : "Terceiro"
                        }
                    </div>

                    <div>
                        <strong>Retirado por:</strong>
                        ${escapar(
                            retiradoPor
                        )}
                    </div>

                    ${
                        observacao
                        ? `
                            <div>
                                <strong>Observação:</strong>
                                ${escapar(
                                    observacao
                                )}
                            </div>
                        `
                        : ""
                    }

                </div>

            `,

            icon:
                "question",

            background:
                "#1b1e21",

            color:
                "#fff",

            showCancelButton:
                true,

            confirmButtonColor:
                "#0e9f55",

            cancelButtonColor:
                "#444",

            confirmButtonText:
                "CONFIRMAR",

            cancelButtonText:
                "CANCELAR"

        });


    if(
        !confirmacao.isConfirmed
    ){

        return;

    }


    /* ======================================================
       BOTÃO
    ====================================================== */

    const botao =
        document.getElementById(
            "btn-entregar-" +
            id
        );


    if(botao){

        botao.disabled =
            true;

        botao.textContent =
            "REGISTRANDO...";

    }


    try{


        /* ==================================================
           USUÁRIO DO SISTEMA
        ================================================== */

        const usuario =
            await encontrarUsuario();


        const usuarioId =
            usuario
                ? usuario.id
                : null;


        /* ==================================================
           CHAMADA AO SUPABASE
        ================================================== */

        const {

            data,
            error

        } =

            await db.rpc(
                "registrar_entrega",
                {

                    p_atleta_id:
                        id,

                    p_usuario_id:
                        usuarioId,

                    p_tipo_retirada:
                        tipo,

                    p_retirado_por:
                        retiradoPor,

                    p_observacao:
                        observacao || null

                }
            );


        if(error){

            throw new Error(
                error.message
            );

        }


        if(!data){

            throw new Error(
                "O sistema não retornou uma confirmação."
            );

        }


        /* ==================================================
           JÁ REALIZADA
        ================================================== */

        if(
            data.sucesso ===
            false
        ){

            if(
                data.erro ===
                "ENTREGA_JA_REALIZADA"
            ){

                await Swal.fire({

                    title:
                        "Entrega já realizada",

                    html: `

                        <div
                            style="
                                text-align:left;
                                line-height:1.7;
                            "
                        >

                            <div>
                                <strong>
                                    Data:
                                </strong>

                                ${
                                    data.entregue_em
                                    ? escapar(
                                        formatarDataHora(
                                            data.entregue_em
                                        )
                                    )
                                    : "Não informada"
                                }

                            </div>


                            <div>
                                <strong>
                                    Retirado por:
                                </strong>

                                ${
                                    escapar(
                                        data.retirado_por ||
                                        "Não informado"
                                    )
                                }

                            </div>


                            <div>
                                <strong>
                                    Atendente:
                                </strong>

                                ${
                                    escapar(
                                        data.atendente ||
                                        "Não informado"
                                    )
                                }

                            </div>

                        </div>

                    `,

                    icon:
                        "warning",

                    background:
                        "#1b1e21",

                    color:
                        "#fff",

                    confirmButtonColor:
                        "#ffc400"

                });


                buscarAtletas();

                return;

            }


            throw new Error(
                data.erro ||
                "Não foi possível registrar a entrega."
            );

        }


        /* ==================================================
           SUCESSO
        ================================================== */

        await Swal.fire({

            title:
                "Entrega realizada",

            text:
                "O registro foi salvo com sucesso.",

            icon:
                "success",

            background:
                "#1b1e21",

            color:
                "#fff",

            confirmButtonColor:
                "#ffc400",

            confirmButtonText:
                "OK"

        });


        /* ==================================================
           ATUALIZA TELA
        ================================================== */

        await buscarAtletas();


    }catch(error){

        console.error(error);


        await Swal.fire({

            title:
                "Não foi possível concluir",

            text:
                error.message ||
                "Ocorreu um erro ao registrar a entrega.",

            icon:
                "error",

            background:
                "#1b1e21",

            color:
                "#fff",

            confirmButtonColor:
                "#ffc400"

        });


        if(botao){

            botao.disabled =
                false;

            botao.textContent =
                "CONFIRMAR ENTREGA";

        }

    }

}


/* ==========================================================
   INICIAR
========================================================== */

verificarAcesso();

</script>
