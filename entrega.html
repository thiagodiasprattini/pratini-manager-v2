<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS

<body>

     TELA DE CARREGAMENTO

<div id="telaCarregando" class="carregando">

<!-- =====================================================
     PAINEL
===================================================== -->

<div id="telaPainel" style="display:none;">

    <header class="topo">

        <div class="titulo-topo">
            Central de Entrega
        </div>

        <img
            src="Colorida.png"

            class="logo-topo"
        >

    </header>


    <main class="container">

        <!-- EVENTO -->

        <div class="evento">
            <div
                id="eventoAtivo"

<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;

const eventoId = localStorage.getItem("evento_ativo_id");


/* =========================================================
   VERIFICAR ACESSO
========================================================= */

async function verificarAcesso(){

    try{

        const { data: sessaoData, error: sessaoError } =
            await db.auth.getSession();

        if(
            sessaoError ||
            !sessaoData ||
            !sessaoData.session
        ){
            window.location.href = "login.html";
            return;
        }


        const usuario = sessaoData.session.user;


        const { data: perfil, error: perfilError } =
            await db
                .from("perfis")
                .select("role, nome")
                .eq("id", usuario.id)
                .single();


        if(perfilError || !perfil){

            window.location.href = "index.html";
            return;
        }


        usuarioLogado = {

            id:usuario.id,

            nome:
                perfil.nome ||
                usuario.email ||
                "Desconhecido",

            email:
                usuario.email ||
                "Desconhecido"

        };


        const eventoNome =
            localStorage.getItem("evento_ativo_nome");


        document.getElementById("eventoAtivo").textContent =
            eventoNome ||
            "Nenhum evento selecionado";


        document.getElementById("telaCarregando").style.display =
            "none";

        document.getElementById("telaPainel").style.display =
            "block";


    }catch(error){

        console.error(error);

        window.location.href = "login.html";

    }

}


/* =========================================================
   NORMALIZAÇÃO
   Corrige acentos para pesquisa.
   Ex.: André = andre
========================================================= */

function normalizar(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}


/* =========================================================
   FORMATAÇÃO DA DATA
========================================================= */

function formatarDataNascimento(data){

    if(!data){
        return "Não informada";
    }

    try{

        /*
         * Evita problemas de fuso horário.
         * Pega somente YYYY-MM-DD.
         */

        const partes =
            String(data).substring(0,10).split("-");


        if(partes.length !== 3){
            return "Não informada";
        }


        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }catch(e){

        return "Não informada";

    }

}


/* =========================================================
   ESCAPAR HTML
   Evita problemas com nomes contendo caracteres especiais.
========================================================= */

function escaparHTML(valor){

    if(valor === null || valor === undefined){
        return "";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   BUSCAR ATLETAS
========================================================= */

async function buscarAtletas(){

    const termoOriginal =
        document.getElementById("busca").value.trim();

    const resultado =
        document.getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `
            <div class="mensagem">
                Nenhum evento foi selecionado.
            </div>
        `;

        return;
    }


    if(!termoOriginal){

        resultado.innerHTML = `
            <div class="mensagem">
                Digite o nome ou número de peito.
            </div>
        `;

        return;
    }


    resultado.innerHTML = `
        <div class="mensagem">
            Pesquisando...
        </div>
    `;


    /*
     * Busca os atletas do evento.
     *
     * Não mostramos CPF, telefone ou outros
     * dados pessoais na tela.
     */

    const { data, error } = await db
        .from("atletas_v2")
        .select(`
            id,
            nome,
            data_nascimento,
            numero_peito,
            modalidade,
            camiseta,
            equipe,
            produto_extra,
            status_kit,
            retirado_por,
            cpf_retirada,
            data_retirada,
            entregue_por,
            entregue_por_usuario,
            retirado_login
        `)
        .eq("evento_id", eventoId)
        .limit(1000);


    if(error){

        console.error(error);

        resultado.innerHTML = `
            <div class="mensagem">
                Erro ao realizar a pesquisa.
                <br><br>
                ${escaparHTML(error.message)}
            </div>
        `;

        return;
    }


    const busca =
        normalizar(termoOriginal);


    const encontrados =
        (data || []).filter(atleta => {

            const nome =
                normalizar(atleta.nome);

            const numero =
                normalizar(atleta.numero_peito);


            return (
                nome.includes(busca) ||
                numero.includes(busca)
            );

        });


    if(encontrados.length === 0){

        resultado.innerHTML = `
            <div class="mensagem">
                Nenhum atleta encontrado.
            </div>
        `;

        return;
    }


    resultado.innerHTML = "";


    encontrados.forEach((atleta, index) => {

        const card = document.createElement("div");

        card.className = "card-atleta";

        card.innerHTML = `

            <div class="nome-resumo">
                ${escaparHTML(atleta.nome)}
            </div>

            <div class="nascimento-resumo">
                Nascimento:
                ${formatarDataNascimento(atleta.data_nascimento)}
            </div>

        `;


        card.addEventListener(
            "click",
            () => abrirDetalhes(atleta)
        );


        resultado.appendChild(card);

    });

}


/* =========================================================
   ABRIR DETALHES
========================================================= */

function abrirDetalhes(atleta){

    const resultado =
        document.getElementById("resultado");


    const entregue =
        atleta.status_kit === "entregue";


    const nome =
        escaparHTML(atleta.nome);


    resultado.innerHTML = `

        <div class="detalhes">

            <!-- NOME -->

            <div class="nome-detalhe">
                ${nome}
            </div>


            <!-- NÚMERO -->

            <div class="numero-detalhe">
                Nº ${escaparHTML(atleta.numero_peito || "—")}
            </div>


            <div class="divisor"></div>


            <!-- DADOS -->

            <div class="dados-grid">

                <div class="dado">

                    <div class="dado-label">
                        Data de nascimento
                    </div>

                    <div class="dado-valor">
                        ${formatarDataNascimento(
                            atleta.data_nascimento
                        )}
                    </div>

                </div>


                <div class="dado">

                    <div class="dado-label">
                        Modalidade
                    </div>

                    <div class="dado-valor">
                        ${escaparHTML(
                            atleta.modalidade || "Não informada"
                        )}
                    </div>

                </div>


                <div class="dado">

                    <div class="dado-label">
                        Camiseta
                    </div>

                    <div class="dado-valor">
                        ${escaparHTML(
                            atleta.camiseta || "Não informada"
                        )}
                    </div>

                </div>


                <div class="dado">

                    <div class="dado-label">
                        Pelotão
                    </div>

                    <div class="dado-valor">
                        ${escaparHTML(
                            atleta.equipe || "Não informado"
                        )}
                    </div>

                </div>


                <div class="dado">

                    <div class="dado-label">
                        Produtos
                    </div>

                    <div class="dado-valor">
                        ${escaparHTML(
                            atleta.produto_extra || "Nenhum"
                        )}
                    </div>

                </div>

            </div>


            ${
                entregue

                ?

                gerarHistoricoEntrega(atleta)

                :

                gerarFormularioEntrega(atleta)

            }


            <button
                class="botao-voltar"
                onclick="buscarAtletas()"
            >
                Voltar para os resultados
            </button>

        </div>

    `;

}


/* =========================================================
   FORMULÁRIO DE ENTREGA
========================================================= */

function gerarFormularioEntrega(atleta){

    return `

        <div class="status status-pendente">
            AGUARDANDO ENTREGA
        </div>


        <div class="bloco-retirada">

            <div class="titulo-retirada">
                Quem está retirando?
            </div>


            <div class="opcoes-retirada">

                <label class="opcao-retirada">

                    <input
                        type="radio"
                        name="tipoRetirada"
                        value="proprio"
                        onchange="alterarTipoRetirada()"
                    >

                    <span>
                        O próprio atleta
                    </span>

                </label>


                <label class="opcao-retirada">

                    <input
                        type="radio"
                        name="tipoRetirada"
                        value="terceiro"
                        onchange="alterarTipoRetirada()"
                    >

                    <span>
                        Terceiro
                    </span>

                </label>

            </div>


            <div id="campoTerceiro">

                <label>
                    Nome de quem está retirando
                </label>

                <input
                    id="nomeTerceiro"
                    class="input-terceiro"
                    type="text"
                    placeholder="Digite o nome completo"
                    autocomplete="off"
                >

            </div>

        </div>


        <button
            class="botao-entregar"
            onclick="entregar(
                '${atleta.id}',
                ${JSON.stringify(atleta.nome)}
            )"
        >
            ENTREGAR
        </button>

    `;

}


/* =========================================================
   ALTERAR TIPO DE RETIRADA
========================================================= */

function alterarTipoRetirada(){

    const selecionado =
        document.querySelector(
            'input[name="tipoRetirada"]:checked'
        );


    const campo =
        document.getElementById("campoTerceiro");


    if(!selecionado){

        campo.style.display = "none";

        return;
    }


    if(selecionado.value === "terceiro"){

        campo.style.display = "block";

    }else{

        campo.style.display = "none";

    }

}


/* =========================================================
   HISTÓRICO DE ENTREGA
========================================================= */

function gerarHistoricoEntrega(atleta){

    const dataEntrega =
        atleta.data_retirada
        ?
        new Date(atleta.data_retirada)
            .toLocaleString(
                "pt-BR",
                {
                    timeZone:"America/Sao_Paulo"
                }
            )
        :
        "Não informada";


    let retiradoPor =
        atleta.retirado_por ||
        "";


    /*
     * Se a estrutura antiga gravou o próprio atendente
     * no campo retirado_por, tentamos manter o histórico.
     */

    if(!retiradoPor){

        retiradoPor = "Não informado";

    }


    return `

        <div class="status status-entregue">
            ENTREGA REALIZADA
        </div>


        <div class="historico-entrega">

            <div class="historico-titulo">
                Registro da entrega
            </div>


            <div class="historico-item">
                <strong>Retirado por:</strong>
                ${escaparHTML(retiradoPor)}
            </div>


            <div class="historico-item">
                <strong>Atendente:</strong>
                ${escaparHTML(
                    atleta.entregue_por ||
                    atleta.retirado_login ||
                    atleta.entregue_por_usuario ||
                    "Não informado"
                )}
            </div>


            <div class="historico-item">
                <strong>Data e horário:</strong>
                ${escaparHTML(dataEntrega)}
            </div>

        </div>

    `;

}


/* =========================================================
   REGISTRAR ENTREGA
========================================================= */

async function entregar(id, nome){

    /*
     * Verifica quem vai retirar
     */

    const selecionado =
        document.querySelector(
            'input[name="tipoRetirada"]:checked'
        );


    if(!selecionado){

        await Swal.fire({

            title:"Atenção",

            text:"Selecione quem está retirando.",

            icon:"warning",

            background:"#101010",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    let tipoRetirada =
        selecionado.value;


    let retiradoPor = "";


    /*
     * PRÓPRIO ATLETA
     */

    if(tipoRetirada === "proprio"){

        retiradoPor =
            "Retirado pelo próprio atleta";

    }


    /*
     * TERCEIRO
     */

    if(tipoRetirada === "terceiro"){

        const campo =
            document.getElementById("nomeTerceiro");


        const nomeTerceiro =
            campo
            ?
            campo.value.trim()
            :
            "";


        if(!nomeTerceiro){

            await Swal.fire({

                title:"Informe o responsável",

                text:"Digite o nome de quem está retirando.",

                icon:"warning",

                background:"#101010",

                color:"#ffffff",

                confirmButtonColor:"#7CFC00"

            });

            return;

        }


        retiradoPor =
            nomeTerceiro;

    }


    /*
     * CONFIRMAÇÃO
     */

    const confirmar =
        await Swal.fire({

            title:"Confirmar entrega",

            html:`
                <div style="
                    font-size:18px;
                    line-height:1.5;
                ">
                    <strong>
                        ${escaparHTML(nome)}
                    </strong>
                    <br><br>
                    Retirado por:<br>
                    <strong>
                        ${escaparHTML(retiradoPor)}
                    </strong>
                </div>
            `,

            icon:"question",

            background:"#101010",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00",

            confirmButtonText:"Confirmar entrega",

            cancelButtonColor:"#444444",

            cancelButtonText:"Cancelar",

            showCancelButton:true

        });


    if(!confirmar.isConfirmed){

        return;

    }


    /*
     * EVITA DUPLA ENTREGA
     *
     * Antes de atualizar, consulta novamente
     * o registro no banco.
     */

    const {
        data: atletaAtual,
        error: erroConsulta
    } = await db
        .from("atletas_v2")
        .select("id,status_kit")
        .eq("id",id)
        .single();


    if(erroConsulta){

        await Swal.fire({

            title:"Erro",

            text:
                "Não foi possível verificar o status atual.",

            icon:"error",

            background:"#101010",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    if(atletaAtual.status_kit === "entregue"){

        await Swal.fire({

            title:"Entrega já realizada",

            text:
                "Este atleta já consta como entregue no sistema.",

            icon:"warning",

            background:"#101010",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });


        buscarAtletas();

        return;

    }


    /*
     * DATA/HORA
     */

    const agora =
        new Date().toISOString();


    /*
     * ATUALIZA ATLETA
     */

    const { error: erroAtualizacao } =
        await db
            .from("atletas_v2")
            .update({

                status_kit:"entregue",

                retirado_por:
                    retiradoPor,

                data_retirada:
                    agora,

                entregue_por:
                    usuarioLogado
                    ?
                    usuarioLogado.nome
                    :
                    "Desconhecido",

                entregue_por_usuario:
                    usuarioLogado
                    ?
                    usuarioLogado.email
                    :
                    "Desconhecido",

                retirado_login:
                    usuarioLogado
                    ?
                    usuarioLogado.email
                    :
                    "Desconhecido"

            })
            .eq("id",id)
            .eq("status_kit","pendente");


    if(erroAtualizacao){

        console.error(erroAtualizacao);


        await Swal.fire({

            title:"Erro",

            text:
                "Não foi possível registrar a entrega: " +
                erroAtualizacao.message,

            icon:"error",

            background:"#101010",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    /*
     * REGISTRA NA TABELA DE ENTREGAS
     */

    const { error: erroEntrega } =
        await db
            .from("entregas")
            .insert([{

                atleta_id:id,

                usuario_id:
                    usuarioLogado
                    ?
                    usuarioLogado.id
                    :
                    null,

                retirado_por:
                    retiradoPor,

                tipo_retirada:
                    tipoRetirada,

                observacao:
                    tipoRetirada === "proprio"
                    ?
                    "Retirado pelo próprio atleta"
                    :
                    "Retirado por terceiro: " + retiradoPor,

                entregue_em:
                    agora

            }]);


    /*
     * Se der erro na tabela de entregas,
     * não apagamos a entrega principal.
     * Apenas registramos na auditoria.
     */

    if(erroEntrega){

        console.error(
            "Erro ao registrar histórico em entregas:",
            erroEntrega
        );

    }


    /*
     * AUDITORIA
     */

    const { error: erroAuditoria } =
        await db
            .from("auditoria_v2")
            .insert([{

                evento_id:
                    eventoId,

                usuario:
                    usuarioLogado
                    ?
                    usuarioLogado.nome
                    :
                    "Desconhecido",

                acao:
                    "Entrega de inscrição",

                detalhe:
                    "Atleta: " +
                    nome +
                    " | Retirado por: " +
                    retiradoPor +
                    " | Atendente: " +
                    (
                        usuarioLogado
                        ?
                        usuarioLogado.email
                        :
                        "Desconhecido"
                    ) +
                    " | ID: " +
                    id

            }]);


    if(erroAuditoria){

        console.error(
            "Erro na auditoria:",
            erroAuditoria
        );

    }


    /*
     * SUCESSO
     */

    await Swal.fire({

        title:"Entrega confirmada!",

        html:`
            <div style="
                font-size:18px;
                line-height:1.5;
            ">
                <strong>
                    ${escaparHTML(nome)}
                </strong>
                <br><br>
                Retirado por:<br>
                <strong>
                    ${escaparHTML(retiradoPor)}
                </strong>
            </div>
        `,

        icon:"success",

        background:"#101010",

        color:"#ffffff",

        confirmButtonColor:"#7CFC00",

        confirmButtonText:"OK"

    });


    /*
     * Retorna para a pesquisa.
     */

    buscarAtletas();

}


/* =========================================================
   INICIAR
========================================================= */

verificarAcesso();

</script>
