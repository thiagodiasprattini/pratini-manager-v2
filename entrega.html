<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Central de Entrega - Pratini Sports</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

    --verde:#7CFC00;

    --verde-hover:#9CFF38;

    --grafite:#202326;

    --grafite-claro:#2b2f33;

    --preto:#050505;

    --texto:#f5f5f5;

    --cinza:#b8b8b8;

}


*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}


body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--grafite);

    color:
        var(--texto);
}


/* =========================
   CABEÇALHO
========================= */

header{

    position:relative;

    min-height:115px;

    background:#101214;

    border-bottom:
        1px solid #383c40;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        15px 200px;
}


.logo{

    position:absolute;

    right:30px;

    top:50%;

    transform:
        translateY(-50%);

    width:175px;

    max-height:95px;

    object-fit:contain;
}


.titulo-header{

    font-size:26px;

    font-weight:700;

    letter-spacing:.5px;

    text-align:center;

    color:#fff;
}


/* =========================
   CONTAINER
========================= */

.container{

    max-width:950px;

    margin:auto;

    padding:25px 20px 40px;
}


/* =========================
   EVENTO
========================= */

.evento{

    text-align:center;

    margin-bottom:20px;

    color:#fff;

    font-size:23px;

    font-weight:bold;
}


/* =========================
   PESQUISA
========================= */

.pesquisa{

    background:#111;

    border:
        1px solid #3a3e42;

    border-radius:15px;

    padding:20px;

    margin-bottom:22px;
}


.pesquisa input{

    width:100%;

    padding:16px 18px;

    background:#202326;

    color:#fff;

    border:
        1px solid #444;

    border-radius:10px;

    font-size:18px;

    outline:none;
}


.pesquisa input:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 2px
        rgba(124,252,0,.10);
}


.botao-buscar{

    width:100%;

    margin-top:10px;

    padding:15px;

    border:0;

    border-radius:10px;

    background:
        var(--verde);

    color:#050505;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;
}


.botao-buscar:hover{

    background:
        var(--verde-hover);
}


/* =========================
   RESULTADOS
========================= */

#resultado{
    width:100%;
}


.card-busca{

    background:#080808;

    border:
        1px solid #3d4145;

    border-left:
        4px solid var(--verde);

    border-radius:12px;

    padding:18px 20px;

    margin-bottom:12px;

    cursor:pointer;

    transition:
        .18s ease;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.25);
}


.card-busca:hover{

    border-color:
        var(--verde);

    transform:
        translateY(-1px);

    box-shadow:
        0 7px 22px
        rgba(124,252,0,.12);
}


.nome-busca{

    font-size:21px;

    font-weight:bold;

    color:#fff;

    margin-bottom:8px;
}


.nascimento-busca{

    color:#bdbdbd;

    font-size:16px;
}


.nascimento-busca strong{

    color:#fff;
}


/* =========================
   CARD DETALHES
========================= */

.card-detalhes{

    background:#050505;

    border:
        1px solid #4a4f54;

    border-radius:18px;

    padding:25px;

    margin-bottom:25px;

    box-shadow:

        0 0 0 1px
        rgba(124,252,0,.10),

        0 12px 35px
        rgba(0,0,0,.40);
}


/* =========================
   NOME
========================= */

.nome-detalhe{

    text-align:center;

    font-size:30px;

    line-height:1.15;

    font-weight:800;

    color:#fff;

    margin:
        0 0 20px;

    word-break:normal;
}


/* =========================
   NÚMERO DE PEITO
========================= */

.numero-box{

    text-align:center;

    padding:
        20px 15px 24px;

    margin-bottom:22px;

    background:#111;

    border:
        1px solid #383838;

    border-radius:14px;
}


.numero-label{

    font-size:15px;

    font-weight:bold;

    letter-spacing:2px;

    color:#aaa;

    margin-bottom:5px;
}


.numero{

    font-size:68px;

    line-height:1;

    font-weight:900;

    color:#fff;

    text-shadow:
        0 0 12px
        rgba(255,255,255,.18);
}


/* =========================
   DADOS DO ATLETA
========================= */

.dados{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-bottom:20px;
}


.dado{

    background:#111;

    border:
        1px solid #303438;

    border-radius:11px;

    padding:14px;

    min-width:0;
}


.dado-label{

    color:#969696;

    font-size:13px;

    text-transform:uppercase;

    font-weight:bold;

    letter-spacing:.5px;

    margin-bottom:6px;
}


.dado-valor{

    color:#fff;

    font-size:19px;

    font-weight:600;

    word-break:break-word;
}


/* =========================
   ORGANIZAÇÃO DOS CAMPOS
========================= */

.dado-nascimento{
    grid-column:1;
    grid-row:1;
}


.dado-sexo{
    grid-column:2;
    grid-row:1;
}


.dado-modalidade{
    grid-column:1;
    grid-row:2;
}


.dado-camiseta{
    grid-column:2;
    grid-row:2;
}


.dado-equipe{
    grid-column:1;
    grid-row:3;
}


.dado-pelotao{
    grid-column:2;
    grid-row:3;
}


/* =========================
   PRODUTO
========================= */

.produto{

    grid-column:1 / 3;

    grid-row:4;

    background:#111;

    border:
        1px solid #303438;

    border-radius:11px;

    padding:15px;

    margin:0;

    min-width:0;
}


.produto .dado-valor{

    font-size:19px;
}


/* =========================
   BOTÃO EDITAR
========================= */

.area-edicao{

    margin-top:10px;

    margin-bottom:20px;

    padding-top:18px;

    border-top:
        1px solid #343434;
}


.botao-editar{

    width:100%;

    border:
        1px solid #555;

    border-radius:10px;

    padding:15px;

    background:#222;

    color:#fff;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}


.botao-editar:hover{

    background:#303030;

    border-color:
        var(--verde);

    color:
        var(--verde);
}


/* =========================
   FORMULÁRIO DE EDIÇÃO
========================= */

.edicao-box{

    display:none;

    background:#111;

    border:
        1px solid #3b3f43;

    border-radius:13px;

    padding:18px;

    margin-top:12px;
}


.edicao-titulo{

    font-size:19px;

    font-weight:bold;

    margin-bottom:15px;

    color:#fff;
}


.edicao-campo{

    margin-bottom:14px;
}


.edicao-campo label{

    display:block;

    color:#aaa;

    font-size:13px;

    text-transform:uppercase;

    font-weight:bold;

    margin-bottom:7px;
}


.edicao-campo input,
.edicao-campo select{

    width:100%;

    padding:14px;

    background:#202326;

    color:#fff;

    border:
        1px solid #444;

    border-radius:9px;

    font-size:17px;

    outline:none;
}


.edicao-campo input:focus,
.edicao-campo select:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 2px
        rgba(124,252,0,.08);
}


.edicao-botoes{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:15px;
}


.botao-salvar-edicao{

    border:0;

    border-radius:9px;

    padding:14px;

    background:
        var(--verde);

    color:#050505;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}


.botao-cancelar-edicao{

    border:
        1px solid #444;

    border-radius:9px;

    padding:14px;

    background:#222;

    color:#fff;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================
   RETIRADA
========================= */

.retirada{

    border-top:
        1px solid #343434;

    padding-top:20px;

    margin-top:15px;
}


.retirada-titulo{

    font-size:20px;

    font-weight:bold;

    margin-bottom:12px;
}


.opcoes{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:10px;

    margin-bottom:15px;
}


.opcao{

    background:#151515;

    border:
        1px solid #3a3a3a;

    border-radius:10px;

    padding:15px;

    cursor:pointer;

    font-size:17px;

    text-align:center;

    transition:.15s;
}


.opcao.ativo{

    border-color:
        var(--verde);

    background:
        rgba(124,252,0,.08);

    color:
        var(--verde);
}


.opcao input{

    display:none;
}


.campo-terceiro{

    display:none;

    margin-bottom:15px;
}


.campo-terceiro label{

    display:block;

    font-size:15px;

    font-weight:bold;

    margin-bottom:6px;

    color:#ccc;
}


.campo-terceiro input{

    width:100%;

    padding:14px;

    background:#202326;

    border:
        1px solid #444;

    border-radius:9px;

    color:#fff;

    font-size:17px;
}


.observacao{

    margin-bottom:15px;
}


.observacao label{

    display:block;

    font-size:15px;

    font-weight:bold;

    margin-bottom:6px;

    color:#ccc;
}


.observacao textarea{

    width:100%;

    min-height:80px;

    resize:vertical;

    background:#202326;

    color:#fff;

    border:
        1px solid #444;

    border-radius:9px;

    padding:14px;

    font-family:Arial;

    font-size:16px;
}


/* =========================
   BOTÃO ENTREGAR
========================= */

.botao-entregar{

    width:100%;

    border:0;

    border-radius:11px;

    padding:17px;

    margin-top:8px;

    background:
        var(--verde);

    color:#050505;

    font-size:20px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 6px 18px
        rgba(124,252,0,.16);
}


.botao-entregar:hover{

    filter:brightness(.92);
}


/* =========================
   ENTREGUE
========================= */

.entregue-box{

    background:#111;

    border:
        1px solid #3b3b3b;

    border-radius:12px;

    padding:18px;

    margin-top:15px;
}


.status-entregue{

    color:
        var(--verde);

    font-size:22px;

    font-weight:bold;

    margin-bottom:12px;
}


.info-entrega{

    font-size:17px;

    line-height:1.7;

    color:#ddd;
}


/* =========================
   VOLTAR
========================= */

.voltar{

    width:100%;

    padding:15px;

    background:#333;

    color:#fff;

    border:0;

    border-radius:10px;

    font-size:17px;

    cursor:pointer;
}


/* =========================
   CARREGANDO
========================= */

.carregando{

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

    color:#ccc;

    font-size:17px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    header{

        min-height:90px;

        padding:
            15px 120px 15px 20px;
    }


    .logo{

        right:15px;

        width:115px;

        max-height:65px;
    }


    .titulo-header{

        font-size:21px;
    }


    .dados{

        grid-template-columns:1fr;

        gap:10px;
    }


    .dado-nascimento,
    .dado-sexo,
    .dado-modalidade,
    .dado-camiseta,
    .dado-equipe,

    .produto{

        grid-column:1;

        grid-row:auto;
    }


    .dado-nascimento{

    }


    .dado-sexo{
        order:2;
    }


    .dado-modalidade{
        order:3;
    }


    .dado-camiseta{
        order:4;
    }


    .dado-equipe{
        order:5;
    }


    .dado-pelotao{
        order:6;
    }

        order:7;
    }


    .opcoes{

        grid-template-columns:1fr;
    }


    .nome-detalhe{

        font-size:25px;
    }


    .numero{

        font-size:58px;
    }


    .container{

        padding:
            18px 12px 30px;
    }


    .edicao-botoes{

        grid-template-columns:1fr;
    }
}

</style>

</head>


<body>


<div
    id="telaCarregando"
    class="carregando"
>
    Verificando acesso...
</div>


<div
    id="telaPainel"
    style="display:none;"
>


<header>

    <div class="titulo-header">
        CENTRAL DE ENTREGA
    </div>

    <img
        src="Colorida.png"
        class="logo"
        alt="Pratini Sports"
    >

</header>


<div class="container">


<div
    id="eventoAtivo"
    class="evento"
>
    Carregando...
</div>


<div class="pesquisa">

    <input
        id="busca"
        type="text"
        placeholder="Digite o nome ou número de peito"
        autocomplete="off"
        onkeydown="
            if(event.key==='Enter'){
                buscarAtletas();
            }
        "
    >

    <button
        class="botao-buscar"
        onclick="buscarAtletas()"
    >
        BUSCAR
    </button>

</div>


<div id="resultado"></div>


<button
    class="voltar"
    onclick="location.href='dashboard.html'"
>
    Voltar ao Painel
</button>


</div>

</div>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://kchpprimvfnwchztwlsa.supabase.co";


const SUPABASE_ANON_KEY =
    "sb_publishable_TT9qEWZX65Xl3prYCwqMtw_t7kA7lf4";


const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =========================
   VARIÁVEIS
========================= */

let usuarioLogado = null;


const eventoId =
    localStorage.getItem(
        "evento_ativo_id"
    );


const eventoNome =
    localStorage.getItem(
        "evento_ativo_nome"
    );


let atletaSelecionado = null;


/* =========================
   ACESSO
========================= */

async function verificarAcesso(){

    const {
        data: sessao
    } =
        await db.auth.getSession();


    if(
        !sessao ||
        !sessao.session
    ){

        window.location.href =
            "login.html";

        return;
    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } =
        await db
        .from("perfis")
        .select("role,nome")
        .eq(
            "id",
            usuario.id
        )
        .single();


    if(
        error ||
        !perfil
    ){

        window.location.href =
            "login.html";

        return;
    }


    usuarioLogado = {

        id:
            usuario.id,

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email
    };


    document.getElementById(
        "eventoAtivo"
    ).innerText =
        eventoNome ||
        "Nenhum evento selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display =
        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =
        "block";
}


/* =========================
   NORMALIZAR
========================= */

function normalizar(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .trim();
}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(texto){

    return (texto || "")
        .toString()
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* =========================
   DATA - EXIBIÇÃO
========================= */

function formatarData(data){

    if(!data){

        return "Não informada";
    }


    const somenteData =
        data.toString().split("T")[0];


    const partes =
        somenteData.split("-");


    if(
        partes.length === 3
    ){

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );
    }


    const d =
        new Date(data);


    if(
        isNaN(d.getTime())
    ){

        return "Não informada";
    }


    return d.toLocaleDateString(
        "pt-BR",
        {
            timeZone:
                "America/Sao_Paulo"
        }
    );
}


/* =========================
   DATA - PARA EDIÇÃO
========================= */

function dataParaInput(data){

    if(!data){

        return "";
    }


    const somenteData =
        data.toString().split("T")[0];


    const partes =
        somenteData.split("-");


    if(
        partes.length === 3
    ){

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );
    }


    return "";
}


/* =========================
   DATA - VALIDAR
========================= */

function validarDataBrasileira(valor){

    const regex =
        /^(\d{2})\/(\d{2})\/(\d{4})$/;


    const resultado =
        valor.match(regex);


    if(!resultado){

        return false;
    }


    const dia =
        parseInt(
            resultado[1],
            10
        );


    const mes =
        parseInt(
            resultado[2],
            10
        );


    const ano =
        parseInt(
            resultado[3],
            10
        );


    if(
        mes < 1 ||
        mes > 12
    ){

        return false;
    }


    const data =
        new Date(
            ano,
            mes - 1,
            dia
        );


    if(
        data.getFullYear() !== ano ||
        data.getMonth() !== mes - 1 ||
        data.getDate() !== dia
    ){

        return false;
    }


    return true;
}


/* =========================
   DATA - CONVERTER PARA BANCO
========================= */

function converterDataParaBanco(valor){

    const partes =
        valor.split("/");


    return (
        partes[2] +
        "-" +
        partes[1] +
        "-" +
        partes[0]
    );
}


/* =========================
   BUSCAR
========================= */

async function buscarAtletas(){

    const termo =
        document
        .getElementById("busca")
        .value
        .trim();


    const resultado =
        document
        .getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `
            <div class="card-busca">
                Nenhum evento foi selecionado.
            </div>
        `;

        return;
    }


    if(!termo){

        resultado.innerHTML = `
            <div class="card-busca">
                Digite o nome ou número de peito.
            </div>
        `;

        return;
    }


    resultado.innerHTML = `
        <div class="card-busca">
            Pesquisando...
        </div>
    `;


    const {
        data,
        error
    } =
        await db
        .from("atletas_v2")
        .select(`
            id,
            nome,
            cpf,
            data_nascimento,
            numero_peito,
            modalidade,
            sexo,
            camiseta,
            equipe,
            pelotao,
            produto_extra,
            observacao,
            status_kit,
            retirado_por,
            cpf_retirada,
            data_retirada,
            entregue_por,
            entregue_por_usuario,
            retirado_login
        `)
        .eq(
            "evento_id",
            eventoId
        )
        .limit(2000);


    if(error){

        resultado.innerHTML = `
            <div class="card-busca">
                Erro ao buscar atletas:
                ${escaparHTML(
                    error.message
                )}
            </div>
        `;

        return;
    }


    const busca =
        normalizar(termo);


    const encontrados =
        (data || []).filter(
            atleta =>

                normalizar(
                    atleta.nome
                ).includes(busca)

                ||

                normalizar(
                    atleta.numero_peito
                ).includes(busca)

                ||

                normalizar(
                    atleta.cpf
                ).includes(busca)
        );


    if(
        encontrados.length === 0
    ){

        resultado.innerHTML = `
            <div class="card-busca">
                Nenhum atleta encontrado.
            </div>
        `;

        return;
    }


    resultado.innerHTML = "";


    encontrados.forEach(
        atleta => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card-busca";


            card.innerHTML = `

                <div class="nome-busca">

                    ${escaparHTML(
                        atleta.nome
                    )}

                </div>

                <div class="nascimento-busca">

                    Nº de peito:

                    <strong>
                        ${escaparHTML(
                            atleta.numero_peito ||
                            "Não informado"
                        )}
                    </strong>

                    &nbsp;&nbsp; | &nbsp;&nbsp;

                    Nascimento:

                    <strong>
                        ${formatarData(
                            atleta.data_nascimento

                </div>
            `;


            card.onclick =
                function(){

                };


            resultado.appendChild(

        }
    );
}

/* =========================
   MÁSCARA DATA
========================= */

function aplicarMascaraData(event){

    let valor =
        event.target.value
        .replace(
            /\D/g,
            ""
        );


    if(valor.length > 8){

        valor =
            valor.substring(
                0,
                8
            );
    }


    if(valor.length >= 5){

        valor =
            valor.substring(0,2)
            + "/"
            + valor.substring(2,4)
            + "/"
            + valor.substring(4);

    }

    else if(valor.length >= 3){

        valor =
            valor.substring(0,2)
            + "/"
            + valor.substring(2);
    }


    event.target.value =
        valor;
}

/* =========================
   SALVAR EDIÇÃO
========================= */

async function salvarEdicao(){

    if(!atletaSelecionado){

        return;
    }


    const campoData =
        document.getElementById(
            "edicaoDataNascimento"
        );


    const campoSexo =
        document.getElementById(
            "edicaoSexo"
        );


    if(!campoData || !campoSexo){

        return;
    }


    const dataDigitada =
        campoData.value.trim();


    const sexo =
        campoSexo.value;


    /* =========================
       VALIDAR DATA
    ========================== */

    if(dataDigitada){

        if(
            !validarDataBrasileira(
                dataDigitada
            )
        ){

            Swal.fire({

                title:
                    "Data inválida",

                text:
                    "Digite a data no formato DD/MM/AAAA.",

                icon:
                    "warning",

                background:
                    "#111",

                color:
                    "#fff",

                confirmButtonColor:
                    "#7CFC00"

            });

            return;
        }
    }


    const novaData =
        dataDigitada
        ? converterDataParaBanco(
            dataDigitada
        )
        : null;


    const dataAnterior =
        atletaSelecionado.data_nascimento
        ? formatarData(
            atletaSelecionado.data_nascimento
        )
        : "Não informada";


    const sexoAnterior =
        atletaSelecionado.sexo ||
        "Não informado";


    const novaDataTexto =
        novaData
        ? formatarData(
            novaData
        )
        : "Não informada";


    const novoSexo =
        sexo ||
        "Não informado";


    /* =========================
       CONFIRMAÇÃO
    ========================== */

    const confirmar =
        await Swal.fire({

            title:
                "Salvar correção?",

            html:
                `

                <div style="
                    font-size:16px;
                    line-height:1.7;
                    text-align:left;
                ">

                    <b>Atleta:</b>
                    ${escaparHTML(
                        atletaSelecionado.nome
                    )}

                    <br><br>

                    <b>Data de nascimento:</b><br>

                    ${escaparHTML(
                        dataAnterior
                    )}

                    &nbsp;→&nbsp;

                    <strong>
                        ${escaparHTML(
                            novaDataTexto
                        )}
                    </strong>

                    <br><br>

                    <b>Sexo:</b><br>

                    ${escaparHTML(
                        sexoAnterior
                    )}

                    &nbsp;→&nbsp;

                    <strong>
                        ${escaparHTML(
                            novoSexo
                        )}
                    </strong>

                </div>

                `,

            icon:
                "question",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#444",

            confirmButtonText:
                "SALVAR",

            cancelButtonText:
                "CANCELAR",

            reverseButtons:true

        });


    if(
        !confirmar.isConfirmed
    ){

        return;
    }


    /* =========================
       ATUALIZAR BANCO
    ========================== */

    const {
        error
    } =
        await db
        .from("atletas_v2")
        .update({

            data_nascimento:
                novaData,

            sexo:
                sexo || null

        })
        .eq(
            "id",
            atletaSelecionado.id
        );


    if(error){

        Swal.fire({

            title:
                "Erro ao salvar",

            text:
                error.message,

            icon:
                "error",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;
    }


    /* =========================
       AUDITORIA
    ========================== */

    const detalheAuditoria =
        `Correção de dados | Atleta: ${atletaSelecionado.nome} | Número: ${atletaSelecionado.numero_peito || "N/I"} | Data nascimento: ${dataAnterior} → ${novaDataTexto} | Sexo: ${sexoAnterior} → ${novoSexo}`;


    const {
        error:
            erroAuditoria
    } =
        await db
        .from("auditoria_v2")
        .insert([{

            evento_id:
                eventoId,

            usuario:
                usuarioLogado
                ? usuarioLogado.nome
                : "Desconhecido",

            acao:
                "Correção de dados",

            detalhe:
                detalheAuditoria

        }]);


    if(erroAuditoria){

        console.error(
            "Erro ao registrar auditoria:",
            erroAuditoria
        );
    }


    /* =========================
       ATUALIZA OBJETO LOCAL
    ========================== */

    atletaSelecionado.data_nascimento =
        novaData;


    atletaSelecionado.sexo =
        sexo || null;


    /* =========================
       SUCESSO
    ========================== */

    await Swal.fire({

        title:
            "DADOS CORRIGIDOS!",

        html:
            `

            <div style="
                font-size:17px;
                line-height:1.7;
            ">

                Os dados de

                <b>
                    ${escaparHTML(
                        atletaSelecionado.nome
                    )}
                </b>

                foram atualizados com sucesso.

            </div>

            `,

        icon:
            "success",

        background:
            "#111",

        color:
            "#fff",

        confirmButtonColor:
            "#7CFC00",

        confirmButtonText:
            "OK"

    });


    /* =========================
       REABRIR CARD ATUALIZADO
    ========================== */

    abrirDetalhes(
        atletaSelecionado
    );
}


/* =========================
   TIPO RETIRADA
========================= */

function selecionarTipo(tipo){

    const proprio =
        document.getElementById(
            "opcaoProprio"
        );


    const terceiro =
        document.getElementById(
            "opcaoTerceiro"
        );


    const campo =
        document.getElementById(
            "campoTerceiro"
        );


    if(tipo === "proprio"){

        proprio.classList.add(
            "ativo"
        );

        terceiro.classList.remove(
            "ativo"
        );

        campo.style.display =
            "none";

    }

    else{

        terceiro.classList.add(
            "ativo"
        );

        proprio.classList.remove(
            "ativo"
        );

        campo.style.display =
            "block";
    }
}


/* =========================
   ENTREGAR
========================= */

async function entregarAtleta(){

    if(!atletaSelecionado){

        return;
    }


    const tipoSelecionado =
        document.querySelector(
            'input[name="tipoRetirada"]:checked'
        );


    if(!tipoSelecionado){

        Swal.fire({

            title:
                "Atenção",

            text:
                "Selecione quem está retirando.",

            icon:
                "warning",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;
    }


    const tipo =
        tipoSelecionado.value;


    let retiradoPor =
        "Retirado pelo próprio atleta";


    if(
        tipo === "terceiro"
    ){

        const nomeTerceiro =
            document
            .getElementById(
                "nomeTerceiro"
            )
            .value
            .trim();


        if(!nomeTerceiro){

            Swal.fire({

                title:
                    "Atenção",

                text:
                    "Informe o nome de quem está retirando.",

                icon:
                    "warning",

                background:
                    "#111",

                color:
                    "#fff",

                confirmButtonColor:
                    "#7CFC00"

            });

            return;
        }


        retiradoPor =
            nomeTerceiro;
    }


    const observacao =
        document
        .getElementById(
            "observacao"
        )
        .value
        .trim();


    const confirmar =
        await Swal.fire({

            title:
                "Confirmar entrega",

            html:
                `
                <div style="
                    font-size:17px;
                    line-height:1.6;
                ">

                <b>
                ${escaparHTML(
                    atletaSelecionado.nome
                )}
                </b>

                <br>

                Número:

                <b>
                ${escaparHTML(
                    atletaSelecionado.numero_peito ||
                    "—"
                )}
                </b>

                <br><br>

                Retirado por:

                <b>
                ${escaparHTML(
                    retiradoPor
                )}
                </b>

                </div>
                `,

            icon:
                "question",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#444",

            confirmButtonText:
                "CONFIRMAR ENTREGA",

            cancelButtonText:
                "CANCELAR",

            reverseButtons:true

        });


    if(
        !confirmar.isConfirmed
    ){

        return;
    }


    /* =========================
       VERIFICA NOVAMENTE
    ========================== */

    const {
        data: verificacao,
        error: erroVerificacao
    } =
        await db
        .from("atletas_v2")
        .select(
            "id,status_kit"
        )
        .eq(
            "id",
            atletaSelecionado.id
        )
        .single();


    if(erroVerificacao){

        Swal.fire({

            title:
                "Erro",

            text:
                erroVerificacao.message,

            icon:
                "error",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;
    }


    if(
        verificacao.status_kit ===
        "entregue"
    ){

        Swal.fire({

            title:
                "ENTREGA JÁ REALIZADA",

            text:
                "Este atleta já possui uma entrega registrada.",

            icon:
                "warning",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"

        });

        buscarAtletas();

        return;
    }


    /* =========================
       REGISTRA ENTREGA
    ========================== */

    const agora =
        new Date().toISOString();


    const {
        error
    } =
        await db
        .from("atletas_v2")
        .update({

            status_kit:
                "entregue",

            retirado_por:
                retiradoPor,

            cpf_retirada:
                null,

            data_retirada:
                agora,

            entregue_por:
                usuarioLogado
                ? usuarioLogado.nome
                : "Desconhecido",

            entregue_por_usuario:
                usuarioLogado
                ? usuarioLogado.email
                : "Desconhecido",

            retirado_login:
                usuarioLogado
                ? usuarioLogado.email
                : "Desconhecido"

        })
        .eq(
            "id",
            atletaSelecionado.id
        )
        .eq(
            "status_kit",
            "pendente"
        );


    if(error){

        Swal.fire({

            title:
                "Erro na entrega",

            text:
                error.message,

            icon:
                "error",

            background:
                "#111",

            color:
                "#fff",

            confirmButtonColor:
                "#7CFC00"

        });

        return;
    }


    /* =========================
       HISTÓRICO
    ========================== */

    const {
        error:
            erroHistorico
    } =
        await db
        .from("entregas")
        .insert([{

            atleta_id:
                atletaSelecionado.id,

            usuario_id:
                usuarioLogado
                ? usuarioLogado.id
                : null,

            retirado_por:
                retiradoPor,

            cpf_retirada:
                null,

            tipo_retirada:
                tipo,

            observacao:
                observacao || null,

            entregue_em:
                agora

        }]);


    if(
        erroHistorico
    ){

        console.error(
            "Erro no histórico:",
            erroHistorico
        );
    }


    /* =========================
       AUDITORIA
    ========================== */

    await db
    .from("auditoria_v2")
    .insert([{

        evento_id:
            eventoId,

        usuario:
            usuarioLogado
            ? usuarioLogado.nome
            : "Desconhecido",

        acao:
            "Entrega",

        detalhe:
            `Atleta: ${atletaSelecionado.nome} | Número: ${atletaSelecionado.numero_peito || "N/I"} | Retirado por: ${retiradoPor} | Tipo: ${tipo} | Observação: ${observacao || "Nenhuma"}`

    }]);


    /* =========================
       MENSAGEM FINAL
    ========================== */

    await Swal.fire({

        title:
            "ENTREGA REALIZADA!",

        html:
            `
            <div style="
                font-size:18px;
                line-height:1.6;
            ">

            <b>
            ${escaparHTML(
                atletaSelecionado.nome
            )}
            </b>

            <br>

            Número:

            <b>
            ${escaparHTML(
                atletaSelecionado.numero_peito ||
                "—"
            )}
            </b>

            <br><br>

            ${escaparHTML(
                retiradoPor
            )}

            </div>
            `,

        icon:
            "success",

        background:
            "#111",

        color:
            "#fff",

        confirmButtonColor:
            "#7CFC00",

        confirmButtonText:
            "OK"

    });


    buscarAtletas();
}
