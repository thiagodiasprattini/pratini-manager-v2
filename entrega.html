<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;


const eventoId =
    localStorage.getItem(
        "evento_ativo_id"
    );


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor) {

    if (
        valor === null ||
        valor === undefined
    ) {

        return "";

    }


    return String(valor)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizar(txt) {

    return (txt || "")

        .toString()

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .trim();

}


/* =========================================================
   DATA DE NASCIMENTO
========================================================= */

function formatarDataNascimento(data) {

    if (!data) {

        return "Não informada";

    }


    const texto =
        String(data);


    const match =
        texto.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (match) {

        const ano =
            match[1];

        const mes =
            match[2];

        const dia =
            match[3];


        return (
            dia +
            "/" +
            mes +
            "/" +
            ano
        );

    }


    const dataObj =
        new Date(data);


    if (
        isNaN(
            dataObj.getTime()
        )
    ) {

        return "Não informada";

    }


    return dataObj.toLocaleDateString(
        "pt-BR",
        {
            timeZone:
                "America/Sao_Paulo"
        }
    );

}


/* =========================================================
   DATA E HORA
========================================================= */

function formatarDataHora(data) {

    if (!data) {

        return "Não informada";

    }


    const dataObj =
        new Date(data);


    if (
        isNaN(
            dataObj.getTime()
        )
    ) {

        return "Não informada";

    }


    return dataObj.toLocaleString(
        "pt-BR",
        {

            timeZone:
                "America/Sao_Paulo",

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =========================================================
   VERIFICAR ACESSO
========================================================= */

async function verificarAcesso() {

    const {
        data: sessao,
        error: erroSessao
    } =
        await db.auth.getSession();


    if (
        erroSessao ||
        !sessao ||
        !sessao.session
    ) {

        window.location.href =
            "login.html";

        return;

    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } =
        await db

            .from("perfis")

            .select(
                "role,nome"
            )

            .eq(
                "id",
                usuario.id
            )

            .single();


    if (
        error ||
        !perfil
    ) {

        window.location.href =
            "index.html";

        return;

    }


    usuarioLogado = {

        id:
            usuario.id,

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email

    };


    const eventoNome =
        localStorage.getItem(
            "evento_ativo_nome"
        );


    document.getElementById(
        "eventoAtivo"
    ).textContent =

        eventoNome ||

        "Nenhum evento ativo selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display =
        "none";


    document.getElementById(
        "telaPainel"
    ).style.display =
        "block";

}


/* =========================================================
   BUSCAR DATAS DE NASCIMENTO
========================================================= */

async function buscarDatasNascimento(atletas) {

    const precisamBuscar =
        atletas.filter(
            a => !a.data_nascimento
        );


    if (
        precisamBuscar.length === 0
    ) {

        return atletas;

    }


    const numeros =
        precisamBuscar

            .map(
                a => a.numero_peito
            )

            .filter(Boolean)

            .map(String);


    if (
        numeros.length > 0
    ) {

        const {
            data: dadosAtletas
        } =
            await db

                .from("atletas")

                .select(
                    "id,nome,cpf,numero_peito,data_nascimento"
                )

                .in(
                    "numero_peito",
                    numeros.map(
                        n => parseInt(n)
                    )
                );


        if (dadosAtletas) {

            atletas.forEach(
                atleta => {

                    if (
                        atleta.data_nascimento
                    ) {

                        return;

                    }


                    const correspondente =
                        dadosAtletas.find(
                            item =>

                                String(
                                    item.numero_peito
                                ) ===

                                String(
                                    atleta.numero_peito
                                )
                        );


                    if (
                        correspondente
                    ) {

                        atleta.data_nascimento =
                            correspondente.data_nascimento;

                    }

                }
            );

        }

    }


    const cpfs =
        precisamBuscar

            .map(
                a => a.cpf
            )

            .filter(Boolean);


    if (
        cpfs.length > 0
    ) {

        const {
            data: dadosCpf
        } =
            await db

                .from("atletas")

                .select(
                    "id,nome,cpf,numero_peito,data_nascimento"
                )

                .in(
                    "cpf",
                    cpfs
                );


        if (dadosCpf) {

            atletas.forEach(
                atleta => {

                    if (
                        atleta.data_nascimento
                    ) {

                        return;

                    }


                    if (
                        !atleta.cpf
                    ) {

                        return;

                    }


                    const correspondente =
                        dadosCpf.find(
                            item =>

                                String(
                                    item.cpf
                                ) ===

                                String(
                                    atleta.cpf
                                )
                        );


                    if (
                        correspondente
                    ) {

                        atleta.data_nascimento =
                            correspondente.data_nascimento;

                    }

                }
            );

        }

    }


    return atletas;

}


/* =========================================================
   BUSCAR ATLETAS
========================================================= */

async function buscarAtletas() {

    const termo =
        document

            .getElementById(
                "busca"
            )

            .value

            .trim();


    const resultado =
        document.getElementById(
            "resultado"
        );


    if (!eventoId) {

        resultado.innerHTML = `

            <div class="card">

                Selecione um evento ativo primeiro.

            </div>

        `;

        return;

    }


    if (!termo) {

        resultado.innerHTML = `

            <div class="card">

                Digite o nome ou número de peito.

            </div>

        `;

        return;

    }


    resultado.innerHTML = `

        <div class="card">

            Pesquisando atleta...

        </div>

    `;


    const {
        data,
        error
    } =
        await db

            .from("atletas_v2")

            .select(`

                id,
                evento_id,
                nome,
                cpf,
                numero_peito,
                modalidade,
                camiseta,
                equipe,
                produto_extra,
                status_kit,
                retirado_por,
                cpf_retirada,
                data_retirada,
                entregue_por,
                entregue_por_usuario,
                retirado_login

            `)

            .eq(
                "evento_id",
                eventoId
            )

            .limit(1000);


    if (error) {

        resultado.innerHTML = `

            <div class="card">

                Erro na busca:

                ${escaparHTML(
                    error.message
                )}

            </div>

        `;

        return;

    }


    const busca =
        normalizar(
            termo
        );


    const encontrados =
        (data || [])

            .filter(
                atleta => {

                    const nome =
                        normalizar(
                            atleta.nome
                        );


                    const cpf =
                        normalizar(
                            atleta.cpf
                        );


                    const numero =
                        normalizar(
                            atleta.numero_peito
                        );


                    return (

                        nome.includes(
                            busca
                        )

                        ||

                        cpf.includes(
                            busca
                        )

                        ||

                        numero.includes(
                            busca
                        )

                    );

                }
            );


    if (
        encontrados.length === 0
    ) {

        resultado.innerHTML = `

            <div class="card">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    await buscarDatasNascimento(
        encontrados
    );


    resultado.innerHTML = "";


    encontrados.forEach(
        atleta => {

            criarCartaoAtleta(
                atleta
            );

        }
    );

}

/* =========================================================
   ALTERAR TIPO DE RETIRADA
========================================================= */

function alterarTipoRetirada(
    id,
    tipo
) {

    const campo =
        document.getElementById(
            "terceiro-" + id
        );


    if (!campo) {

        return;

    }


    if (
        tipo === "terceiro"
    ) {

        campo.classList.add(
            "ativo"
        );

    }

    else {

        campo.classList.remove(
            "ativo"
        );

    }

}


/* =========================================================
   REGISTRAR ENTREGA
========================================================= */

async function entregar(id) {

    const {
        data: atleta,
        error: erroBusca
    } =
        await db

            .from("atletas_v2")

            .select("*")

            .eq(
                "id",
                id
            )

            .single();


    if (
        erroBusca ||
        !atleta
    ) {

        Swal.fire({

            title:
                "Erro",

            text:
                "Não foi possível localizar o atleta.",

            icon:
                "error",

            background:
                "#1F1F1F",

            color:
                "#FFFFFF",

            confirmButtonColor:
                "#7CFC00"

        });

        return;

    }


    /* =====================================================
       PROTEÇÃO CONTRA DUPLA ENTREGA
    ===================================================== */

    if (
        atleta.status_kit ===
        "entregue"
    ) {

        Swal.fire({

            title:
                "Entrega já realizada",

            text:
                "Esta inscrição já foi registrada como entregue.",

            icon:
                "warning",

            background:
                "#1F1F1F",

            color:
                "#FFFFFF",

            confirmButtonColor:
                "#7CFC00"

        });


        buscarAtletas();

        return;

    }


    /* =====================================================
       TIPO DE RETIRADA
    ===================================================== */

    const radioSelecionado =
        document.querySelector(

            `input[name="tipo-${id}"]:checked`

        );


    const tipo =
        radioSelecionado
            ? radioSelecionado.value
            : "proprio";


    let retiradoPor =
        "Retirado pelo próprio atleta";


    /* =====================================================
       TERCEIRO
    ===================================================== */

    if (
        tipo === "terceiro"
    ) {

        const campo =
            document.getElementById(
                "nome-terceiro-" + id
            );


        const nomeTerceiro =
            campo
                ? campo.value.trim()
                : "";


        if (
            !nomeTerceiro
        ) {

            Swal.fire({

                title:
                    "Informe quem está retirando",

                text:
                    "Digite o nome da pessoa que está retirando.",

                icon:
                    "warning",

                background:
                    "#1F1F1F",

                color:
                    "#FFFFFF",

                confirmButtonColor:
                    "#7CFC00",

                confirmButtonText:
                    "OK"

            });


            if (campo) {

                campo.focus();

            }


            return;

        }


        retiradoPor =
            nomeTerceiro;

    }


    /* =====================================================
       OBSERVAÇÃO
    ===================================================== */

    const campoObservacao =
        document.getElementById(
            "observacao-" + id
        );


    const observacao =
        campoObservacao
            ? campoObservacao.value.trim()
            : "";


    /* =====================================================
       CONFIRMAÇÃO
    ===================================================== */

    const confirmar =
        await Swal.fire({

            title:
                "Confirmar entrega",

            html: `

                <div
                    style="
                        font-size:18px;
                        line-height:1.6;
                    "
                >

                    <strong>

                        ${escaparHTML(
                            atleta.nome
                        )}

                    </strong>


                    <br><br>


                    Número de peito:

                    <strong>

                        ${escaparHTML(
                            atleta.numero_peito ||
                            "Não informado"
                        )}

                    </strong>


                    <br><br>


                    Retirado por:

                    <strong>

                        ${escaparHTML(
                            retiradoPor
                        )}

                    </strong>

                </div>

            `,

            icon:
                "question",

            background:
                "#1F1F1F",

            color:
                "#FFFFFF",

            confirmButtonColor:
                "#7CFC00",

            cancelButtonColor:
                "#555555",

            confirmButtonText:
                "CONFIRMAR ENTREGA",

            cancelButtonText:
                "CANCELAR",

            showCancelButton:
                true

        });


    if (
        !confirmar.isConfirmed
    ) {

        return;

    }


    const agora =
        new Date().toISOString();


    /* =====================================================
       ATUALIZA ATLETA
    ===================================================== */

    const {
        data: atualizado,
        error: erroAtualizacao
    } =
        await db

            .from("atletas_v2")

            .update({

                status_kit:
                    "entregue",

                retirado_por:
                    retiradoPor,

                cpf_retirada:
                    null,

                data_retirada:
                    agora,

                entregue_por:

                    usuarioLogado
                        ? usuarioLogado.nome
                        : "Desconhecido",

                entregue_por_usuario:

                    usuarioLogado
                        ? usuarioLogado.email
                        : "Desconhecido",

                retirado_login:

                    usuarioLogado
                        ? usuarioLogado.email
                        : "Desconhecido"

            })

            .eq(
                "id",
                id
            )

            .eq(
                "status_kit",
                "pendente"
            )

            .select();


    /* =====================================================
       VERIFICAR ATUALIZAÇÃO
    ===================================================== */

    if (

        erroAtualizacao ||

        !atualizado ||

        atualizado.length === 0

    ) {

        Swal.fire({

            title:
                "Entrega não realizada",

            text:
                "A inscrição pode ter sido entregue por outro atendente. Atualize a pesquisa e confira o status.",

            icon:
                "warning",

            background:
                "#1F1F1F",

            color:
                "#FFFFFF",

            confirmButtonColor:
                "#7CFC00",

            confirmButtonText:
                "OK"

        });


        buscarAtletas();

        return;

    }


    /* =====================================================
       REGISTRO NA TABELA ENTREGAS
    ===================================================== */

    const {
        error: erroEntrega
    } =
        await db

            .from("entregas")

            .insert([{

                atleta_id:
                    id,

                usuario_id:

                    usuarioLogado
                        ? usuarioLogado.id
                        : null,

                retirado_por:
                    retiradoPor,

                cpf_retirada:
                    null,

                tipo_retirada:
                    tipo,

                observacao:
                    observacao ||
                    null,

                entregue_em:
                    agora

            }]);


    /* =====================================================
       AUDITORIA
    ===================================================== */

    await db

        .from("auditoria_v2")

        .insert([{

            evento_id:
                eventoId,

            usuario:

                usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",

            acao:
                "Entrega de Inscrição",

            detalhe:

                `Entrega registrada para ${atleta.nome}. Número de peito: ${atleta.numero_peito || "não informado"}. Retirado por: ${retiradoPor}. Tipo: ${tipo}. Observação: ${observacao || "nenhuma"}.`

        }]);


    if (erroEntrega) {

        console.warn(
            "Entrega registrada, mas houve erro no histórico:",
            erroEntrega
        );

    }


    /* =====================================================
       MENSAGEM FINAL
    ===================================================== */

    const mensagemEntrega =

        tipo === "proprio"

            ? "Retirado pelo próprio atleta"

            : "Retirado por " +
              retiradoPor;


    await Swal.fire({

        title:
            "Entrega confirmada!",

        html: `

            <div
                style="
                    font-size:18px;
                    line-height:1.6;
                "
            >

                <strong>

                    ${escaparHTML(
                        atleta.nome
                    )}

                </strong>


                <br>


                Número de peito:

                <strong>

                    ${escaparHTML(
                        atleta.numero_peito ||
                        "Não informado"
                    )}

                </strong>


                <br><br>


                ${escaparHTML(
                    mensagemEntrega
                )}

            </div>

        `,

        icon:
            "success",

        background:
            "#1F1F1F",

        color:
            "#FFFFFF",

        confirmButtonColor:
            "#7CFC00",

        confirmButtonText:
            "OK"

    });


    buscarAtletas();

}


/* =========================================================
   INICIAR SISTEMA
========================================================= */

verificarAcesso();

</script>
