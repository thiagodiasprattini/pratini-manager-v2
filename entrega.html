<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;

const eventoId =
    localStorage.getItem("evento_ativo_id");

const eventoNome =
    localStorage.getItem("evento_ativo_nome");



/* =========================================================
   ACESSO
========================================================= */

async function verificarAcesso(){

    const { data: sessao, error } =
        await db.auth.getSession();


    if(
        error ||
        !sessao ||
        !sessao.session
    ){

        window.location.href = "login.html";

        return;

    }


    const usuario =
        sessao.session.user;


    const { data: perfil, error: erroPerfil } =
        await db
            .from("perfis")
            .select("role, nome")
            .eq("id", usuario.id)
            .single();


    if(
        erroPerfil ||
        !perfil
    ){

        window.location.href =
            "index.html";

        return;

    }


    usuarioLogado = {

        id:usuario.id,

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email

    };


    document
        .getElementById("eventoAtivo")
        .innerText =
            eventoNome ||
            "Nenhum evento selecionado.";


    document
        .getElementById("telaCarregando")
        .style.display =
            "none";


    document
        .getElementById("telaPainel")
        .style.display =
            "block";

}



/* =========================================================
   NORMALIZAR TEXTO
   Corrige buscas com acentos:
   André = Andre
========================================================= */

function normalizar(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();

}



/* =========================================================
   DATA DE NASCIMENTO
========================================================= */

function formatarData(data){

    if(!data){

        return "Não informada";

    }


    try{

        let valor = data.toString().trim();


        /*
         * Se vier como YYYY-MM-DD
         */

        if(
            /^\d{4}-\d{2}-\d{2}$/.test(valor)
        ){

            const partes =
                valor.split("-");

            return `${partes[2]}/${partes[1]}/${partes[0]}`;

        }


        /*
         * Se vier como DD/MM/YYYY
         */

        if(
            /^\d{2}\/\d{2}\/\d{4}$/.test(valor)
        ){

            return valor;

        }


        const d = new Date(valor);


        if(isNaN(d.getTime())){

            return valor;

        }


        return d.toLocaleDateString(
            "pt-BR",
            {
                timeZone:
                    "America/Sao_Paulo"
            }
        );

    }catch(e){

        return data;

    }

}



/* =========================================================
   DATA E HORA
========================================================= */

function formatarDataHora(data){

    if(!data){

        return "Não informada";

    }


    try{

        return new Date(data)
            .toLocaleString(
                "pt-BR",
                {
                    timeZone:
                        "America/Sao_Paulo"
                }
            );

    }catch(e){

        return data;

    }

}



/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHtml(valor){

    return String(valor || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* =========================================================
   BUSCAR ATLETAS
========================================================= */

async function buscarAtletas(){

    const termo =
        document
            .getElementById("busca")
            .value
            .trim();


    const resultado =
        document.getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `

            <div class="mensagem">

                Nenhum evento foi selecionado.

            </div>

        `;

        return;

    }


    if(!termo){

        resultado.innerHTML = `

            <div class="mensagem">

                Digite o nome ou número de peito.

            </div>

        `;

        return;

    }


    resultado.innerHTML = `

        <div class="mensagem">

            Pesquisando...

        </div>

    `;


    /*
     * Busca os atletas do evento.
     *
     * Também traz data_nascimento e equipe.
     */

    const { data, error } =

        await db
            .from("atletas_v2")
            .select(`
                id,
                evento_id,
                nome,
                data_nascimento,
                numero_peito,
                modalidade,
                camiseta,
                equipe,
                produto_extra,
                status_kit,
                retirado_por,
                cpf_retirada,
                data_retirada,
                entregue_por,
                entregue_por_usuario,
                retirado_login
            `)
            .eq("evento_id",eventoId)
            .order("nome",{ascending:true})
            .limit(1000);


    if(error){

        resultado.innerHTML = `

            <div class="mensagem">

                Erro na busca:<br><br>

                ${escaparHtml(error.message)}

            </div>

        `;

        return;

    }


    const busca =
        normalizar(termo);


    const encontrados =
        (data || []).filter(atleta =>

            normalizar(atleta.nome)
                .includes(busca)

            ||

            normalizar(atleta.numero_peito)
                .includes(busca)

        );


    if(encontrados.length === 0){

        resultado.innerHTML = `

            <div class="mensagem">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    resultado.innerHTML = "";


    encontrados.forEach(
        (atleta,index) => {

            criarCardAtleta(
                atleta,
                index
            );

        }
    );

}



/* =========================================================
   CRIAR CARD
========================================================= */

function criarCardAtleta(atleta,index){

    const resultado =
        document.getElementById("resultado");


    const card =
        document.createElement("div");


    card.className =
        "card-atleta";


    const nome =
        escaparHtml(atleta.nome);


    const nascimento =
        formatarData(
            atleta.data_nascimento
        );


    const entregue =
        atleta.status_kit ===
        "entregue";


    card.innerHTML = `

        <div class="nome-resumo">

            ${nome}

        </div>


        <div class="nascimento-resumo">

            Nascimento:
            <strong>
                ${escaparHtml(nascimento)}
            </strong>

        </div>


        <div
            class="detalhes"
            id="detalhes-${index}"
        >

            <div class="atleta-cabecalho">

                <h2 class="atleta-nome">

                    ${nome}

                </h2>


                <div class="numero-label">

                    Número de peito

                </div>


                <span class="numero-peito">

                    ${escaparHtml(
                        atleta.numero_peito ||
                        "—"
                    )}

                </span>

            </div>


            <div class="dados">


                <div class="dado">

                    <span class="dado-label">

                        Data de nascimento

                    </span>

                    <span class="dado-valor">

                        ${escaparHtml(
                            formatarData(
                                atleta.data_nascimento
                            )
                        )}

                    </span>

                </div>



                <div class="dado">

                    <span class="dado-label">

                        Modalidade

                    </span>

                    <span class="dado-valor">

                        ${escaparHtml(
                            atleta.modalidade ||
                            "Não informada"
                        )}

                    </span>

                </div>



                <div class="dado">

                    <span class="dado-label">

                        Camiseta

                    </span>

                    <span class="dado-valor">

                        ${escaparHtml(
                            atleta.camiseta ||
                            "Não informada"
                        )}

                    </span>

                </div>



                <div class="dado">

                    <span class="dado-label">

                        Equipe

                    </span>

                    <span class="dado-valor">

                        ${escaparHtml(
                            atleta.equipe ||
                            "Não informada"
                        )}

                    </span>

                </div>



                <div class="dado produto">

                    <span class="dado-label">

                        Produtos

                    </span>

                    <span class="dado-valor">

                        ${escaparHtml(
                            atleta.produto_extra ||
                            "Nenhum"
                        )}

                    </span>

                </div>


            </div>


            <div class="retirada">


                ${
                    entregue

                    ?

                    gerarInformacoesEntrega(
                        atleta
                    )

                    :

                    gerarFormularioEntrega(
                        atleta
                    )

                }


            </div>

        </div>

    `;


    /*
     * Clique no card abre os detalhes.
     */

    card.addEventListener(
        "click",
        function(){

            const detalhes =
                card.querySelector(
                    ".detalhes"
                );


            if(
                detalhes.classList
                    .contains("aberto")
            ){

                detalhes.classList
                    .remove("aberto");

            }else{

                /*
                 * Fecha os outros cards.
                 */

                document
                    .querySelectorAll(
                        ".detalhes.aberto"
                    )
                    .forEach(
                        outro => {

                            outro.classList
                                .remove("aberto");

                        }
                    );


                detalhes.classList
                    .add("aberto");

            }

        }
    );


    resultado.appendChild(card);

}



/* =========================================================
   FORMULÁRIO DE ENTREGA
========================================================= */

function gerarFormularioEntrega(atleta){

    const id =
        escaparHtml(atleta.id);


    return `

        <h3>

            Retirada

        </h3>


        <div class="opcoes-retirada">


            <div class="opcao">

                <input
                    type="radio"
                    name="tipo-${id}"
                    id="proprio-${id}"
                    value="proprio"
                    checked
                    onchange="alterarTipoRetirada('${id}')"
                >

                <label for="proprio-${id}">

                    Próprio atleta

                </label>

            </div>



            <div class="opcao">

                <input
                    type="radio"
                    name="tipo-${id}"
                    id="terceiro-${id}"
                    value="terceiro"
                    onchange="alterarTipoRetirada('${id}')"
                >

                <label for="terceiro-${id}">

                    Terceiro

                </label>

            </div>


        </div>


        <div
            class="terceiro-area"
            id="terceiro-area-${id}"
        >

            <label>

                Nome de quem está retirando

            </label>


            <input
                type="text"
                id="retirado-${id}"
                placeholder="Digite o nome completo"
            >

        </div>


        <div class="observacao">

            <label>

                Observação

            </label>


            <textarea
                id="observacao-${id}"
                placeholder="Ex.: mãe do atleta, pai, amigo, responsável..."
            ></textarea>

        </div>


        <button
            class="btn-entregar"
            id="btn-entregar-${id}"
            onclick="event.stopPropagation(); entregar('${id}')"
        >

            ENTREGAR

        </button>


        <div class="status status-pendente">

            Aguardando entrega

        </div>

    `;

}



/* =========================================================
   ALTERAR TIPO DE RETIRADA
========================================================= */

function alterarTipoRetirada(id){

    const terceiro =
        document.getElementById(
            "terceiro-" + id
        );


    const area =
        document.getElementById(
            "terceiro-area-" + id
        );


    if(
        terceiro &&
        terceiro.checked
    ){

        area.classList
            .add("visivel");

    }else{

        area.classList
            .remove("visivel");

    }

}



/* =========================================================
   INFORMAÇÕES DE ENTREGA
========================================================= */

function gerarInformacoesEntrega(atleta){

    const retiradoPor =
        atleta.retirado_por ||
        "Não informado";


    const observacao =
        atleta.observacao ||
        "";


    return `

        <h3>

            Entrega realizada

        </h3>


        <div class="status status-entregue">

            ENTREGA CONFIRMADA

        </div>


        <div class="entrega-info">

            <strong>Retirado por:</strong>

            ${escaparHtml(
                retiradoPor
            )}

            <br>


            <strong>Atendente:</strong>

            ${escaparHtml(
                atleta.entregue_por ||
                atleta.retirado_login ||
                atleta.entregue_por_usuario ||
                "Não informado"
            )}

            <br>


            <strong>Data e horário:</strong>

            ${escaparHtml(
                formatarDataHora(
                    atleta.data_retirada
                )
            )}

            ${
                observacao
                ?
                `
                <br>
                <strong>Observação:</strong>
                ${escaparHtml(observacao)}
                `
                :
                ""
            }

        </div>

    `;

}



/* =========================================================
   ENTREGAR
========================================================= */

async function entregar(id){

    /*
     * Impede o clique de subir para o card.
     */

    event.stopPropagation();


    const tipoSelecionado =
        document.querySelector(
            `input[name="tipo-${id}"]:checked`
        );


    if(!tipoSelecionado){

        Swal.fire({

            title:"Atenção",

            text:
                "Selecione quem está realizando a retirada.",

            icon:"warning",

            background:"#171717",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    const tipo =
        tipoSelecionado.value;


    let retiradoPor =
        "Próprio atleta";


    if(tipo === "terceiro"){

        const campo =
            document.getElementById(
                "retirado-" + id
            );


        retiradoPor =
            campo.value.trim();


        if(!retiradoPor){

            Swal.fire({

                title:"Informe quem está retirando",

                text:
                    "Digite o nome da pessoa que está retirando.",

                icon:"warning",

                background:"#171717",

                color:"#ffffff",

                confirmButtonColor:"#7CFC00"

            });

            return;

        }

    }


    const observacaoCampo =
        document.getElementById(
            "observacao-" + id
        );


    const observacao =
        observacaoCampo
            ?
            observacaoCampo.value.trim()
            :
            "";


    /*
     * Busca novamente no banco antes de registrar.
     *
     * Isso é uma proteção importante contra
     * duas pessoas tentando realizar a entrega
     * ao mesmo tempo.
     */

    const { data: atletaAtual, error: erroBusca } =

        await db
            .from("atletas_v2")
            .select(`
                id,
                nome,
                status_kit,
                numero_peito
            `)
            .eq("id",id)
            .single();


    if(erroBusca || !atletaAtual){

        Swal.fire({

            title:"Erro",

            text:
                "Não foi possível localizar o atleta.",

            icon:"error",

            background:"#171717",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    /*
     * BLOQUEIO DE SEGUNDA ENTREGA
     */

    if(
        atletaAtual.status_kit ===
        "entregue"
    ){

        Swal.fire({

            title:"Entrega já realizada",

            html:`

                <b>
                    ${escaparHtml(
                        atletaAtual.nome
                    )}
                </b>

                <br><br>

                Número de peito:
                <b>
                    ${escaparHtml(
                        atletaAtual.numero_peito ||
                        "—"
                    )}
                </b>

                <br><br>

                Este registro já consta como entregue.

            `,

            icon:"warning",

            background:"#171717",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    const confirmar =
        await Swal.fire({

            title:"Confirmar entrega",

            html:`

                <div style="
                    font-size:18px;
                    line-height:1.6;
                ">

                    <strong>
                        ${escaparHtml(
                            atletaAtual.nome
                        )}
                    </strong>

                    <br>

                    Número:
                    <strong>
                        ${escaparHtml(
                            atletaAtual.numero_peito ||
                            "—"
                        )}
                    </strong>

                    <br><br>

                    Retirado por:

                    <strong>
                        ${escaparHtml(
                            retiradoPor
                        )}
                    </strong>

                </div>

            `,

            icon:"question",

            background:"#171717",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00",

            cancelButtonColor:"#444",

            confirmButtonText:"CONFIRMAR ENTREGA",

            cancelButtonText:"CANCELAR"

        });


    if(!confirmar.isConfirmed){

        return;

    }


    const agora =
        new Date().toISOString();


    const atendente =
        usuarioLogado
            ?
            usuarioLogado.nome
            :
            "Desconhecido";


    const login =
        usuarioLogado
            ?
            usuarioLogado.email
            :
            "Desconhecido";


    /*
     * Primeiro registra na tabela entregas.
     */

    const { error: erroEntrega } =

        await db
            .from("entregas")
            .insert([{

                atleta_id:id,

                usuario_id:
                    usuarioLogado
                    ?
                    usuarioLogado.id
                    :
                    null,

                retirado_por:
                    retiradoPor,

                tipo_retirada:
                    tipo,

                observacao:
                    observacao,

                entregue_em:
                    agora

            }]);


    if(erroEntrega){

        Swal.fire({

            title:"Erro",

            text:
                "Não foi possível registrar a entrega: " +
                erroEntrega.message,

            icon:"error",

            background:"#171717",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    /*
     * Atualiza o atleta.
     */

    const { error: erroAtleta } =

        await db
            .from("atletas_v2")
            .update({

                status_kit:
                    "entregue",

                retirado_por:
                    retiradoPor,

                data_retirada:
                    agora,

                entregue_por:
                    atendente,

                entregue_por_usuario:
                    login,

                retirado_login:
                    login

            })
            .eq("id",id)
            .eq("status_kit","pendente");


    if(erroAtleta){

        Swal.fire({

            title:"Atenção",

            text:
                "A entrega foi registrada, mas houve um problema ao atualizar o atleta: " +
                erroAtleta.message,

            icon:"warning",

            background:"#171717",

            color:"#ffffff",

            confirmButtonColor:"#7CFC00"

        });

        return;

    }


    /*
     * Auditoria.
     */

    await db
        .from("auditoria_v2")
        .insert([{

            evento_id:
                eventoId,

            usuario:
                atendente,

            acao:
                "Entrega de Inscrição",

            detalhe:
                `Atleta: ${atletaAtual.nome} | Número: ${atletaAtual.numero_peito || "—"} | Retirado por: ${retiradoPor} | Tipo: ${tipo} | Observação: ${observacao || "Nenhuma"} | Login: ${login}`

        }]);


    await Swal.fire({

        title:"Entrega confirmada!",

        html:`

            <div style="
                font-size:18px;
                line-height:1.6;
            ">

                <strong>
                    ${escaparHtml(
                        atletaAtual.nome
                    )}
                </strong>

                <br>

                Número de peito:
                <strong>
                    ${escaparHtml(
                        atletaAtual.numero_peito ||
                        "—"
                    )}
                </strong>

                <br><br>

                Retirado por:
                <strong>
                    ${escaparHtml(
                        retiradoPor
                    )}
                </strong>

            </div>

        `,

        icon:"success",

        background:"#171717",

        color:"#ffffff",

        confirmButtonColor:"#7CFC00",

        confirmButtonText:"OK"

    });


    /*
     * Atualiza a pesquisa.
     */

    buscarAtletas();

}
