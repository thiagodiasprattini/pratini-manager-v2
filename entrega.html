<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;

const eventoId =
localStorage.getItem(
    "evento_ativo_id"
);


/* =========================================================
   VERIFICAR ACESSO
========================================================= */

async function verificarAcesso(){

    try{

        const {
            data: sessao,
            error: erroSessao
        } =
        await db.auth.getSession();


        if(
            erroSessao ||
            !sessao ||
            !sessao.session
        ){

            window.location.href =
            "login.html";

            return;

        }


        const usuario =
        sessao.session.user;


        const {
            data: perfil,
            error
        } =
        await db
        .from("perfis")
        .select("role, nome")
        .eq("id", usuario.id)
        .single();


        if(error || !perfil){

            window.location.href =
            "index.html";

            return;

        }


        usuarioLogado = {

            id:
            usuario.id,

            nome:
            perfil.nome ||
            usuario.email,

            email:
            usuario.email

        };


        const eventoNome =
        localStorage.getItem(
            "evento_ativo_nome"
        );


        document.getElementById(
            "eventoAtivo"
        ).textContent =
        eventoNome ||
        "Nenhum evento ativo selecionado.";


        document.getElementById(
            "telaCarregando"
        ).style.display =
        "none";


        document.getElementById(
            "telaPainel"
        ).style.display =
        "block";


    }catch(error){

        console.error(error);

        window.location.href =
        "login.html";

    }

}


/* =========================================================
   NORMALIZAR
========================================================= */

function normalizar(txt){

    return (txt || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .trim();

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   DATA DE NASCIMENTO
========================================================= */

function formatarDataNascimento(data){

    if(!data)
        return "Não informada";


    const partes =
    String(data).split("-");


    if(partes.length === 3){

        return `
            ${partes[2]}/${partes[1]}/${partes[0]}
        `;

    }


    return data;

}


/* =========================================================
   DATA/HORA
========================================================= */

function formatarDataHora(data){

    if(!data)
        return "Não informada";


    return new Date(data)
        .toLocaleString(
            "pt-BR",
            {
                timeZone:
                "America/Sao_Paulo"
            }
        );

}


/* =========================================================
   PESQUISAR ATLETAS
========================================================= */

async function buscarAtletas(){

    const termo =
    document
    .getElementById("busca")
    .value
    .trim();


    const resultado =
    document
    .getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `

            <div class="mensagem">

                Nenhum evento ativo
                selecionado.

            </div>

        `;

        return;

    }


    if(!termo){

        resultado.innerHTML = `

            <div class="mensagem">

                Digite o nome ou o
                número de peito.

            </div>

        `;

        return;

    }


    resultado.innerHTML = `

        <div class="mensagem">

            Pesquisando...

        </div>

    `;


    const {
        data,
        error
    } =
    await db
    .from("atletas_v2")
    .select(`
        id,
        nome,
        data_nascimento,
        numero_peito,
        modalidade,
        camiseta,
        pelotao,
        produto_extra,
        status_kit,
        retirado_por,
        data_retirada,
        entregue_por,
        entregue_por_usuario,
        retirado_login
    `)
    .eq("evento_id", eventoId)
    .limit(1000);


    if(error){

        console.error(error);


        resultado.innerHTML = `

            <div class="mensagem">

                Não foi possível realizar
                a pesquisa.

            </div>

        `;

        return;

    }


    const busca =
    normalizar(termo);


    const encontrados =
    (data || []).filter(atleta => {

        return (

            normalizar(
                atleta.nome
            ).includes(busca)

            ||

            normalizar(
                atleta.numero_peito
            ).includes(busca)

        );

    });


    if(encontrados.length === 0){

        resultado.innerHTML = `

            <div class="mensagem">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    resultado.innerHTML = "";


    encontrados.forEach(atleta => {

        resultado.appendChild(
            criarCardAtleta(atleta)
        );

    });

}


/* =========================================================
   CRIAR CARD
========================================================= */

function criarCardAtleta(atleta){

    const entregue =
    atleta.status_kit === "entregue";


    const card =
    document.createElement("div");


    card.className =
    "atleta-card";


    card.innerHTML = `

        <div class="atleta-nome">

            ${escaparHTML(
                atleta.nome
            )}

        </div>


        <div class="dados-grid">


            <div class="dado numero">

                <span class="dado-label">
                    Número de peito
                </span>

                <span class="dado-valor">

                    ${escaparHTML(
                        atleta.numero_peito ||
                        "Não informado"
                    )}

                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Data de nascimento
                </span>

                <span class="dado-valor">

                    ${formatarDataNascimento(
                        atleta.data_nascimento
                    )}

                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Modalidade
                </span>

                <span class="dado-valor">

                    ${escaparHTML(
                        atleta.modalidade ||
                        "Não informada"
                    )}

                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Camiseta
                </span>

                <span class="dado-valor">

                    ${escaparHTML(
                        atleta.camiseta ||
                        "Não informada"
                    )}

                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Pelotão
                </span>

                <span class="dado-valor">

                    ${escaparHTML(
                        atleta.pelotao ||
                        "Não informado"
                    )}

                </span>

            </div>


        </div>


        <div class="produto">

            <span class="dado-label">
                Produtos
            </span>

            <span class="dado-valor">

                ${escaparHTML(
                    atleta.produto_extra ||
                    "Nenhum produto adicional"
                )}

            </span>

        </div>


        <div class="
            status
            ${entregue
                ? "entregue"
                : "pendente"}
        ">

            ${
                entregue
                ? "● ENTREGA REALIZADA"
                : "● AGUARDANDO RETIRADA"
            }

        </div>


        ${
            entregue
            ? gerarHistorico(atleta)
            : gerarFormularioRetirada(atleta)
        }

    `;


    return card;

}


/* =========================================================
   HISTÓRICO
========================================================= */

function gerarHistorico(atleta){

    return `

        <div class="historico">


            <div class="historico-linha">

                <span class="historico-label">
                    Retirado por
                </span>

                <span class="historico-valor">

                    ${escaparHTML(
                        atleta.retirado_por ||
                        "Não informado"
                    )}

                </span>

            </div>


            <div class="historico-linha">

                <span class="historico-label">
                    Atendimento realizado por
                </span>

                <span class="historico-valor">

                    ${escaparHTML(
                        atleta.entregue_por ||
                        atleta.retirado_login ||
                        "Não informado"
                    )}

                </span>

            </div>


            <div class="historico-linha">

                <span class="historico-label">
                    Data e horário
                </span>

                <span class="historico-valor">

                    ${formatarDataHora(
                        atleta.data_retirada
                    )}

                </span>

            </div>


        </div>

    `;

}


/* =========================================================
   FORMULÁRIO
========================================================= */

function gerarFormularioRetirada(atleta){

    const id =
    escaparHTML(atleta.id);


    return `

        <div class="retirada-area">


            <div class="retirada-titulo">

                Quem está realizando a retirada?

            </div>


            <div class="opcoes">


                <div class="opcao">

                    <input
                        type="radio"
                        name="retirada_${id}"
                        id="proprio_${id}"
                        value="proprio"
                        checked
                        onchange="
                        alterarTipoRetirada('${id}')
                        "
                    >

                    <label for="proprio_${id}">

                        Próprio atleta

                    </label>

                </div>


                <div class="opcao">

                    <input
                        type="radio"
                        name="retirada_${id}"
                        id="terceiro_${id}"
                        value="terceiro"
                        onchange="
                        alterarTipoRetirada('${id}')
                        "
                    >

                    <label for="terceiro_${id}">

                        Terceiro

                    </label>

                </div>


            </div>


            <div
                id="terceiroArea_${id}"
                class="campo-retirada"
                style="display:none;"
            >

                <label>
                    Nome de quem está retirando
                </label>

                <input
                    id="nomeTerceiro_${id}"
                    type="text"
                    placeholder="Digite o nome completo"
                >

            </div>


            <div class="campo-retirada">

                <label>
                    Observação
                </label>

                <textarea
                    id="observacao_${id}"
                    placeholder="Digite uma observação, se necessário"
                ></textarea>

            </div>


            <button
                class="btn-entregar"
                onclick="
                entregar(
                    '${id}',
                    ${JSON.stringify(atleta.nome)}
                )
                "
            >

                CONFIRMAR ENTREGA

            </button>


        </div>

    `;

}


/* =========================================================
   TIPO DE RETIRADA
========================================================= */

function alterarTipoRetirada(id){

    const terceiro =
    document.getElementById(
        "terceiro_" + id
    );


    const area =
    document.getElementById(
        "terceiroArea_" + id
    );


    if(
        terceiro &&
        terceiro.checked
    ){

        area.style.display =
        "block";

    }else{

        area.style.display =
        "none";

    }

}


/* =========================================================
   ENTREGA
========================================================= */

async function entregar(id,nome){

    const radioTerceiro =
    document.getElementById(
        "terceiro_" + id
    );


    const nomeTerceiro =
    document.getElementById(
        "nomeTerceiro_" + id
    );


    const observacao =
    document.getElementById(
        "observacao_" + id
    );


    const tipo =
    radioTerceiro &&
    radioTerceiro.checked
    ? "terceiro"
    : "proprio";


    let retiradoPor =
    "Retirado pelo próprio atleta";


    if(tipo === "terceiro"){

        retiradoPor =
        nomeTerceiro
        ? nomeTerceiro.value.trim()
        : "";


        if(!retiradoPor){

            await Swal.fire({

                title:
                "Informe o nome",

                text:
                "Digite o nome de quem está realizando a retirada.",

                icon:
                "warning",

                background:
                "#151719",

                color:
                "#ffffff",

                confirmButtonColor:
                "#20b56b"

            });

            return;

        }

    }


    const observacaoTexto =
    observacao
    ? observacao.value.trim()
    : "";


    const confirmacao =
    await Swal.fire({

        title:
        "Confirmar entrega",

        html:`

            <div style="
                color:#bfc3c7;
                line-height:1.7;
            ">

                <strong style="
                    color:#fff;
                    font-size:18px;
                ">

                    ${escaparHTML(nome)}

                </strong>

                <br><br>

                Retirado por:

                <strong style="
                    color:#20b56b;
                ">

                    ${escaparHTML(
                        retiradoPor
                    )}

                </strong>

            </div>

        `,

        icon:
        "question",

        background:
        "#151719",

        color:
        "#fff",

        showCancelButton:
        true,

        confirmButtonColor:
        "#20b56b",

        cancelButtonColor:
        "#303438",

        confirmButtonText:
        "Confirmar",

        cancelButtonText:
        "Cancelar"

    });


    if(!confirmacao.isConfirmed)
        return;


    /* =====================================================
       VERIFICA NOVAMENTE
    ===================================================== */

    const {
        data: atual,
        error: erroBusca
    } =
    await db
    .from("atletas_v2")
    .select(`
        id,
        status_kit,
        retirado_por,
        data_retirada
    `)
    .eq("id",id)
    .single();


    if(erroBusca){

        await Swal.fire({

            title:
            "Erro",

            text:
            "Não foi possível verificar o status atual.",

            icon:
            "error",

            background:
            "#151719",

            color:
            "#fff",

            confirmButtonColor:
            "#20b56b"

        });

        return;

    }


    if(
        atual.status_kit ===
        "entregue"
    ){

        await Swal.fire({

            title:
            "Entrega já realizada",

            html:`

                <div style="
                    color:#bfc3c7;
                    line-height:1.8;
                ">

                    Esta retirada já foi
                    registrada anteriormente.

                    <br><br>

                    <strong style="
                        color:#20b56b;
                    ">

                        ${escaparHTML(
                            atual.retirado_por ||
                            "Não informado"
                        )}

                    </strong>

                    <br>

                    ${formatarDataHora(
                        atual.data_retirada
                    )}

                </div>

            `,

            icon:
            "warning",

            background:
            "#151719",

            color:
            "#fff",

            confirmButtonColor:
            "#20b56b"

        });


        buscarAtletas();

        return;

    }


    const agora =
    new Date().toISOString();


    /* =====================================================
       ATUALIZA ATLETA
    ===================================================== */

    const {
        error: erroAtualizacao
    } =
    await db
    .from("atletas_v2")
    .update({

        status_kit:
        "entregue",

        retirado_por:
        retiradoPor,

        data_retirada:
        agora,

        entregue_por:
        usuarioLogado
        ? usuarioLogado.nome
        : "Desconhecido",

        entregue_por_usuario:
        usuarioLogado
        ? usuarioLogado.email
        : "Desconhecido",

        retirado_login:
        usuarioLogado
        ? usuarioLogado.email
        : "Desconhecido"

    })
    .eq("id",id)
    .neq(
        "status_kit",
        "entregue"
    );


    if(erroAtualizacao){

        console.error(
            erroAtualizacao
        );


        await Swal.fire({

            title:
            "Não foi possível concluir",

            text:
            erroAtualizacao.message,

            icon:
            "error",

            background:
            "#151719",

            color:
            "#fff",

            confirmButtonColor:
            "#20b56b"

        });

        return;

    }


    /* =====================================================
       HISTÓRICO
    ===================================================== */

    const {
        error: erroEntrega
    } =
    await db
    .from("entregas")
    .insert([{

        atleta_id:
        id,

        usuario_id:
        usuarioLogado
        ? usuarioLogado.id
        : null,

        retirado_por:
        retiradoPor,

        tipo_retirada:
        tipo,

        observacao:
        observacaoTexto ||
        null,

        entregue_em:
        agora

    }]);


    if(erroEntrega){

        console.warn(
            "Erro no histórico:",
            erroEntrega.message
        );

    }


    /* =====================================================
       AUDITORIA
    ===================================================== */

    await db
    .from("auditoria_v2")
    .insert([{

        evento_id:
        eventoId,

        usuario:
        usuarioLogado
        ? usuarioLogado.nome
        : "Desconhecido",

        acao:
        "Entrega realizada",

        detalhe:

        `Atleta: ${nome} | ` +

        `Retirado por: ${retiradoPor} | ` +

        `Tipo: ${tipo} | ` +

        `Observação: ${
            observacaoTexto ||
            "Nenhuma"
        } | ` +

        `Atendente: ${
            usuarioLogado
            ? usuarioLogado.email
            : "Desconhecido"
        } | ` +

        `Atleta ID: ${id}`

    }]);


    /* =====================================================
       SUCESSO
    ===================================================== */

    await Swal.fire({

        title:
        "Entrega confirmada",

        html:`

            <div style="
                color:#bfc3c7;
                line-height:1.8;
            ">

                <strong style="
                    color:#fff;
                    font-size:18px;
                ">

                    ${escaparHTML(nome)}

                </strong>

                <br>

                Retirado por:

                <strong style="
                    color:#20b56b;
                ">

                    ${escaparHTML(
                        retiradoPor
                    )}

                </strong>

            </div>

        `,

        icon:
        "success",

        background:
        "#151719",

        color:
        "#fff",

        confirmButtonColor:
        "#20b56b",

        confirmButtonText:
        "Concluído"

    });


    buscarAtletas();

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

verificarAcesso();

</script>

</body>

</html>
