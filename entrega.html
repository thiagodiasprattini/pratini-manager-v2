const SUPABASE_URL = "https://kchpprimvfnwchztwlsa.supabase.co";

const db = window.supabase.createClient(

</script>

<style>
:root{
    --verde:#7CFC00;
    --grafite:#202326;
    --grafite-claro:#2b2f33;
    --preto:#050505;
    --texto:#f5f5f5;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--grafite);
    color:var(--texto);
}

header{
    background:#111;
    border-bottom:1px solid #34383c;
    padding:22px;
    text-align:center;
    font-size:26px;
    font-weight:700;
    letter-spacing:.5px;
    color:#fff;
}

.container{
    padding:25px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#111;
    border:1px solid #34383c;
    padding:22px;
    border-radius:14px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.20);
}

h2{
    margin-top:0;
}

input,
select,
button{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:none;
    border-radius:9px;
    font-size:16px;
    box-sizing:border-box;
}

input,
select{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

button{
    background:var(--verde);
    color:#050505;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    filter:brightness(.9);
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.voltar{
    background:#333;
    color:white;
}

.ok{
    color:var(--verde);
    font-weight:bold;
}

.erro{
    color:#ff5252;
    font-weight:bold;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:4px;
    font-weight:bold;
}

.carregando{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-size:16px;
    color:#cfcfcf;
}
</style>
</head>

<body>

<div id="telaCarregando" class="carregando">
    Verificando acesso...
</div>

<div id="telaPainel" style="display:none;">

<header>
    CENTRAL DE IMPORTAÇÃO
</header>

<div class="container">

<div class="card">
    <h2 id="eventoAtivo"></h2>
</div>

<div class="card">

    <h2>Selecionar Planilha</h2>

    <input
        type="file"
        id="arquivo"
        accept=".xlsx,.xls,.csv"
    >

    <button onclick="lerArquivo()">
        Ler Planilha
    </button>

    <p>
        Formatos aceitos: Excel (.xlsx/.xls) e CSV.
    </p>

</div>

<div
    class="card"
    id="mapeamento"
    style="display:none;"
>

<h2>Mapear Colunas</h2>

<label>Nome do atleta</label>
<select id="colNome"></select>

<label>CPF</label>
<select id="colCpf"></select>

<label>Data de nascimento</label>
<select id="colNascimento"></select>

<label>Número de peito</label>
<select id="colNumero"></select>

<label>Modalidade</label>
<select id="colModalidade"></select>

<label>Camiseta</label>
<select id="colCamiseta"></select>

<label>Equipe</label>
<select id="colEquipe"></select>

<label>Pelotão</label>
<select id="colPelotao"></select>

<label>Produto Extra</label>
<select id="colProduto"></select>

<button onclick="preVisualizar()">
    Pré-visualizar Importação
</button>

</div>

<div
    class="card"
    id="preview"
    style="display:none;"
>

<h2>Pré-visualização</h2>

<p id="resumo"></p>

<button
    id="btnImportar"
    onclick="importarAtletas()"
>
    Importar Atletas
</button>

<p
    id="progresso"
    style="display:none;"
></p>

</div>

<div
    class="card"
    id="resultado"
    style="display:none;"
>

<h2>Resultado</h2>

<p id="resultadoTexto"></p>

</div>

<button
    class="voltar"
    onclick="location.href='dashboard.html'"
>
    Voltar ao Painel
</button>

</div>

</div>

<script>

let dadosPlanilha = [];
let colunas = [];
let nomeArquivo = "";
let usuarioLogado = null;

const eventoId =
    localStorage.getItem("evento_ativo_id");

const eventoNome =
    localStorage.getItem("evento_ativo_nome");


async function verificarAcesso(){

    const { data: sessao } =
        await db.auth.getSession();

    if(!sessao || !sessao.session){
        window.location.href = "login.html";
        return;
    }

    const usuario =
        sessao.session.user;

    const { data: perfil, error } =
        await db
        .from("perfis")
        .select("role,nome")
        .eq("id",usuario.id)
        .single();

    if(
        error ||
        !perfil ||
        perfil.role !== "admin"
    ){
        alert(
            "Acesso restrito ao administrador."
        );

        window.location.href =
            "dashboard.html";

        return;
    }

    usuarioLogado = {
        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email
    };

    document.getElementById(
        "eventoAtivo"
    ).innerText =
        eventoNome ||
        "Nenhum evento selecionado.";

    document.getElementById(
        "telaCarregando"
    ).style.display = "none";

    document.getElementById(
        "telaPainel"
    ).style.display = "block";
}


function normalizarTexto(txt){

    return (txt || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}


function sugerirColuna(palavras){

    for(const coluna of colunas){

        const c =
            normalizarTexto(coluna);

        for(const palavra of palavras){

            if(
                c.includes(
                    normalizarTexto(palavra)
                )
            ){
                return coluna;
            }
        }
    }

    return "";
}


function preencherSelects(){

    const campos = [

        [
            "colNome",
            [
                "nome completo",
                "nome",
                "atleta"
            ]
        ],

        [
            "colCpf",
            [
                "cpf",
                "documento"
            ]
        ],

        [
            "colNascimento",
            [
                "nascimento",
                "data nascimento",
                "data de nascimento"
            ]
        ],

        [
            "colNumero",
            [
                "numero de peito",
                "numero peito",
                "numero",
                "peito",
                "bib"
            ]
        ],

        [
            "colModalidade",
            [
                "modalidade",
                "distancia",
                "distância",
                "prova"
            ]
        ],

        [
            "colCamiseta",
            [
                "camiseta",
                "tamanho"
            ]
        ],

        [
            "colEquipe",
            [
                "equipe ou assessoria",
                "nome da equipe",
                "equipe",
                "assessoria"
            ]
        ],

        [
            "colPelotao",
            [
                "pelotao",
                "pelotão",
                "pace"
            ]
        ],

        [
            "colProduto",
            [
                "produto extra",
                "produto",
                "extra",
                "brinde"
            ]
        ]
    ];


    campos.forEach(
        ([id,sugestoes])=>{

            const select =
                document.getElementById(id);

            select.innerHTML =
                "<option value=''>Não importar</option>";

            colunas.forEach(col=>{

                const option =
                    document.createElement("option");

                option.value = col;
                option.textContent = col;

                select.appendChild(option);
            });

            const sugestao =
                sugerirColuna(sugestoes);

            if(sugestao){
                select.value = sugestao;
            }
        }
    );
}


function lerArquivo(){

    if(!eventoId){

        alert(
            "Selecione um evento antes de importar."
        );

        return;
    }

    const arquivo =
        document.getElementById(
            "arquivo"
        ).files[0];

    if(!arquivo){

        alert(
            "Selecione uma planilha."
        );

        return;
    }

    nomeArquivo =
        arquivo.name;

    if(
        nomeArquivo
        .toLowerCase()
        .endsWith(".csv")
    ){

        lerComoCsv(arquivo);

    }else{

        lerComoExcel(arquivo);

    }
}


function finalizarLeitura(dados){

    if(
        !dados ||
        dados.length === 0
    ){

        alert(
            "A planilha está vazia."
        );

        return;
    }

    dadosPlanilha = dados;

    colunas =
        Object.keys(
            dadosPlanilha[0]
        );

    preencherSelects();

    document.getElementById(
        "mapeamento"
    ).style.display = "block";

    alert(
        "Planilha lida com sucesso! " +
        dadosPlanilha.length +
        " linhas encontradas."
    );
}


function lerComoCsv(arquivo){

    Papa.parse(
        arquivo,
        {
            header:true,
            delimiter:";",
            skipEmptyLines:true,
            encoding:"UTF-8",

            complete:function(resultado){

                finalizarLeitura(
                    resultado.data
                );
            },

            error:function(erro){

                alert(
                    "Erro ao ler CSV: " +
                    erro.message
                );
            }
        }
    );
}


function lerComoExcel(arquivo){

    const leitor =
        new FileReader();

    leitor.onload =
        function(e){

            try{

                const data =
                    new Uint8Array(
                        e.target.result
                    );

                const workbook =
                    XLSX.read(
                        data,
                        {
                            type:"array",
                            cellDates:true
                        }
                    );

                const primeiraAba =
                    workbook.SheetNames[0];

                const planilha =
                    workbook.Sheets[
                        primeiraAba
                    ];

                const dados =
                    XLSX.utils.sheet_to_json(
                        planilha,
                        {
                            defval:""
                        }
                    );

                finalizarLeitura(dados);

            }catch(erro){

                alert(
                    "Erro ao ler planilha: " +
                    erro.message
                );
            }
        };

    leitor.readAsArrayBuffer(
        arquivo
    );
}


function valor(linha,campo){

    const coluna =
        document.getElementById(
            campo
        ).value;

    if(!coluna){
        return "";
    }

    const valorOriginal =
        linha[coluna];

    if(
        valorOriginal === null ||
        valorOriginal === undefined
    ){
        return "";
    }

    if(
        valorOriginal instanceof Date
    ){

        return valorOriginal
            .toISOString()
            .split("T")[0];
    }

    return valorOriginal
        .toString()
        .trim();
}


function converterData(valorData){

    if(!valorData){
        return null;
    }

    let valor =
        valorData
        .toString()
        .trim();

    // dd/mm/yyyy
    const br =
        valor.match(
            /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
        );

    if(br){

        return (
            br[3] + "-" +
            br[2].padStart(2,"0") + "-" +
            br[1].padStart(2,"0")
        );
    }

    // yyyy-mm-dd
    const iso =
        valor.match(
            /^(\d{4})-(\d{1,2})-(\d{1,2})$/
        );

    if(iso){

        return (
            iso[1] + "-" +
            iso[2].padStart(2,"0") + "-" +
            iso[3].padStart(2,"0")
        );
    }

    return null;
}


function preVisualizar(){

    const total =
        dadosPlanilha.length;

    const campoNome =
        document.getElementById(
            "colNome"
        ).value;

    if(!campoNome){

        alert(
            "A coluna Nome do atleta é obrigatória."
        );

        return;
    }

    let validos = 0;

    dadosPlanilha.forEach(
        linha=>{

            if(
                valor(
                    linha,
                    "colNome"
                )
            ){

                validos++;
            }
        }
    );

    document.getElementById(
        "preview"
    ).style.display = "block";

    document.getElementById(
        "resumo"
    ).innerHTML = `

        Evento:
        <b>${eventoNome}</b>
        <br><br>

        Arquivo:
        <b>${nomeArquivo}</b>
        <br><br>

        Linhas encontradas:
        <b>${total}</b>
        <br>

        Atletas válidos:
        <b>${validos}</b>
        <br>

        Registros sem nome:
        <b>${total-validos}</b>

        <br><br>

        Clique em importar para gravar no banco.
    `;
}


async function buscarAtletaExistente(
    cpf,
    numero
){

    if(cpf){

        const {data} =
            await db
            .from("atletas_v2")
            .select("*")
            .eq("evento_id",eventoId)
            .eq("cpf",cpf)
            .limit(1);

        if(
            data &&
            data.length > 0
        ){

            return data[0];
        }
    }


    if(numero){

        const {data} =
            await db
            .from("atletas_v2")
            .select("*")
            .eq("evento_id",eventoId)
            .eq("numero_peito",numero)
            .limit(1);

        if(
            data &&
            data.length > 0
        ){

            return data[0];
        }
    }

    return null;
}


async function importarAtletas(){

    const botao =
        document.getElementById(
            "btnImportar"
        );

    const progresso =
        document.getElementById(
            "progresso"
        );

    botao.disabled = true;

    botao.innerText =
        "Importando...";

    progresso.style.display =
        "block";

    let novos = 0;
    let atualizados = 0;
    let ignorados = 0;
    let erros = 0;

    let ultimoErro = "";

    try{

        const total =
            dadosPlanilha.length;

        let processados = 0;

        for(
            const linha of dadosPlanilha
        ){

            processados++;

            progresso.innerText =
                `Importando ${processados} de ${total}...`;

            const nome =
                valor(linha,"colNome");

            const cpf =
                valor(linha,"colCpf");

            const data_nascimento =
                converterData(
                    valor(
                        linha,
                        "colNascimento"
                    )
                );

            const numero_peito =
                valor(
                    linha,
                    "colNumero"
                );

            const modalidade =
                valor(
                    linha,
                    "colModalidade"
                );

            const camiseta =
                valor(
                    linha,
                    "colCamiseta"
                );

            const equipe =
                valor(
                    linha,
                    "colEquipe"
                );

            const pelotao =
                valor(
                    linha,
                    "colPelotao"
                );

            const produto_extra =
                valor(
                    linha,
                    "colProduto"
                );


            if(!nome){

                ignorados++;
                continue;
            }


            try{

                const existente =
                    await buscarAtletaExistente(
                        cpf,
                        numero_peito
                    );


                const dadosAtleta = {

                    evento_id: eventoId,

                    nome,

                    cpf:
                        cpf || null,

                    data_nascimento,

                    numero_peito:
                        numero_peito || null,

                    modalidade:
                        modalidade || null,

                    camiseta:
                        camiseta || null,

                    equipe:
                        equipe || null,

                    pelotao:
                        pelotao || null,

                    produto_extra:
                        produto_extra || null
                };


                if(existente){

                    const {error} =
                        await db
                        .from("atletas_v2")
                        .update(
                            dadosAtleta
                        )
                        .eq(
                            "id",
                            existente.id
                        );

                    if(error){

                        erros++;

                        ultimoErro =
                            error.message;

                    }else{

                        atualizados++;
                    }


                }else{

                    const {error} =
                        await db
                        .from("atletas_v2")
                        .insert([{

                            ...dadosAtleta,

                            origem_importacao:
                                nomeArquivo,

                            importacao_id:
                                null,

                            status_kit:
                                "pendente"
                        }]);


                    if(error){

                        erros++;

                        ultimoErro =
                            error.message;

                    }else{

                        novos++;
                    }
                }


            }catch(e){

                erros++;

                ultimoErro =
                    e.message;
            }
        }


        await db
        .from("importacoes_v2")
        .insert([{

            evento_id:
                eventoId,

            nome_arquivo:
                nomeArquivo,

            usuario:
                usuarioLogado
                ? usuarioLogado.nome
                : "Desconhecido",

            total_linhas:
                dadosPlanilha.length,

            novos,

            atualizados,

            ignorados,

            erros
        }]);


        await db
        .from("auditoria_v2")
        .insert([{

            evento_id:
                eventoId,

            usuario:
                usuarioLogado
                ? usuarioLogado.nome
                : "Desconhecido",

            acao:
                "Importação de planilha",

            detalhe:
                `${nomeArquivo} | Novos: ${novos} | Atualizados: ${atualizados} | Ignorados: ${ignorados} | Erros: ${erros}`
        }]);


        progresso.style.display =
            "none";

        document.getElementById(
            "resultado"
        ).style.display = "block";

        document.getElementById(
            "resultadoTexto"
        ).innerHTML = `

            <span class="ok">
                Importação concluída!
            </span>

            <br><br>

            Novos atletas:
            <b>${novos}</b>

            <br>

            Atualizados:
            <b>${atualizados}</b>

            <br>

            Ignorados:
            <b>${ignorados}</b>

            <br>

            Erros:
            <b>${erros}</b>

            ${
                erros > 0
                ?
                `<br><br>
                <span class="erro">
                    Último erro:
                    ${ultimoErro}
                </span>`
                :
                ""
            }
        `;


    }catch(erroGeral){

        progresso.style.display =
            "none";

        document.getElementById(
            "resultado"
        ).style.display = "block";

        document.getElementById(
            "resultadoTexto"
        ).innerHTML = `

            <span class="erro">
                A importação encontrou um erro.
            </span>

            <br><br>

            ${erroGeral.message}

        `;

        console.error(
            erroGeral
        );


    }finally{

        botao.disabled = false;

        botao.innerText =
            "Importar Atletas";
    }
}


verificarAcesso();

</script>

</body>
</html>
