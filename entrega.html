<style>

/* =========================================================
   CORES
========================================================= */

:root{
    --verde:#7CFC00;

    --grafite:#242424;
    --grafite-2:#2b2b2b;

    --preto:#111111;
    --preto-card:#101010;

    --cinza:#3a3a3a;
    --cinza-claro:#555555;

    --branco:#ffffff;
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        Arial,
        "Helvetica Neue",
        Helvetica,
        sans-serif;

    background:
        var(--grafite);

    color:#fff;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}


/* =========================================================
   CARREGAMENTO
========================================================= */

.carregando{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:18px;

    color:#cccccc;

    background:
        var(--grafite);
}


/* =========================================================
   CABEÇALHO
========================================================= */

header{
    position:relative;

    min-height:145px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        var(--grafite);

    border-bottom:
        1px solid #3a3a3a;

    padding:
        25px 190px;
}


/* =========================================================
   LOGO
========================================================= */

.logo-topo{
    position:absolute;

    right:35px;
    top:50%;

    transform:translateY(-50%);

    width:150px;
    max-width:18vw;

    height:auto;

    object-fit:contain;
}


/* =========================================================
   TÍTULO
========================================================= */

.titulo-central{
    width:100%;

    text-align:center;

    font-size:34px;

    font-weight:700;

    letter-spacing:1px;

    color:#f1f1f1;
}


/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:100%;

    max-width:1100px;

    margin:0 auto;

    padding:
        30px 20px 60px;
}


/* =========================================================
   CARD GENÉRICO
========================================================= */

.card{
    border-radius:16px;

    padding:24px;

    margin-bottom:20px;

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 8px 24px rgba(0,0,0,.28);
}


/* =========================================================
   EVENTO
========================================================= */

.evento-card{
    background:
        var(--grafite-2);
}

.evento-card h2{
    margin:
        0 0 8px;

    font-size:19px;

    color:#bdbdbd;
}

#eventoAtivo{
    margin:0;

    font-size:22px;

    font-weight:700;

    color:#fff;
}


/* =========================================================
   PESQUISA
========================================================= */

.pesquisa-card{
    background:
        var(--grafite-2);
}

.pesquisa-card h2{
    margin:
        0 0 14px;

    font-size:22px;
}

#busca{
    width:100%;

    padding:
        17px 18px;

    border-radius:11px;

    border:
        1px solid #484848;

    background:
        #151515;

    color:#fff;

    font-size:20px;

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

#busca:focus{
    border-color:
        var(--verde);

    box-shadow:
        0 0 0 3px
        rgba(124,252,0,.10);
}

#busca::placeholder{
    color:#777;
}


/* =========================================================
   BOTÕES
========================================================= */

button{
    width:100%;

    padding:
        16px 20px;

    margin-top:12px;

    border:0;

    border-radius:11px;

    font-size:18px;

    font-weight:700;

    cursor:pointer;

    transition:
        transform .15s ease,
        filter .15s ease,
        box-shadow .15s ease;
}

button:hover{
    filter:brightness(1.08);
}

button:active{
    transform:scale(.99);
}


/* =========================================================
   BOTÃO PESQUISAR
========================================================= */

.btn-buscar{
    background:
        var(--verde);

    color:#111;

    box-shadow:
        0 4px 14px
        rgba(124,252,0,.15);
}


/* =========================================================
   BOTÃO ENTREGAR
========================================================= */

.btn-entregar{
    background:
        var(--verde);

    color:#111;

    font-size:20px;

    padding:18px;

    box-shadow:
        0 5px 18px
        rgba(124,252,0,.20);
}

.btn-entregar:hover{
    box-shadow:
        0 6px 24px
        rgba(124,252,0,.35);
}


/* =========================================================
   VOLTAR
========================================================= */

.voltar{
    background:
        #3a3a3a;

    color:#fff;

    margin-top:20px;
}


/* =========================================================
   RESULTADOS
========================================================= */

#resultado{
    width:100%;
}


/* =========================================================
   CARD DO ATLETA
========================================================= */

/*
   O fundo externo agora é mais claro.
   O card continua preto.
   O contorno recebe uma sombra verde discreta.
*/

.atleta-card{

    padding:0;

    overflow:hidden;

    margin-bottom:32px;

    background:
        var(--preto-card);

    border:
        1px solid rgba(124,252,0,.32);

    border-radius:18px;

    box-shadow:
        0 0 0 1px rgba(124,252,0,.08),
        0 8px 26px rgba(0,0,0,.42),
        0 0 18px rgba(124,252,0,.12);

    position:relative;

    transition:
        box-shadow .2s ease,
        transform .2s ease;
}


/* =========================================================
   DESTAQUE DO CARD AO PASSAR O MOUSE
========================================================= */

.atleta-card:hover{

    box-shadow:
        0 0 0 1px rgba(124,252,0,.16),
        0 10px 30px rgba(0,0,0,.48),
        0 0 25px rgba(124,252,0,.20);

}


/* =========================================================
   CABEÇALHO DO ATLETA
========================================================= */

.atleta-topo{

    text-align:center;

    padding:
        27px 20px 24px;

    background:
        #0d0d0d;

    border-bottom:
        1px solid #303030;
}


/* =========================================================
   NOME
========================================================= */

.nome-atleta{

    margin:0;

    font-size:34px;

    line-height:1.15;

    font-weight:800;

    color:#fff;

    overflow-wrap:anywhere;
}


/* =========================================================
   LABEL NÚMERO
========================================================= */

.label-numero{

    margin-top:17px;

    font-size:14px;

    text-transform:uppercase;

    letter-spacing:2px;

    color:#888;
}


/* =========================================================
   NÚMERO DE PEITO
========================================================= */

.numero-peito{

    margin:
        4px 0 0;

    font-size:60px;

    line-height:1;

    font-weight:900;

    color:
        var(--verde);

    letter-spacing:2px;

    text-shadow:
        0 0 14px
        rgba(124,252,0,.22);
}


/* =========================================================
   DADOS
========================================================= */

.atleta-dados{
    padding:25px;
}

.dados-grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}


.dado{

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:11px;

    padding:
        15px 16px;

    min-height:72px;
}


.dado-label{

    display:block;

    margin-bottom:6px;

    font-size:13px;

    text-transform:uppercase;

    letter-spacing:.7px;

    color:#929292;
}


.dado-valor{

    display:block;

    font-size:20px;

    font-weight:700;

    color:#fff;

    line-height:1.25;

    overflow-wrap:anywhere;
}


.data-nascimento{
    font-size:21px;
}


/* =========================================================
   AGUARDANDO ENTREGA
   AGORA É CINZA — NÃO VERDE
========================================================= */

.status-area{
    margin-top:20px;

    padding:16px;

    border-radius:11px;

    text-align:center;
}


/* PENDENTE */

.status-pendente{

    background:
        #252525;

    border:
        1px solid #444;

    color:
        #bdbdbd;

    font-size:18px;

    font-weight:800;

    letter-spacing:.5px;
}


/* =========================================================
   ENTREGA JÁ REALIZADA
========================================================= */

.status-entregue{

    background:
        #252525;

    border:
        1px solid #444;

    color:
        #bdbdbd;

    font-size:19px;

    font-weight:800;
}


/* =========================================================
   INFORMAÇÕES DA ENTREGA
========================================================= */

.entrega-info{

    margin-top:18px;

    padding:18px;

    background:
        rgba(255,255,255,.035);

    border-radius:11px;

    border:
        1px solid rgba(255,255,255,.08);
}


.entrega-info p{

    margin:
        8px 0;

    font-size:18px;

    line-height:1.4;

    color:#eee;
}


.entrega-info strong{
    color:#aaa;
}


/* =========================================================
   ÁREA DE RETIRADA
========================================================= */

.area-retirada{
    margin-top:20px;
}


.area-retirada label{

    display:block;

    margin-bottom:8px;

    font-size:16px;

    font-weight:700;

    color:#ddd;
}


.observacao{

    width:100%;

    min-height:90px;

    resize:vertical;

    padding:14px;

    border-radius:10px;

    border:
        1px solid #444;

    background:
        #111;

    color:#fff;

    font-size:18px;

    outline:none;
}


.observacao:focus{

    border-color:
        var(--verde);

    box-shadow:
        0 0 0 3px
        rgba(124,252,0,.08);
}


/* =========================================================
   TIPO DE RETIRADA
========================================================= */

.tipo-retirada{
    margin-top:18px;
}


.tipo-retirada-titulo{

    display:block;

    margin-bottom:10px;

    font-size:16px;

    font-weight:700;

    color:#ddd;
}


.opcoes-retirada{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:10px;
}


.opcao-retirada{

    display:flex;

    align-items:center;

    gap:10px;

    padding:14px;

    border-radius:10px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

    cursor:pointer;

    font-size:17px;
}


.opcao-retirada input{

    width:20px;

    height:20px;

    margin:0;

    accent-color:
        var(--verde);
}


/* =========================================================
   TERCEIRO
========================================================= */

.terceiro-area{

    display:none;

    margin-top:14px;
}


.terceiro-area.ativo{
    display:block;
}


.terceiro-area input{

    width:100%;

    padding:15px;

    border-radius:10px;

    border:
        1px solid #444;

    background:
        #111;

    color:#fff;

    font-size:18px;

    outline:none;
}


.terceiro-area input:focus{

    border-color:
        var(--verde);
}


/* =========================================================
   SWEET ALERT
========================================================= */

.swal2-confirm{

    background:
        var(--verde) !important;

    color:#111 !important;
}


.swal2-cancel{

    background:
        #444 !important;
}


/* =========================================================
   RESPONSIVO
========================================================= */

@media(max-width:700px){

    header{

        min-height:125px;

        padding:
            20px 120px 20px 20px;
    }


    .logo-topo{

        right:18px;

        width:100px;

        max-width:24vw;
    }


    .titulo-central{

        font-size:27px;
    }


    .container{

        padding:
            20px 12px 40px;
    }


    .atleta-card{

        margin-bottom:28px;
    }


    .nome-atleta{

        font-size:29px;
    }


    .numero-peito{

        font-size:50px;
    }


    .dados-grid{

        grid-template-columns:1fr;
    }


    .opcoes-retirada{

        grid-template-columns:1fr;
    }


    .dado-valor{

        font-size:19px;
    }

}


@media(max-width:430px){

    header{

        min-height:110px;

        padding-right:95px;
    }


    .logo-topo{

        width:80px;
    }


    .titulo-central{

        font-size:23px;
    }


    .nome-atleta{

        font-size:25px;
    }


    .numero-peito{

        font-size:45px;
    }


    .card{

        border-radius:13px;
    }

}

</style>
