<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;

const eventoId =
localStorage.getItem(
    "evento_ativo_id"
);


/* =========================================================
   ELEMENTOS
========================================================= */

const buscaInput =
document.getElementById(
    "busca"
);


const btnBuscar =
document.getElementById(
    "btnBuscar"
);


const btnVoltar =
document.getElementById(
    "btnVoltar"
);


/* =========================================================
   EVENTOS
========================================================= */

btnBuscar.addEventListener(
    "click",
    buscarAtletas
);


btnVoltar.addEventListener(
    "click",
    function(){

        window.location.href =
        "dashboard.html";

    }
);


buscaInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            buscarAtletas();

        }

    }
);


/* =========================================================
   ACESSO
========================================================= */

async function verificarAcesso(){

    try{

        const {
            data: sessao,
            error: erroSessao
        } =
        await db.auth.getSession();


        if(
            erroSessao ||
            !sessao ||
            !sessao.session
        ){

            window.location.href =
            "login.html";

            return;

        }


        const usuario =
        sessao.session.user;


        const {
            data: perfil,
            error
        } =
        await db
        .from("perfis")
        .select("role, nome")
        .eq("id",usuario.id)
        .single();


        if(error || !perfil){

            window.location.href =
            "index.html";

            return;

        }


        usuarioLogado = {

            id:
            usuario.id,

            nome:
            perfil.nome ||
            usuario.email,

            email:
            usuario.email

        };


        const eventoNome =
        localStorage.getItem(
            "evento_ativo_nome"
        );


        document.getElementById(
            "eventoAtivo"
        ).textContent =
        eventoNome ||
        "Nenhum evento ativo selecionado.";


        document.getElementById(
            "telaCarregando"
        ).style.display =
        "none";


        document.getElementById(
            "telaPainel"
        ).style.display =
        "block";


        buscaInput.focus();


    }catch(error){

        console.error(error);

        window.location.href =
        "login.html";

    }

}


/* =========================================================
   NORMALIZAR TEXTO
========================================================= */

function normalizar(txt){

    return String(txt ?? "")
        .toLocaleLowerCase("pt-BR")
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .trim();

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarDataNascimento(data){

    if(!data){

        return "Não informada";

    }


    const texto =
    String(data).trim();


    const partes =
    texto
    .substring(0,10)
    .split("-");


    if(partes.length === 3){

        const ano =
        partes[0];

        const mes =
        partes[1];

        const dia =
        partes[2];


        if(
            ano.length === 4 &&
            mes.length === 2 &&
            dia.length === 2
        ){

            return (
                dia +
                "/" +
                mes +
                "/" +
                ano
            );

        }

    }


    return texto;

}


/* =========================================================
   FORMATAR DATA/HORA
========================================================= */

function formatarDataHora(data){

    if(!data){

        return "Não informada";

    }


    return new Date(data)
        .toLocaleString(
            "pt-BR",
            {
                timeZone:
                "America/Sao_Paulo"
            }
        );

}


/* =========================================================
   BUSCAR ATLETAS
========================================================= */

async function buscarAtletas(){

    const termo =
    buscaInput.value.trim();


    const resultado =
    document.getElementById(
        "resultado"
    );


    if(!eventoId){

        resultado.innerHTML = "";

        const mensagem =
        document.createElement(
            "div"
        );

        mensagem.className =
        "mensagem";

        mensagem.textContent =
        "Nenhum evento ativo selecionado.";

        resultado.appendChild(
            mensagem
        );

        return;

    }


    if(!termo){

        resultado.innerHTML = "";

        const mensagem =
        document.createElement(
            "div"
        );

        mensagem.className =
        "mensagem";

        mensagem.textContent =
        "Digite o nome ou número de peito.";

        resultado.appendChild(
            mensagem
        );

        buscaInput.focus();

        return;

    }


    resultado.innerHTML = "";


    const carregando =
    document.createElement(
        "div"
    );

    carregando.className =
    "mensagem";

    carregando.textContent =
    "Pesquisando atletas...";

    resultado.appendChild(
        carregando
    );


    /*
       IMPORTANTE:

       Usamos select("*") em vez de
       listar manualmente as colunas.

       Assim, se "pelotao" ainda não
       estiver criado no Supabase,
       a pesquisa não quebra.
    */

    const {
        data,
        error
    } =
    await db
    .from("atletas_v2")
    .select("*")
    .eq(
        "evento_id",
        eventoId
    )
    .limit(1000);


    if(error){

        console.error(error);

        resultado.innerHTML = "";

        const mensagem =
        document.createElement(
            "div"
        );

        mensagem.className =
        "mensagem";

        mensagem.textContent =
        "Erro ao pesquisar: " +
        error.message;

        resultado.appendChild(
            mensagem
        );

        return;

    }


    const busca =
    normalizar(termo);


    const encontrados =
    (data || []).filter(
        function(atleta){

            const nome =
            normalizar(
                atleta.nome
            );


            const numero =
            normalizar(
                atleta.numero_peito
            );


            return (
                nome.includes(busca) ||
                numero.includes(busca)
            );

        }
    );


    if(
        encontrados.length === 0
    ){

        resultado.innerHTML = "";

        const mensagem =
        document.createElement(
            "div"
        );

        mensagem.className =
        "mensagem";

        mensagem.textContent =
        "Nenhum atleta encontrado.";

        resultado.appendChild(
            mensagem
        );

        return;

    }


    resultado.innerHTML = "";


    /*
       Ordena por número de peito
       quando possível.
    */

    encontrados.sort(
        function(a,b){

            const na =
            parseInt(
                a.numero_peito
            ) || 999999;

            const nb =
            parseInt(
                b.numero_peito
            ) || 999999;

            return na - nb;

        }
    );


    encontrados.forEach(
        function(atleta){

            const card =
            criarCardAtleta(
                atleta
            );

            resultado.appendChild(
                card
            );

        }
    );

}


/* =========================================================
   CRIAR CARD
========================================================= */

function criarCardAtleta(atleta){

    const card =
    document.createElement(
        "div"
    );


    card.className =
    "atleta-card";


    /*
       Número
    */

    const numeroBox =
    document.createElement(
        "div"
    );

    numeroBox.className =
    "numero-destaque";


    const numeroLabel =
    document.createElement(
        "span"
    );

    numeroLabel.className =
    "numero-label";

    numeroLabel.textContent =
    "Número de peito";


    const numeroValor =
    document.createElement(
        "span"
    );

    numeroValor.className =
    "numero-valor";

    numeroValor.textContent =
    atleta.numero_peito ||
    "—";


    numeroBox.appendChild(
        numeroLabel
    );

    numeroBox.appendChild(
        numeroValor
    );


    /*
       Nome
    */

    const nome =
    document.createElement(
        "div"
    );

    nome.className =
    "atleta-nome";

    /*
       textContent é proposital.
       Preserva André, João,
       Márcia, José etc.
    */

    nome.textContent =
    atleta.nome ||
    "Nome não informado";


    /*
       Grid
    */

    const grid =
    document.createElement(
        "div"
    );

    grid.className =
    "dados-grid";


    grid.appendChild(
        criarDado(
            "Data de nascimento",
            formatarDataNascimento(
                atleta.data_nascimento
            ),
            "nascimento"
        )
    );


    grid.appendChild(
        criarDado(
            "Modalidade",
            atleta.modalidade ||
            "Não informada"
        )
    );


    grid.appendChild(
        criarDado(
            "Camiseta",
            atleta.camiseta ||
            "Não informada"
        )
    );


    /*
       Pelotão

       O sistema aceita tanto:
       atleta.pelotao

       quanto:
       atleta.pelotão

       caso algum arquivo antigo
       tenha sido importado dessa forma.
    */

    const pelotao =
    atleta.pelotao ||
    atleta["pelotão"] ||
    "Não informado";


    grid.appendChild(
        criarDado(
            "Pelotão",
            pelotao
        )
    );


    /*
       Produtos
    */

    const produto =
    document.createElement(
        "div"
    );

    produto.className =
    "produto";


    const produtoLabel =
    document.createElement(
        "span"
    );

    produtoLabel.className =
    "dado-label";

    produtoLabel.textContent =
    "Produtos";


    const produtoValor =
    document.createElement(
        "span"
    );

    produtoValor.className =
    "dado-valor";

    produtoValor.textContent =
    atleta.produto_extra ||
    "Nenhum produto adicional";


    produto.appendChild(
        produtoLabel
    );

    produto.appendChild(
        produtoValor
    );


    /*
       Status
    */

    const entregue =
    atleta.status_kit ===
    "entregue";


    const status =
    document.createElement(
        "div"
    );

    status.className =
    "status " +
    (
        entregue
        ? "entregue"
        : "pendente"
    );


    status.textContent =
    entregue
    ? "● ENTREGA REALIZADA"
    : "● AGUARDANDO RETIRADA";


    /*
       Montagem
    */

    card.appendChild(
        numeroBox
    );

    card.appendChild(
        nome
    );

    card.appendChild(
        grid
    );

    card.appendChild(
        produto
    );

    card.appendChild(
        status
    );


    /*
       Histórico ou formulário
    */

    if(entregue){

        card.appendChild(
            criarHistorico(
                atleta
            )
        );

    }else{

        card.appendChild(
            criarFormularioRetirada(
                atleta
            )
        );

    }


    return card;

}


/* =========================================================
   CRIAR DADO
========================================================= */

function criarDado(
    label,
    valor,
    classeExtra = ""
){

    const dado =
    document.createElement(
        "div"
    );


    dado.className =
    "dado " +
    classeExtra;


    const titulo =
    document.createElement(
        "span"
    );

    titulo.className =
    "dado-label";

    titulo.textContent =
    label;


    const texto =
    document.createElement(
        "span"
    );

    texto.className =
    "dado-valor";

    texto.textContent =
    valor;


    dado.appendChild(
        titulo
    );

    dado.appendChild(
        texto
    );


    return dado;

}


/* =========================================================
   FORMULÁRIO DE RETIRADA
========================================================= */

function criarFormularioRetirada(
    atleta
){

    const area =
    document.createElement(
        "div"
    );

    area.className =
    "retirada-area";


    const titulo =
    document.createElement(
        "div"
    );

    titulo.className =
    "retirada-titulo";

    titulo.textContent =
    "Quem está realizando a retirada?";


    /*
       OPÇÕES
    */

    const opcoes =
    document.createElement(
        "div"
    );

    opcoes.className =
    "opcoes";


    /*
       PRÓPRIO
    */

    const opcaoProprio =
    document.createElement(
        "div"
    );

    opcaoProprio.className =
    "opcao";


    const radioProprio =
    document.createElement(
        "input"
    );

    radioProprio.type =
    "radio";

    radioProprio.name =
    "retirada_" +
    atleta.id;

    radioProprio.value =
    "proprio";

    radioProprio.checked =
    true;

    radioProprio.id =
    "proprio_" +
    atleta.id;


    const labelProprio =
    document.createElement(
        "label"
    );

    labelProprio.htmlFor =
    radioProprio.id;

    labelProprio.textContent =
    "Próprio atleta";


    opcaoProprio.appendChild(
        radioProprio
    );

    opcaoProprio.appendChild(
        labelProprio
    );


    /*
       TERCEIRO
    */

    const opcaoTerceiro =
    document.createElement(
        "div"
    );

    opcaoTerceiro.className =
    "opcao";


    const radioTerceiro =
    document.createElement(
        "input"
    );

    radioTerceiro.type =
    "radio";

    radioTerceiro.name =
    "retirada_" +
    atleta.id;

    radioTerceiro.value =
    "terceiro";

    radioTerceiro.id =
    "terceiro_" +
    atleta.id;


    const labelTerceiro =
    document.createElement(
        "label"
    );

    labelTerceiro.htmlFor =
    radioTerceiro.id;

    labelTerceiro.textContent =
    "Terceiro";


    opcaoTerceiro.appendChild(
        radioTerceiro
    );

    opcaoTerceiro.appendChild(
        labelTerceiro
    );


    opcoes.appendChild(
        opcaoProprio
    );

    opcoes.appendChild(
        opcaoTerceiro
    );


    /*
       ÁREA TERCEIRO
    */

    const terceiroArea =
    document.createElement(
        "div"
    );

    terceiroArea.className =
    "campo-retirada";

    terceiroArea.style.display =
    "none";


    const labelNome =
    document.createElement(
        "label"
    );

    labelNome.textContent =
    "Nome de quem está retirando";


    const inputNome =
    document.createElement(
        "input"
    );

    inputNome.type =
    "text";

    inputNome.placeholder =
    "Digite o nome completo";

    inputNome.autocomplete =
    "off";


    terceiroArea.appendChild(
        labelNome
    );

    terceiroArea.appendChild(
        inputNome
    );


    /*
       OBSERVAÇÃO
    */

    const observacaoArea =
    document.createElement(
        "div"
    );

    observacaoArea.className =
    "campo-retirada";


    const labelObs =
    document.createElement(
        "label"
    );

    labelObs.textContent =
    "Observação";


    const textarea =
    document.createElement(
        "textarea"
    );

    textarea.placeholder =
    "Digite uma observação, se necessário";


    observacaoArea.appendChild(
        labelObs
    );

    observacaoArea.appendChild(
        textarea
    );


    /*
       BOTÃO
    */

    const botao =
    document.createElement(
        "button"
    );

    botao.className =
    "btn-entregar";

    botao.textContent =
    "CONFIRMAR ENTREGA";


    botao.addEventListener(
        "click",
        function(){

            entregar(
                atleta.id,
                atleta.nome,
                radioTerceiro,
                inputNome,
                textarea
            );

        }
    );


    /*
       Alternância
    */

    radioProprio.addEventListener(
        "change",
        function(){

            terceiroArea.style.display =
            "none";

            inputNome.value =
            "";

        }
    );


    radioTerceiro.addEventListener(
        "change",
        function(){

            terceiroArea.style.display =
            "block";

            setTimeout(
                function(){

                    inputNome.focus();

                },
                100
            );

        }
    );


    /*
       Montagem
    */

    area.appendChild(
        titulo
    );

    area.appendChild(
        opcoes
    );

    area.appendChild(
        terceiroArea
    );

    area.appendChild(
        observacaoArea
    );

    area.appendChild(
        botao
    );


    return area;

}


/* =========================================================
   HISTÓRICO
========================================================= */

function criarHistorico(
    atleta
){

    const historico =
    document.createElement(
        "div"
    );

    historico.className =
    "historico";


    historico.appendChild(
        criarLinhaHistorico(
            "Retirado por",
            atleta.retirado_por ||
            "Não informado"
        )
    );


    historico.appendChild(
        criarLinhaHistorico(
            "Atendimento realizado por",
            atleta.entregue_por ||
            atleta.retirado_login ||
            "Não informado"
        )
    );


    historico.appendChild(
        criarLinhaHistorico(
            "Data e horário",
            formatarDataHora(
                atleta.data_retirada
            )
        )
    );


    return historico;

}

/* =========================================================
   ENTREGA
========================================================= */

async function entregar(
    id,
    nome,
    radioTerceiro,
    inputNome,
    textarea
){

    const tipo =
    radioTerceiro.checked
    ? "terceiro"
    : "proprio";


    let retiradoPor =
    "Retirado pelo próprio atleta";


    if(
        tipo ===
        "terceiro"
    ){

        retiradoPor =
        inputNome.value.trim();


        if(!retiradoPor){

            await Swal.fire({

                title:
                "Informe o nome",

                text:
                "Digite o nome de quem está realizando a retirada.",

                icon:
                "warning",

                background:
                "#171A1C",

                color:
                "#FFFFFF",

                confirmButtonColor:
                "#00C875",

                confirmButtonText:
                "Entendi"

            });

            inputNome.focus();

            return;

        }

    }


    const observacao =
    textarea.value.trim();


    /*
       CONFIRMAÇÃO
    */

    const confirmacao =
    await Swal.fire({

        title:
        "Confirmar entrega?",

        html:

        "<div style='color:#BFC5C8;line-height:1.7'>" +

        "<strong style='color:#FFFFFF;font-size:18px'>" +

        nome +

        "</strong>" +

        "<br><br>" +

        "Retirado por: " +

        "<strong style='color:#18E58A'>" +

        retiradoPor +

        "</strong>" +

        "</div>",

        icon:
        "question",

        background:
        "#171A1C",

        color:
        "#FFFFFF",

        showCancelButton:
        true,

        confirmButtonColor:
        "#00C875",

        cancelButtonColor:
        "#303438",

        confirmButtonText:
        "Confirmar",

        cancelButtonText:
        "Cancelar"

    });


    if(
        !confirmacao.isConfirmed
    ){

        return;

    }


    /*
       VERIFICA NOVAMENTE
       PARA EVITAR DUPLA ENTREGA
    */

    const {
        data: atual,
        error: erroBusca
    } =
    await db
    .from("atletas_v2")
    .select(
        "id,status_kit,retirado_por,data_retirada"
    )
    .eq(
        "id",
        id
    )
    .single();


    if(erroBusca){

        await Swal.fire({

            title:
            "Erro",

            text:
            "Não foi possível verificar o status atual.",

            icon:
            "error",

            background:
            "#171A1C",

            color:
            "#FFFFFF",

            confirmButtonColor:
            "#00C875"

        });

        return;

    }


    /*
       JÁ ENTREGUE
    */

    if(
        atual.status_kit ===
        "entregue"
    ){

        await Swal.fire({

            title:
            "Entrega já realizada",

            html:

            "<div style='color:#BFC5C8;line-height:1.8'>" +

            "Esta retirada já foi registrada." +

            "<br><br>" +

            "<strong style='color:#18E58A'>" +

            (atual.retirado_por ||
            "Não informado") +

            "</strong>" +

            "<br>" +

            formatarDataHora(
                atual.data_retirada
            ) +

            "</div>",

            icon:
            "warning",

            background:
            "#171A1C",

            color:
            "#FFFFFF",

            confirmButtonColor:
            "#00C875"

        });


        buscarAtletas();

        return;

    }


    const agora =
    new Date().toISOString();


    /*
       ATUALIZA ATLETA
    */

    const {
        error:
        erroAtualizacao
    } =
    await db
    .from("atletas_v2")
    .update({

        status_kit:
        "entregue",

        retirado_por:
        retiradoPor,

        data_retirada:
        agora,

        entregue_por:
        usuarioLogado
        ? usuarioLogado.nome
        : "Desconhecido",

        entregue_por_usuario:
        usuarioLogado
        ? usuarioLogado.email
        : "Desconhecido",

        retirado_login:
        usuarioLogado
        ? usuarioLogado.email
        : "Desconhecido"

    })
    .eq(
        "id",
        id
    )
    .neq(
        "status_kit",
        "entregue"
    );


    if(erroAtualizacao){

        console.error(
            erroAtualizacao
        );


        await Swal.fire({

            title:
            "Não foi possível concluir",

            text:
            erroAtualizacao.message,

            icon:
            "error",

            background:
            "#171A1C",

            color:
            "#FFFFFF",

            confirmButtonColor:
            "#00C875"

        });

        return;

    }


    /*
       HISTÓRICO
    */

    const {
        error:
        erroEntrega
    } =
    await db
    .from("entregas")
    .insert([{

        atleta_id:
        id,

        usuario_id:
        usuarioLogado
        ? usuarioLogado.id
        : null,

        retirado_por:
        retiradoPor,

        tipo_retirada:
        tipo,

        observacao:
        observacao ||
        null,

        entregue_em:
        agora

    }]);


    if(erroEntrega){

        console.warn(
            "Erro no histórico:",
            erroEntrega.message
        );

    }


    /*
       AUDITORIA
    */

    const {
        error:
        erroAuditoria
    } =
    await db
    .from("auditoria_v2")
    .insert([{

        evento_id:
        eventoId,

        usuario:
        usuarioLogado
        ? usuarioLogado.nome
        : "Desconhecido",

        acao:
        "Entrega realizada",

        detalhe:

        "Atleta: " +
        nome +

        " | Retirado por: " +
        retiradoPor +

        " | Tipo: " +
        tipo +

        " | Observação: " +
        (
            observacao ||
            "Nenhuma"
        ) +

        " | Atendente: " +
        (
            usuarioLogado
            ? usuarioLogado.email
            : "Desconhecido"
        ) +

        " | Atleta ID: " +
        id

    }]);


    if(erroAuditoria){

        console.warn(
            "Erro na auditoria:",
            erroAuditoria.message
        );

    }


    /*
       SUCESSO
    */

    await Swal.fire({

        title:
        "Entrega confirmada",

        html:

        "<div style='color:#BFC5C8;line-height:1.8'>" +

        "<strong style='color:#FFFFFF;font-size:18px'>" +

        nome +

        "</strong>" +

        "<br>" +

        "Retirado por: " +

        "<strong style='color:#18E58A'>" +

        retiradoPor +

        "</strong>" +

        "</div>",

        icon:
        "success",

        background:
        "#171A1C",

        color:
        "#FFFFFF",

        confirmButtonColor:
        "#00C875",

        confirmButtonText:
        "Concluído"

    });


    buscarAtletas();

}

   INICIAR

verificarAcesso();

</script>
