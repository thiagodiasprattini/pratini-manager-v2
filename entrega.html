<script>

/* ==========================================================
   VARIÁVEIS
========================================================== */

let usuarioLogado = null;

const eventoId =
localStorage.getItem("evento_ativo_id");



/* ==========================================================
   ACESSO
========================================================== */

async function verificarAcesso(){

    try{

        const {
            data: sessao,
            error: erroSessao
        } =
        await db.auth.getSession();


        if(
            erroSessao ||
            !sessao ||
            !sessao.session
        ){

            window.location.href =
            "login.html";

            return;

        }


        const usuario =
        sessao.session.user;


        const {
            data: perfil,
            error
        } =
        await db
        .from("perfis")
        .select("role, nome")
        .eq("id", usuario.id)
        .single();


        if(error || !perfil){

            window.location.href =
            "index.html";

            return;

        }


        usuarioLogado = {

            id: usuario.id,

            nome:
            perfil.nome ||
            usuario.email,

            email:
            usuario.email

        };


        const eventoNome =
        localStorage.getItem(
            "evento_ativo_nome"
        );


        document.getElementById(
            "eventoAtivo"
        ).textContent =
        eventoNome ||
        "Nenhum evento ativo selecionado.";


        document.getElementById(
            "telaCarregando"
        ).style.display =
        "none";


        document.getElementById(
            "telaPainel"
        ).style.display =
        "block";


    }catch(error){

        console.error(error);

        window.location.href =
        "login.html";

    }

}



/* ==========================================================
   NORMALIZAR PESQUISA
========================================================== */

function normalizar(txt){

    return (txt || "")
        .toString()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();

}



/* ==========================================================
   ESCAPAR HTML
========================================================== */

function escaparHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}



/* ==========================================================
   FORMATA DATA
========================================================== */

function formatarDataNascimento(data){

    if(!data)
        return "Não informada";

    const partes =
    String(data).split("-");

    if(partes.length === 3){

        return `${partes[2]}/${partes[1]}/${partes[0]}`;

    }

    return data;

}



/* ==========================================================
   FORMATA DATA/HORA
========================================================== */

function formatarDataHora(data){

    if(!data)
        return "Não informada";

    return new Date(data)
        .toLocaleString(
            "pt-BR",
            {
                timeZone:
                "America/Sao_Paulo"
            }
        );

}



/* ==========================================================
   PESQUISAR
========================================================== */

async function buscarAtletas(){

    const termo =
    document
    .getElementById("busca")
    .value
    .trim();


    const resultado =
    document
    .getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `

            <div class="mensagem">

                Nenhum evento ativo
                selecionado.

            </div>

        `;

        return;

    }


    if(!termo){

        resultado.innerHTML = `

            <div class="mensagem">

                Digite o nome ou o
                número de peito.

            </div>

        `;

        return;

    }


    resultado.innerHTML = `

        <div class="mensagem">

            Pesquisando...

        </div>

    `;


    const {
        data,
        error
    } =
    await db
    .from("atletas_v2")
    .select(`
        id,
        nome,
        data_nascimento,
        numero_peito,
        modalidade,
        camiseta,
        produto_extra,
        status_kit,
        retirado_por,
        data_retirada,
        entregue_por,
        entregue_por_usuario,
        retirado_login
    `)
    .eq("evento_id", eventoId)
    .limit(1000);


    if(error){

        console.error(error);

        resultado.innerHTML = `

            <div class="mensagem">

                Não foi possível realizar
                a pesquisa.

            </div>

        `;

        return;

    }


    const busca =
    normalizar(termo);


    const encontrados =
    (data || []).filter(atleta => {

        return (

            normalizar(
                atleta.nome
            ).includes(busca)

            ||

            normalizar(
                atleta.numero_peito
            ).includes(busca)

        );

    });


    if(encontrados.length === 0){

        resultado.innerHTML = `

            <div class="mensagem">

                Nenhum atleta encontrado.

            </div>

        `;

        return;

    }


    resultado.innerHTML = "";


    encontrados.forEach(atleta => {

        resultado.appendChild(
            criarCardAtleta(atleta)
        );

    });

}



/* ==========================================================
   CRIAR CARD
========================================================== */

function criarCardAtleta(atleta){

    const entregue =
    atleta.status_kit === "entregue";


    const card =
    document.createElement("div");


    card.className =
    "atleta-card " +
    (entregue ? "entregue" : "");


    const idSeguro =
    escaparHTML(atleta.id);


    card.innerHTML = `

        <div class="atleta-nome">

            ${escaparHTML(atleta.nome)}

        </div>


        <div class="dados-grid">


            <div class="dado numero">

                <span class="dado-label">
                    Número de peito
                </span>

                <span class="dado-valor">
                    ${escaparHTML(
                        atleta.numero_peito ||
                        "Não informado"
                    )}
                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Data de nascimento
                </span>

                <span class="dado-valor">
                    ${formatarDataNascimento(
                        atleta.data_nascimento
                    )}
                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Modalidade
                </span>

                <span class="dado-valor">
                    ${escaparHTML(
                        atleta.modalidade ||
                        "Não informada"
                    )}
                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Camiseta
                </span>

                <span class="dado-valor">
                    ${escaparHTML(
                        atleta.camiseta ||
                        "Não informada"
                    )}
                </span>

            </div>


            <div class="dado">

                <span class="dado-label">
                    Pelotão
                </span>

                <span class="dado-valor">
                    ${escaparHTML(
                        atleta.pelotao ||
                        "Não informado"
                    )}
                </span>

            </div>


        </div>


        <div class="produto">

            <span class="dado-label">
                Produtos
            </span>

            <span class="dado-valor">

                ${escaparHTML(
                    atleta.produto_extra ||
                    "Nenhum produto adicional"
                )}

            </span>

        </div>


        <div class="status ${entregue ? "entregue" : "pendente"}">

            ${entregue
                ? "● ENTREGA REALIZADA"
                : "● AGUARDANDO RETIRADA"}

        </div>


        ${
            entregue

            ?

            gerarHistorico(atleta)

            :

            gerarFormularioRetirada(atleta)
        }

    `;


    return card;

}



/* ==========================================================
   HISTÓRICO
========================================================== */

function gerarHistorico(atleta){

    return `

        <div class="historico">

            <div class="historico-linha">

                <span class="historico-label">
                    Retirado por
                </span>

                <span class="historico-valor">
                    ${escaparHTML(
                        atleta.retirado_por ||
                        "Não informado"
                    )}
                </span>

            </div>


            <div class="historico-linha">

                <span class="historico-label">
                    Atendimento realizado por
                </span>

                <span class="historico-valor">
                    ${escaparHTML(
                        atleta.entregue_por ||
                        atleta.retirado_login ||
                        "Não informado"
                    )}
                </span>

            </div>


            <div class="historico-linha">

                <span class="historico-label">
                    Data e horário
                </span>

                <span class="historico-valor">
                    ${formatarDataHora(
                        atleta.data_retirada
                    )}
                </span>

            </div>


        </div>

    `;

}



/* ==========================================================
   FORMULÁRIO DE RETIRADA
========================================================== */

function gerarFormularioRetirada(atleta){

    const id =
    escaparHTML(atleta.id);


    return `

        <div class="retirada-area">

            <div class="retirada-titulo">

                Quem está realizando a retirada?

            </div>


            <div class="opcoes">


                <div class="opcao">

                    <input
                        type="radio"
                        name="retirada_${id}"
                        id="proprio_${id}"
                        value="proprio"
                        checked
                        onchange="alterarTipoRetirada('${id}')"
                    >

                    <label for="proprio_${id}">

                        Próprio atleta

                    </label>

                </div>


                <div class="opcao">

                    <input
                        type="radio"
                        name="retirada_${id}"
                        id="terceiro_${id}"
                        value="terceiro"
                        onchange="alterarTipoRetirada('${id}')"
                    >

                    <label for="terceiro_${id}">

                        Terceiro

                    </label>

                </div>


            </div>


            <div
                id="terceiroArea_${id}"
                class="campo-retirada"
                style="display:none;">

                <label>
                    Nome de quem está retirando
                </label>

                <input
                    id="nomeTerceiro_${id}"
                    type="text"
                    placeholder="Digite o nome completo"
                >

            </div>


            <div class="campo-retirada">

                <label>
                    Observação
                </label>

                <textarea
                    id="observacao_${id}"
                    placeholder="Ex.: mãe do atleta, esposa, irmão, amigo..."
                ></textarea>

            </div>


            <button
                class="btn-entregar"
                onclick="entregar('${id}', ${JSON.stringify(atleta.nome)})">

                CONFIRMAR ENTREGA

            </button>

        </div>

    `;

}



/* ==========================================================
   ALTERAR TIPO
========================================================== */

function alterarTipoRetirada(id){

    const terceiro =
    document
    .getElementById(
        "terceiro_" + id
    );


    const area =
    document
    .getElementById(
        "terceiroArea_" + id
    );


    if(
        terceiro &&
        terceiro.checked
    ){

        area.style.display =
        "block";

    }else{

        area.style.display =
        "none";

    }

}



/* ==========================================================
   REGISTRAR ENTREGA
========================================================== */

async function entregar(id, nome){

    const radioProprio =
    document
    .getElementById(
        "proprio_" + id
    );


    const radioTerceiro =
    document
    .getElementById(
        "terceiro_" + id
    );


    const nomeTerceiro =
    document
    .getElementById(
        "nomeTerceiro_" + id
    );


    const observacao =
    document
    .getElementById(
        "observacao_" + id
    );


    const tipo =
    radioTerceiro &&
    radioTerceiro.checked
        ? "terceiro"
        : "proprio";


    let retiradoPor =
    "Retirado pelo próprio atleta";


    if(tipo === "terceiro"){

        retiradoPor =
        nomeTerceiro
        ? nomeTerceiro.value.trim()
        : "";


        if(!retiradoPor){

            Swal.fire({

                title:"Informe o nome",

                text:
                "Digite o nome de quem está realizando a retirada.",

                icon:"warning",

                background:"#151619",

                color:"#fff",

                confirmButtonColor:"#ffc400"

            });

            return;

        }

    }


    const observacaoTexto =
    observacao
    ? observacao.value.trim()
    : "";


    const confirmacao =
    await Swal.fire({

        title:
        "Confirmar entrega",

        html:`

            <div style="
                font-size:15px;
                line-height:1.7;
                color:#ddd;
            ">

                <strong style="color:#fff;">
                    ${escaparHTML(nome)}
                </strong>

                <br><br>

                Retirada por:

                <strong style="color:#ffe16b;">
                    ${escaparHTML(retiradoPor)}
                </strong>

            </div>

        `,

        icon:"question",

        background:"#151619",

        color:"#fff",

        showCancelButton:true,

        confirmButtonColor:"#ffc400",

        cancelButtonColor:"#303238",

        confirmButtonText:
        "Confirmar",

        cancelButtonText:
        "Cancelar"

    });


    if(!confirmacao.isConfirmed)
        return;



    /* ======================================================
       SEGURANÇA:
       VERIFICA NOVAMENTE SE JÁ EXISTE ENTREGA
    ====================================================== */

    const {
        data: atual,
        error: erroBusca
    } =
    await db
    .from("atletas_v2")
    .select(`
        id,
        status_kit,
        retirado_por,
        data_retirada
    `)
    .eq("id", id)
    .single();


    if(erroBusca){

        Swal.fire({

            title:"Erro",

            text:
            "Não foi possível verificar o status do atleta.",

            icon:"error",

            background:"#151619",

            color:"#fff",

            confirmButtonColor:"#ffc400"

        });

        return;

    }


    if(atual.status_kit === "entregue"){

        Swal.fire({

            title:"Entrega já realizada",

            html:`

                <div style="
                    line-height:1.7;
                    color:#ddd;
                ">

                    Esta retirada já foi
                    registrada anteriormente.

                    <br><br>

                    <strong>
                        ${escaparHTML(
                            atual.retirado_por ||
                            "Não informado"
                        )}
                    </strong>

                    <br>

                    ${formatarDataHora(
                        atual.data_retirada
                    )}

                </div>

            `,

            icon:"warning",

            background:"#151619",

            color:"#fff",

            confirmButtonColor:"#ffc400"

        });

        buscarAtletas();

        return;

    }



    const agora =
    new Date().toISOString();



    /* ======================================================
       ATUALIZA ATLETA
    ====================================================== */

    const {
        error: erroAtualizacao
    } =
    await db
    .from("atletas_v2")
    .update({

        status_kit:
        "entregue",

        retirado_por:
        retiradoPor,

        data_retirada:
        agora,

        entregue_por:
        usuarioLogado
        ? usuarioLogado.nome
        : "Desconhecido",

        entregue_por_usuario:
        usuarioLogado
        ? usuarioLogado.email
        : "Desconhecido",

        retirado_login:
        usuarioLogado
        ? usuarioLogado.email
        : "Desconhecido"

    })
    .eq("id", id)
    .neq("status_kit", "entregue");



    if(erroAtualizacao){

        console.error(
            erroAtualizacao
        );


        Swal.fire({

            title:"Não foi possível concluir",

            text:
            erroAtualizacao.message,

            icon:"error",

            background:"#151619",

            color:"#fff",

            confirmButtonColor:"#ffc400"

        });

        return;

    }



    /* ======================================================
       REGISTRA HISTÓRICO EM ENTREGAS
    ====================================================== */

    const {
        error: erroEntrega
    } =
    await db
    .from("entregas")
    .insert([{

        atleta_id:
        id,

        usuario_id:
        usuarioLogado
        ? usuarioLogado.id
        : null,

        retirado_por:
        retiradoPor,

        tipo_retirada:
        tipo,

        observacao:
        observacaoTexto || null,

        entregue_em:
        agora

    }]);



    /*
       Se já houver um registro concorrente,
       não deixa a tela quebrar.
    */

    if(erroEntrega){

        console.warn(
            "Histórico:",
            erroEntrega.message
        );

    }



    /* ======================================================
       AUDITORIA
    ====================================================== */

    await db
    .from("auditoria_v2")
    .insert([{

        evento_id:
        eventoId,

        usuario:
        usuarioLogado
        ? usuarioLogado.nome
        : "Desconhecido",

        acao:
        "Entrega realizada",

        detalhe:

        `Atleta: ${nome} | ` +

        `Retirado por: ${retiradoPor} | ` +

        `Tipo: ${tipo} | ` +

        `Observação: ${
            observacaoTexto ||
            "Nenhuma"
        } | ` +

        `Atendente: ${
            usuarioLogado
            ? usuarioLogado.email
            : "Desconhecido"
        } | ` +

        `Atleta ID: ${id}`

    }]);



    /* ======================================================
       SUCESSO
    ====================================================== */

    await Swal.fire({

        title:
        "Entrega confirmada!",

        html:`

            <div style="
                line-height:1.8;
                color:#ddd;
            ">

                <strong style="
                    color:#fff;
                    font-size:18px;
                ">
                    ${escaparHTML(nome)}
                </strong>

                <br>

                Retirado por:

                <strong style="
                    color:#ffe16b;
                ">
                    ${escaparHTML(retiradoPor)}
                </strong>

            </div>

        `,

        icon:"success",

        background:"#151619",

        color:"#fff",

        confirmButtonColor:"#ffc400",

        confirmButtonText:
        "Concluído"

    });


    /* Atualiza a pesquisa */

    buscarAtletas();

}



/* ==========================================================
   INICIAR
========================================================== */

verificarAcesso();

</script>

</html>
