<script>

/* =========================================================
   VARIÁVEIS
========================================================= */

let usuarioLogado = null;

const eventoId =
    localStorage.getItem("evento_ativo_id");


/* =========================================================
   ESCAPAR HTML
   Evita problemas com nomes especiais.
========================================================= */

function escaparHTML(valor){

    if(valor === null || valor === undefined){
        return "";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   NORMALIZAR TEXTO
   Mantém acentos funcionando corretamente na tela.
========================================================= */

function normalizar(txt){

    return (txt || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim();
}


/* =========================================================
   DATA DE NASCIMENTO
========================================================= */

function formatarDataNascimento(data){

    if(!data){
        return "Não informada";
    }

    /*
       Se vier como YYYY-MM-DD,
       usamos a data diretamente para evitar
       problemas de fuso horário.
    */

    const texto = String(data);

    const match =
        texto.match(/^(\d{4})-(\d{2})-(\d{2})/);

    if(match){

        const ano = match[1];
        const mes = match[2];
        const dia = match[3];

        return `${dia}/${mes}/${ano}`;
    }

    const dataObj = new Date(data);

    if(isNaN(dataObj.getTime())){
        return "Não informada";
    }

    return dataObj.toLocaleDateString(
        "pt-BR",
        {
            timeZone:"America/Sao_Paulo"
        }
    );
}


/* =========================================================
   DATA/HORA DA ENTREGA
========================================================= */

function formatarDataHora(data){

    if(!data){
        return "Não informada";
    }

    const dataObj = new Date(data);

    if(isNaN(dataObj.getTime())){
        return "Não informada";
    }

    return dataObj.toLocaleString(
        "pt-BR",
        {
            timeZone:"America/Sao_Paulo",
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   VERIFICAR ACESSO
========================================================= */

async function verificarAcesso(){

    const {
        data: sessao,
        error: erroSessao
    } = await db.auth.getSession();

    if(
        erroSessao ||
        !sessao ||
        !sessao.session
    ){

        window.location.href = "login.html";
        return;
    }


    const usuario =
        sessao.session.user;


    const {
        data: perfil,
        error
    } = await db
        .from("perfis")
        .select("role, nome")
        .eq("id", usuario.id)
        .single();


    if(error || !perfil){

        window.location.href = "index.html";
        return;
    }


    usuarioLogado = {

        id:usuario.id,

        nome:
            perfil.nome ||
            usuario.email,

        email:
            usuario.email

    };


    const eventoNome =
        localStorage.getItem(
            "evento_ativo_nome"
        );


    document.getElementById(
        "eventoAtivo"
    ).textContent =
        eventoNome ||
        "Nenhum evento ativo selecionado.";


    document.getElementById(
        "telaCarregando"
    ).style.display = "none";


    document.getElementById(
        "telaPainel"
    ).style.display = "block";
}


/* =========================================================
   BUSCAR DATA DE NASCIMENTO
========================================================= */

async function buscarDatasNascimento(atletas){

    /*
       Primeiro verificamos se por acaso
       algum registro já possui a informação.
    */

    const precisamBuscar =
        atletas.filter(a => !a.data_nascimento);


    if(precisamBuscar.length === 0){
        return atletas;
    }


    /*
       A tabela atletas possui:
       data_nascimento
       cpf
       numero_peito
       nome

       Vamos tentar recuperar pela correspondência
       do número de peito.
    */

    const numeros =
        precisamBuscar
            .map(a => a.numero_peito)
            .filter(Boolean)
            .map(String);


    if(numeros.length > 0){

        const {
            data: dadosAtletas
        } = await db
            .from("atletas")
            .select(
                "id,nome,cpf,numero_peito,data_nascimento"
            )
            .in(
                "numero_peito",
                numeros.map(n => parseInt(n))
            );


        if(dadosAtletas){

            atletas.forEach(atleta => {

                if(atleta.data_nascimento){
                    return;
                }

                const correspondente =
                    dadosAtletas.find(item =>
                        String(item.numero_peito) ===
                        String(atleta.numero_peito)
                    );


                if(correspondente){

                    atleta.data_nascimento =
                        correspondente.data_nascimento;

                }

            });

        }
    }


    /*
       Segunda tentativa:
       CPF.
    */

    const cpfs =
        precisamBuscar
            .map(a => a.cpf)
            .filter(Boolean);


    if(cpfs.length > 0){

        const {
            data: dadosCpf
        } = await db
            .from("atletas")
            .select(
                "id,nome,cpf,numero_peito,data_nascimento"
            )
            .in("cpf", cpfs);


        if(dadosCpf){

            atletas.forEach(atleta => {

                if(atleta.data_nascimento){
                    return;
                }

                if(!atleta.cpf){
                    return;
                }

                const correspondente =
                    dadosCpf.find(item =>
                        String(item.cpf) ===
                        String(atleta.cpf)
                    );


                if(correspondente){

                    atleta.data_nascimento =
                        correspondente.data_nascimento;

                }

            });

        }
    }


    return atletas;
}


/* =========================================================
   BUSCAR ATLETAS
========================================================= */

async function buscarAtletas(){

    const termo =
        document
            .getElementById("busca")
            .value
            .trim();


    const resultado =
        document.getElementById("resultado");


    if(!eventoId){

        resultado.innerHTML = `
            <div class="card">
                Selecione um evento ativo primeiro.
            </div>
        `;

        return;
    }


    if(!termo){

        resultado.innerHTML = `
            <div class="card">
                Digite o nome ou número de peito.
            </div>
        `;

        return;
    }


    resultado.innerHTML = `
        <div class="card">
            Pesquisando atleta...
        </div>
    `;


    /*
       Buscamos somente os campos necessários
       para a Central de Entrega.
    */

    const {
        data,
        error
    } = await db
        .from("atletas_v2")
        .select(`
            id,
            evento_id,
            nome,
            cpf,
            numero_peito,
            modalidade,
            camiseta,
            equipe,
            produto_extra,
            status_kit,
            retirado_por,
            cpf_retirada,
            data_retirada,
            entregue_por,
            entregue_por_usuario,
            retirado_login
        `)
        .eq("evento_id", eventoId)
        .limit(1000);


    if(error){

        resultado.innerHTML = `
            <div class="card">
                Erro na busca:
                ${escaparHTML(error.message)}
            </div>
        `;

        return;
    }


    const busca =
        normalizar(termo);


    const encontrados =
        (data || []).filter(atleta => {

            const nome =
                normalizar(atleta.nome);

            const cpf =
                normalizar(atleta.cpf);

            const numero =
                normalizar(atleta.numero_peito);


            return (
                nome.includes(busca) ||
                cpf.includes(busca) ||
                numero.includes(busca)
            );

        });


    if(encontrados.length === 0){

        resultado.innerHTML = `
            <div class="card">
                Nenhum atleta encontrado.
            </div>
        `;

        return;
    }


    /*
       Recupera data de nascimento.
    */

    await buscarDatasNascimento(
        encontrados
    );


    resultado.innerHTML = "";


    encontrados.forEach(
        (atleta,index) => {

            criarCartaoAtleta(
                atleta,
                index
            );

        }
    );
}


/* =========================================================
   CRIAR CARTÃO
========================================================= */

function criarCartaoAtleta(atleta,index){

    const resultado =
        document.getElementById("resultado");


    const entregue =
        atleta.status_kit === "entregue";


    /*
       Alternância visual entre cartões.
       Não altera sua paleta principal:
       apenas cria diferenciação usando os tons
       escuros já utilizados.
    */

    const classeFundo =
        index % 2 === 0
            ? "card-escuro"
            : "card-claro";


    const nome =
        escaparHTML(atleta.nome);


    const numero =
        escaparHTML(
            atleta.numero_peito ||
            "NÃO INFORMADO"
        );


    const nascimento =
        escaparHTML(
            formatarDataNascimento(
                atleta.data_nascimento
            )
        );


    const modalidade =
        escaparHTML(
            atleta.modalidade ||
            "Não informada"
        );


    const camiseta =
        escaparHTML(
            atleta.camiseta ||
            "Não informada"
        );


    const equipe =
        escaparHTML(
            atleta.equipe ||
            "Não informada"
        );


    const produto =
        escaparHTML(
            atleta.produto_extra ||
            "Nenhum"
        );


    /*
       ID e nome ficam armazenados de maneira segura
       no botão.
    */

    const idSeguro =
        escaparHTML(atleta.id);


    let html = `

    <div
        class="card atleta-card ${classeFundo}"
        id="atleta-${idSeguro}"
    >

        <!-- CABEÇALHO -->

        <div class="atleta-topo">

            <h2 class="nome-atleta">

            <div class="label-numero">

            </div>

            <div class="numero-peito">
                ${numero}
            </div>

        </div>


        <!-- DADOS -->

        <div class="atleta-dados">

            <div class="dados-grid">

                <div class="dado">

                    <span class="dado-label">
                        Data de nascimento
                    </span>

                    <span class="dado-valor data-nascimento">
                        ${nascimento}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Modalidade
                    </span>

                    <span class="dado-valor">
                        ${modalidade}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Camiseta
                    </span>

                    <span class="dado-valor">
                        ${camiseta}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Equipe
                    </span>

                    <span class="dado-valor">
                        ${equipe}
                    </span>

                </div>


                <div class="dado">

                    <span class="dado-label">
                        Produtos
                    </span>

                    <span class="dado-valor">
                        ${produto}
                    </span>

                </div>

            </div>
    `;


    /* =====================================================
       JÁ ENTREGUE
    ===================================================== */

    if(entregue){

        html += `

            <div class="status-area status-entregue">
                ENTREGA JÁ REALIZADA
            </div>


            <div class="entrega-info">

                <p>
                    <strong>Retirado por:</strong>
                    ${escaparHTML(
                        atleta.retirado_por ||
                        "Não informado"
                    )}
                </p>

                <p>
                    <strong>Atendente:</strong>
                    ${escaparHTML(
                        atleta.entregue_por ||
                        atleta.retirado_login ||
                        atleta.entregue_por_usuario ||
                        "Não informado"
                    )}
                </p>

                <p>
                    <strong>Data e horário:</strong>
                    ${escaparHTML(
                        formatarDataHora(
                            atleta.data_retirada
                        )
                    )}
                </p>

            </div>

        `;

    }

    /* =====================================================
       PENDENTE
    ===================================================== */

    else{

        html += `

            <div class="status-area status-pendente">
                AGUARDANDO ENTREGA
            </div>


            <div class="tipo-retirada">

                <span class="tipo-retirada-titulo">
                    Quem está retirando?
                </span>


                <div class="opcoes-retirada">

                    <label class="opcao-retirada">

                        <input
                            type="radio"
                            name="tipo-${idSeguro}"
                            value="proprio"
                            checked
                            onchange="alterarTipoRetirada('${idSeguro}','proprio')"
                        >

                        <span>
                            O próprio atleta
                        </span>

                    </label>


                    <label class="opcao-retirada">

                        <input
                            type="radio"
                            name="tipo-${idSeguro}"
                            value="terceiro"
                            onchange="alterarTipoRetirada('${idSeguro}','terceiro')"
                        >

                        <span>
                            Terceiro
                        </span>

                    </label>

                </div>


                <div
                    id="terceiro-${idSeguro}"
                    class="terceiro-area"
                >

                    <input
                        id="nome-terceiro-${idSeguro}"
                        type="text"
                        placeholder="Nome de quem está retirando"
                        autocomplete="off"
                    >

                </div>

            </div>


            <div class="area-retirada">

                <label>
                    Observação
                </label>

                <textarea
                    id="observacao-${idSeguro}"
                    class="observacao"
                    placeholder="Digite uma observação, se necessário..."
                ></textarea>

            </div>


            <button
                class="btn-entregar"
                onclick="entregar('${idSeguro}')"
            >
                ENTREGAR
            </button>

        `;

    }


    html += `

        </div>

    </div>

    `;


    resultado.innerHTML += html;
}


/* =========================================================
   ALTERAR TIPO DE RETIRADA
========================================================= */

function alterarTipoRetirada(id,tipo){

    const campo =
        document.getElementById(
            "terceiro-" + id
        );


    if(!campo){
        return;
    }


    if(tipo === "terceiro"){

        campo.classList.add("ativo");

    }else{

        campo.classList.remove("ativo");

    }
}


/* =========================================================
   ENTREGAR
========================================================= */

async function entregar(id){

    /*
       Primeiro buscamos novamente o atleta
       diretamente no banco.

       Isso é importante para impedir que dois
       atendentes entreguem a mesma inscrição
       simultaneamente.
    */

    const {
        data: atleta,
        error: erroBusca
    } = await db
        .from("atletas_v2")
        .select("*")
        .eq("id",id)
        .single();


    if(erroBusca || !atleta){

        Swal.fire({
            title:"Erro",
            text:"Não foi possível localizar o atleta.",
            icon:"error",
            background:"#1f1f1f",
            color:"#fff"
        });

        return;
    }


    /*
       PROTEÇÃO CONTRA DUPLA ENTREGA
    */

    if(atleta.status_kit === "entregue"){

        Swal.fire({

            title:"Entrega já realizada",

            text:
                "Esta inscrição já foi registrada como entregue.",

            icon:"warning",

            background:"#1f1f1f",

            color:"#fff"

        });

        buscarAtletas();

        return;
    }


    /*
       Tipo de retirada
    */

    const radioSelecionado =
        document.querySelector(
            `input[name="tipo-${id}"]:checked`
        );


    const tipo =
        radioSelecionado
            ? radioSelecionado.value
            : "proprio";


    let retiradoPor =
        "Retirado pelo próprio atleta";


    /*
       Se for terceiro, exige nome.
    */

    if(tipo === "terceiro"){

        const campo =
            document.getElementById(
                "nome-terceiro-" + id
            );


        const nomeTerceiro =
            campo
                ? campo.value.trim()
                : "";


        if(!nomeTerceiro){

            Swal.fire({

                title:"Informe quem está retirando",

                text:
                    "Digite o nome da pessoa que está retirando a inscrição.",

                icon:"warning",

                background:"#1f1f1f",

                color:"#fff"

            });

            if(campo){
                campo.focus();
            }

            return;
        }


        retiradoPor =
            nomeTerceiro;
    }


    /*
       Observação
    */

    const campoObservacao =
        document.getElementById(
            "observacao-" + id
        );


    const observacao =
        campoObservacao
            ? campoObservacao.value.trim()
            : "";


    /*
       Confirmação
    */

    const confirmar =
        await Swal.fire({

            title:"Confirmar entrega",

            html:`
                <div style="font-size:18px;line-height:1.5;">
                    <strong>
                        ${escaparHTML(atleta.nome)}
                    </strong>

                    <br><br>

                    Número de peito:
                    <strong>
                        ${escaparHTML(atleta.numero_peito || "Não informado")}
                    </strong>

                    <br><br>

                    Retirado por:
                    <strong>
                        ${escaparHTML(retiradoPor)}
                    </strong>
                </div>
            `,

            icon:"question",

            background:"#1f1f1f",

            color:"#fff",

            confirmButtonColor:"#ffc400",

            cancelButtonColor:"#555",

            confirmButtonText:"CONFIRMAR ENTREGA",

            cancelButtonText:"CANCELAR",

            showCancelButton:true

        });


    if(!confirmar.isConfirmed){
        return;
    }


    /*
       Data atual
    */

    const agora =
        new Date().toISOString();


    /*
       Atualiza o atleta.
    */

    const {
        data: atualizado,
        error: erroAtualizacao
    } = await db
        .from("atletas_v2")
        .update({

            status_kit:"entregue",

            retirado_por:
                retiradoPor,

            cpf_retirada:
                null,

            data_retirada:
                agora,

            entregue_por:
                usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",

            entregue_por_usuario:
                usuarioLogado
                    ? usuarioLogado.email
                    : "Desconhecido",

            retirado_login:
                usuarioLogado
                    ? usuarioLogado.email
                    : "Desconhecido"

        })
        .eq("id",id)
        .eq("status_kit","pendente")
        .select();


    if(
        erroAtualizacao ||
        !atualizado ||
        atualizado.length === 0
    ){

        Swal.fire({

            title:"Entrega não realizada",

            text:
                "A inscrição pode ter sido entregue por outro atendente. Atualize a pesquisa e confira o status.",

            icon:"warning",

            background:"#1f1f1f",

            color:"#fff"

        });

        buscarAtletas();

        return;
    }


    /*
       REGISTRO NA TABELA ENTREGAS
    */

    const {
        error: erroEntrega
    } = await db
        .from("entregas")
        .insert([{

            atleta_id:
                id,

            usuario_id:
                usuarioLogado
                    ? usuarioLogado.id
                    : null,

            retirado_por:
                retiradoPor,

            cpf_retirada:
                null,

            tipo_retirada:
                tipo,

            observacao:
                observacao || null,

            entregue_em:
                agora

        }]);


    /*
       AUDITORIA
    */

    await db
        .from("auditoria_v2")
        .insert([{

            evento_id:
                eventoId,

            usuario:
                usuarioLogado
                    ? usuarioLogado.nome
                    : "Desconhecido",

            acao:
                "Entrega de Inscrição",

            detalhe:
                `Entrega registrada para ${atleta.nome}. Número de peito: ${atleta.numero_peito || "não informado"}. Retirado por: ${retiradoPor}. Tipo: ${tipo}. Observação: ${observacao || "nenhuma"}.`

        }]);


    /*
       Mensagem final
    */

    let mensagemEntrega =
        tipo === "proprio"
            ? "Retirado pelo próprio atleta"
            : `Retirado por ${retiradoPor}`;


    if(erroEntrega){

        console.warn(
            "Entrega registrada, mas houve erro no histórico:",
            erroEntrega
        );

    }


    await Swal.fire({

        title:"Entrega confirmada!",

        html:`

            <div style="
                font-size:18px;
                line-height:1.6;
            ">

                <strong>
                    ${escaparHTML(atleta.nome)}
                </strong>

                <br>

                Número de peito:
                <strong>
                    ${escaparHTML(atleta.numero_peito || "Não informado")}
                </strong>

                <br><br>

                ${escaparHTML(mensagemEntrega)}

            </div>

        `,

        icon:"success",

        background:"#1f1f1f",

        color:"#fff",

        confirmButtonColor:"#ffc400",

        confirmButtonText:"OK"

    });


    /*
       Atualiza a pesquisa.
    */

    buscarAtletas();
}


/* =========================================================
   INICIAR
========================================================= */

verificarAcesso();

</script>
